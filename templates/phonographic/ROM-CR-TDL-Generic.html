<!DOCTYPE html>
<html lang="en" data-scheme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tidal Cycle — Phonographic — Generic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #f9f9f9; overflow: hidden;
        }
        .a4-page {
            width: 90vw; height: 70vh;
            border: 5px solid black; background-color: white;
            box-sizing: border-box; position: relative;
            touch-action: none; z-index: 1; overflow: hidden;
        }
        .watermark {
            position: absolute; bottom: 5px; width: 100%;
            text-align: center; font-size: 12px;
            color: rgba(0,0,0,0.3); font-weight: bold;
            pointer-events: none; user-select: none; z-index: 0;
        }
        svg { width: 100%; height: 100%; overflow: visible; }
        .circle-path { stroke: #2c5aa0; stroke-width: 0.5; fill: none; }
        .tide-segment { stroke: #ddd; stroke-width: 0.3; transition: fill 0.3s ease; }
        .segment-highlighted { stroke: #4682B4; stroke-width: 1px; filter: brightness(1.1); }
        .segment-label {
            font-size: 2.8px; font-weight: bold; fill: #333;
            text-anchor: middle; dominant-baseline: central;
            pointer-events: none; font-family: Arial, sans-serif;
        }
        .high-tide-segment  { fill: none; }
        .outgoing-segment   { fill: url(#tidalHeightGradient); }
        .low-tide-segment   { fill: none; }
        .incoming-segment   { fill: url(#tidalHeightGradient); }
        .textBox {
            cursor: pointer; font-size: 0.8em; fill: black;
            opacity: 0; display: none;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5); text-anchor: middle; font-family: Arial, sans-serif;
        }
        .textBox.active  { opacity: 1; display: block; transform: scale(1) translateY(0); }
        .textBox.learned { opacity: 0.5; display: block; transform: scale(1) translateY(0); fill: green; }
        .textBox.learned.active { opacity: 1; }
        .textBox.hidden  { opacity: 0; display: none; }
        #draggableFrame {
            cursor: grab; fill: url(#moonGradient);
            pointer-events: all; opacity: 1; transition: opacity 0.15s ease; z-index: 1000;
        }
        #draggableFrame.dragging { cursor: grabbing; opacity: 0.2; }
        .title-box {
            position: absolute; top: 2%; left: 75%; transform: translateX(-50%);
            font-size: 1em; font-weight: bold; text-align: center;
            cursor: pointer; border: 1px solid black; padding: 10px;
            background-color: white; z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease; font-family: Arial, sans-serif;
        }
        .title-box.hidden { opacity: 0; transform: translateX(-50%) scale(0.9); }
        .mode-toggle {
            position: absolute; bottom: 30px; left: 75%; transform: translateX(-50%);
            font-size: 0.8em; padding: 8px 16px;
            background-color: #f0f0f0; border: 1px solid #ccc;
            border-radius: 4px; cursor: pointer; z-index: 3;
        }
        .drag-instruction {
            position: absolute; top: 60px; right: 10px;
            font-size: 0.9em; padding: 5px 10px;
            background-color: rgba(255,255,255,0.9); border: 1px solid #ccc;
            border-radius: 4px; z-index: 3; opacity: 1;
            transition: opacity 3s ease; max-width: 200px;
        }
        .drag-instruction.fade { opacity: 0; }
        .quiz-container {
            position: fixed; top: 40%; left: 75%;
            transform: translate(-50%,-50%);
            background-color: white; border: 3px solid #3366cc;
            border-radius: 4px; padding: 12px; z-index: 9999;
            display: none; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 360px; width: 360px;
            pointer-events: auto; visibility: visible; opacity: 1;
        }
        .quiz-container input {
            width: 100%; padding: 8px; font-size: 14px;
            border: 1px solid #ccc; border-radius: 4px;
            margin-bottom: 10px; font-family: Arial, sans-serif;
        }
        .quiz-container button {
            width: 100%; padding: 8px; background-color: #3366cc;
            color: white; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold;
        }
        .quiz-container button:hover { background-color: #254e9c; }
        #quizFeedback { text-align: center; font-weight: bold; margin-top: 8px; min-height: 20px; }
        .learned-vocabulary {
            position: absolute; top: 2%; left: 5px;
            width: 25%; max-height: 40vh; overflow-y: auto;
            background-color: rgba(255,255,255,0.9); border: 1px solid #ccc;
            border-radius: 4px; padding: 5px; z-index: 4; display: block;
        }
        .array-title {
            font-size: 0.9em; text-align: center; font-weight: bold;
            margin-bottom: 5px; padding: 3px;
            background-color: #f0f0f0; border-bottom: 1px solid #ccc;
        }
        .vocabulary-item {
            display: flex; flex-direction: column; font-size: 0.75em;
            margin: 3px 0; padding: 5px; border: 1px solid #ddd;
            border-radius: 3px; background-color: #f9f9f9;
            transition: background-color 0.3s ease;
        }
        .vocabulary-item:hover { background-color: #eaf2ff; }
        .vocabulary-item .tl-word {
            font-weight: bold; color: green; cursor: pointer;
            padding: 2px 5px; border-radius: 3px; font-family: Arial, sans-serif;
        }
        .vocabulary-item .sl-word {
            color: #555; cursor: pointer; padding: 2px 5px; border-radius: 3px;
        }
        .vocabulary-item .tl-word.hidden,
        .vocabulary-item .sl-word.hidden {
            color: transparent; user-select: none; background-color: #f0f0f0;
        }
        .toggle-visibility {
            position: absolute; top: 5px; right: 5px; font-size: 0.7em;
            padding: 2px 5px; background-color: #eee; border: 1px solid #ccc;
            border-radius: 3px; cursor: pointer; z-index: 5;
        }
        .time-marker {
            font-size: 2.5px; fill: #2c5aa0; font-weight: bold;
            text-anchor: middle; pointer-events: none;
        }
        .tidal-icon { opacity: 0.2; pointer-events: none; }
    /* 2026-11-06 Phone layout, Audio, Print, Full Screen, Tools menu and no Quiz on the Compass */
    .a4-page { height: 86vh; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; }
    .a4-page > svg { grid-column: 1 / 3; grid-row: 2; min-height: 0; width: 100%; height: 100%; }
    #cmpInfo { position: static; grid-column: 1; grid-row: 1; z-index: 3; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px; }
    #cmpInfo .title-box { position: static; transform: none; left: auto; top: auto; }
    #cmpInfo .title-box.hidden { transform: scale(0.9); }
    #cmpInfo .day-indicator, #cmpInfo .drag-instruction { position: static; transform: none; left: auto; top: auto; min-width: 0; white-space: normal; }
    #cmpCtl { position: static; grid-column: 2; grid-row: 1; z-index: 200; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; align-items: flex-start; margin: 10px; }
    .a4-page > .watermark { position: static; grid-column: 1 / 3; grid-row: 3; padding: 0 0 4px; }
    #cmpCtl .tb { position: static; transform: none; left: auto; top: auto; min-width: 0; font-weight: normal; background: #3366cc; color: #fff; border: 0; border-radius: 4px; padding: 7px 12px; font: 14px Arial, sans-serif; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    #cmpCtl .tb:hover { background: #254e9c; }
    #printList { display: none; }
    .textBox { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.audio-wrap { position: relative; display: flex; flex-direction: column; align-items: stretch; width: 104px; box-sizing: border-box; background-color: #3366cc; color: #fff; border-radius: 4px; padding: 3px 6px 2px; }
    .audio-wrap:hover { background-color: #254e9c; }
    .audio-wrap #auCycle { background: transparent; border: 0; color: inherit; font: inherit; font-size: 14px; padding: 4px 0 1px; margin: 0; cursor: pointer; white-space: nowrap; text-align: center; -webkit-tap-highlight-color: transparent; }
    .controls .audio-wrap #auCycle:hover { background: transparent; }
    .audio-wrap #auVol2 { width: 100%; height: 14px; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: none; cursor: pointer; --p: 80%; }
    .audio-wrap #auVol2::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(to right, #007FFF 0, #007FFF var(--p), #B0E0E6 var(--p), #B0E0E6 100%); }
    .audio-wrap #auVol2::-moz-range-track { height: 5px; border-radius: 3px; background: #B0E0E6; }
    .audio-wrap #auVol2::-moz-range-progress { height: 5px; border-radius: 3px; background: #007FFF; }
    .audio-wrap #auVol2::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8fbff 0%, #2fd0e8 38%, #7fb8f0 68%, #ff9cc8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .audio-wrap #auVol2::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8fbff 0%, #2fd0e8 38%, #7fb8f0 68%, #ff9cc8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
    @media (pointer: coarse) { .audio-wrap { width: 112px; } .audio-wrap #auVol2 { height: 20px; } .audio-wrap #auVol2::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6.5px; } .audio-wrap #auVol2::-moz-range-thumb { width: 18px; height: 18px; } }
    @media (max-height: 520px) and (orientation: landscape) { .audio-wrap { width: 86px; padding: 1px 5px 0; } .audio-wrap #auCycle { font-size: 11px; padding: 2px 0 0; } .audio-wrap #auVol2 { height: 13px; } }
    #auToast { position: fixed; z-index: 1100; background: rgba(40,40,40,.92); color: #fff; font: 14px Arial, sans-serif; padding: 7px 12px; border-radius: 8px; max-width: min(92vw, 360px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
    .tools-wrap { position: relative; }
    #toolsBtn { min-width: 74px; }
    .tools-dd { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 9.5em; background: #3366cc; border-radius: 6px; overflow: hidden; z-index: 400; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .tools-dd.active { display: block; }
    .tools-dd button { display: block; width: 100%; text-align: left; background: #3366cc; color: #fff; border: 0; border-bottom: 1px solid rgba(255,255,255,.35); padding: 9px 14px; font: 14px Arial, sans-serif; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .tools-dd button:last-child { border-bottom: 0; }
    .tools-dd button:hover { background: #254e9c; }
    html[data-scheme="nocolour"] body { background: #e6e6e6; }
    html[data-scheme="nocolour"] .a4-page { filter: grayscale(1); }
    @media screen {
      html[data-scheme="night"] body { background: #0b1330; }
      html[data-scheme="night"] .a4-page { background: #14213d; border-color: #8a96b8; }
      html[data-scheme="night"] .circle-path { stroke: #aab4d0; }
      html[data-scheme="night"] .segment-label { fill: #c5cce0; }
      html[data-scheme="night"] .textBox div { color: #fff !important; text-shadow: none !important; }
      html[data-scheme="night"] .title-box, html[data-scheme="night"] .day-indicator { background: #1f2f55; color: #e8eefc; border-color: #8a96b8; }
      html[data-scheme="night"] .watermark { color: rgba(255,255,255,.45); }
    }
    /* Phone held upright: title and direction, buttons, the compass as large as fits, then the watermark */
    @media (max-width: 700px) and (min-height: 521px) {
      html, body { overflow: hidden; }
      body { display: block; height: 100vh; height: 100dvh; padding: 0; }
      .a4-page { width: 100vw; height: 100vh; height: 100dvh; border: 0; display: grid; grid-template-columns: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto; }
      #cmpInfo { grid-column: 1; grid-row: 1; justify-content: center; max-width: 96%; margin: 6px 0 0; gap: 4px 6px; }
      #cmpInfo .title-box { padding: 6px 12px; font-size: .95em; text-align: center; }
      #cmpInfo .day-indicator { font-size: .95em; padding: 4px 10px; }
      #cmpInfo .drag-instruction { font-size: .8em; max-width: 92vw; text-align: center; }
      #cmpCtl { grid-column: 1; grid-row: 2; justify-content: center; margin: 6px 4px; }
      #cmpCtl .tb { padding: 7px 10px; font-size: 13px; }
      .a4-page > svg { grid-column: 1; grid-row: 3; }
      .a4-page > .watermark { grid-column: 1; grid-row: 4; }
    }
    /* Phone held sideways (or any short window, e.g. inside the viewer, about 690 x 200): text column on the left, compass at full height on the right */
    @media (max-height: 520px) and (orientation: landscape) {
      html, body { overflow: hidden; }
      body { display: block; height: 100vh; height: 100dvh; padding: 0; }
      .a4-page { width: 100vw; height: 100vh; height: 100dvh; border: 0; display: grid; grid-template-columns: minmax(190px, 42%) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
      #cmpInfo { grid-column: 1; grid-row: 1; flex-direction: column; align-items: flex-start; margin: 4px; gap: 3px; }
      #cmpInfo .title-box { padding: 3px 8px; font-size: .8em; }
      #cmpInfo .day-indicator { font-size: .8em; padding: 2px 8px; }
      #cmpInfo .drag-instruction { display: none; }
      #cmpCtl { grid-column: 1; grid-row: 2; justify-content: flex-start; margin: 2px 4px; gap: 4px; }
      #cmpCtl .tb { padding: 4px 8px; font-size: 11px; }
      .a4-page > svg { grid-column: 2; grid-row: 1 / 5; }
      .a4-page > .watermark { grid-column: 1; grid-row: 4; text-align: left; font-size: 9px; padding: 0 4px 2px; }
    }
    /* Print: the compass on the left and every direction listed on the right, on one A4 landscape sheet */
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { height: auto !important; min-height: 0 !important; overflow: visible !important; background: #fff !important; padding: 0 !important; display: block !important; }
      .a4-page { width: 100% !important; height: 188mm !important; border: 0 !important; overflow: visible !important; display: grid !important; grid-template-columns: 152mm 1fr; grid-template-rows: auto 1fr auto; column-gap: 6mm; filter: none !important; }
      .a4-page > svg { grid-column: 1; grid-row: 1 / 4; width: 152mm !important; height: 152mm !important; align-self: center; }
      #cmpInfo { position: static !important; grid-column: 2; grid-row: 1; max-width: none; margin: 0 0 3mm; }
      #cmpInfo .title-box { font-size: 14pt; border: 0; padding: 0; }
      #cmpInfo .day-indicator, #cmpInfo .drag-instruction { display: none !important; }
      #printList { display: block !important; grid-column: 2; grid-row: 2; font: 8.5pt Arial, sans-serif; overflow: hidden; }
      #printList .pl-row { display: grid; grid-template-columns: 14mm 1fr 1fr 1fr; gap: 2mm; padding: 0.6mm 0; border-bottom: 0.2mm solid #ddd; }
      #printList .pl-row.rom { grid-template-columns: 14mm 1fr 1fr; }
      #printList .pl-h { color: #777; }
      .a4-page > .watermark { position: static !important; grid-column: 2; grid-row: 3; text-align: right; }
      .textBox { display: block !important; opacity: 1 !important; transform: none !important; }
      #cmpCtl, .quiz-container, .vocabulary-array, #auToast { display: none !important; }
    }
    @media (max-height: 520px) and (orientation: landscape) { .audio-wrap #auVol2::-webkit-slider-thumb { width: 13px; height: 13px; margin-top: -4px; } .audio-wrap #auVol2::-moz-range-thumb { width: 13px; height: 13px; } }
    #textSizePanel { position: fixed; z-index: 700; display: none; background: #fff; color: #222; border: 1px solid #555; border-radius: 8px; padding: 6px 10px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.35); font: 13px Arial, sans-serif; width: min(300px, 88vw); touch-action: none; }
    #textSizePanel .tsHead { cursor: grab; display: flex; justify-content: space-between; align-items: center; font-weight: bold; user-select: none; margin-bottom: 4px; }
    #textSizePanel .tsHead button { border: 0; background: none; font-size: 20px; cursor: pointer; line-height: 1; }
    #textSizePanel .tsTarget { margin: 2px 0 4px; min-height: 1.2em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #textSizePanel input[type=range] { width: 100%; touch-action: pan-y; }
    #textSizePanel .tsRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
    #textSizePanel button.tsReset { padding: 3px 10px; cursor: pointer; }
    .textBox:hover div { background: #fff176; border-radius: 4px; }
    .cmp-ghost { position: fixed; z-index: 1000; left: 0; top: 0; background: #fff176; border: 1px solid #b8860b; border-radius: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.45); font-family: Arial, sans-serif; font-weight: bold; color: #000; white-space: nowrap; padding: 2px 5px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transform-origin: 50% 50%; }
    @media print { #textSizePanel, .cmp-ghost { display: none !important; } }

    .textBox.visible { display: block; transform: scale(1) translateY(0); }
    </style>
    <style id="cx-style">
/* ===== CONCEPTIONARY STYLE SHEET v0.1 (trial on the Compass, 2026-11-06) =====
   One block of design tokens plus the rules that use them. It sits AFTER the template's own CSS and only changes looks, never behaviour.
   Colour: ink / muted / surface / line, ONE primary (controls), ONE accent (the active word and highlight). Every text pair is 4.5:1 or better.
   Type: one system font stack (set by script into --cx-font so the word measuring uses the same font), weights 600 and 700 only.
   Spacing scale 4 / 8 / 12 / 16 / 24 px. Radius 10 (controls) and 16 (page card). Motion 150-250 ms, switched off by prefers-reduced-motion.
   NOTE: inside an SVG foreignObject one CSS px is one SVG unit, so borders, radii and shadows on words are written in tiny values. */
:root {
  --cx-ink: #1f2937; --cx-muted: #4b5565; --cx-faint: #6b7280;
  --cx-surface: #ffffff; --cx-bg: #eef1f7; --cx-line: #d3d9e6;
  --cx-primary: #2a56c6; --cx-primary-dark: #1f428f; --cx-on-primary: #ffffff;
  --cx-accent: #f2b01e; --cx-accent-soft: #fff4cf;
  --cx-btn-bg: #e4ecf8; --cx-btn-bg-hover: #d3e0f5; --cx-btn-bg-on: #bcd0f0; --cx-btn-ink: #1d3b80; --cx-btn-line: #bccbe8;
  --cx-disc-a: #fffdf6; --cx-disc-b: #efe8d4; --cx-disc-line: #d9cfb4;
  --cx-s1: 4px; --cx-s2: 8px; --cx-s3: 12px; --cx-s4: 16px; --cx-s5: 24px;
  --cx-r-ctl: 10px; --cx-r-card: 16px;
  --cx-shadow-sm: 0 1px 2px rgba(20,30,60,.12); --cx-shadow-md: 0 4px 14px rgba(20,30,60,.16);
  --cx-font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --cx-t: 180ms ease;
}
html[data-scheme="night"] {
  --cx-ink: #e6ebf7; --cx-muted: #b4bfd8; --cx-faint: #8f9cb8;
  --cx-surface: #172036; --cx-bg: #0d1424; --cx-line: #2e3a58;
  --cx-primary: #3d63c9; --cx-primary-dark: #2f4fa6; --cx-accent: #f2b01e; --cx-accent-soft: #3a3320;
  --cx-btn-bg: #24304e; --cx-btn-bg-hover: #2e3c60; --cx-btn-bg-on: #3a4a74; --cx-btn-ink: #d6e0fa; --cx-btn-line: #3b4a70;
  --cx-disc-a: #1c2846; --cx-disc-b: #121b33; --cx-disc-line: #3a4768;
}
body { font-family: var(--cx-font); color: var(--cx-ink); background: var(--cx-bg); }
@media (min-width: 701px) and (min-height: 521px) {
  body { background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, var(--cx-bg) 70%); }
  .a4-page { border: 1px solid var(--cx-line); border-radius: var(--cx-r-card); box-shadow: var(--cx-shadow-md); background: var(--cx-surface); }
}
.a4-page { background: var(--cx-surface); }
/* title and indicator: quiet cards */
.title-box { font-family: var(--cx-font); font-weight: 700; font-size: 1.05em; color: var(--cx-ink); background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: var(--cx-r-ctl); box-shadow: var(--cx-shadow-sm); padding: var(--cx-s2) var(--cx-s3); transition: box-shadow var(--cx-t), transform var(--cx-t), opacity .5s ease; }
.title-box:hover { box-shadow: var(--cx-shadow-md); }
.direction-indicator, .day-indicator { font-family: var(--cx-font); font-weight: 600; color: var(--cx-ink); background: var(--cx-accent-soft); border: 1px solid var(--cx-accent); border-radius: 999px; padding: var(--cx-s1) var(--cx-s3); }
.drag-instruction { font-family: var(--cx-font); color: var(--cx-muted); background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: var(--cx-r-ctl); }
/* controls: one button style */
#cmpCtl .tb, .quiz-container button { font-family: var(--cx-font); font-weight: 600; letter-spacing: .01em; background: var(--cx-btn-bg); color: var(--cx-btn-ink); border: 1px solid var(--cx-btn-line); border-radius: var(--cx-r-ctl); box-shadow: var(--cx-shadow-sm); min-height: 38px; transition: background var(--cx-t), transform var(--cx-t), box-shadow var(--cx-t); }
#cmpCtl .tb:hover { background: var(--cx-btn-bg-hover); box-shadow: var(--cx-shadow-md); }
#cmpCtl .tb.on { background: var(--cx-btn-bg-on); border-color: var(--cx-primary); }
#cmpCtl .tb:active, .audio-wrap:active { transform: scale(.97); box-shadow: none; }
#cmpCtl .tb:focus-visible, .audio-wrap #auCycle:focus-visible, .tools-dd button:focus-visible { outline: 3px solid var(--cx-accent); outline-offset: 2px; }
.audio-wrap { background: var(--cx-btn-bg); color: var(--cx-btn-ink); border: 1px solid var(--cx-btn-line); border-radius: var(--cx-r-ctl); box-shadow: var(--cx-shadow-sm); transition: background var(--cx-t); }
.audio-wrap:hover { background: var(--cx-btn-bg-hover); }
.audio-wrap #auVol2::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--cx-primary) 0, var(--cx-primary) var(--p), var(--cx-btn-line) var(--p), var(--cx-btn-line) 100%) !important; }
.audio-wrap #auVol2::-moz-range-track { background: var(--cx-btn-line) !important; } .audio-wrap #auVol2::-moz-range-progress { background: var(--cx-primary) !important; }
.audio-wrap #auCycle { font-family: var(--cx-font); font-weight: 600; }
.tools-dd { background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: 12px; box-shadow: var(--cx-shadow-md); }
.tools-dd button { background: var(--cx-surface); color: var(--cx-btn-ink); font-family: var(--cx-font); border-bottom: 1px solid var(--cx-line); transition: background var(--cx-t); }
.tools-dd button:hover { background: var(--cx-accent-soft); }
#textSizePanel { font-family: var(--cx-font); background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 12px; box-shadow: var(--cx-shadow-md); }
#textSizePanel button.tsReset { border: 1px solid var(--cx-line); border-radius: 8px; background: var(--cx-surface); color: var(--cx-ink); }
@media (pointer: coarse) { #cmpCtl .tb { min-height: 44px; } .tools-dd button { padding-top: 12px; padding-bottom: 12px; } }
@media (max-height: 520px) and (orientation: landscape) { #cmpCtl .tb { min-height: 32px; } }
/* the dial */
.circle-path, .compass-circle { stroke: var(--cx-ink); stroke-width: 0.45; }
.degree-marker { stroke: #aab2c2; } .major-marker { stroke: #6f7889; }
.degree-label { fill: var(--cx-faint); font-family: var(--cx-font); }
.segment-label { font-family: var(--cx-font); fill: var(--cx-ink); }
.quadrant-fill { fill-opacity: .42; }
.q1-quadrant { fill: #c9defc; } .q2-quadrant { fill: #fdeaa8; } .q3-quadrant { fill: #fcd2ad; } .q4-quadrant { fill: #f8c4de; }
.compass-rose-decoration { stroke: var(--cx-faint); opacity: .35; }
.needle-north { fill: #d64545; stroke: #8f2323; } .needle-south { fill: #3b6fd8; stroke: #1f3f8f; }
.compass-arrow { filter: drop-shadow(0 .6px 1px rgba(20,30,60,.35)); }
/* words on the dial: the active word is a chip with the accent edge; the others are quiet but fully readable */
.textBox div { font-family: var(--cx-font) !important; font-weight: 600 !important; color: var(--cx-muted) !important; text-shadow: 0 0 .8px var(--cx-surface) !important; border-radius: 1.6px; transition: background var(--cx-t), color var(--cx-t); }
.textBox.active div { font-weight: 700 !important; color: var(--cx-ink) !important; background: rgba(255,255,255,.94); box-shadow: 0 0 0 .35px var(--cx-accent), 0 .5px 1.2px rgba(20,30,60,.2); text-shadow: none !important; }
html[data-scheme="night"] .textBox.active div { background: rgba(23,32,54,.94); }
.textBox:hover div { background: #fff176 !important; color: #1f2937 !important; }
.watermark { color: var(--cx-faint); font-family: var(--cx-font); font-weight: 600; opacity: .85; }
.cmp-ghost { font-family: var(--cx-font); border-radius: 10px; background: #fff176; border-color: var(--cx-accent); color: #1f2937; }
html[data-scheme="night"] body { background: var(--cx-bg); }
html[data-scheme="night"] .a4-page, html[data-scheme="night"] .title-box { background: var(--cx-surface); border-color: var(--cx-line); }
html[data-scheme="night"] .title-box, html[data-scheme="night"] .direction-indicator { color: var(--cx-ink); }
html[data-scheme="night"] .direction-indicator { background: var(--cx-accent-soft); border-color: var(--cx-accent); }
html[data-scheme="night"] .quadrant-fill { fill-opacity: .22; }
html[data-scheme="night"] .tools-dd, html[data-scheme="night"] #textSizePanel { background: var(--cx-surface); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { body { background: #fff !important; } .textBox div, .textBox.active div { color: #000 !important; background: none !important; box-shadow: none !important; } }
/* colour disc behind the dial (inserted by script as #cxDisc) */
#cxDisc { fill: url(#cxDiscGrad); stroke: var(--cx-disc-line); stroke-width: .35; filter: drop-shadow(0 .5px 1.2px rgba(60,50,20,.18)); }
html[data-scheme="night"] #cxDisc { filter: none; }
html[data-scheme="nocolour"] #cxDisc { filter: grayscale(1); }
@media print { #cxDisc { filter: none; } }

/* ===== v0.3: pearl buttons and a silver slider ===== */
:root {
  --cx-pearl: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 38%, rgba(255,255,255,0) 62%),
              linear-gradient(135deg, #f8f5ff 0%, #e4edfb 32%, #f3e8f5 62%, #e2f1f3 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,1) 0%, rgba(255,255,255,.45) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #f3eefe 0%, #d6e4fa 32%, #efdff3 62%, #d3ebef 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.75) 0%, rgba(255,255,255,.2) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #cfdcf5 0%, #b3c8ee 35%, #cdbfe9 65%, #b4d9e3 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -3px 5px rgba(110,125,175,.20), inset 0 0 0 1px rgba(255,255,255,.35);
}
html[data-scheme="night"] {
  --cx-pearl: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #2c3a5c 0%, #34456d 35%, #3a3560 65%, #2b4458 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.3) 0%, rgba(255,255,255,.1) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #34456d 0%, #3f5486 35%, #473f78 65%, #345468 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.2) 0%, rgba(255,255,255,.05) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #46609c 0%, #4d6bb0 35%, #5a4d98 65%, #3f6f8a 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -3px 5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.06);
}
#cmpCtl .tb, .audio-wrap, .tools-dd button {
  background-image: var(--cx-pearl); background-size: 100% 100%, 220% 220%; background-position: 0 0, 0% 0%; background-repeat: no-repeat;
  transition: background-position .6s ease, box-shadow var(--cx-t), transform var(--cx-t), border-color var(--cx-t);
}
#cmpCtl .tb, .audio-wrap { box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:hover, .audio-wrap:hover { background-image: var(--cx-pearl-hover); background-position: 0 0, 100% 100%; box-shadow: var(--cx-pearl-edge), 0 3px 8px rgba(20,30,60,.20); }
#cmpCtl .tb.on { background-image: var(--cx-pearl-on); box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:active, .audio-wrap:active { box-shadow: inset 0 2px 5px rgba(60,70,110,.28); }
.tools-dd button { box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
.tools-dd button:hover { background-image: var(--cx-pearl-hover); background-position: 0 0, 100% 100%; }
/* Audio slider: a silver ball like the compass pivot, on a channel that darkens from light grey (quiet) to black (loud) */
.audio-wrap #auVol2::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; box-shadow: inset 0 1px 1px rgba(0,0,0,.25); }
.audio-wrap #auVol2::-moz-range-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; }
.audio-wrap #auVol2::-moz-range-progress { background: transparent !important; }
.audio-wrap #auVol2::-webkit-slider-thumb { box-sizing: border-box; border: 1px solid #555; margin-top: -5px; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f5f5 12%, #b0b0b0 58%, #707070 100%); box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.35); }
.audio-wrap #auVol2::-moz-range-thumb { box-sizing: border-box; border: 1px solid #555; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f5f5 12%, #b0b0b0 58%, #707070 100%); box-shadow: 0 1px 2px rgba(0,0,0,.45); }
@media (pointer: coarse) { .audio-wrap #auVol2::-webkit-slider-thumb { margin-top: -7px; } }
@media (max-height: 520px) and (orientation: landscape) { .audio-wrap #auVol2::-webkit-slider-thumb { margin-top: -4px; } }
html[data-scheme="night"] .tools-dd button { box-shadow: inset 0 1px 0 rgba(255,255,255,.10); }
    
/* ===== TDL: tide dial, Quiz and Learned panel ===== */
.textBox, .textBox.active, .textBox.learned { transform: none !important; }
.textBox.learned div { color: #1b7f3b !important; }
.tide-segment { stroke: rgba(255,255,255,.75); stroke-width: .25; }
.segment-highlighted { stroke: var(--cx-accent); stroke-width: .9px; filter: none; }
.time-marker { font-family: var(--cx-font); fill: var(--cx-primary); font-weight: 700; }
html[data-scheme="night"] .time-marker { fill: #9fb4ee; }
html[data-scheme="night"] .tide-segment { stroke: rgba(255,255,255,.25); }
.quiz-container { background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: var(--cx-r-card); box-shadow: var(--cx-shadow-md); top: 50%; left: 75%; right: auto; transform: translate(-50%, -50%); width: min(340px, 92vw); max-width: none; box-sizing: border-box; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.quiz-container input { background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 8px; font-family: var(--cx-font); box-sizing: border-box; cursor: text; user-select: text; -webkit-user-select: text; }
.quiz-container button:hover { background: var(--cx-btn-bg-hover) !important; color: var(--cx-btn-ink) !important; }
.learned-vocabulary { position: fixed; z-index: 600; display: none; background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 12px; box-shadow: var(--cx-shadow-md); top: 110px; left: 12px; width: 200px; max-height: calc(100vh - 40px); overflow-y: auto; touch-action: none; cursor: grab; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html.has-learned .learned-vocabulary { display: block; }
html.no-quiz .quiz-container, html.no-quiz .learned-vocabulary, html.no-quiz #arrayMoveTip { display: none !important; }
.array-title { background: var(--cx-primary); color: #fff; border-radius: 8px; font-family: var(--cx-font); text-align: left; padding: 5px 66px 5px 8px; min-height: 1.4em; }
.vocabulary-item { background: var(--cx-surface); border-color: var(--cx-line); font-family: var(--cx-font); }
.vocabulary-item .sl-word { color: var(--cx-muted); }
.vocabulary-item .tl-word.hidden, .vocabulary-item .sl-word.hidden { background: var(--cx-line); }
.toggle-visibility { background: var(--cx-btn-bg); color: var(--cx-btn-ink); border: 1px solid var(--cx-btn-line); border-radius: 8px; font-family: var(--cx-font); font-weight: 600; }
@media (pointer: coarse) { .quiz-container input { font-size: 16px; } }
#quizMoveHint { font: 600 14px var(--cx-font); color: var(--cx-muted); text-align: center; margin: 0 0 8px; transition: opacity .4s ease, max-height .4s ease, margin .4s ease; max-height: 30px; overflow: hidden; }
#quizMoveHint.gone { opacity: 0; max-height: 0; margin: 0; }
#arrayMoveTip { position: fixed; z-index: 1200; background: #1f2937; color: #fff; font: 600 14px var(--cx-font); padding: 7px 12px; border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity .3s ease; white-space: nowrap; }
#arrayMoveTip::after { content: ""; position: absolute; border: 6px solid transparent; }
#arrayMoveTip.left::after { left: 100%; top: 50%; margin-top: -6px; border-left-color: #1f2937; }
#arrayMoveTip.right::after { right: 100%; top: 50%; margin-top: -6px; border-right-color: #1f2937; }
#arrayMoveTip.below::after { bottom: 100%; left: 24px; border-bottom-color: #1f2937; }
#modeToggle { max-width: 16em; white-space: normal; }
@media print { .a4-page { background: #fff !important; } .learned-vocabulary, .quiz-container { display: none !important; } #printList .pl-gap { height: 3mm; } }
/* the moon: the frame is now only the invisible grab handle; #cxMoon (script) is what you see */
#draggableFrame, #draggableFrame:hover, #draggableFrame.dragging { fill: transparent !important; stroke: none !important; opacity: 1 !important; }
#cxMoon .glow { transition: transform var(--cx-t); transform-box: fill-box; transform-origin: center; }
#cxMoon { filter: drop-shadow(0 .5px 1.1px rgba(40,25,0,.45)); transition: opacity var(--cx-t); }
#cxMoon.dragging { opacity: .88; }
#cxMoon.dragging .glow { transform: scale(1.2); }
html[data-scheme="night"] #cxMoon { filter: drop-shadow(0 0 1.4px rgba(255,238,170,.55)); }
@media print { #cxMoon { filter: none; } }
/* the labels sit on a blue that is now deep at high tide: a thin halo keeps them readable at every height */
.segment-label, .time-marker { paint-order: stroke; stroke: rgba(255,255,255,.9); stroke-width: .55px; stroke-linejoin: round; }
html[data-scheme="night"] .segment-label, html[data-scheme="night"] .time-marker { stroke: rgba(14,24,46,.85); }
html[data-scheme="night"] .segment-label { fill: #e6ebf7; }
@media print { .segment-label, .time-marker { stroke: none; } }
/* a word that turns yellow under the pointer (or a touch) always shows black text, in every colour scheme and whether or not it is learned */
html[lang] .textBox:hover div, html[lang] .textBox:active div, html[lang] .textBox.active:hover div, html[lang] .textBox.learned:hover div { color: #000 !important; text-shadow: none !important; background: #fff176 !important; }
    </style>
</head>
<body>
    <div class="a4-page">
        <div id="cmpInfo">
            <div id="title-box" class="title-box">TITLE_PLACEHOLDER</div>
            <div id="drag-instruction" class="drag-instruction">DRAG_INSTRUCTION_PLACEHOLDER</div>
        </div>
        <div id="cmpCtl">
            <button id="display-mode-toggle" class="display-mode-toggle tb" type="button" title="Change the language shown on every word">Show: TL</button>
            <button id="show-all-toggle" class="tb" type="button" title="Show every word at once">Show All</button>
            <button id="modeToggle" class="mode-toggle tb" type="button">STATES_MODE_LABEL</button>
            <button id="reset-btn" class="tb" type="button" title="Back to the starting view">Reset</button>
            <div class="tools-wrap" id="toolsWrap">
                <button id="toolsBtn" class="tb" type="button" aria-haspopup="true" title="Colours, Text size and Print">Tools &#9660;</button>
                <div class="tools-dd" id="toolsMenu">
                    <button id="colourBtn" type="button" title="Try different colour schemes">Colours: Night</button>
                    <button id="textSizeBtn" type="button" title="Enlarge or shrink any word">Text size&hellip;</button>
                    <button id="printBtn" type="button" title="Print this page on one A4 landscape sheet">Print</button>
                </div>
            </div>
            <button id="fsBtn" class="tb" type="button" onclick="toggleFullScreen()">Full Screen</button>
        </div>

        <div id="learned-vocabulary" class="learned-vocabulary">
            <div class="array-title" id="array-title">ARRAY_TITLE_PLACEHOLDER</div>
            <button class="toggle-visibility" id="toggle-learned">HIDE_ALL_LABEL</button>
            <div id="learned-items"></div>
        </div>

        <svg id="svgCanvas" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
            <defs>
                <radialGradient id="waveGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%"   style="stop-color:#87CEEB;stop-opacity:1"/>
                    <stop offset="60%"  style="stop-color:#4682B4;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1"/>
                </radialGradient>
                <!-- Moon gradient — matching LOG-CR-TDL exactly, colors
                     sampled from Alan's reference photo (Moon.jpg). -->
                <radialGradient id="moonGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%"   style="stop-color:#f5b55b;stop-opacity:1"/>
                    <stop offset="40%"  style="stop-color:#e2a24a;stop-opacity:1"/>
                    <stop offset="70%"  style="stop-color:#b87830;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#a36a1d;stop-opacity:1"/>
                </radialGradient>
                <!-- Tidal height gradient — matching LOG-CR-TDL exactly,
                     colors sampled from Alan's reference image
                     (BlueSeaGradients.png). Linear (not radial): color
                     tracks tide height (vertical position), not distance
                     from center. -->
                <linearGradient id="tidalHeightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%"   style="stop-color:#003399;stop-opacity:1"/>
                    <stop offset="25%"  style="stop-color:#0b58b3;stop-opacity:0.88"/>
                    <stop offset="50%"  style="stop-color:#2299dd;stop-opacity:0.66"/>
                    <stop offset="75%"  style="stop-color:#33ccee;stop-opacity:0.40"/>
                    <stop offset="100%" style="stop-color:#6bf3fc;stop-opacity:0.16"/>
                </linearGradient>
            </defs>

            <circle id="circlePath" cx="50" cy="50" r="30" class="circle-path"/>

            <!-- Tide segments -->
            <path id="high-tide-segment"  class="tide-segment high-tide-segment"/>
            <path id="outgoing-segment"   class="tide-segment outgoing-segment"/>
            <path id="low-tide-segment"   class="tide-segment low-tide-segment"/>
            <path id="incoming-segment"   class="tide-segment incoming-segment"/>

            <!-- Time markers -->
            <text class="time-marker" x="50" y="17">0h</text>
            <text class="time-marker" x="62" y="23">1h</text>
            <text class="time-marker" x="71" y="32">2h</text>
            <text class="time-marker" x="77" y="44">3h</text>
            <text class="time-marker" x="77" y="56">4h</text>
            <text class="time-marker" x="71" y="68">5h</text>
            <text class="time-marker" x="62" y="77">6h</text>
            <text class="time-marker" x="50" y="83">6h 12m</text>
            <text class="time-marker" x="38" y="77">7h</text>
            <text class="time-marker" x="29" y="68">8h</text>
            <text class="time-marker" x="23" y="56">9h</text>
            <text class="time-marker" x="23" y="44">10h</text>
            <text class="time-marker" x="29" y="32">11h</text>
            <text class="time-marker" x="38" y="23">12h</text>

            <!-- Central tidal icons -->
            <g id="tidal-decorations" class="tidal-icon">
                <path id="wave1" d="M 42 48 Q 44 46 46 48 Q 48 50 50 48 Q 52 46 54 48 Q 56 50 58 48"
                      stroke="#1E90FF" stroke-width="0.5" fill="none" opacity="0"/>
                <path id="wave2" d="M 42 52 Q 44 50 46 52 Q 48 54 50 52 Q 52 50 54 52 Q 56 54 58 52"
                      stroke="#1E90FF" stroke-width="0.5" fill="none" opacity="0"/>
                <line id="low-line" x1="44" y1="50" x2="56" y2="50"
                      stroke="#87CEEB" stroke-width="0.5" opacity="0"/>
            </g>

            <!-- Phase labels — populated from LANG config at runtime -->
            <text id="label-high"     class="segment-label" x="50" y="27"></text>
            <text id="label-outgoing" class="segment-label" x="68" y="50"></text>
            <text id="label-low"      class="segment-label" x="50" y="73"></text>
            <text id="label-incoming" class="segment-label" x="32" y="50"></text>

            <circle id="draggableFrame" cx="50" cy="20" r="4"/>
        </svg>

        <div id="printList"></div>

        <div class="watermark">&copy; 2026 Alan William Preston</div>
    </div>

    <div id="textSizePanel">
        <div class="tsHead"><span>Text size</span><button type="button" id="tsClose" aria-label="Close">&times;</button></div>
        <div class="tsTarget" id="tsTarget">Click a word, then slide</div>
        <input type="range" id="tsRange" min="50" max="300" step="5" value="100">
        <div class="tsRow"><label><input type="checkbox" id="tsAll"> All words</label><span id="tsVal">100%</span><button type="button" class="tsReset" id="tsReset">Reset</button></div>
    </div>

    <div id="quizContainer" class="quiz-container">
        <input type="text" id="quizInput" placeholder="QUIZ_PLACEHOLDER">
        <button id="quizCheck">QUIZ_BUTTON_LABEL</button>
        <div id="quizFeedback"></div>
    </div>

    <script>

    // =====================================================================
    // LANGUAGE CONFIGURATION BLOCK
    // To create a new language pair, replace ALL values in this section.
    // SL = Source Language  |  TL = Target Language (language being learned)
    // Do NOT change anything outside this block.
    // =====================================================================
    const LANG = {

        // --- Title cycle (click title box to cycle) ----------------------
        titles: [
            "SL_TITLE",          // e.g. "Tidal Cycle"
            "TL_TITLE",          // e.g. "Siklus Pasang Surut"
            "SL_TITLE / TL_TITLE"
        ],

        // --- UI strings --------------------------------------------------
        drag_instruction:   "DRAG_INSTRUCTION",   // e.g. "Drag the wave marker to explore!"
        array_title:        "ARRAY_TITLE",         // e.g. "Learned Vocabulary"
        hide_all_label:     "HIDE_ALL_LABEL",      // e.g. "Hide All"
        show_all_label:     "SHOW_ALL_LABEL",      // e.g. "Show All"
        states_mode_label:  "STATES_MODE_LABEL",   // e.g. "Switch to Transitions Mode"
        trans_mode_label:   "TRANS_MODE_LABEL",    // e.g. "Switch to States Mode"
        quiz_placeholder:   "QUIZ_PLACEHOLDER",    // e.g. "Enter the [TL] phrase"
        quiz_button:        "QUIZ_BUTTON_LABEL",   // e.g. "Check"
        quiz_correct:       "QUIZ_CORRECT",        // e.g. "Correct! ✓"
        quiz_wrong:         "QUIZ_WRONG",          // e.g. "Try again"
        reset_label:        "RESET_LABEL",         // e.g. "Reset"
        move_hint:          "MOVE_HINT",           // e.g. "You can move this"  (shown for 5 seconds each time the Quiz opens)
        show_tl_label:      "SHOW_TL_LABEL",       // e.g. "Show: TL"
        show_sl_label:      "SHOW_SL_LABEL",       // e.g. "Show: SL"

        // --- Phase labels (shown on the four quadrants of the dial) ------
        phase_high:     "PHASE_HIGH",      // e.g. "HIGH TIDE"
        phase_outgoing: "PHASE_OUTGOING",  // e.g. "OUTGOING"
        phase_low:      "PHASE_LOW",       // e.g. "LOW TIDE"
        phase_incoming: "PHASE_INCOMING",  // e.g. "INCOMING"

        // --- States mode vocabulary (12 items) ---------------------------
        // Format: [ SL phrase, TL phrase, Quiz question, angle (0–360°) ]
        // Angle 0° = top of circle (high tide peak); increases clockwise.
        statesData: [
            ["SL-S1",  "TL-S1",  "QUIZ-S1",  0  ],
            ["SL-S2",  "TL-S2",  "QUIZ-S2",  30 ],
            ["SL-S3",  "TL-S3",  "QUIZ-S3",  60 ],
            ["SL-S4",  "TL-S4",  "QUIZ-S4",  90 ],
            ["SL-S5",  "TL-S5",  "QUIZ-S5",  120],
            ["SL-S6",  "TL-S6",  "QUIZ-S6",  150],
            ["SL-S7",  "TL-S7",  "QUIZ-S7",  180],
            ["SL-S8",  "TL-S8",  "QUIZ-S8",  210],
            ["SL-S9",  "TL-S9",  "QUIZ-S9",  225],
            ["SL-S10", "TL-S10", "QUIZ-S10", 240],
            ["SL-S11", "TL-S11", "QUIZ-S11", 270],
            ["SL-S12", "TL-S12", "QUIZ-S12", 330]
        ],

        // --- Transitions mode vocabulary (12 items) ----------------------
        // Format: [ SL phrase, TL phrase, Quiz question, angle (0–360°) ]
        transitionsData: [
            ["SL-T1",  "TL-T1",  "QUIZ-T1",  90 ],
            ["SL-T2",  "TL-T2",  "QUIZ-T2",  105],
            ["SL-T3",  "TL-T3",  "QUIZ-T3",  120],
            ["SL-T4",  "TL-T4",  "QUIZ-T4",  135],
            ["SL-T5",  "TL-T5",  "QUIZ-T5",  165],
            ["SL-T6",  "TL-T6",  "QUIZ-T6",  180],
            ["SL-T7",  "TL-T7",  "QUIZ-T7",  195],
            ["SL-T8",  "TL-T8",  "QUIZ-T8",  225],
            ["SL-T9",  "TL-T9",  "QUIZ-T9",  240],
            ["SL-T10", "TL-T10", "QUIZ-T10", 270],
            ["SL-T11", "TL-T11", "QUIZ-T11", 315],
            ["SL-T12", "TL-T12", "QUIZ-T12", 345]
        ]
    };
    // =====================================================================
    // END OF LANGUAGE CONFIGURATION BLOCK
    // No language-specific content appears below this line.
    // =====================================================================


    // --- Apply UI strings from config ------------------------------------
    document.getElementById('title-box').innerHTML           = LANG.titles[0];   // innerHTML: a title may carry furigana (ruby)
    document.getElementById('drag-instruction').textContent = LANG.drag_instruction;
    document.getElementById('array-title').textContent      = LANG.array_title;
    document.getElementById('toggle-learned').textContent   = LANG.hide_all_label;
    document.getElementById('modeToggle').textContent       = LANG.states_mode_label;
    document.getElementById('quizInput').placeholder        = LANG.quiz_placeholder;
    document.getElementById('quizCheck').textContent        = LANG.quiz_button;
    document.getElementById('label-high').textContent       = LANG.phase_high;
    document.getElementById('label-outgoing').textContent   = LANG.phase_outgoing;
    document.getElementById('label-low').textContent        = LANG.phase_low;
    document.getElementById('label-incoming').textContent   = LANG.phase_incoming;

    // --- Runtime state --------------------------------------------------
    let isStatesMode    = true;
    let currentQuizIndex = -1;
    let learnedItemsStates      = new Array(LANG.statesData.length).fill(false);
    let learnedItemsTransitions = new Array(LANG.transitionsData.length).fill(false);

    // Uniform textbox radius, matching LOG-CR-TDL and the rest of the
    // Circular family — previously activeR=10/learnedR=22 clustered all
    // 12 items tightly near the center rather than spreading them around
    // the circle's circumference.
    const textBoxRadius = 30 * 1.25;
    const positionOverrides = {
        8:  { x: 18, y: 70 }, // S9  — matching LOG-CR-TDL's values
        9:  { x: 10, y: 50 }, // S10 — moved 2026-07-21 (was 10,40)
        10: { x: 20, y: 30 }  // S11 — moved 2026-07-21 (was 10,30)
        // S8 and S12 intentionally left at their formula positions,
        // matching LOG-CR-TDL. Note: this file's positions have now
        // diverged slightly from LOG-CR-TDL's — S10/S11 were adjusted
        // here specifically, not ported back to LOG.
    };
    let textBoxElements = [];
    let currentPosition = 0;
    let isDragging      = false;
    let currentTextIndex = 0;
    let closedIdx = -1;

    // --- Vocabulary array panel -----------------------------------------
    function toggleArrayVisibility() {
        const container = document.getElementById('learned-items');
        const button    = document.getElementById('toggle-learned');
        if (!container || !button) return;
        const spans = container.querySelectorAll('.vocabulary-item .tl-word, .vocabulary-item .sl-word');
        let visibleCount = 0;
        spans.forEach(s => { if (!s.classList.contains('hidden')) visibleCount++; });
        const mostlyVisible = visibleCount > spans.length / 2;
        spans.forEach(s => { s.classList.toggle('hidden', mostlyVisible); });
        button.textContent = mostlyVisible ? LANG.show_all_label : LANG.hide_all_label;
    }

    function addToVocabularyArray(index, data) {
        const tl = data[index][1];
        const sl = data[index][0];
        const item = document.createElement('div');
        item.className = 'vocabulary-item';
        const tlSpan = document.createElement('span');
        tlSpan.className = 'tl-word';
        tlSpan.innerHTML = tl;   // the TL word may carry furigana (ruby)
        const slSpan = document.createElement('span');
        slSpan.className = 'sl-word';
        slSpan.textContent = sl;
        [tlSpan, slSpan].forEach(s => {
            s.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('hidden');
            });
        });
        item.appendChild(tlSpan);
        item.appendChild(slSpan);
        document.getElementById('learned-items').appendChild(item);
    }

    // --- SVG segment geometry -------------------------------------------
    function createSegments() {
        const c = { x: 50, y: 50 }, r = 30;
        // Recalibrated to match LOG-CR-TDL's semi-diurnal (~12.4h)
        // 2-phase model: high tide and low tide are the two turning
        // POINTS (top = 50,20 = hour 0/12.4; bottom = 50,80 = hour 6.2),
        // not their own segments. Outgoing spans the full right half
        // (hours 0–6.2); incoming spans the full left half (hours
        // 6.2–12.4). high-tide-segment / low-tide-segment are left with
        // no path so they render as nothing, while their labels remain
        // as point-markers.
        const halves = [
            { id: 'outgoing-segment',   a1: -90, a2:  90 },
            { id: 'incoming-segment',   a1:  90, a2: 270 }
        ];
        halves.forEach(q => {
            const a1 = q.a1 * Math.PI / 180, a2 = q.a2 * Math.PI / 180;
            const x1 = c.x + r * Math.cos(a1), y1 = c.y + r * Math.sin(a1);
            const x2 = c.x + r * Math.cos(a2), y2 = c.y + r * Math.sin(a2);
            document.getElementById(q.id).setAttribute('d',
                `M ${c.x} ${c.y} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`);
        });
    }

    function updateSegmentHighlight(angle) {
        const a = ((angle % 360) + 360) % 360;
        ['high-tide-segment','outgoing-segment','low-tide-segment','incoming-segment']
            .forEach(id => document.getElementById(id).classList.remove('segment-highlighted'));
        // Recalibrated to match LOG-CR-TDL: only two real segments now
        // (outgoing = 0–180, incoming = 180–360). high-tide-segment and
        // low-tide-segment are never highlighted as areas anymore — no
        // rendered path — but the wave decoration still gets a
        // "high"/"low" flourish within a narrow band near the actual
        // turning points.
        const active = a < 180 ? 'outgoing-segment' : 'incoming-segment';
        document.getElementById(active).classList.add('segment-highlighted');

        const nearTop    = a <= 15 || a >= 345;
        const nearBottom = a >= 165 && a <= 195;
        const decoPhase  = nearTop ? 'high' : nearBottom ? 'low' : (a < 180 ? 'outgoing' : 'incoming');
        updateTidalDecoration(decoPhase);
    }

    function updateTidalDecoration(phase) {
        const w1 = document.getElementById('wave1');
        const w2 = document.getElementById('wave2');
        const ll = document.getElementById('low-line');
        if (phase === 'high' || phase === 'incoming') {
            w1.setAttribute('opacity','1'); w2.setAttribute('opacity','1');
            ll.setAttribute('opacity','0');
        } else if (phase === 'low') {
            w1.setAttribute('opacity','0'); w2.setAttribute('opacity','0');
            ll.setAttribute('opacity','1');
        } else {
            w1.setAttribute('opacity','0.5'); w2.setAttribute('opacity','0.5');
            ll.setAttribute('opacity','0.5');
        }
    }

    // --- Text boxes -----------------------------------------------------
    function createTextBoxes() {
        document.querySelectorAll('.textBox').forEach(b => b.parentNode && b.parentNode.removeChild(b));
        textBoxElements = [];

        const svg         = document.getElementById('svgCanvas');
        const c           = { x: 50, y: 50 };
        const currentData = isStatesMode ? LANG.statesData : LANG.transitionsData;
        const learnedItems= isStatesMode ? learnedItemsStates : learnedItemsTransitions;

        currentData.forEach((item, index) => {
            const angle = (item[3] - 90) * Math.PI / 180;
            let x = c.x + textBoxRadius * Math.cos(angle);
            let y = c.y + textBoxRadius * Math.sin(angle);
            if (positionOverrides[index]) {
                if (positionOverrides[index].x !== undefined) x = positionOverrides[index].x;
                if (positionOverrides[index].y !== undefined) y = positionOverrides[index].y;
            }

            const fo = document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
            fo.setAttribute('x', x - 30);
            fo.setAttribute('y', y - 12);
            fo.setAttribute('width',  '60');
            fo.setAttribute('height', '24');
            fo.setAttribute('class',  'textBox');
            fo.setAttribute('data-index', index);
            fo.style.pointerEvents = 'auto';
            fo.style.zIndex = '500';

            const div = document.createElement('div');
            // Vertical centering: previously only text-align:center
            // (horizontal) was set. A plain div flows from the TOP of its
            // container, so text rendered near the box's top edge rather
            // than its true center — the same root-cause bug found and
            // fixed on LOG-CR-TDL via a debug-marker test. Fixed the same
            // way here with flexbox, filling the full box.
            div.style.display        = 'flex';
            div.style.alignItems     = 'center';
            div.style.justifyContent = 'center';
            div.style.width          = '100%';
            div.style.height         = '100%';
            div.style.boxSizing      = 'border-box';
            div.style.textAlign  = 'center';
            div.style.fontSize   = '2.5px';
            div.style.fontFamily = 'Arial, sans-serif';
            div.style.color      = 'black';
            div.style.cursor     = 'pointer';
            div.style.lineHeight = '1.1';
            div.style.fontWeight = 'normal';
            // Full white halo, matching LOG-CR-TDL, for contrast against
            // both the plain page and the new tidal-height gradient.
            div.style.textShadow =
                '1px 1px 2px white, -1px -1px 2px white, ' +
                '1px -1px 2px white, -1px 1px 2px white';
            div.textContent = item[1]; // starts at TL — ROM convention
            fo.appendChild(div);

            if (learnedItems[index]) fo.classList.add('learned');

            fo.addEventListener('click', function() {
                const idx  = parseInt(this.getAttribute('data-index'));
                const div  = this.querySelector('div');
                const data = isStatesMode ? LANG.statesData : LANG.transitionsData;
                const lrnd = isStatesMode ? learnedItemsStates : learnedItemsTransitions;

                if (document.getElementById('quizContainer').style.display !== 'none'
                    && currentQuizIndex === idx) return;

                const tlText = data[idx][1];
                const slText = data[idx][0];

                if (lrnd[idx]) {
                    // Learned: toggle TL ↔ SL
                    div.textContent = (div.textContent === tlText) ? slText : tlText;
                    div.style.fontSize = (div.textContent === slText) ? '2.3px' : '2.5px';
                } else {
                    // Not learned: TL → SL → Quiz
                    if (div.textContent === tlText) {
                        div.textContent = slText;
                        div.style.fontSize = '2.3px';
                    } else if (div.textContent === slText) {
                        showQuiz(idx, this);
                    } else {
                        div.textContent = tlText;
                        div.style.fontSize = '2.5px';
                    }
                }
            });

            const draggableFrame = document.getElementById('draggableFrame');
            if (draggableFrame && draggableFrame.parentNode) {
                draggableFrame.parentNode.insertBefore(fo, draggableFrame);
            } else {
                svg.appendChild(fo);
            }
            textBoxElements.push(fo);
        });

        const frame = document.getElementById('draggableFrame');
        if (frame && frame.parentNode) frame.parentNode.appendChild(frame);
    }

    // --- Frame positioning & update -------------------------------------
    function findClosestItem(angle) {
        const data = isStatesMode ? LANG.statesData : LANG.transitionsData;
        const norm = ((angle % 360) + 360) % 360;
        let closest = 0, minDiff = 360;
        data.forEach((item, i) => {
            let diff = Math.abs(norm - item[3]);
            if (diff > 180) diff = 360 - diff;
            if (diff < minDiff) { minDiff = diff; closest = i; }
        });
        return closest;
    }

    function updateVisibleTextBoxes(itemIndex) {
        const data    = isStatesMode ? LANG.statesData : LANG.transitionsData;
        const learned = isStatesMode ? learnedItemsStates : learnedItemsTransitions;
        textBoxElements.forEach((tb, i) => {
            if (!tb) return;
            if (i === itemIndex) {
                tb.classList.add('active'); tb.classList.remove('hidden');
                tb.style.opacity = '1'; tb.style.display = 'block';
            } else if (learned[i]) {
                tb.classList.remove('active'); tb.classList.remove('hidden');
                tb.style.opacity = '0.5'; tb.style.display = 'block';
            } else {
                tb.classList.remove('active'); tb.classList.add('hidden');
                tb.style.opacity = '0'; tb.style.display = 'none';
            }
        });
    }

    function positionFrameOnItem(itemIndex) {
        const data  = isStatesMode ? LANG.statesData : LANG.transitionsData;
        const c     = { x: 50, y: 50 }, r = 30;
        const angle = (data[itemIndex][3] - 90) * Math.PI / 180;
        const frame = document.getElementById('draggableFrame');
        frame.setAttribute('cx', c.x + r * Math.cos(angle));
        frame.setAttribute('cy', c.y + r * Math.sin(angle));
        currentPosition = itemIndex;
        updateVisibleTextBoxes(itemIndex);
        updateSegmentHighlight(data[itemIndex][3]);
    }

    // --- Quiz -----------------------------------------------------------
    function showQuiz(index) {
        const data = isStatesMode ? LANG.statesData : LANG.transitionsData;
        currentQuizIndex = index;
        const qc = document.getElementById('quizContainer');
        document.getElementById('quizInput').placeholder = data[index][2];
        document.getElementById('quizInput').value = '';
        document.getElementById('quizFeedback').textContent = '';
        qc.style.display    = 'block';
        qc.style.visibility = 'visible';
        qc.style.opacity    = '1';
        qc.style.zIndex     = '9999';
        setTimeout(() => { try { document.getElementById('quizInput').focus(); } catch(e){} }, 100);
    }

    function checkQuizAnswer() {
        if (currentQuizIndex < 0) return;
        const data    = isStatesMode ? LANG.statesData : LANG.transitionsData;
        const learned = isStatesMode ? learnedItemsStates : learnedItemsTransitions;
        const input   = document.getElementById('quizInput').value.trim();
        const correct = data[currentQuizIndex][1];
        const fb      = document.getElementById('quizFeedback');

        if (input.toLowerCase() === correct.toLowerCase()) {
            fb.textContent = LANG.quiz_correct;
            fb.style.color = 'green';
            learned[currentQuizIndex] = true;

            const tb = textBoxElements[currentQuizIndex];
            if (tb) {
                tb.classList.add('learned');
                const div = tb.querySelector('div');
                if (div) div.textContent = correct;
                const c = { x: 50, y: 50 };
                const angle = (data[currentQuizIndex][3] - 90) * Math.PI / 180;
                let lx = c.x + textBoxRadius * Math.cos(angle);
                let ly = c.y + textBoxRadius * Math.sin(angle);
                if (positionOverrides[currentQuizIndex]) {
                    if (positionOverrides[currentQuizIndex].x !== undefined) lx = positionOverrides[currentQuizIndex].x;
                    if (positionOverrides[currentQuizIndex].y !== undefined) ly = positionOverrides[currentQuizIndex].y;
                }
                tb.setAttribute('x', lx - 30);
                tb.setAttribute('y', ly - 12);
            }
            addToVocabularyArray(currentQuizIndex, data);
            closedIdx = currentQuizIndex;
            setTimeout(() => {
                if (currentQuizIndex === closedIdx) {
                    document.getElementById('quizContainer').style.display = 'none';
                    currentQuizIndex = -1;
                }
            }, 1500);
        } else {
            fb.textContent = LANG.quiz_wrong;
            fb.style.color = 'red';
            const tb = textBoxElements[currentQuizIndex];
            if (tb) {
                const div = tb.querySelector('div');
                if (div) { div.textContent = correct; div.style.fontSize = '2.5px'; }
            }
        }
    }

    // --- Mode toggle ----------------------------------------------------
    function toggleMode() {
        isStatesMode = !isStatesMode;
        document.getElementById('modeToggle').textContent =
            isStatesMode ? LANG.states_mode_label : LANG.trans_mode_label;
        createTextBoxes();
        positionFrameOnItem(0);
    }

    // --- Init -----------------------------------------------------------
    function initializeApp() {
        const svg       = document.getElementById('svgCanvas');
        const frame     = document.getElementById('draggableFrame');
        const titleBox  = document.getElementById('title-box');
        const qc        = document.getElementById('quizContainer');
        const quizInput = document.getElementById('quizInput');

        if (!svg || !frame || !titleBox) return;

        createSegments();
        createTextBoxes();
        positionFrameOnItem(0);

        frame.style.pointerEvents = 'all';
        frame.style.cursor = 'grab';

        // Drag handlers
        frame.addEventListener('mousedown',  e => { isDragging = true; frame.classList.add('dragging'); e.preventDefault(); e.stopPropagation(); });
        frame.addEventListener('touchstart', e => { isDragging = true; frame.classList.add('dragging'); e.preventDefault(); e.stopPropagation(); }, { passive: false });

        function onMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const pt0 = svg.createSVGPoint(); pt0.x = clientX; pt0.y = clientY;
            const sp = pt0.matrixTransform(svg.getScreenCTM().inverse());
            const svgX = sp.x, svgY = sp.y;
            const angle = Math.atan2(svgY - 50, svgX - 50);
            const r = 30;
            frame.setAttribute('cx', 50 + r * Math.cos(angle));
            frame.setAttribute('cy', 50 + r * Math.sin(angle));
            const deg  = (angle * 180 / Math.PI + 90 + 360) % 360;
            const idx  = findClosestItem(deg);
            currentPosition = idx;
            updateVisibleTextBoxes(idx);
            updateSegmentHighlight(deg);
            e.preventDefault(); e.stopPropagation();
        }

        function onEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            frame.classList.remove('dragging');
            frame.style.cursor = 'grab';
            if (window.__cmpSpeak) window.__cmpSpeak(currentPosition);   // no snap on release (standing preference across Circular templates)
            if (e) { e.preventDefault(); e.stopPropagation(); }
        }

        document.addEventListener('mousemove',  onMove);
        document.addEventListener('touchmove',  onMove,  { passive: false });
        document.addEventListener('mouseup',    onEnd);
        document.addEventListener('touchend',   onEnd);
        document.addEventListener('mouseleave', onEnd);

        // Title cycle
        titleBox.addEventListener('click', function() {
            this.classList.add('hidden');
            setTimeout(() => {
                currentTextIndex = (currentTextIndex + 1) % LANG.titles.length;
                this.innerHTML = LANG.titles[currentTextIndex];
                this.classList.remove('hidden');
            }, 500);
        });

        document.getElementById('modeToggle').addEventListener('click', toggleMode);
        document.getElementById('quizCheck').addEventListener('click', checkQuizAnswer);
        quizInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkQuizAnswer(); });
        document.getElementById('toggle-learned').addEventListener('click', toggleArrayVisibility);

        // Outside-click dismisses quiz
        document.addEventListener('click', function(e) {
            if (qc.style.display === 'none') return;
            if (qc.contains(e.target)) return;
            if (textBoxElements.some(b => b && b.contains(e.target))) return;
            const learned = isStatesMode ? learnedItemsStates : learnedItemsTransitions;
            const data    = isStatesMode ? LANG.statesData : LANG.transitionsData;
            if (currentQuizIndex >= 0 && !learned[currentQuizIndex]) {
                const tb = textBoxElements[currentQuizIndex];
                if (tb) {
                    const div = tb.querySelector('div');
                    if (div && window.__tdlSetK) window.__tdlSetK(currentQuizIndex, 0);
                }
            }
            qc.style.display = 'none';
            currentQuizIndex = -1;
        });

        qc.style.display = 'none';

        // Fade drag instruction after 15s
        setTimeout(() => {
            const di = document.getElementById('drag-instruction');
            if (di) {
                di.classList.add('fade');
                setTimeout(() => { di.style.display = 'none'; }, 3000);
            }
        }, 15000);
    }

    document.addEventListener('DOMContentLoaded', initializeApp);

    </script>
    <script>
    /* 2026-11-13 TIDAL DAILY CYCLE: layout that fits any screen (each word sits just outside the dial at its own angle, pushed out when words would touch; the view box grows to hold
       the longest words), the layer cycle (ROM: TL > SL > Quiz; LOG: TLR > TL > SL > Quiz) on every word, Show All, and the touch-anywhere grab of the moon. */
    (function () {
        var SVGNS = 'http://www.w3.org/2000/svg';
        var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif'; document.documentElement.style.setProperty('--cx-font', FONT);
        var BASE = 4.2, R0 = 36.6, GAP = 0.8;
        var svg = document.getElementById('svgCanvas');
        var cv = document.createElement('canvas').getContext('2d'), tmp = document.createElement('div');
        window.LOGV = LANG.statesData[0].length >= 5;
        window.MODES = LOGV ? [2, 1, 0] : [1, 0];
        var ANGI = LOGV ? 4 : 3, QI = LOGV ? 3 : 2, displayMode = 0;
        function plain(s) { tmp.innerHTML = String(s == null ? '' : s); tmp.querySelectorAll('rt, rp').forEach(function (n) { n.parentNode.removeChild(n); }); return tmp.textContent; }
        function dat() { return isStatesMode ? LANG.statesData : LANG.transitionsData; }
        function lrn() { return isStatesMode ? learnedItemsStates : learnedItemsTransitions; }
        function sizeOf(i) { return BASE * (window.tsScale ? window.tsScale(i) : 1); }
        function wOf(i, txt) { cv.font = '700 ' + sizeOf(i) + 'px ' + FONT; return cv.measureText(plain(txt)).width + 3; }
        function hOf(i) { return sizeOf(i) * 1.35; }
        function lab(key, dflt) { var v = LANG[key]; return (v && !/^SHOW_(TLR|TL|SL)_LABEL$/.test(v)) ? v : dflt; }
        function modeLabel(m) { var row = MODES[m]; return row === 2 ? lab('show_tlr_label', 'Show: TLR') : row === 1 ? lab('show_tl_label', 'Show: TL') : lab('show_sl_label', 'Show: SL'); }
        function word(i, k) { return dat()[i][MODES[k]]; }

        function rectsFor(ds, kOf) {
            var out = [], placed = [];
            for (var i = 0; i < ds.length; i++) {
                var w = wOf(i, ds[i][MODES[kOf(i)]]), h = hOf(i), a = (ds[i][ANGI] - 90) * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
                var d = R0 + (w / 2) * Math.abs(ux) + (h / 2) * Math.abs(uy), r;
