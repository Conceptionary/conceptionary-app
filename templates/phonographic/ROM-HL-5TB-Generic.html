<!-- Last updated: 2026-08-26 (Mangawhai, NZ) — added to
     templates/phonographic/ (was previously missing from the repo
     entirely; the LOG-HL-5TB sibling was already present). Renamed
     from "Horizontal_Line_5TB_-_Phonographic_-_Generic.html" to match
     the project's ROM-XX-Generic.html naming convention. Bugfix
     applied: textPath was anchored to an SVG <line>, a newer SVG2
     addition with inconsistent browser support (silently fails in
     Firefox). Now anchored to a dedicated invisible <path> instead,
     universally supported since SVG's earliest implementations. Same
     bug found and fixed across the HL family (ROM-HL-BI, LOG-HL-BI,
     LOG-HL-10TB, LOG-HL-5TB, ROM-HL-10TB) — see
     Conceptionary_Template_Decision_Log.md for the discovery context. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Line - Language Learning Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            overflow: hidden;
        }

        .a4-page {
            width: 90vw;
            height: 70vh;
            border: 5px solid black;
            background-color: white;
            box-sizing: border-box;
            position: relative;
            touch-action: none;
            z-index: 1;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .path-line {
            stroke: black;
            stroke-width: 0.5;
            fill: none;
        }

        /* Background gradient */
        #conceptBackground {
            fill: url(#conceptGradient);
            opacity: 0.2;
        }

        /* States Template Elements */
        .textBox {
            cursor: pointer;
            font-size: 0.32em;
            fill: black;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5);
        }

        .textBox.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .textBox.learned {
            opacity: 1;
            transform: scale(1) translateY(0);
            fill: green;
        }

        #draggableFrame {
            cursor: move;
            fill: rgba(100, 150, 255, 0.2);
            stroke: black;
            stroke-width: 0.5px;
            pointer-events: all;
            opacity: 0.8;
        }

        #draggableFrame:hover {
            fill: rgba(100, 150, 255, 0.5);
        }

        #draggableFrame.dragging {
            cursor: grabbing;
            fill: rgba(255, 150, 100, 0.5);
            stroke: #cc6600;
        }

        /* Transitions Template Elements */
        .sliding-text {
            font-size: 4px;
            font-weight: bold;
            fill: blue;
            cursor: pointer;
        }
        
        .sliding-text.learned {
            fill: green;
        }

        /* Common Title Box Styling */
        .title-box {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 1px solid black;
            padding: 10px;
            background-color: white;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .title-box.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }
        
        /* Mode Toggle Button */
        .mode-toggle {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            padding: 8px 16px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
        }
        
        /* Concept Indicator */
        .concept-indicator {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 3;
        }
        
        /* Level indicator for transitions mode */
        .level-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 3;
        }

        /* Quiz container styles */
        .quiz-container {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 3px solid #3366cc;
            border-radius: 4px;
            padding: 12px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 360px;
            width: 360px;
            pointer-events: auto;
            visibility: visible;
            opacity: 1;
        }
        
        .quiz-container input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .quiz-container button {
            width: 100%;
            padding: 8px;
            background-color: #3366cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .quiz-container button:hover {
            background-color: #254e9c;
        }
        
        #quizFeedback {
            text-align: center;
            font-weight: bold;
            margin-top: 8px;
            min-height: 20px;
        }

        /* Vocabulary Arrays Styles */
        .vocabulary-array {
            position: absolute;
            top: 2%;
            width: 25%;
            max-height: 40vh;
            overflow-y: auto;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px;
            z-index: 4;
            display: none;
        }

        #increasing-array {
            left: 12.5%;
        }

        #decreasing-array {
            right: 12.5%;
        }

        .array-title {
            font-size: 0.9em;
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
            padding: 3px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ccc;
        }

        .vocabulary-item {
            display: flex;
            flex-direction: column;
            font-size: 0.75em;
            margin: 3px 0;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background-color: #f9f9f9;
            transition: background-color 0.3s ease;
        }

        .vocabulary-item:hover {
            background-color: #eaf2ff;
        }

        .vocabulary-item .target-language {
            font-weight: bold;
            color: #0066cc;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .vocabulary-item .source-language {
            color: #555;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
        }
        
        .vocabulary-item .target-language.hidden,
        .vocabulary-item .source-language.hidden {
            color: transparent;
            user-select: none;
            background-color: #f0f0f0;
        }
        
        /* Toggle visibility button */
        .toggle-visibility {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7em;
            padding: 2px 5px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            z-index: 5;
        }

        /* Tools Menu */
        .tools-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
        }

        .tools-button {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.8em;
            cursor: pointer;
        }

        .tools-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 30px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 150px;
            padding: 5px 0;
            z-index: 10;
        }

        .tools-dropdown.active {
            display: block;
        }

        .tool-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            pointer-events: auto;
            user-select: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .tool-item:hover {
            background-color: #f5f5f5;
        }

        /* Drag instruction */
        .drag-instruction {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9em;
            padding: 5px 10px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 3;
            opacity: 1;
            transition: opacity 2s ease;
        }
        
        .drag-instruction.fade {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="a4-page">
        <div id="title-box" class="title-box">Horizontal Line Template - Language Learning</div>
        <div id="concept-indicator" class="concept-indicator">Position</div>
        <div id="level-indicator" class="level-indicator">Target Language</div>
        <div id="drag-instruction" class="drag-instruction">Drag the blue frame along the line to explore vocabulary!</div>
        
        <!-- Tools Menu -->
        <div class="tools-menu">
            <div class="tools-button">Tools</div>
            <div class="tools-dropdown">
                <div class="tool-item" id="loadConcept">Load Concept</div>
                <div class="tool-item" id="startQuiz">Quick Quiz</div>
                <div class="tool-item" id="toggleArrays">Toggle Arrays</div>
            </div>
        </div>
        
        <!-- Vocabulary Arrays -->
        <div id="increasing-array" class="vocabulary-array">
            <div class="array-title">Increasing Progression</div>
            <button class="toggle-visibility" id="toggle-increasing">Hide All</button>
            <div id="increasing-items"></div>
        </div>
        
        <div id="decreasing-array" class="vocabulary-array">
            <div class="array-title">Decreasing Progression</div>
            <button class="toggle-visibility" id="toggle-decreasing">Hide All</button>
            <div id="decreasing-items"></div>
        </div>
        
        <svg id="svgCanvas" viewBox="0 0 160 50" preserveAspectRatio="xMidYMid meet">
            <!-- Concept Gradient -->
            <defs>
                <linearGradient id="conceptGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#87ceeb;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <line id="horizontalLine" class="path-line" x1="0" y1="25" x2="160" y2="25"/>
            <!-- Invisible path with identical geometry, for textPath to
                 anchor to. See top-of-file comment for why. -->
            <path id="horizontalPath" d="M 0,25 L 160,25" style="display:none;" />
            <rect id="conceptBackground" x="0" y="22" width="160" height="6"/>
            
            <!-- States Mode Elements -->
            <rect id="draggableFrame" x="15" y="20" width="10" height="10" rx="2"/>
            
            <!-- Transitions Mode Elements - Single Draggable Text -->
            <text id="interactiveText" class="sliding-text">
                <textPath id="slidingText" href="#horizontalPath" startOffset="0%">
                    TL-T1
                </textPath>
            </text>
        </svg>
        <button id="modeToggle" class="mode-toggle">Toggle Mode</button>
        <div class="watermark">
            &copy; 2025 Alan William Preston - Horizontal Line Template
        </div>
    </div>

    <!-- Quiz Container -->
    <div id="quizContainer" class="quiz-container">
        <input type="text" id="quizInput" placeholder="Enter the target language word">
        <button id="quizCheck">Check</button>
        <div id="quizFeedback"></div>
    </div>

    <script>
        // Horizontal line template data with 5 textboxes - 2-level hierarchy: TL, SL
        // Format: [TL, SL, Quiz Question, Position along line (0-160 units)]
        const conceptData = [
            ["TL1", "SL1", "What is the TL word for 'SL1'?", 0],     // Left end
            ["TL2", "SL2", "What is the TL word for 'SL2'?", 40],    // 25%
            ["TL3", "SL3", "What is the TL word for 'SL3'?", 80],    // 50% - Center
            ["TL4", "SL4", "What is the TL word for 'SL4'?", 120],   // 75%
            ["TL5", "SL5", "What is the TL word for 'SL5'?", 160]    // Right end
        ];

        // Transitions data for horizontal progression - 4 segments with equal length staying within frame bounds
        const transitionsData = [
            ["TL-T1", "SL-T1", "What is the TL word for 'SL-T1'?", 0],
            ["TL-T2", "SL-T2", "What is the TL word for 'SL-T2'?", 20],
            ["TL-T3", "SL-T3", "What is the TL word for 'SL-T3'?", 40],
            ["TL-T4", "SL-T4", "What is the TL word for 'SL-T4'?", 60]
        ];

        // Global variables
        let isStatesMode = true;
        let currentQuizIndex = -1;
        let slidingTextMode = 0; // 0: TL, 1: SL, 2: Quiz
        let statesLearnedItems = []; // Separate array for States Mode
        let transitionsLearnedItems = []; // Separate array for Transitions Mode
        let textBoxElements = [];
        let addedIncreasingItems = [];
        let addedDecreasingItems = [];
        let currentTextLayer = new Array(5).fill(0); // Start with TL (index 0)
        
        // TRANSITIONS MODE VARIABLES
        let startPercent = 0;
        let isDraggingText = false;
        let lastX = 0;
        let hasMovedDuringDrag = false;
        
        // Title text options
        const titleTexts = {
            states: ["Horizontal Line Template - Language Learning", "Target Language View", "Source Language View"],
            transitions: ["Horizontal Line Transitions", "Dynamic Changes", "Temporal Progression"]
        };
        let currentTextIndex = 0;
        
        // Activation distance for text boxes
        const activationDistance = 18;

        // DOM elements
        let svg, horizontalLine, conceptBackground, titleBox, conceptIndicator, levelIndicator;
        let modeToggleBtn, frame, quizContainer, quizInput, quizCheck, quizFeedback;
        let increasingArray, decreasingArray, increasingItems, decreasingItems;
        let toggleIncreasingBtn, toggleDecreasingBtn, interactiveText;

        // TRANSITIONS MODE FUNCTIONS
        
        function getTransitionDataForPosition(percent) {
            if (percent < 15) return { index: 0, data: transitionsData[0] };
            else if (percent < 35) return { index: 1, data: transitionsData[1] };
            else if (percent < 55) return { index: 2, data: transitionsData[2] };
            else return { index: 3, data: transitionsData[3] };
        }

        function updateTextBasedOnPosition(percent) {
            if (isStatesMode) return;
            
            // Allow range up to 93% to prevent text extending beyond frame
            percent = Math.min(93, Math.max(0, percent));
            const transitionData = getTransitionDataForPosition(percent);
            const index = transitionData.index;
            const data = transitionData.data;
            
            const textPath = document.getElementById("slidingText");
            if (!textPath) return;
            
            if (transitionsLearnedItems[index]) {
                interactiveText.classList.add('learned');
                // For learned items, cycle between TL and SL
                if (slidingTextMode === 0) {
                    textPath.textContent = data[0]; // TL
                } else {
                    textPath.textContent = data[1]; // SL
                }
            } else {
                interactiveText.classList.remove('learned');
                // For unlearned items, show based on current mode
                if (slidingTextMode === 0) {
                    textPath.textContent = data[0]; // TL
                } else if (slidingTextMode === 1) {
                    textPath.textContent = data[1]; // SL
                }
            }
            
            conceptIndicator.textContent = data[1]; // Always show SL in indicator
            updateLevelIndicator();
        }

        function updateTextPosition(percent) {
            if (isStatesMode) return;
            
            // Constrain to 93% to prevent text from extending beyond frame boundary
            percent = Math.min(93, Math.max(0, percent));
            
            const textPath = document.getElementById("slidingText");
            if (textPath) {
                textPath.setAttribute("startOffset", `${percent}%`);
            }
            updateTextBasedOnPosition(percent);
        }

        function startTextDrag(event) {
            if (isStatesMode) return;
            
            isDraggingText = true;
            hasMovedDuringDrag = false;
            lastX = event.touches ? event.touches[0].clientX : event.clientX;
            event.preventDefault();
        }

        function dragText(event) {
            if (!isDraggingText || isStatesMode) return;
            
            let currentX = event.touches ? event.touches[0].clientX : event.clientX;
            let movement = currentX - lastX;
            
            if (Math.abs(movement) > 5) {
                hasMovedDuringDrag = true;
            }
            
            lastX = currentX;
            startPercent += movement * 0.15; // Reduced sensitivity for better control
            
            // Constrain to 0-93% range to keep text within frame boundaries
            startPercent = Math.min(93, Math.max(0, startPercent));
            updateTextPosition(startPercent);
            
            if (event.cancelable) event.preventDefault();
        }

        function endTextDrag() {
            isDraggingText = false;
        }

        // 3-level cycling: TL -> SL -> Quiz
        function toggleTextFormat(event) {
            if (isStatesMode || isDraggingText || hasMovedDuringDrag) {
                return;
            }
            
            const transitionData = getTransitionDataForPosition(startPercent);
            const index = transitionData.index;
            const data = transitionData.data;
            
            if (transitionsLearnedItems[index]) {
                // Cycle between TL and SL for learned items
                slidingTextMode = (slidingTextMode + 1) % 2;
                updateTextBasedOnPosition(startPercent);
            } else {
                // TL(0) -> SL(1) -> Quiz(2) for unlearned items
                if (slidingTextMode === 0) {
                    // From TL to SL
                    slidingTextMode = 1;
                    updateTextBasedOnPosition(startPercent);
                } else if (slidingTextMode === 1) {
                    // From SL to Quiz
                    slidingTextMode = 2;
                    showQuiz(index, interactiveText);
                    return;
                } else {
                    // From Quiz back to TL
                    slidingTextMode = 0;
                    updateTextBasedOnPosition(startPercent);
                }
            }
            
            updateLevelIndicator();
            if (event && event.cancelable) event.preventDefault();
        }

        function updateLevelIndicator() {
            if (isStatesMode) {
                levelIndicator.style.display = 'none';
                return;
            }
            
            levelIndicator.style.display = 'block';
            
            switch (slidingTextMode) {
                case 0:
                    levelIndicator.textContent = 'Target Language';
                    break;
                case 1:
                    levelIndicator.textContent = 'Source Language';
                    break;
                case 2:
                    levelIndicator.textContent = 'Quiz Mode';
                    break;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            console.log("Initializing Horizontal Line Template...");
            
            try {
                // Get DOM elements
                svg = document.getElementById("svgCanvas");
                horizontalLine = document.getElementById("horizontalLine");
                conceptBackground = document.getElementById("conceptBackground");
                titleBox = document.getElementById("title-box");
                conceptIndicator = document.getElementById("concept-indicator");
                levelIndicator = document.getElementById("level-indicator");
                modeToggleBtn = document.getElementById("modeToggle");
                frame = document.getElementById("draggableFrame");
                quizContainer = document.getElementById("quizContainer");
                quizInput = document.getElementById("quizInput");
                quizCheck = document.getElementById("quizCheck");
                quizFeedback = document.getElementById("quizFeedback");
                interactiveText = document.getElementById("interactiveText");
                
                increasingArray = document.getElementById("increasing-array");
                decreasingArray = document.getElementById("decreasing-array");
                increasingItems = document.getElementById("increasing-items");
                decreasingItems = document.getElementById("decreasing-items");
                toggleIncreasingBtn = document.getElementById("toggle-increasing");
                toggleDecreasingBtn = document.getElementById("toggle-decreasing");
                
                if (!svg || !horizontalLine || !titleBox || !modeToggleBtn || !frame) {
                    console.error("Critical elements are missing from the DOM");
                    return;
                }
                
                // Initialize separate arrays for each mode
                statesLearnedItems = new Array(conceptData.length).fill(false);
                transitionsLearnedItems = new Array(transitionsData.length).fill(false);
                addedIncreasingItems = new Array(transitionsData.length).fill(false);
                addedDecreasingItems = new Array(transitionsData.length).fill(false);
                
                // Initialize States mode
                isStatesMode = true;
                createTextBoxes();
                initializeFramePosition();
                setupEventListeners();
                
                // Hide sliding text in States mode
                if (interactiveText) {
                    interactiveText.style.display = 'none';
                }
                
                // Set initial UI state
                levelIndicator.style.display = 'none';
                quizContainer.style.display = 'none';
                increasingArray.style.display = 'none';
                decreasingArray.style.display = 'none';
                
                // Hide drag instruction after 5 seconds
                setTimeout(() => {
                    const dragInstruction = document.getElementById('drag-instruction');
                    if (dragInstruction) {
                        dragInstruction.classList.add('fade');
                        setTimeout(() => {
                            dragInstruction.style.display = 'none';
                        }, 2000);
                    }
                }, 5000);
                
                console.log("Horizontal Line Template initialized successfully");
                
            } catch (error) {
                console.error("Error initializing application:", error);
            }
        }

        // Create text boxes for States mode with 3-level cycling
        function createTextBoxes() {
            if (!isStatesMode) return;
            
            // Clear existing text boxes
            document.querySelectorAll('.textBox').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            textBoxElements = [];
            
            // Create 5 text boxes along the horizontal line with alternating above/below pattern
            for (let i = 0; i < conceptData.length; i++) {
                const x = conceptData[i][3]; // X position from data
                let textAnchor = "middle";
                let y = 18; // Default above the line
                
                // Adjust text anchor for edge positions
                if (i === 0) textAnchor = "start";  // Left end
                if (i === conceptData.length - 1) textAnchor = "end";  // Right end
                
                // Alternating pattern: TL1, TL3, TL5 above (indices 0, 2, 4)
                // TL2, TL4 below (indices 1, 3)
                if (i === 1 || i === 3) {
                    y = 33.6; // Below the line (lowered by 5% from 32)
                } else {
                    y = 18.9; // Above the line (lowered by 5% from 18)
                }
                
                const textBox = document.createElementNS("http://www.w3.org/2000/svg", "text");
                textBox.setAttribute("class", "textBox");
                textBox.setAttribute("x", x);
                textBox.setAttribute("y", y);
                textBox.setAttribute("text-anchor", textAnchor);
                textBox.setAttribute("data-index", i);
                
                // Set initial text based on current layer (starts with TL)
                textBox.textContent = conceptData[i][currentTextLayer[i]];
                
                if (statesLearnedItems[i]) textBox.classList.add('learned');
                
                // Add click event listener with 3-level cycling
                textBox.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const index = parseInt(this.getAttribute('data-index'));
                    
                    if (statesLearnedItems[index]) {
                        // Cycle between TL and SL for learned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TL -> SL
                            this.textContent = conceptData[index][1];
                        } else {
                            currentTextLayer[index] = 0; // SL -> TL
                            this.textContent = conceptData[index][0];
                        }
                    } else {
                        // TL -> SL -> Quiz cycle for unlearned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TL -> SL
                            this.textContent = conceptData[index][1];
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2; // SL -> Quiz
                            showQuiz(index, this);
                        } else {
                            currentTextLayer[index] = 0; // Reset to TL
                            this.textContent = conceptData[index][0];
                        }
                    }
                });
                
                svg.appendChild(textBox);
                textBoxElements.push(textBox);
            }
            
            console.log("Created", textBoxElements.length, "text boxes with 3-level cycling");
        }

        function showQuiz(index, element) {
            const currentData = isStatesMode ? conceptData : transitionsData;
            
            if (index < 0 || index >= currentData.length) {
                console.error("Invalid quiz index:", index, "Max length:", currentData.length);
                return;
            }
            
            currentQuizIndex = index;
            
            // Generate dynamic quiz question with SL word
            const slWord = currentData[index][1];
            quizInput.placeholder = `What is the TL word for '${slWord}'?`;
            quizInput.value = '';
            quizFeedback.textContent = '';
            
            quizContainer.style.display = 'block';
            quizContainer.style.visibility = 'visible';
            quizContainer.style.opacity = '1';
            quizContainer.style.zIndex = '9999';
            
            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing quiz input:", e);
                }
            }, 100);
        }

        function addToVocabularyArray(index, isIncreasing) {
            try {
                const currentData = transitionsData;
                const targetLanguage = currentData[index][0]; // Target Language
                const sourceLanguage = currentData[index][1]; // Source Language
                
                const itemElement = document.createElement('div');
                itemElement.className = 'vocabulary-item';
                
                const targetSpan = document.createElement('span');
                targetSpan.className = 'target-language';
                targetSpan.textContent = targetLanguage;
                
                const sourceSpan = document.createElement('span');
                sourceSpan.className = 'source-language';
                sourceSpan.textContent = sourceLanguage;
                
                targetSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                sourceSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                itemElement.appendChild(targetSpan);
                itemElement.appendChild(sourceSpan);
                
                if (isIncreasing) {
                    increasingItems.appendChild(itemElement);
                    addedIncreasingItems[index] = true;
                } else {
                    decreasingItems.appendChild(itemElement);
                    addedDecreasingItems[index] = true;
                }
                
                console.log("Added vocabulary item:", targetLanguage, "->", sourceLanguage);
            } catch (error) {
                console.error("Error adding vocabulary item:", error);
            }
        }

        function checkQuizAnswer() {
            if (currentQuizIndex < 0) {
                console.error("No valid quiz index");
                return;
            }
            
            const currentData = isStatesMode ? conceptData : transitionsData;
            const userAnswer = quizInput.value.trim().toLowerCase();
            const correctAnswer = currentData[currentQuizIndex][0].toLowerCase(); // TL is correct answer
            
            if (userAnswer === correctAnswer) {
                quizFeedback.textContent = 'Correct!';
                quizFeedback.style.color = 'green';
                
                if (isStatesMode) {
                    statesLearnedItems[currentQuizIndex] = true;
                    const textBox = textBoxElements[currentQuizIndex];
                    if (textBox) {
                        textBox.classList.add('learned');
                        textBox.textContent = currentData[currentQuizIndex][0]; // Show TL
                        currentTextLayer[currentQuizIndex] = 0; // Set to TL
                    }
                } else {
                    // Handle transitions mode - RESET TO TL MODE AND ADD TO ARRAYS
                    transitionsLearnedItems[currentQuizIndex] = true;
                    slidingTextMode = 0; // Reset to TL
                    
                    const targetTextElement = document.getElementById(`interactiveText`);
                    
                    if (targetTextElement) {
                        targetTextElement.classList.add('learned');
                        
                        // Update the text content to show TL
                        const textPath = document.getElementById("slidingText");
                        if (textPath) {
                            textPath.textContent = currentData[currentQuizIndex][0]; // TL
                        }
                    }
                    
                    // ADD TO VOCABULARY ARRAYS
                    const position = startPercent;
                    
                    if (position < 50 && !addedIncreasingItems[currentQuizIndex]) {
                        addToVocabularyArray(currentQuizIndex, true);
                    } else if (position >= 50 && !addedDecreasingItems[currentQuizIndex]) {
                        addToVocabularyArray(currentQuizIndex, false);
                    }
                    
                    updateLevelIndicator();
                    updateTextBasedOnPosition(startPercent);
                }
                
                setTimeout(() => { 
                    quizContainer.style.display = 'none'; 
                    currentQuizIndex = -1;
                }, 1500);
            } else {
                quizFeedback.textContent = 'Try again';
                quizFeedback.style.color = 'red';
            }
        }

        function updateVisibleTextBoxes(point) {
            if (!isStatesMode) return -1;
            
            let closestIndex = -1;
            let minDistance = Infinity;
            
            // Find closest text box
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x'));
                const y = parseFloat(textBox.getAttribute('y'));
                
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });
            
            // Update visibility
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                if (index === closestIndex && minDistance < activationDistance) {
                    textBox.classList.add('active');
                } else if (statesLearnedItems[index]) {
                    textBox.classList.remove('active');
                    textBox.classList.add('learned');
                } else {
                    textBox.classList.remove('active', 'learned');
                }
            });
            
            if (closestIndex !== -1 && minDistance < activationDistance && conceptData[closestIndex]) {
                conceptIndicator.textContent = conceptData[closestIndex][1]; // Show SL in indicator
            }
            
            return closestIndex;
        }

        function initializeFramePosition() {
            // Start at the beginning of the line
            const x = 0; // Start position (left edge of line - now extended to frame edge)
            const y = 25; // Line Y position
            const frameWidth = parseFloat(frame.getAttribute('width'));
            const frameHeight = parseFloat(frame.getAttribute('height'));
            
            frame.setAttribute('x', x - frameWidth/2);
            frame.setAttribute('y', y - frameHeight/2);
            
            const startPoint = { x: x, y: y };
            updateVisibleTextBoxes(startPoint);
            conceptIndicator.textContent = conceptData[0][1]; // Show SL
        }

        // Frame dragging functionality
        let isDragging = false;
        let offsetX, offsetY;

        function startDrag(e) {
            if (!isStatesMode) return;
            isDragging = true;
            frame.classList.add('dragging');
            
            const point = getEventPoint(e);
            offsetX = point.x - parseFloat(frame.getAttribute("x"));
            offsetY = point.y - parseFloat(frame.getAttribute("y"));
            
            e.preventDefault();
            e.stopPropagation();
        }

        function dragMove(e) {
            if (!isDragging || !isStatesMode) return;
            
            const point = getEventPoint(e);
            let newX = point.x - offsetX;
            
            // Constrain to horizontal line bounds (accounting for frame width)
            const minX = -5; // Left boundary (extended to accommodate new line position)
            const maxX = 155; // Right boundary (extended to accommodate new line position)
            newX = Math.max(minX, Math.min(maxX, newX));
            
            const frameWidth = parseFloat(frame.getAttribute('width'));
            const frameHeight = parseFloat(frame.getAttribute('height'));
            const lineY = 25;
            
            frame.setAttribute("x", newX);
            frame.setAttribute("y", lineY - frameHeight/2);

            // Create point for checking closest textbox
            const centerPoint = { x: newX + frameWidth/2, y: lineY };
            updateVisibleTextBoxes(centerPoint);
            
            e.preventDefault();
            e.stopPropagation();
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                frame.classList.remove('dragging');
                
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        function getEventPoint(event) {
            const isTouchEvent = event.type.includes('touch');
            const point = svg.createSVGPoint();
            const clientX = isTouchEvent ? event.touches[0].clientX : event.clientX;
            const clientY = isTouchEvent ? event.touches[0].clientY : event.clientY;
            point.x = clientX;
            point.y = clientY;
            return point.matrixTransform(svg.getScreenCTM().inverse());
        }

        function toggleMode() {
            isStatesMode = !isStatesMode;
            
            if (isStatesMode) {
                // Switch to States mode
                frame.style.display = 'block';
                
                // Hide the single sliding text element
                if (interactiveText) {
                    interactiveText.style.display = 'none';
                }
                
                titleBox.textContent = titleTexts.states[currentTextIndex];
                levelIndicator.style.display = 'none';
                
                // Reset all textbox layers to show TL initially
                currentTextLayer = new Array(5).fill(0);
                createTextBoxes();
                initializeFramePosition();
                
                increasingArray.style.display = 'none';
                decreasingArray.style.display = 'none';
            } else {
                // Switch to Transitions mode
                frame.style.display = 'none';
                
                // Show the single sliding text element
                if (interactiveText) {
                    interactiveText.style.display = 'block';
                }
                
                titleBox.textContent = titleTexts.transitions[currentTextIndex];
                slidingTextMode = 0; // Start with TL
                updateLevelIndicator();
                
                // Remove text boxes
                document.querySelectorAll('.textBox').forEach(box => {
                    if (box && box.parentNode) box.parentNode.removeChild(box);
                });
                textBoxElements = [];
                
                // Initialize sliding text position to start of line (0%)
                startPercent = 0;
                updateTextPosition(startPercent);
                
                increasingArray.style.display = 'block';
                decreasingArray.style.display = 'block';
            }
            
            quizContainer.style.display = 'none';
        }

        function switchTitleText() {
            titleBox.classList.add('hidden');
            setTimeout(() => {
                currentTextIndex = (currentTextIndex + 1) % 3;
                const modeKey = isStatesMode ? 'states' : 'transitions';
                titleBox.textContent = titleTexts[modeKey][currentTextIndex];
                titleBox.classList.remove('hidden');
            }, 500);
        }

        function toggleArrayVisibility(arrayType) {
            try {
                const container = document.getElementById(arrayType + "-items");
                const button = document.getElementById("toggle-" + arrayType);
                if (!container || !button) {
                    console.error("Container or button not found for " + arrayType);
                    return;
                }
                
                const spans = container.querySelectorAll('.vocabulary-item .target-language, .vocabulary-item .source-language');
                
                let visibleCount = 0;
                spans.forEach(span => {
                    if (!span.classList.contains('hidden')) {
                        visibleCount++;
                    }
                });
                
                const mostlyVisible = visibleCount > spans.length / 2;
                
                spans.forEach(span => {
                    if (mostlyVisible) {
                        span.classList.add('hidden');
                    } else {
                        span.classList.remove('hidden');
                    }
                });
                
                button.textContent = mostlyVisible ? 'Show All' : 'Hide All';
            } catch (error) {
                console.error("Error in toggleArrayVisibility:", error);
            }
        }

        function setupEventListeners() {
            // Frame dragging events
            frame.addEventListener('mousedown', startDrag);
            frame.addEventListener('touchstart', startDrag, { passive: false });
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            
            // UI events
            titleBox.addEventListener('click', switchTitleText);
            modeToggleBtn.addEventListener('click', toggleMode);
            quizCheck.addEventListener('click', checkQuizAnswer);
            quizInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkQuizAnswer();
            });
            
            // TRANSITIONS MODE EVENT SETUP
            // Mouse events
            interactiveText.addEventListener("mousedown", startTextDrag);
            document.addEventListener("mousemove", dragText);
            document.addEventListener("mouseup", endTextDrag);
            
            // Click event with proper delay to allow drag detection
            interactiveText.addEventListener("click", function(e) {
                setTimeout(() => {
                    toggleTextFormat(e);
                }, 10);
            });
            
            // Touch events
            interactiveText.addEventListener("touchstart", startTextDrag, { passive: false });
            document.addEventListener("touchmove", dragText, { passive: false });
            document.addEventListener("touchend", endTextDrag);
            
            // Touch end event with proper delay
            interactiveText.addEventListener("touchend", function(e) {
                setTimeout(() => {
                    if (!hasMovedDuringDrag && !isStatesMode) {
                        toggleTextFormat(e);
                    }
                }, 10);
            });
            
            // Tools menu setup
            const toolsButton = document.querySelector('.tools-button');
            const toolsDropdown = document.querySelector('.tools-dropdown');
            const loadConceptBtn = document.getElementById("loadConcept");
            const startQuizBtn = document.getElementById("startQuiz");
            const toggleArraysBtn = document.getElementById("toggleArrays");
            
            let dropdownOpen = false;
            
            if (toolsButton) {
                toolsButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = !dropdownOpen;
                    toolsDropdown.classList.toggle('active', dropdownOpen);
                });
            }
            
            document.addEventListener('click', function(e) {
                if (toolsButton && toolsDropdown && 
                    !toolsButton.contains(e.target) && !toolsDropdown.contains(e.target)) {
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                }
            });
            
            if (loadConceptBtn) {
                loadConceptBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    alert("Load Concept feature will integrate with API to fetch vocabulary for language concepts.");
                });
            }
            
            if (startQuizBtn) {
                startQuizBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    const currentData = isStatesMode ? conceptData : transitionsData;
                    const randomIndex = Math.floor(Math.random() * currentData.length);
                    showQuiz(randomIndex, null);
                });
            }
            
            if (toggleArraysBtn) {
                toggleArraysBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    const visibility = increasingArray.style.display === 'none' || increasingArray.style.display === '';
                    increasingArray.style.display = visibility ? 'block' : 'none';
                    decreasingArray.style.display = visibility ? 'block' : 'none';
                });
            }
            
            if (toggleIncreasingBtn) {
                toggleIncreasingBtn.addEventListener('click', function() {
                    toggleArrayVisibility('increasing');
                });
            }
            
            if (toggleDecreasingBtn) {
                toggleDecreasingBtn.addEventListener('click', function() {
                    toggleArrayVisibility('decreasing');
                });
            }
            
            // Document click handler for closing quizzes
            document.addEventListener('click', function(e) {
                if (quizContainer.style.display !== 'none' && 
                    !quizContainer.contains(e.target) &&
                    !e.target.classList.contains('textBox') &&
                    !e.target.classList.contains('sliding-text')) {
                    
                    quizContainer.style.display = 'none';
                    currentQuizIndex = -1;
                    
                    // Reset to TL mode if quiz was open
                    if (!isStatesMode && slidingTextMode === 2) {
                        slidingTextMode = 0; // Reset to TL
                        updateLevelIndicator();
                        updateTextBasedOnPosition(startPercent);
                    }
                }
            });
        }

    </script>
