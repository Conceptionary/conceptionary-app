<!DOCTYPE html>
<html lang="en" class="no-quiz" data-scheme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week Cycle - Generic Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            overflow: hidden;
        }

        .a4-page {
            width: 90vw;
            height: 70vh;
            border: 5px solid black;
            background-color: white;
            box-sizing: border-box;
            position: relative;
            touch-action: none;
            z-index: 1;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .circle-path {
            stroke: #333;
            stroke-width: 0.5;
            fill: none;
        }

        .weekday-segment {
            stroke: #ddd;
            stroke-width: 0.3;
            fill: rgba(135, 206, 250, 0.2);
            transition: fill 0.3s ease;
        }

        .weekend-segment {
            stroke: #ddd;
            stroke-width: 0.3;
            fill: rgba(255, 192, 203, 0.2);
            transition: fill 0.3s ease;
        }

        .segment-highlighted {
            fill: rgba(255, 255, 0, 0.6) !important;
            stroke: #ffd700;
            stroke-width: 1px;
        }

        .segment-label {
            font-size: 2.5px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            font-family: Arial, sans-serif;
            transition: opacity 0.3s ease;
        }

        .textBox {
            cursor: pointer;
            font-size: 0.8em;
            fill: black;
            opacity: 0;
            display: none;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5);
            text-anchor: middle;
            font-family: Arial, sans-serif;
            pointer-events: all;
        }

        .textBox.active {
            opacity: 1;
            display: block;
            transform: scale(1) translateY(0);
        }

        .textBox.learned {
            opacity: 0.5;
            display: block;
            transform: scale(1) translateY(0);
            fill: green;
        }
        
        .textBox.learned.active {
            opacity: 1;
        }
        
        .textBox.hidden {
            opacity: 0;
            display: none;
        }

        #draggableFrame {
            cursor: grab;
            fill: url(#sunGradient);
            stroke: #ff7f00;
            stroke-width: 2px;
            pointer-events: all;
            opacity: 0.9;
            transition: fill 0.2s ease;
            z-index: 1000;
        }

        #draggableFrame:hover {
            fill: url(#sunGradient);
            stroke: #ff7f00;
            stroke-width: 3px;
            cursor: grab;
        }

        #draggableFrame.dragging {
            cursor: grabbing;
            fill: url(#sunGradient);
            stroke: #ff7f00;
            stroke-width: 3px;
        }

        .title-box {
            position: absolute;
            top: 2%;
            left: 75%;
            transform: translateX(-50%);
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 1px solid black;
            padding: 10px;
            background-color: white;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
            font-family: Arial, sans-serif;
        }
        
        .title-box.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }

        .day-indicator {
            position: absolute;
            top: 10%;
            left: 95%;
            transform: translateX(-50%);
            font-size: 0.75em;
            padding: 6px 12px;
            background-color: white;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 3;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            min-width: 120px;
            text-align: center;
        }

        .today-indicator {
            position: absolute;
            top: 22%;
            left: 95%;
            transform: translateX(-50%);
            font-size: 0.75em;
            padding: 6px 12px;
            background-color: #4CAF50;
            color: white;
            border: 1px solid #45a049;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            min-width: 120px;
            text-align: center;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .today-indicator:hover {
            background-color: #45a049;
        }

        .display-mode-toggle {
            position: absolute;
            top: 34%;
            left: 95%;
            transform: translateX(-50%);
            font-size: 0.75em;
            padding: 6px 12px;
            background-color: #e8f4fd;
            border: 1px solid #3366cc;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            min-width: 120px;
            text-align: center;
        }

        .sun-cycle-toggle {
            position: absolute;
            top: 46%;
            left: 95%;
            transform: translateX(-50%);
            font-size: 0.75em;
            padding: 6px 12px;
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            min-width: 120px;
            text-align: center;
        }

        .day-labels-toggle {
            position: absolute;
            top: 58%;
            left: 95%;
            transform: translateX(-50%);
            font-size: 0.75em;
            padding: 6px 12px;
            background-color: #e8f4e8;
            border: 1px solid #66cc66;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            min-width: 120px;
            text-align: center;
        }

        .drag-instruction {
            position: absolute;
            top: 70%;
            left: 95%;
            transform: translateX(-50%);
            font-size: 0.75em;
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 3;
            opacity: 1;
            transition: opacity 3s ease;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            min-width: 120px;
            text-align: center;
        }
        
        .drag-instruction.fade {
            opacity: 0;
        }

        .quiz-container {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 3px solid #3366cc;
            border-radius: 4px;
            padding: 12px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 360px;
            width: 360px;
        }
        
        .quiz-container input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }
        
        .quiz-container button {
            width: 100%;
            padding: 8px;
            background-color: #3366cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .quiz-container button:hover {
            background-color: #254e9c;
        }
        
        #quizFeedback {
            text-align: center;
            font-weight: bold;
            margin-top: 8px;
            min-height: 20px;
        }

        .vocabulary-array {
            position: absolute;
            top: 1%;
            left: 2%;
            width: 20%;
            max-height: 60vh;
            overflow-y: auto;
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #3366cc;
            border-radius: 8px;
            padding: 8px;
            z-index: 4;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .array-title {
            font-size: 1em;
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            padding: 6px;
            background-color: #3366cc;
            color: white;
            border-radius: 4px;
        }

        .vocabulary-item {
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
            margin: 6px 0;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            transition: background-color 0.3s ease;
        }

        .vocabulary-item:hover {
            background-color: #eaf2ff;
        }

        .vocabulary-item .target-language {
            font-weight: bold;
            color: green;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
            font-family: Arial, sans-serif;
            margin-bottom: 3px;
        }

        .vocabulary-item .target-language-romanized {
            font-style: italic;
            color: #666;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 0.9em;
            margin-bottom: 3px;
        }

        .vocabulary-item .source-language {
            color: #555;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
        }
        
        .vocabulary-item .target-language.hidden,
        .vocabulary-item .target-language-romanized.hidden,
        .vocabulary-item .source-language.hidden {
            color: transparent;
            user-select: none;
            background-color: #f0f0f0;
        }

        .toggle-visibility {
            display: block;
            width: 100%;
            margin-top: 8px;
            font-size: 0.85em;
            padding: 6px 12px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .toggle-visibility:hover {
            background-color: #e0e0e0;
        }
    /* 2026-11-06 Phone layout, Audio, Print, Full Screen, Tools menu and no Quiz on the Compass */
    html.no-quiz .quiz-container, html.no-quiz .vocabulary-array { display: none !important; }
    .a4-page { height: 86vh; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; }
    .a4-page > svg { grid-column: 1 / 3; grid-row: 2; min-height: 0; width: 100%; height: 100%; }
    #cmpInfo { position: static; grid-column: 1; grid-row: 1; z-index: 3; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px; }
    #cmpInfo .title-box { position: static; transform: none; left: auto; top: auto; }
    #cmpInfo .title-box.hidden { transform: scale(0.9); }
    #cmpInfo .day-indicator, #cmpInfo .drag-instruction { position: static; transform: none; left: auto; top: auto; min-width: 0; white-space: normal; }
    #cmpCtl { position: static; grid-column: 2; grid-row: 1; z-index: 200; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; align-items: flex-start; margin: 10px; }
    .a4-page > .watermark { position: static; grid-column: 1 / 3; grid-row: 3; padding: 0 0 4px; }
    #cmpCtl .tb { position: static; transform: none; left: auto; top: auto; min-width: 0; font-weight: normal; background: #3366cc; color: #fff; border: 0; border-radius: 4px; padding: 7px 12px; font: 14px Arial, sans-serif; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    #cmpCtl .tb:hover { background: #254e9c; }
    #printList { display: none; }
    .textBox { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.audio-wrap { position: relative; display: flex; flex-direction: column; align-items: stretch; width: 104px; box-sizing: border-box; background-color: #3366cc; color: #fff; border-radius: 4px; padding: 3px 6px 2px; }
    .audio-wrap:hover { background-color: #254e9c; }
    .audio-wrap #auCycle { background: transparent; border: 0; color: inherit; font: inherit; font-size: 14px; padding: 4px 0 1px; margin: 0; cursor: pointer; white-space: nowrap; text-align: center; -webkit-tap-highlight-color: transparent; }
    .controls .audio-wrap #auCycle:hover { background: transparent; }
    .audio-wrap #auVol2 { width: 100%; height: 14px; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: none; cursor: pointer; --p: 80%; }
    .audio-wrap #auVol2::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(to right, #007FFF 0, #007FFF var(--p), #B0E0E6 var(--p), #B0E0E6 100%); }
    .audio-wrap #auVol2::-moz-range-track { height: 5px; border-radius: 3px; background: #B0E0E6; }
    .audio-wrap #auVol2::-moz-range-progress { height: 5px; border-radius: 3px; background: #007FFF; }
    .audio-wrap #auVol2::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8fbff 0%, #2fd0e8 38%, #7fb8f0 68%, #ff9cc8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .audio-wrap #auVol2::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8fbff 0%, #2fd0e8 38%, #7fb8f0 68%, #ff9cc8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
    @media (pointer: coarse) { .audio-wrap { width: 112px; } .audio-wrap #auVol2 { height: 20px; } .audio-wrap #auVol2::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6.5px; } .audio-wrap #auVol2::-moz-range-thumb { width: 18px; height: 18px; } }
    @media (max-height: 520px) and (orientation: landscape) { .audio-wrap { width: 86px; padding: 1px 5px 0; } .audio-wrap #auCycle { font-size: 11px; padding: 2px 0 0; } .audio-wrap #auVol2 { height: 13px; } }
    #auToast { position: fixed; z-index: 1100; background: rgba(40,40,40,.92); color: #fff; font: 14px Arial, sans-serif; padding: 7px 12px; border-radius: 8px; max-width: min(92vw, 360px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
    .tools-wrap { position: relative; }
    #toolsBtn { min-width: 74px; }
    .tools-dd { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 9.5em; background: #3366cc; border-radius: 6px; overflow: hidden; z-index: 400; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .tools-dd.active { display: block; }
    .tools-dd button { display: block; width: 100%; text-align: left; background: #3366cc; color: #fff; border: 0; border-bottom: 1px solid rgba(255,255,255,.35); padding: 9px 14px; font: 14px Arial, sans-serif; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .tools-dd button:last-child { border-bottom: 0; }
    .tools-dd button:hover { background: #254e9c; }
    html[data-scheme="nocolour"] body { background: #e6e6e6; }
    html[data-scheme="nocolour"] .a4-page { filter: grayscale(1); }
    @media screen {
      html[data-scheme="night"] body { background: #0b1330; }
      html[data-scheme="night"] .a4-page { background: #14213d; border-color: #8a96b8; }
      html[data-scheme="night"] .circle-path { stroke: #aab4d0; }
      html[data-scheme="night"] .segment-label { fill: #c5cce0; }
      html[data-scheme="night"] .textBox div { color: #fff !important; text-shadow: none !important; }
      html[data-scheme="night"] .title-box, html[data-scheme="night"] .day-indicator { background: #1f2f55; color: #e8eefc; border-color: #8a96b8; }
      html[data-scheme="night"] .watermark { color: rgba(255,255,255,.45); }
    }
    /* Phone held upright: title and direction, buttons, the compass as large as fits, then the watermark */
    @media (max-width: 700px) and (min-height: 521px) {
      html, body { overflow: hidden; }
      body { display: block; height: 100vh; height: 100dvh; padding: 0; }
      .a4-page { width: 100vw; height: 100vh; height: 100dvh; border: 0; display: grid; grid-template-columns: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto; }
      #cmpInfo { grid-column: 1; grid-row: 1; justify-content: center; max-width: 96%; margin: 6px 0 0; gap: 4px 6px; }
      #cmpInfo .title-box { padding: 6px 12px; font-size: .95em; text-align: center; }
      #cmpInfo .day-indicator { font-size: .95em; padding: 4px 10px; }
      #cmpInfo .drag-instruction { font-size: .8em; max-width: 92vw; text-align: center; }
      #cmpCtl { grid-column: 1; grid-row: 2; justify-content: center; margin: 6px 4px; }
      #cmpCtl .tb { padding: 7px 10px; font-size: 13px; }
      .a4-page > svg { grid-column: 1; grid-row: 3; }
      .a4-page > .watermark { grid-column: 1; grid-row: 4; }
    }
    /* Phone held sideways (or any short window, e.g. inside the viewer, about 690 x 200): text column on the left, compass at full height on the right */
    @media (max-height: 520px) and (orientation: landscape) {
      html, body { overflow: hidden; }
      body { display: block; height: 100vh; height: 100dvh; padding: 0; }
      .a4-page { width: 100vw; height: 100vh; height: 100dvh; border: 0; display: grid; grid-template-columns: minmax(190px, 42%) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
      #cmpInfo { grid-column: 1; grid-row: 1; flex-direction: column; align-items: flex-start; margin: 4px; gap: 3px; }
      #cmpInfo .title-box { padding: 3px 8px; font-size: .8em; }
      #cmpInfo .day-indicator { font-size: .8em; padding: 2px 8px; }
      #cmpInfo .drag-instruction { display: none; }
      #cmpCtl { grid-column: 1; grid-row: 2; justify-content: flex-start; margin: 2px 4px; gap: 4px; }
      #cmpCtl .tb { padding: 4px 8px; font-size: 11px; }
      .a4-page > svg { grid-column: 2; grid-row: 1 / 5; }
      .a4-page > .watermark { grid-column: 1; grid-row: 4; text-align: left; font-size: 9px; padding: 0 4px 2px; }
    }
    /* Print: the compass on the left and every direction listed on the right, on one A4 landscape sheet */
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { height: auto !important; min-height: 0 !important; overflow: visible !important; background: #fff !important; padding: 0 !important; display: block !important; }
      .a4-page { width: 100% !important; height: 188mm !important; border: 0 !important; overflow: visible !important; display: grid !important; grid-template-columns: 152mm 1fr; grid-template-rows: auto 1fr auto; column-gap: 6mm; filter: none !important; }
      .a4-page > svg { grid-column: 1; grid-row: 1 / 4; width: 152mm !important; height: 152mm !important; align-self: center; }
      #cmpInfo { position: static !important; grid-column: 2; grid-row: 1; max-width: none; margin: 0 0 3mm; }
      #cmpInfo .title-box { font-size: 14pt; border: 0; padding: 0; }
      #cmpInfo .day-indicator, #cmpInfo .drag-instruction { display: none !important; }
      #printList { display: block !important; grid-column: 2; grid-row: 2; font: 8.5pt Arial, sans-serif; overflow: hidden; }
      #printList .pl-row { display: grid; grid-template-columns: 14mm 1fr 1fr 1fr; gap: 2mm; padding: 0.6mm 0; border-bottom: 0.2mm solid #ddd; }
      #printList .pl-row.rom { grid-template-columns: 14mm 1fr 1fr; }
      #printList .pl-h { color: #777; }
      .a4-page > .watermark { position: static !important; grid-column: 2; grid-row: 3; text-align: right; }
      .textBox { display: block !important; opacity: 1 !important; transform: none !important; }
      #cmpCtl, .quiz-container, .vocabulary-array, #auToast { display: none !important; }
    }
    @media (max-height: 520px) and (orientation: landscape) { .audio-wrap #auVol2::-webkit-slider-thumb { width: 13px; height: 13px; margin-top: -4px; } .audio-wrap #auVol2::-moz-range-thumb { width: 13px; height: 13px; } }
    #textSizePanel { position: fixed; z-index: 700; display: none; background: #fff; color: #222; border: 1px solid #555; border-radius: 8px; padding: 6px 10px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.35); font: 13px Arial, sans-serif; width: min(300px, 88vw); touch-action: none; }
    #textSizePanel .tsHead { cursor: grab; display: flex; justify-content: space-between; align-items: center; font-weight: bold; user-select: none; margin-bottom: 4px; }
    #textSizePanel .tsHead button { border: 0; background: none; font-size: 20px; cursor: pointer; line-height: 1; }
    #textSizePanel .tsTarget { margin: 2px 0 4px; min-height: 1.2em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #textSizePanel input[type=range] { width: 100%; touch-action: pan-y; }
    #textSizePanel .tsRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
    #textSizePanel button.tsReset { padding: 3px 10px; cursor: pointer; }
    .textBox:hover div { background: #fff176; border-radius: 4px; }
    .cmp-ghost { position: fixed; z-index: 1000; left: 0; top: 0; background: #fff176; border: 1px solid #b8860b; border-radius: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.45); font-family: Arial, sans-serif; font-weight: bold; color: #000; white-space: nowrap; padding: 2px 5px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transform-origin: 50% 50%; }

    .textBox.visible { display: block; transform: scale(1) translateY(0); }
    #cmpCtl .today-indicator { font-weight: bold; }
    #cmpCtl .today-indicator { background: #3366cc; }

    /* 2026-11-09 Full Screen: when on, the dial fills the whole screen (no framed box), so the change is plainly visible */

    <style id="cx-style">
/* ===== CONCEPTIONARY STYLE SHEET v0.1 (trial on the Compass, 2026-11-06) =====
   One block of design tokens plus the rules that use them. It sits AFTER the template's own CSS and only changes looks, never behaviour.
   Colour: ink / muted / surface / line, ONE primary (controls), ONE accent (the active word and highlight). Every text pair is 4.5:1 or better.
   Type: one system font stack (set by script into --cx-font so the word measuring uses the same font), weights 600 and 700 only.
   Spacing scale 4 / 8 / 12 / 16 / 24 px. Radius 10 (controls) and 16 (page card). Motion 150-250 ms, switched off by prefers-reduced-motion.
   NOTE: inside an SVG foreignObject one CSS px is one SVG unit, so borders, radii and shadows on words are written in tiny values. */
:root {
  --cx-ink: #1f2937; --cx-muted: #4b5565; --cx-faint: #6b7280;
  --cx-surface: #ffffff; --cx-bg: #eef1f7; --cx-line: #d3d9e6;
  --cx-primary: #2a56c6; --cx-primary-dark: #1f428f; --cx-on-primary: #ffffff;
  --cx-accent: #f2b01e; --cx-accent-soft: #fff4cf;
  --cx-btn-bg: #e4ecf8; --cx-btn-bg-hover: #d3e0f5; --cx-btn-bg-on: #bcd0f0; --cx-btn-ink: #1d3b80; --cx-btn-line: #bccbe8;
  --cx-disc-a: #fffdf6; --cx-disc-b: #efe8d4; --cx-disc-line: #d9cfb4;
  --cx-s1: 4px; --cx-s2: 8px; --cx-s3: 12px; --cx-s4: 16px; --cx-s5: 24px;
  --cx-r-ctl: 10px; --cx-r-card: 16px;
  --cx-shadow-sm: 0 1px 2px rgba(20,30,60,.12); --cx-shadow-md: 0 4px 14px rgba(20,30,60,.16);
  --cx-font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --cx-t: 180ms ease;
}
html[data-scheme="night"] {
  --cx-ink: #e6ebf7; --cx-muted: #b4bfd8; --cx-faint: #8f9cb8;
  --cx-surface: #172036; --cx-bg: #0d1424; --cx-line: #2e3a58;
  --cx-primary: #3d63c9; --cx-primary-dark: #2f4fa6; --cx-accent: #f2b01e; --cx-accent-soft: #3a3320;
  --cx-btn-bg: #24304e; --cx-btn-bg-hover: #2e3c60; --cx-btn-bg-on: #3a4a74; --cx-btn-ink: #d6e0fa; --cx-btn-line: #3b4a70;
  --cx-disc-a: #1c2846; --cx-disc-b: #121b33; --cx-disc-line: #3a4768;
}
body { font-family: var(--cx-font); color: var(--cx-ink); background: var(--cx-bg); }
@media (min-width: 701px) and (min-height: 521px) {
  body { background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, var(--cx-bg) 70%); }
  .a4-page { border: 1px solid var(--cx-line); border-radius: var(--cx-r-card); box-shadow: var(--cx-shadow-md); background: var(--cx-surface); }
}
.a4-page { background: var(--cx-surface); }
/* title and indicator: quiet cards */
.title-box { font-family: var(--cx-font); font-weight: 700; font-size: 1.05em; color: var(--cx-ink); background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: var(--cx-r-ctl); box-shadow: var(--cx-shadow-sm); padding: var(--cx-s2) var(--cx-s3); transition: box-shadow var(--cx-t), transform var(--cx-t), opacity .5s ease; }
.title-box:hover { box-shadow: var(--cx-shadow-md); }
.direction-indicator, .day-indicator { font-family: var(--cx-font); font-weight: 600; color: var(--cx-ink); background: var(--cx-accent-soft); border: 1px solid var(--cx-accent); border-radius: 999px; padding: var(--cx-s1) var(--cx-s3); }
.drag-instruction { font-family: var(--cx-font); color: var(--cx-muted); background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: var(--cx-r-ctl); }
/* controls: one button style */
#cmpCtl .tb, .quiz-container button { font-family: var(--cx-font); font-weight: 600; letter-spacing: .01em; background: var(--cx-btn-bg); color: var(--cx-btn-ink); border: 1px solid var(--cx-btn-line); border-radius: var(--cx-r-ctl); box-shadow: var(--cx-shadow-sm); min-height: 38px; transition: background var(--cx-t), transform var(--cx-t), box-shadow var(--cx-t); }
#cmpCtl .tb:hover { background: var(--cx-btn-bg-hover); box-shadow: var(--cx-shadow-md); }
#cmpCtl .tb.on { background: var(--cx-btn-bg-on); border-color: var(--cx-primary); }
#cmpCtl .tb:active, .audio-wrap:active { transform: scale(.97); box-shadow: none; }
#cmpCtl .tb:focus-visible, .audio-wrap #auCycle:focus-visible, .tools-dd button:focus-visible { outline: 3px solid var(--cx-accent); outline-offset: 2px; }
.audio-wrap { background: var(--cx-btn-bg); color: var(--cx-btn-ink); border: 1px solid var(--cx-btn-line); border-radius: var(--cx-r-ctl); box-shadow: var(--cx-shadow-sm); transition: background var(--cx-t); }
.audio-wrap:hover { background: var(--cx-btn-bg-hover); }
.audio-wrap #auVol2::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--cx-primary) 0, var(--cx-primary) var(--p), var(--cx-btn-line) var(--p), var(--cx-btn-line) 100%) !important; }
.audio-wrap #auVol2::-moz-range-track { background: var(--cx-btn-line) !important; } .audio-wrap #auVol2::-moz-range-progress { background: var(--cx-primary) !important; }
.audio-wrap #auCycle { font-family: var(--cx-font); font-weight: 600; }
.tools-dd { background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: 12px; box-shadow: var(--cx-shadow-md); }
.tools-dd button { background: var(--cx-surface); color: var(--cx-btn-ink); font-family: var(--cx-font); border-bottom: 1px solid var(--cx-line); transition: background var(--cx-t); }
.tools-dd button:hover { background: var(--cx-accent-soft); }
#textSizePanel { font-family: var(--cx-font); background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 12px; box-shadow: var(--cx-shadow-md); }
#textSizePanel button.tsReset { border: 1px solid var(--cx-line); border-radius: 8px; background: var(--cx-surface); color: var(--cx-ink); }
@media (pointer: coarse) { #cmpCtl .tb { min-height: 44px; } .tools-dd button { padding-top: 12px; padding-bottom: 12px; } }
@media (max-height: 520px) and (orientation: landscape) { #cmpCtl .tb { min-height: 32px; } }
/* the dial */
.circle-path, .compass-circle { stroke: var(--cx-ink); stroke-width: 0.45; }
.degree-marker { stroke: #aab2c2; } .major-marker { stroke: #6f7889; }
.degree-label { fill: var(--cx-faint); font-family: var(--cx-font); }

.compass-rose-decoration { stroke: var(--cx-faint); opacity: .35; }
.needle-north { fill: #d64545; stroke: #8f2323; } .needle-south { fill: #3b6fd8; stroke: #1f3f8f; }
.compass-arrow { filter: drop-shadow(0 .6px 1px rgba(20,30,60,.35)); }
/* words on the dial: the active word is a chip with the accent edge; the others are quiet but fully readable */
.textBox div { font-family: var(--cx-font) !important; font-weight: 600 !important; color: var(--cx-muted) !important; text-shadow: 0 0 .8px var(--cx-surface) !important; border-radius: 1.6px; transition: background var(--cx-t), color var(--cx-t); }
.textBox.active div { font-weight: 700 !important; color: var(--cx-ink) !important; background: rgba(255,255,255,.94); box-shadow: 0 0 0 .35px var(--cx-accent), 0 .5px 1.2px rgba(20,30,60,.2); text-shadow: none !important; }
html[data-scheme="night"] .textBox.active div { background: rgba(23,32,54,.94); }
.textBox:hover div { background: #fff176 !important; color: #1f2937 !important; }
.watermark { color: var(--cx-faint); font-family: var(--cx-font); font-weight: 600; opacity: .85; }
.cmp-ghost { font-family: var(--cx-font); border-radius: 10px; background: #fff176; border-color: var(--cx-accent); color: #1f2937; }
html[data-scheme="night"] body { background: var(--cx-bg); }
html[data-scheme="night"] .a4-page, html[data-scheme="night"] .title-box { background: var(--cx-surface); border-color: var(--cx-line); }
html[data-scheme="night"] .title-box, html[data-scheme="night"] .direction-indicator { color: var(--cx-ink); }
html[data-scheme="night"] .direction-indicator { background: var(--cx-accent-soft); border-color: var(--cx-accent); }
html[data-scheme="night"] .quadrant-fill { fill-opacity: .22; }
html[data-scheme="night"] .tools-dd, html[data-scheme="night"] #textSizePanel { background: var(--cx-surface); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { body { background: #fff !important; } .textBox div, .textBox.active div { color: #000 !important; background: none !important; box-shadow: none !important; } }
/* colour disc behind the dial (inserted by script as #cxDisc) */
#cxDisc { fill: url(#cxDiscGrad); stroke: var(--cx-disc-line); stroke-width: .35; filter: drop-shadow(0 .5px 1.2px rgba(60,50,20,.18)); }
html[data-scheme="night"] #cxDisc { filter: none; }

/* ===== v0.3: pearl buttons and a silver slider ===== */
:root {
  --cx-pearl: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 38%, rgba(255,255,255,0) 62%),
              linear-gradient(135deg, #f8f5ff 0%, #e4edfb 32%, #f3e8f5 62%, #e2f1f3 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,1) 0%, rgba(255,255,255,.45) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #f3eefe 0%, #d6e4fa 32%, #efdff3 62%, #d3ebef 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.75) 0%, rgba(255,255,255,.2) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #cfdcf5 0%, #b3c8ee 35%, #cdbfe9 65%, #b4d9e3 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -3px 5px rgba(110,125,175,.20), inset 0 0 0 1px rgba(255,255,255,.35);
}

  --cx-pearl: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #2c3a5c 0%, #34456d 35%, #3a3560 65%, #2b4458 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.3) 0%, rgba(255,255,255,.1) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #34456d 0%, #3f5486 35%, #473f78 65%, #345468 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.2) 0%, rgba(255,255,255,.05) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #46609c 0%, #4d6bb0 35%, #5a4d98 65%, #3f6f8a 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -3px 5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.06);
}
#cmpCtl .tb, .audio-wrap, .tools-dd button {
  background-image: var(--cx-pearl); background-size: 100% 100%, 220% 220%; background-position: 0 0, 0% 0%; background-repeat: no-repeat;
  transition: background-position .6s ease, box-shadow var(--cx-t), transform var(--cx-t), border-color var(--cx-t);
}
#cmpCtl .tb, .audio-wrap { box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:hover, .audio-wrap:hover { background-image: var(--cx-pearl-hover); background-position: 0 0, 100% 100%; box-shadow: var(--cx-pearl-edge), 0 3px 8px rgba(20,30,60,.20); }
#cmpCtl .tb.on { background-image: var(--cx-pearl-on); box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:active, .audio-wrap:active { box-shadow: inset 0 2px 5px rgba(60,70,110,.28); }

/* Audio slider: a silver ball like the compass pivot, on a channel that darkens from light grey (quiet) to black (loud) */
.audio-wrap #auVol2::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; box-shadow: inset 0 1px 1px rgba(0,0,0,.25); }
.audio-wrap #auVol2::-moz-range-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; }
.audio-wrap #auVol2::-moz-range-progress { background: transparent !important; }

.audio-wrap #auVol2::-moz-range-thumb { box-sizing: border-box; border: 1px solid #555; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f5f5 12%, #b0b0b0 58%, #707070 100%); box-shadow: 0 1px 2px rgba(0,0,0,.45); }

@media (max-height: 520px) and (orientation: landscape) { .audio-wrap #auVol2::-webkit-slider-thumb { margin-top: -4px; } }
html[data-scheme="night"] .tools-dd button { box-shadow: inset 0 1px 0 rgba(255,255,255,.10); }
/* ===== DOW: dial, sun and words ===== */

#cxToast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 1200; background: rgba(40,40,40,.92); color: #fff; font: 600 14px var(--cx-font, sans-serif); padding: 8px 14px; border-radius: 10px; max-width: min(92vw, 420px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; }

.weekday-segment { stroke: #fff; stroke-opacity: .8; stroke-width: .25; }

/* the sun */
#draggableFrame, #draggableFrame:hover, #draggableFrame.dragging { stroke: #e8890c; stroke-width: .35px; opacity: 1; filter: drop-shadow(0 .5px 1px rgba(160,80,0,.45)); }
#draggableFrame:hover, #draggableFrame.dragging { stroke-width: .5px; filter: drop-shadow(0 .6px 1.4px rgba(160,80,0,.6)); }

html[data-scheme="night"] #cxSun .glow { opacity: .8; }
@media print { #cxSun .rays { animation: none; } #draggableFrame { filter: none; } }

<body>
    <div class="a4-page">

    <script>
        // Generic vocabulary data template
        // Format: [Source Language, Target Language, Target Language Romanized, Quiz Prompt, DayIndex]
        const daysOfWeekData = [
            ["SL-Day1", "TL-Day1", "TLR-Day1", "What's the Target Language word for 'Day 1'?", 0],
            ["SL-Day2", "TL-Day2", "TLR-Day2", "What's the Target Language word for 'Day 2'?", 1],
            ["SL-Day3", "TL-Day3", "TLR-Day3", "What's the Target Language word for 'Day 3'?", 2],
            ["SL-Day4", "TL-Day4", "TLR-Day4", "What's the Target Language word for 'Day 4'?", 3],
            ["SL-Day5", "TL-Day5", "TLR-Day5", "What's the Target Language word for 'Day 5'?", 4],
            ["SL-Day6", "TL-Day6", "TLR-Day6", "What's the Target Language word for 'Day 6'?", 5],
            ["SL-Day7", "TL-Day7", "TLR-Day7", "What's the Target Language word for 'Day 7'?", 6]
        ];

        // Global variables
        let learnedItems = new Array(7).fill(false);
        let textBoxElements = [];
        let addedLearnedItems = new Array(7).fill(false);
        let displayMode = 0; // 0: TLR (default), 1: TL, 2: SL
        let currentDay = 0;
        let isDragging = false;
        let currentTextIndex = 0;
        let currentQuizIndex = -1;
        let showSunCycle = true;
        let showDayLabels = false;   // Day Labels start hidden; Tools > Show Day Labels
        
        // Title cycle: TLR (default) → TL → SL → TLR. See "Logographic
        // UI Conventions" in Conceptionary_Template_Definitions.md.
        // Previously this array's first element was the literal string
        // "LOG-CR-DOW Generic" (a disconnected placeholder, not real
        // content) and its third element combined that same disconnected
        // string with TL — with no TLR anywhere and no load-time
        // initialization at all (the title only ever updated on click).
        const titleTexts = [
            "TLR_TITLE",
            "TL_TITLE",
            "SL_TITLE"
        ];

        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/[āáǎà]/g, 'a')
                .replace(/[ēéěè]/g, 'e')
                .replace(/[īíǐì]/g, 'i')
                .replace(/[ōóǒò]/g, 'o')
                .replace(/[ūúǔù]/g, 'u')
                .replace(/[ǖǘǚǜü]/g, 'u')
                .replace(/'/g, '')
                .replace(/'/g, '')
                .trim();
        }

        function toggleArrayVisibility() {
            try {
                const container = document.getElementById("learned-items");
                const button = document.getElementById("toggle-learned");
                if (!container || !button) return;
                
                const spans = container.querySelectorAll('.vocabulary-item .target-language, .vocabulary-item .target-language-romanized, .vocabulary-item .source-language');
                
                let visibleCount = 0;
                spans.forEach(span => {
                    if (!span.classList.contains('hidden')) {
                        visibleCount++;
                    }
                });
                
                const mostlyVisible = visibleCount > spans.length / 2;
                
                spans.forEach(span => {
                    if (mostlyVisible) {
                        span.classList.add('hidden');
                    } else {
                        span.classList.remove('hidden');
                    }
                });
                
                button.textContent = mostlyVisible ? 'Show All' : 'Hide All';
            } catch (error) {
                console.error("Error in toggleArrayVisibility:", error);
            }
        }

        function cycleDisplayMode() {
            displayMode = (displayMode + 1) % 3;
            const button = document.getElementById("display-mode-toggle");
            
            switch(displayMode) {
                case 0:
                    button.textContent = "Show: TLR";
                    break;
                case 1:
                    button.textContent = "Show: TL";
                    break;
                case 2:
                    button.textContent = "Show: SL";
                    break;
            }
            
            updateAllTextBoxes();
        }

        function updateAllTextBoxes() {
            textBoxElements.forEach((textBox, index) => {
                if (textBox && learnedItems[index]) {
                    const div = textBox.querySelector('div');
                    if (div) {
                        switch(displayMode) {
                            case 0:
                                div.innerHTML = daysOfWeekData[index][2]; // TLR
                                break;
                            case 1:
                                div.innerHTML = daysOfWeekData[index][1]; // TL
                                break;
                            case 2:
                                div.innerHTML = daysOfWeekData[index][0]; // SL
                                break;
                        }
                    }
                }
            });
        }

        function toggleSunCycle() {
            showSunCycle = !showSunCycle;
            const sunCycleArcs = document.getElementById("sunCycleArcs");
            const button = document.getElementById("sun-cycle-toggle");
            
            if (showSunCycle) {
                sunCycleArcs.style.display = "block";
                button.textContent = "Hide Sun Cycle";
            } else {
                sunCycleArcs.style.display = "none";
                button.textContent = "Show Sun Cycle";
            }
        }

        function toggleDayLabels() {
            showDayLabels = !showDayLabels;
            const dayLabels = document.querySelectorAll(".segment-label");
            const button = document.getElementById("day-labels-toggle");
            
            dayLabels.forEach(label => {
                label.style.opacity = showDayLabels ? "1" : "0";
            });
            
            button.textContent = showDayLabels ? "Hide Day Labels" : "Show Day Labels";
        }

        function createSegments() {
            const segmentsGroup = document.getElementById("segments");
            const center = { x: 50, y: 50 };
            const radius = 30;
            
            for (let i = 0; i < 7; i++) {
                const startAngle = (i * 360/7 - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * 360/7 - 90) * Math.PI / 180;
                
                const x1 = center.x + radius * Math.cos(startAngle);
                const y1 = center.y + radius * Math.sin(startAngle);
                const x2 = center.x + radius * Math.cos(endAngle);
                const y2 = center.y + radius * Math.sin(endAngle);
                
                const pathData = `M ${center.x},${center.y} L ${x1},${y1} A ${radius},${radius} 0 0,1 ${x2},${y2} Z`;
                
                const segment = document.createElementNS("http://www.w3.org/2000/svg", "path");
                segment.setAttribute("d", pathData);
                segment.setAttribute("class", (i === 5 || i === 6) ? "weekend-segment" : "weekday-segment");
                segment.setAttribute("data-day", i);
                
                segmentsGroup.appendChild(segment);
            }
        }

        function createSunCycleArcs() {
            const sunCycleGroup = document.getElementById("sunCycleArcs");
            const center = { x: 50, y: 50 };
            const innerRadius = 31;
            const outerRadius = 34;
            
            const dayStartAngle = (0 * 360/7 - 90) * Math.PI / 180;
            const dayEndAngle = (5 * 360/7 - 90) * Math.PI / 180;
            
            const nightStartAngle1 = (5 * 360/7 - 90) * Math.PI / 180;
            const nightEndAngle1 = (7 * 360/7 - 90) * Math.PI / 180;
            
            const nightStartAngle2 = (-90) * Math.PI / 180;
            const nightEndAngle2 = (0 * 360/7 - 90) * Math.PI / 180;
            
            function createArc(startAngle, endAngle, color, label, labelAngle) {
                const x1 = center.x + innerRadius * Math.cos(startAngle);
                const y1 = center.y + innerRadius * Math.sin(startAngle);
                const x2 = center.x + outerRadius * Math.cos(startAngle);
                const y2 = center.y + outerRadius * Math.sin(startAngle);
                const x3 = center.x + outerRadius * Math.cos(endAngle);
                const y3 = center.y + outerRadius * Math.sin(endAngle);
                const x4 = center.x + innerRadius * Math.cos(endAngle);
                const y4 = center.y + innerRadius * Math.sin(endAngle);
                
                const largeArcFlag = (endAngle - startAngle) > Math.PI ? 1 : 0;
                
                const pathData = `M ${x1},${y1} L ${x2},${y2} A ${outerRadius},${outerRadius} 0 ${largeArcFlag},1 ${x3},${y3} L ${x4},${y4} A ${innerRadius},${innerRadius} 0 ${largeArcFlag},0 ${x1},${y1} Z`;
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathData);
                path.setAttribute("fill", color);
                path.setAttribute("stroke", "#999");
                path.setAttribute("stroke-width", "0.2");
                
                sunCycleGroup.appendChild(path);
                
                if (label) {
                    const labelRadius = (innerRadius + outerRadius) / 2;
                    const labelX = center.x + labelRadius * Math.cos(labelAngle);
                    const labelY = center.y + labelRadius * Math.sin(labelAngle);
                    
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", labelX);
                    text.setAttribute("y", labelY);
                    text.setAttribute("font-size", "2");
                    text.setAttribute("fill", "#333");
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("dominant-baseline", "central");
                    text.textContent = label;
                    
                    sunCycleGroup.appendChild(text);
                }
            }
            
            createArc(dayStartAngle, dayEndAngle, "#ffeb99", "☀", (dayStartAngle + dayEndAngle) / 2);
            createArc(nightStartAngle1, nightEndAngle1, "#4a5a7a", "☾", (nightStartAngle1 + nightEndAngle1) / 2);
            createArc(nightStartAngle2, nightEndAngle2, "#4a5a7a", "", null);
        }

        function createDayLabels() {
            const dayLabelsGroup = document.getElementById("dayLabels");
            const center = { x: 50, y: 50 };
            const labelRadius = 20;
            const dayNames = ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7"];
            
            for (let i = 0; i < 7; i++) {
                const angle = (i * 360/7 - 90 + 360/14) * Math.PI / 180;
                const x = center.x + labelRadius * Math.cos(angle);
                const y = center.y + labelRadius * Math.sin(angle);
                
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x);
                text.setAttribute("y", y);
                text.setAttribute("class", "segment-label"); text.style.opacity = showDayLabels ? "1" : "0";
                text.textContent = dayNames[i];
                
                dayLabelsGroup.appendChild(text);
            }
        }

        function getLearnedRadius(index) {
            // Keep at outer edge for visibility
            return 36;
        }

        function getSegmentMidAngle(index) {
            // Calculate the angle at the midpoint of the segment
            const segmentStartAngle = index * 360/7;
            const segmentMidAngle = segmentStartAngle + (360/7) / 2;
            return (segmentMidAngle - 90) * Math.PI / 180;
        }

        function createTextBoxes() {
            const textBoxContainer = document.getElementById("textBoxContainer");
            const center = { x: 50, y: 50 };
            const radius = 36; // Positioned outside circle but visible
            
            for (let i = 0; i < 7; i++) {
                // Calculate angle at the MIDPOINT of each segment (50% along the segment)
                const segmentStartAngle = i * 360/7;
                const segmentMidAngle = segmentStartAngle + (360/7) / 2; // Add half segment to get midpoint
                const angle = (segmentMidAngle - 90) * Math.PI / 180; // Convert to radians with -90 offset
                
                const x = center.x + radius * Math.cos(angle);
                const y = center.y + radius * Math.sin(angle);
                
                const foreignObject = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
                foreignObject.setAttribute("x", x - 8);
                foreignObject.setAttribute("y", y - 4);
                foreignObject.setAttribute("width", "16");
                foreignObject.setAttribute("height", "8");
                foreignObject.setAttribute("class", "textBox");
                foreignObject.setAttribute("data-index", i);
                foreignObject.style.overflow = "visible";
                
                const div = document.createElement("div");
                // Vertical centering: previously only text-align:center
                // (horizontal) was set. A plain div flows from the TOP of
                // its container, so text rendered near the box's top
                // edge rather than its true center — the same root-cause
                // bug found and fixed on LOG-CR-TDL via a debug-marker
                // test. Fixed the same way here with flexbox, filling
                // the full box. Fixed 2026-07-21 as part of the
                // systematic re-fix across the Circular family.
                div.style.display = "flex";
                div.style.alignItems = "center";
                div.style.justifyContent = "center";
                div.style.width = "100%";
                div.style.height = "100%";
                div.style.boxSizing = "border-box";
                div.style.textAlign = "center";
                div.style.fontSize = "5.25px";
                div.style.fontFamily = "Arial, sans-serif";
                div.style.color = "black";
                div.style.cursor = "pointer";
                div.style.whiteSpace = "nowrap";
                div.style.fontWeight = "bold";
                div.innerHTML = daysOfWeekData[i][2]; // Start with TLR (romanized)
                
                foreignObject.appendChild(div);
                
                if (learnedItems[i]) foreignObject.classList.add('learned');
                
                foreignObject.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const index = parseInt(this.getAttribute('data-index'));
                    const div = this.querySelector('div');
                    
                    
                    if (learnedItems[index]) {
                        // For learned items, cycle through all three: TLR → TL → SL
                        if (div.innerHTML === daysOfWeekData[index][2]) { // TLR
                            div.innerHTML = daysOfWeekData[index][1]; // TL
                        } else if (div.innerHTML === daysOfWeekData[index][1]) { // TL
                            div.innerHTML = daysOfWeekData[index][0]; // SL
                        } else { // SL
                            div.innerHTML = daysOfWeekData[index][2]; // Back to TLR
                        }
                    } else {
                        // For unlearned items: TLR → TL → SL → Quiz
                        if (div.innerHTML === daysOfWeekData[index][2]) { // TLR (default)
                            div.innerHTML = daysOfWeekData[index][1]; // Show TL
                        } else if (div.innerHTML === daysOfWeekData[index][1]) { // TL
                            div.innerHTML = daysOfWeekData[index][0]; // Show SL
                        } else if (div.innerHTML === daysOfWeekData[index][0]) { // SL
                            showQuiz(index, this); // Start quiz
                        } else {
                            div.innerHTML = daysOfWeekData[index][2]; // Reset to TLR
                        }
                    }
                });
                
                textBoxContainer.appendChild(foreignObject);
                textBoxElements.push(foreignObject);
            }
            
        }

        function addToVocabularyArray(index) {
            try {
                if (addedLearnedItems[index]) return;
                
                const sourceLanguage = daysOfWeekData[index][0];
                const targetLanguage = daysOfWeekData[index][1];
                const targetLanguageRomanized = daysOfWeekData[index][2];
                
                const itemElement = document.createElement('div');
                itemElement.className = 'vocabulary-item';
                
                const targetLanguageSpan = document.createElement('span');
                targetLanguageSpan.className = 'target-language';
                targetLanguageSpan.innerHTML = targetLanguage;
                
                const targetLanguageRomanizedSpan = document.createElement('span');
                targetLanguageRomanizedSpan.className = 'target-language-romanized';
                targetLanguageRomanizedSpan.textContent = targetLanguageRomanized;
                
                const sourceLanguageSpan = document.createElement('span');
                sourceLanguageSpan.className = 'source-language';
                sourceLanguageSpan.textContent = sourceLanguage;
                
                targetLanguageSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                targetLanguageRomanizedSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                sourceLanguageSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                itemElement.appendChild(targetLanguageSpan);
                itemElement.appendChild(targetLanguageRomanizedSpan);
                itemElement.appendChild(sourceLanguageSpan);
                
                const learnedItemsContainer = document.getElementById("learned-items");
                learnedItemsContainer.appendChild(itemElement);
                addedLearnedItems[index] = true;
                
                const learnedArray = document.getElementById("learned-array");
                learnedArray.style.display = 'block';
                
            } catch (error) {
                console.error("Error adding vocabulary item:", error);
            }
        }

        function updateVisibleTextBoxes(dayIndex) {
            const segments = document.querySelectorAll('[data-day]');
            segments.forEach((segment, index) => {
                if (index === dayIndex) {
                    segment.classList.add('segment-highlighted');
                } else {
                    segment.classList.remove('segment-highlighted');
                }
            });
            
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                if (index === dayIndex) {
                    textBox.classList.add('active');
                    textBox.classList.remove('hidden');
                } else if (learnedItems[index]) {
                    textBox.classList.remove('active');
                    textBox.classList.remove('hidden');
                } else {
                    textBox.classList.remove('active');
                    textBox.classList.add('hidden');
                }
            });
            
            const dayIndicator = document.getElementById("day-indicator");
            dayIndicator.textContent = "Day " + (dayIndex + 1);
        }

        function showQuiz(index, element) {
            currentQuizIndex = index;
            
            const quizContainer = document.getElementById("quizContainer");
            const quizInput = document.getElementById("quizInput");
            const quizFeedback = document.getElementById("quizFeedback");
            
            quizInput.placeholder = daysOfWeekData[index][3];
            quizInput.value = '';
            quizFeedback.textContent = '';
            
            quizContainer.style.display = 'block';
            
            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing quiz input:", e);
                }
            }, 100);
        }

        function checkQuizAnswer() {
            if (currentQuizIndex < 0) return;
            
            const quizInput = document.getElementById("quizInput");
            const quizFeedback = document.getElementById("quizFeedback");
            const userAnswer = quizInput.value.trim();
            const correctAnswerTL = daysOfWeekData[currentQuizIndex][1].replace(/<[^>]*>/g, '');
            const correctAnswerTLR = daysOfWeekData[currentQuizIndex][2];
            
            const normalizedUserAnswer = normalizeText(userAnswer);
            const normalizedCorrectTLR = normalizeText(correctAnswerTLR);
            
            if (userAnswer === correctAnswerTL || 
                userAnswer.toLowerCase() === correctAnswerTL.toLowerCase() ||
                userAnswer === correctAnswerTLR ||
                userAnswer.toLowerCase() === correctAnswerTLR.toLowerCase() ||
                normalizedUserAnswer === normalizedCorrectTLR) {
                
                quizFeedback.textContent = 'Correct!';
                quizFeedback.style.color = 'green';
                
                learnedItems[currentQuizIndex] = true;
                const textBox = textBoxElements[currentQuizIndex];
                if (textBox) {
                    textBox.classList.add('learned');
                    const div = textBox.querySelector('div');
                    if (div) {
                        div.innerHTML = daysOfWeekData[currentQuizIndex][1]; // Show TL
                        div.style.color = "green";
                    }
                    
                    const center = { x: 50, y: 50 };
                    const learnedRadius = getLearnedRadius(currentQuizIndex);
                    const angle = getSegmentMidAngle(currentQuizIndex); // Use midpoint angle
                    const x = center.x + learnedRadius * Math.cos(angle);
                    const y = center.y + learnedRadius * Math.sin(angle);
                    
                    textBox.setAttribute("x", x - 8);
                    textBox.setAttribute("y", y - 4);
                }
                
                addToVocabularyArray(currentQuizIndex);
                
                setTimeout(() => { 
                    document.getElementById("quizContainer").style.display = 'none';
                    currentQuizIndex = -1;
                }, 1500);
            } else {
                quizFeedback.textContent = 'Try again';
                quizFeedback.style.color = 'red';
                
                // Reset to show TLR when user gets wrong answer
                const textBox = textBoxElements[currentQuizIndex];
                if (textBox) {
                    const div = textBox.querySelector('div');
                    if (div) {
                        div.innerHTML = daysOfWeekData[currentQuizIndex][2]; // TLR
                    }
                }
            }
        }

        function positionFrameOnDay(dayIndex) {
            const center = { x: 50, y: 50 };
            const radius = 30;
            const angle = ((dayIndex + 0.5) * 360/7 - 90) * Math.PI / 180;   // the middle of the day's segment
            
            const x = center.x + radius * Math.cos(angle);
            const y = center.y + radius * Math.sin(angle);
            
            const frame = document.getElementById("draggableFrame");
            frame.setAttribute('cx', x);
            frame.setAttribute('cy', y);
            
            currentDay = dayIndex;
            updateVisibleTextBoxes(dayIndex);
        }

        function getCurrentDayIndex() {
            // Get current day of the week (0 = Sunday, 1 = Monday, etc.)
            const now = new Date();
            let dayOfWeek = now.getDay();
            
            // Convert Sunday (0) to index 6, and shift others down
            // Monday = 0, Tuesday = 1, ..., Saturday = 5, Sunday = 6
            if (dayOfWeek === 0) {
                return 6; // Sunday
            } else {
                return dayOfWeek - 1; // Monday-Saturday
            }
        }

        function initializeApp() {
            
            const svg = document.getElementById("svgCanvas");
            const frame = document.getElementById("draggableFrame");
            const titleBox = document.getElementById("title-box");
            const displayModeToggle = document.getElementById("display-mode-toggle");
            const sunCycleToggle = document.getElementById("sun-cycle-toggle");
            const quizContainer = document.getElementById("quizContainer");
            const quizInput = document.getElementById("quizInput");
            const quizCheck = document.getElementById("quizCheck");
            const toggleLearnedBtn = document.getElementById("toggle-learned");
            const dayLabelsToggle = document.getElementById("day-labels-toggle");
            const todayIndicator = document.getElementById("today-indicator");
            
            if (!svg || !frame || !titleBox) {
                console.error("Critical elements are missing from the DOM");
                return;
            }

            // Title box: TLR by default (matches the vocabulary-item
            // convention — see Conceptionary_Template_Definitions.md).
            // Was previously left showing a static HTML placeholder that
            // didn't even match titleTexts[0]; now genuinely defaults to
            // real content from the moment the page loads.
            titleBox.textContent = titleTexts[0];
            currentTextIndex = 0;
            
            createSegments();
            createSunCycleArcs();
            createDayLabels();
            createTextBoxes();
            
            // Position the sun on the current day of the week
            const todayIndex = getCurrentDayIndex();
            positionFrameOnDay(todayIndex);
            
            
            frame.style.pointerEvents = 'all';
            frame.style.cursor = 'grab';
            
            
            let startDrag = function(e) {
                isDragging = true;
                frame.classList.add('dragging');
                frame.style.cursor = 'grabbing';
                e.preventDefault();
                e.stopPropagation();
            };
            
            let dragMove = function(e) {
                if (!isDragging) return;
                
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                try {
                    const pt0 = svg.createSVGPoint(); pt0.x = clientX; pt0.y = clientY;
                    const sp = pt0.matrixTransform(svg.getScreenCTM().inverse());
                    const svgX = sp.x, svgY = sp.y;
                    
                    const centerX = 50;
                    const centerY = 50;
                    const deltaX = svgX - centerX;
                    const deltaY = svgY - centerY;
                    
                    let angle = Math.atan2(deltaY, deltaX);
                    
                    const radius = 30;
                    const frameX = centerX + radius * Math.cos(angle);
                    const frameY = centerY + radius * Math.sin(angle);
                    
                    frame.setAttribute('cx', frameX);
                    frame.setAttribute('cy', frameY);
                    
                    const angleDegrees = (angle * 180 / Math.PI + 90 + 360) % 360;
                    const dayIndex = Math.floor(angleDegrees / (360/7));
                    const clampedDayIndex = Math.max(0, Math.min(6, dayIndex));
                    
                    currentDay = clampedDayIndex;
                    updateVisibleTextBoxes(clampedDayIndex);
                    
                } catch (error) {
                    console.error("Error during drag:", error);
                }
                
                e.preventDefault();
                e.stopPropagation();
            };
            
            let endDrag = function(e) {
                if (isDragging) {
                    isDragging = false;
                    frame.classList.remove('dragging');
                    frame.style.cursor = 'grab';
                    if (window.__cmpSpeak) window.__cmpSpeak(currentDay);
                    
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }
            };
            
            function switchTitleText() {
                titleBox.classList.add('hidden');
                setTimeout(() => {
                    currentTextIndex = (currentTextIndex + 1) % titleTexts.length;
                    titleBox.innerHTML = titleTexts[currentTextIndex];
                    titleBox.classList.remove('hidden');
                }, 500);
            }
            
            frame.addEventListener('mousedown', startDrag);
            frame.addEventListener('touchstart', startDrag, { passive: false });
            // 2026-11-06: touching or clicking anywhere on the ring grabs the sun (the sun itself is small, especially on a phone)
            const faceDown = function (e) {
                if (e.target.closest && e.target.closest('.textBox')) return;
                const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
                const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
                const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
                const p = pt.matrixTransform(svg.getScreenCTM().inverse());
                if (Math.hypot(p.x - 50, p.y - 50) > 35) return;
                startDrag(e); dragMove(e);
            };
            svg.addEventListener('mousedown', faceDown);
            svg.addEventListener('touchstart', faceDown, { passive: false });
            
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            document.addEventListener('mouseleave', endDrag);
            
            titleBox.addEventListener('click', switchTitleText);
            displayModeToggle.addEventListener('click', cycleDisplayMode);
            sunCycleToggle.addEventListener('click', toggleSunCycle);
            dayLabelsToggle.addEventListener('click', toggleDayLabels);
            quizCheck.addEventListener('click', checkQuizAnswer);
            quizInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkQuizAnswer();
            });
            
            toggleLearnedBtn.addEventListener('click', toggleArrayVisibility);
            
            // Today button - returns to current day
            todayIndicator.addEventListener('click', function() {
                const todayIndex = getCurrentDayIndex();
                positionFrameOnDay(todayIndex);
            });
            
            document.addEventListener('click', function(e) {
                if (quizContainer.style.display !== 'none' && 
                    !quizContainer.contains(e.target) && 
                    !textBoxElements.some(box => box && box.contains(e.target))) {
                    
                    if (currentQuizIndex >= 0 && !learnedItems[currentQuizIndex]) {
                        const textBox = textBoxElements[currentQuizIndex];
                        if (textBox) {
                            const div = textBox.querySelector('div');
                            if (div) {
                                div.innerHTML = daysOfWeekData[currentQuizIndex][2]; // Reset to TLR
                            }
                        }
                    }
                    
                    quizContainer.style.display = 'none';
                    currentQuizIndex = -1;
                }
            });
            
            quizContainer.style.display = 'none';
            
            setTimeout(() => {
                const dragInstruction = document.getElementById('drag-instruction');
                if (dragInstruction) {
                    dragInstruction.classList.add('fade');
                    setTimeout(() => {
                        dragInstruction.style.display = 'none';
                    }, 3000);
                }
            }, 15000);
            
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
    <script>

    (function () {

        var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif'; document.documentElement.style.setProperty('--cx-font', FONT);
        function wOf(i, txt) { cv.font = '700 ' + sizeOf(i) + 'px ' + FONT; return cv.measureText(plain(txt)).width + 3; }
        function hOf(i) { return sizeOf(i) * 1.35; }

        function modeLabel(m) { var row = MODES[m]; if (LOGV) return row === 2 ? 'Show: TLR' : row === 1 ? 'Show: TL' : 'Show: SL'; return row === 1 ? LANG.show_tl_label : LANG.show_sl_label; }
        function dayWord(i, k) { return daysOfWeekData[i][MODES[k]]; }

        function rectsFor(kOf) {

    <script>
    /* 2026-11-09 night and day: seven "night" cones (pink - grey - black - grey - pink), each as wide as a day segment but shifted half a segment, so the blackest line (midnight)
       falls on the boundary between two days and the pink edges (sunrise / sunset) fall at the middle of each day, where the sun stands. Plus a yellow beam of light from the

    (function () {
        var svg = document.getElementById('svgCanvas'), frame = document.getElementById('draggableFrame'), cyc = document.getElementById('sunCycleArcs');
        if (!svg || !frame || !cyc || document.getElementById('cxNight')) return;
        var NS = 'http://www.w3.org/2000/svg', R = 30, SL = 28;   // SL = slivers per cone
        function mk(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

        lg.innerHTML = '<stop offset="0%" stop-color="#ffe45c" stop-opacity=".78"/><stop offset="55%" stop-color="#ffd23a" stop-opacity=".34"/><stop offset="100%" stop-color="#ffd23a" stop-opacity=".06"/>';
        defs.appendChild(lg);
        var g = mk('g', { id: 'cxNight', 'pointer-events': 'none' });
        /* ONE smooth repeating conic gradient (7 cones). The cone starts at the middle of a day (pink = sunrise / sunset), is blackest on the boundary between two days (midnight). */
        var W = 360 / 7, fo = mk('foreignObject', { x: 50 - R, y: 50 - R, width: 2 * R, height: 2 * R });
        var d = document.createElement('div'); d.id = 'cxNightDisc';
        /* stops as [fraction of the cone, red, green, blue, strength]: a wide sky-blue daylight band at the edge (the middle of the day), a NARROW transition (pink, orange, grey) and a wide black midnight band in the middle */
        var ST = [[0, 120, 200, 240, 0.8], [0.24, 120, 200, 240, 0.76], [0.27, 255, 182, 200, 0.45], [0.295, 255, 150, 70, 0.6], [0.315, 125, 120, 130, 0.75], [0.34, 10, 10, 20, 0.94], [0.5, 8, 8, 18, 0.94], [0.66, 10, 10, 20, 0.94], [0.685, 125, 120, 130, 0.75], [0.705, 255, 150, 70, 0.6], [0.73, 255, 182, 200, 0.45], [0.76, 120, 200, 240, 0.76], [1, 120, 200, 240, 0.8]];
        d.style.cssText = 'width:100%;height:100%;border-radius:50%;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:repeating-conic-gradient(from ' + (W / 2).toFixed(4) + 'deg at 50% 50%,' +
            ST.map(function (p) { return 'rgba(' + p[1] + ',' + p[2] + ',' + p[3] + ',' + p[4] + ') ' + (W * p[0]).toFixed(3) + 'deg'; }).join(',') + ')';

    })();

    <script>
    /* 2026-11-09 WEEKENDS: the week-day / weekend colours (light green = go, light red = stop) on the segments and on the outer rim, and a Tools > Weekend button

       Day numbers: 0 Mon, 1 Tue, 2 Wed, 3 Thu, 4 Fri, 5 Sat, 6 Sun.  See Conceptionary_Weekend_Reference.md for the sources and for how to add or change a country. */

        var NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], WEST = [5, 6], FS = [4, 5];

            IR: [4], PS: [4], DJ: [4], SO: [4], NP: [5], BN: [4, 6],
            AE: WEST, MA: WEST, TN: WEST, LB: WEST   /* Arabic-speaking, but Sat-Sun: these stop the Arabic fallback below */
        };
        /* by language alone (a code with no country, e.g. ar or he) - second choice */
        var BY_LANG = { he: FS, ar: FS, fa: [4], ne: [5], dv: FS, so: [4] };
        var CK = 'url(#cxRimBlue)', CR = 'url(#cxRimGrey)';   /* rim: sky-blue (week days) and light-grey (weekend) rounded, bevelled tubes */
        (function () {
            var NS = 'http://www.w3.org/2000/svg', defs = document.querySelector('#svgCanvas defs');
            function grad(id, stops) { var g = document.createElementNS(NS, 'radialGradient'); g.setAttribute('id', id); g.setAttribute('gradientUnits', 'userSpaceOnUse'); g.setAttribute('cx', 50); g.setAttribute('cy', 50); g.setAttribute('r', 34);
                g.innerHTML = stops.map(function (s) { return '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>'; }).join(''); defs.appendChild(g); }
            grad('cxRimBlue', [[.9118, '#f6fcff'], [.93, '#cdeafc'], [.955, '#87ceeb'], [.978, '#5fb2e2'], [1, '#bfe3f7']]);
            grad('cxRimGrey', [[.9118, '#fcfcfc'], [.93, '#e6e8eb'], [.955, '#c4c8ce'], [.978, '#9ba1a9'], [1, '#d6d9de']]);

        function parse(v) {   /* accepts [4,5] or 'Fri,Sat' / 'Fri-Sat' */

            if (!code) return WEST;

            if (p.length > 1 && BY_COUNTRY[reg]) return BY_COUNTRY[reg];

        function key(a) { return a.join(','); }
        function nice(a) {

        }
        var svg = document.getElementById('svgCanvas'), grp = document.getElementById('sunCycleArcs'), btn = document.getElementById('weekendBtn');

        var cur = WEST, opts = [], oi = 0;
        function arcPath(a0, n) {

            function P(r, t) { return (50 + r * Math.cos(t)).toFixed(3) + ',' + (50 + r * Math.sin(t)).toFixed(3); }
            var big = (e - s) > Math.PI ? 1 : 0;

        }

            });

            if (start === 7) start = 0;

            var bestWd = null, bestWe = null;
            runs.forEach(function (r) { if (r.wk) { if (!bestWe || r.n > bestWe.n) bestWe = r; } else if (!bestWd || r.n > bestWd.n) bestWd = r; });
            runs.forEach(function (r) {

                /* shiny highlight along the inner third of the tube */

        }

        function say(msg) { toast.textContent = msg; toast.style.opacity = '1'; clearTimeout(tt); tt = setTimeout(function () { toast.style.opacity = '0'; }, 3200); }
        btn.addEventListener('click', function (e) {

    })();
