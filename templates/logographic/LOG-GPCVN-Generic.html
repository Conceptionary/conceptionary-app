<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG-GPCVN Generic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            overflow: hidden;
        }

        .a4-page {
            width: 90vw;
            height: 70vh;
            border: 5px solid black;
            background-color: white;
            box-sizing: border-box;
            position: relative;
            touch-action: none;
            z-index: 1;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .decline-curve {
            stroke: black;
            stroke-width: 0.25;
            fill: none;
        }

        /* States Mode Elements */
        .textBox {
            cursor: pointer;
            font-size: 0.7em;
            fill: black;
            opacity: 0;
            display: none;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5);
            text-anchor: middle;
            font-family: Arial, sans-serif;
            pointer-events: auto;
            z-index: 500;
        }

        .textBox.active {
            opacity: 1;
            display: block;
            transform: scale(1) translateY(0);
        }

        .textBox.learned {
            opacity: 0.5;
            display: block;
            transform: scale(1) translateY(0);
            fill: green;
        }
        
        .textBox.learned.active {
            opacity: 1;
        }
        
        .textBox.hidden {
            opacity: 0;
            display: none;
        }

        /* Enhanced background with decline theme */
        #conceptBackground {
            fill: url(#declineGradient);
            opacity: 0.2;
        }

        /* Enhanced draggable frame */
        #draggableFrame {
            cursor: grab;
            fill: rgba(255, 100, 100, 0.3);
            stroke: #a02c2c;
            stroke-width: 0.5px;
            pointer-events: all;
            opacity: 0.9;
            transition: fill 0.2s ease;
            z-index: 1000;
        }

        #draggableFrame:hover {
            fill: rgba(255, 100, 100, 0.5);
            stroke-width: 0.5px;
            cursor: grab;
        }

        #draggableFrame.dragging {
            cursor: grabbing;
            fill: rgba(255, 150, 100, 0.5);
            stroke: #cc6600;
        }

        /* Transitions Mode Elements */
        .sliding-text {
            font-size: 3.5px;
            font-weight: bold;
            fill: #dc3545;
            cursor: pointer;
            dominant-baseline: auto;
            pointer-events: all;
            font-family: Arial, sans-serif;
        }
        
        .sliding-text.learned {
            fill: green;
        }

        /* Level indicators with distinct colors for decline */
        .sliding-text.level-1 {
            fill: #dc3545;
        }
        
        .sliding-text.level-2 {
            fill: #fd7e14;
        }
        
        .sliding-text.level-3 {
            fill: #6f42c1;
        }
        
        .sliding-text.level-4 {
            fill: #e83e8c;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Common Title Box Styling */
        .title-box {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 1px solid black;
            padding: 10px;
            background-color: white;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
            font-family: Arial, sans-serif;
        }
        
        .title-box.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }
        
        /* Mode Toggle Button */
        .mode-toggle {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            padding: 8px 16px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
        }
        
        /* Concept Indicator */
        .concept-indicator {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 3;
        }

        /* Level indicator for transitions mode */
        .level-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 3;
        }

        /* Display mode toggle for states */
        .display-mode-toggle {
            position: absolute;
            top: 60px;
            right: 10px;
            font-size: 0.7em;
            padding: 5px 10px;
            background-color: #ffe8e8;
            border: 1px solid #dc3545;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
        }

        /* Audio button */
        .audio-button {
            position: absolute;
            top: 10px;
            right: 70px;
            font-size: 0.7em;
            padding: 5px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
            transition: background-color 0.3s ease;
        }
        
        .audio-button:hover {
            background-color: #c82333;
        }

        .audio-button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9em;
            padding: 5px 10px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 3;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 200px;
            opacity: 1;
            transition: opacity 2s ease;
        }
        
        .instructions.fade {
            opacity: 0;
        }

        /* Quiz container styles */
        .quiz-container {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 3px solid #dc3545;
            border-radius: 4px;
            padding: 12px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 360px;
            width: 360px;
            pointer-events: auto;
            visibility: visible;
            opacity: 1;
        }
        
        .quiz-container input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }
        
        .quiz-container button {
            width: 100%;
            padding: 8px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .quiz-container button:hover {
            background-color: #c82333;
        }
        
        #quizFeedback {
            text-align: center;
            font-weight: bold;
            margin-top: 8px;
            min-height: 20px;
        }

        /* Vocabulary Arrays Styles */
        .vocabulary-array {
            position: absolute;
            width: 25%;
            max-height: 40vh;
            overflow-y: auto;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px;
            z-index: 4;
            display: none;
        }

        #decline-array {
            left: 5px;
            top: 5px;
        }

        #degraded-array {
            right: 5px;
            top: 35px;
        }

        .array-title {
            font-size: 0.9em;
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
            padding: 3px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ccc;
        }

        .vocabulary-item {
            display: flex;
            flex-direction: column;
            font-size: 0.75em;
            margin: 3px 0;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background-color: #f9f9f9;
            transition: background-color 0.3s ease;
        }

        .vocabulary-item:hover {
            background-color: #ffe8e8;
        }

        .learned-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .target-language-learned {
            flex: 1;
            font-weight: bold;
            color: #dc3545;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: Arial, sans-serif;
        }

        .romanized-learned {
            flex: 1;
            font-weight: bold;
            color: #fd7e14;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
            text-align: center;
        }

        .source-language-learned {
            flex: 1;
            color: #555;
            text-align: right;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
        }
        
        .target-language-learned.hidden,
        .romanized-learned.hidden,
        .source-language-learned.hidden {
            color: transparent;
            user-select: none;
            background-color: #f0f0f0;
        }
        
        .concept-ref {
            font-size: 0.7em;
            color: #666;
            text-align: center;
            margin-bottom: 6px;
        }
        
        /* Toggle visibility button */
        .toggle-visibility {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7em;
            padding: 2px 5px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="a4-page">
        <div id="title-box" class="title-box"></div>
        <div id="concept-indicator" class="concept-indicator">12:00 AM</div>
        <div id="level-indicator" class="level-indicator">Japanese</div>
        <div id="display-mode-toggle" class="display-mode-toggle">Show: TL</div>
        <div id="audio-button" class="audio-button">Audio</div>
        <div id="instructions" class="instructions">Drag the red rectangle along the curve to explore permanent decline!</div>
        
        
        <!-- Vocabulary Arrays -->
        <div id="decline-array" class="vocabulary-array">
            <div class="array-title">Decline Phase</div>
            <button class="toggle-visibility" id="toggle-decline">Hide All</button>
            <div id="decline-items"></div>
        </div>
        
        <div id="degraded-array" class="vocabulary-array">
            <div class="array-title">Degraded State</div>
            <button class="toggle-visibility" id="toggle-degraded">Hide All</button>
            <div id="degraded-items"></div>
        </div>
        
        <svg id="svgCanvas" viewBox="-30 0 160 50" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="declineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
                    <stop offset="15%" style="stop-color:#ff6b6b;stop-opacity:1" />
                    <stop offset="25%" style="stop-color:#ffa8a8;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#ffcccc;stop-opacity:1" />
                    <stop offset="75%" style="stop-color:#d4a4a4;stop-opacity:1" />
                    <stop offset="85%" style="stop-color:#8b6666;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#5c3434;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <path id="declineCurve" class="decline-curve"></path>
            <path id="conceptBackground"></path>
            
            <!-- Transitions Mode Elements -->
            <text id="interactiveText" class="sliding-text level-1">
                <textPath id="slidingText" href="#declineCurve" startOffset="10%" dy="-5">
                    Click me to learn!
                </textPath>
            </text>
            
            <!-- States Mode Elements -->
            <rect id="draggableFrame" x="40" y="20" width="15" height="8" rx="2" 
                  style="z-index: 1000; pointer-events: all; cursor: grab;"/>
        </svg>
        
        <button id="modeToggle" class="mode-toggle">Toggle Mode</button>
        <div class="watermark">
            &copy; 2026 Alan William Preston
        </div>
    </div>

    <!-- Quiz Container -->
    <div id="quizContainer" class="quiz-container">
        <input type="text" id="quizInput" placeholder="Enter the target language">
        <button id="quizCheck">Check</button>
        <div id="quizFeedback"></div>
    </div>

    <script>
        // GPCVN concept data - Permanent decline from peak to degraded state
        const conceptData = [
            ["Peak-State", "TL-Peak", "TLR-Peak", "What's the target language for the peak state?", 5],
            ["Slight-Decline-1", "TL-SD-1", "TLR-SD-1", "What's the target language for slight decline 1?", 10],
            ["Slight-Decline-2", "TL-SD-2", "TLR-SD-2", "What's the target language for slight decline 2?", 15],
            ["Noticeable-Decline-1", "TL-ND-1", "TLR-ND-1", "What's the target language for noticeable decline 1?", 20],
            ["Noticeable-Decline-2", "TL-ND-2", "TLR-ND-2", "What's the target language for noticeable decline 2?", 25],
            ["Significant-Decline-1", "TL-SigD-1", "TLR-SigD-1", "What's the target language for significant decline 1?", 30],
            ["Significant-Decline-2", "TL-SigD-2", "TLR-SigD-2", "What's the target language for significant decline 2?", 35],
            ["Major-Decline-1", "TL-MD-1", "TLR-MD-1", "What's the target language for major decline 1?", 40],
            ["Major-Decline-2", "TL-MD-2", "TLR-MD-2", "What's the target language for major decline 2?", 45],
            ["Lowest-Point", "TL-Lowest", "TLR-Lowest", "What's the target language for the lowest point?", 50],
            ["Degraded-1", "TL-Deg-1", "TLR-Deg-1", "What's the target language for degraded state 1?", 55],
            ["Degraded-2", "TL-Deg-2", "TLR-Deg-2", "What's the target language for degraded state 2?", 60],
            ["Degraded-3", "TL-Deg-3", "TLR-Deg-3", "What's the target language for degraded state 3?", 65],
            ["Degraded-4", "TL-Deg-4", "TLR-Deg-4", "What's the target language for degraded state 4?", 70],
            ["Degraded-5", "TL-Deg-5", "TLR-Deg-5", "What's the target language for degraded state 5?", 75],
            ["Degraded-6", "TL-Deg-6", "TLR-Deg-6", "What's the target language for degraded state 6?", 80],
            ["Degraded-7", "TL-Deg-7", "TLR-Deg-7", "What's the target language for degraded state 7?", 85],
            ["Degraded-8", "TL-Deg-8", "TLR-Deg-8", "What's the target language for degraded state 8?", 90],
            ["Degraded-9", "TL-Deg-9", "TLR-Deg-9", "What's the target language for degraded state 9?", 95]
        ];

        const transitionsData = [
            {
                process: "Beginning irreversible decline",
                targetLanguage: "T-Beginning irreversible decline",
                romanized: "T-Beginning-decline-rom",
                sourceLanguage: "Beginning irreversible decline",
                question: "What's the target language for 'Beginning irreversible decline'?",
                positionPercent: 5
            },
            {
                process: "Declining steadily", 
                targetLanguage: "T-Declining steadily",
                romanized: "T-Declining-rom",
                sourceLanguage: "Declining steadily",
                question: "What's the target language for 'Declining steadily'?",
                positionPercent: 20
            },
            {
                process: "Significant deterioration",
                targetLanguage: "T-Significant deterioration", 
                romanized: "T-Deterioration-rom",
                sourceLanguage: "Significant deterioration",
                question: "What's the target language for 'Significant deterioration'?",
                positionPercent: 35
            },
            {
                process: "Approaching lowest point",
                targetLanguage: "T-Approaching lowest point",
                romanized: "T-Approaching-lowest-rom", 
                sourceLanguage: "Approaching lowest point",
                question: "What's the target language for 'Approaching lowest point'?",
                positionPercent: 45
            },
            {
                process: "Reaching degraded state",
                targetLanguage: "T-Reaching degraded state",
                romanized: "T-Reaching-degraded-rom",
                sourceLanguage: "Reaching degraded state",
                question: "What's the target language for 'Reaching degraded state'?",
                positionPercent: 50
            },
            {
                process: "Remaining at reduced level",
                targetLanguage: "T-Remaining at reduced level", 
                romanized: "T-Remaining-rom",
                sourceLanguage: "Remaining at reduced level",
                question: "What's the target language for 'Remaining at reduced level'?",
                positionPercent: 65
            },
            {
                process: "Permanently diminished",
                targetLanguage: "T-Permanently diminished",
                romanized: "T-Permanently-dim-rom", 
                sourceLanguage: "Permanently diminished",
                question: "What's the target language for 'Permanently diminished'?",
                positionPercent: 80
            },
            {
                process: "Irreversibly reduced",
                targetLanguage: "T-Irreversibly reduced",
                romanized: "T-Irreversibly-rom",
                sourceLanguage: "Irreversibly reduced",
                question: "What's the target language for 'Irreversibly reduced'?",
                positionPercent: 95
            }
        ];

        // Global variables
        let isStatesMode = true;
        let pathLength = 0;
        let currentQuizIndex = -1;
        let currentLevel = 1;
        let currentDataIndex = 0;
        let displayLevel = 0;
        let learnedItems = new Set();
        let textBoxElements = [];
        let addedDeclineItems = [];
        let addedDegradedItems = [];
        
        // Title cycle: TLR (default) → TL → SL → TLR, per mode. See
        // "Logographic UI Conventions" in Conceptionary_Template_Definitions.md.
        const titleTexts = {
            states: ["TLR_TITLE_STATES", "TL_TITLE_STATES", "SL_TITLE_STATES"],
            transitions: ["TLR_TITLE_TRANSITIONS", "TL_TITLE_TRANSITIONS", "SL_TITLE_TRANSITIONS"]
        };
        let currentTextIndex = 0;
        const activationDistance = 8;

        function playAudio(text, language = 'auto') {
            alert(`Audio API would pronounce: "${text}"\n(Feature ready for API integration)`);
        }

        function getPositionFromPercent(positionPercent) {
            return (positionPercent / 100) * pathLength;
        }

        function getDataIndexAtPosition(positionPercent) {
            let closestIndex = 0;
            let minDistance = Infinity;
            
            for (let i = 0; i < transitionsData.length; i++) {
                const distance = Math.abs(transitionsData[i].positionPercent - positionPercent);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = i;
                }
            }
            
            return closestIndex;
        }

        function toggleArrayVisibility(arrayType) {
            try {
                const container = document.getElementById(arrayType + "-items");
                const button = document.getElementById("toggle-" + arrayType);
                if (!container || !button) return;
                
                const spans = container.querySelectorAll('.vocabulary-item .target-language-learned, .vocabulary-item .romanized-learned, .vocabulary-item .source-language-learned');
                
                let visibleCount = 0;
                spans.forEach(span => {
                    if (!span.classList.contains('hidden')) {
                        visibleCount++;
                    }
                });
                
                const mostlyVisible = visibleCount > spans.length / 2;
                
                spans.forEach(span => {
                    if (mostlyVisible) {
                        span.classList.add('hidden');
                    } else {
                        span.classList.remove('hidden');
                    }
                });
                
                button.textContent = mostlyVisible ? 'Show All' : 'Hide All';
            } catch (error) {
                console.error("Error in toggleArrayVisibility:", error);
            }
        }

        function cycleDisplayLevel() {
            displayLevel = (displayLevel + 1) % 4;
            const button = document.getElementById("display-mode-toggle");
            
            switch(displayLevel) {
                case 0: button.textContent = "Show: TL"; break;
                case 1: button.textContent = "Show: TLR"; break;
                case 2: button.textContent = "Show: SL"; break;
                case 3: button.textContent = "Show: TLQ"; break;
            }
            
            if (isStatesMode) {
                updateAllTextBoxes();
            }
        }

        function updateAllTextBoxes() {
            textBoxElements.forEach((textBox, index) => {
                if (textBox && conceptData[index] && !textBox.classList.contains('active')) {
                    const div = textBox.querySelector('div');
                    if (div) {
                        switch(displayLevel) {
                            case 0: div.innerHTML = conceptData[index][1]; break;
                            case 1: div.innerHTML = conceptData[index][2]; break;
                            case 2: div.innerHTML = conceptData[index][0]; break;
                            case 3: div.innerHTML = "TLQ" + (index + 1); break;
                        }
                    }
                }
            });
        }
        
        function bringFrameToFront() {
            const frame = document.getElementById('draggableFrame');
            if (frame && frame.parentNode) {
                frame.parentNode.appendChild(frame);
            }
        }

        function setLevel(newLevel) {
            currentLevel = newLevel;
            const currentData = transitionsData[currentDataIndex];
            const slidingText = document.getElementById('slidingText');
            const interactiveText = document.getElementById('interactiveText');
            const conceptIndicator = document.getElementById('concept-indicator');
            const levelIndicator = document.getElementById('level-indicator');

            conceptIndicator.textContent = currentData.process;
            interactiveText.className = 'sliding-text';

            // LOG convention: TLR default (1) → TL script (2) → SL (3) → Quiz (4)
            switch(newLevel) {
                case 1:
                    slidingText.textContent = currentData.romanized;
                    interactiveText.classList.add('level-1');
                    levelIndicator.textContent = 'Romanized (TLR)';
                    break;
                case 2:
                    slidingText.textContent = currentData.targetLanguage;
                    interactiveText.classList.add('level-2');
                    levelIndicator.textContent = 'Target Language';
                    break;
                case 3:
                    slidingText.textContent = currentData.sourceLanguage;
                    interactiveText.classList.add('level-3');
                    levelIndicator.textContent = 'Source Language';
                    break;
                case 4:
                    slidingText.textContent = "QUIZ READY - Click to start!";
                    interactiveText.classList.add('level-4');
                    levelIndicator.textContent = 'Quiz Mode';
                    break;
            }

            slidingText.setAttribute('href', '#declineCurve');
            slidingText.setAttribute('dy', '-5');
        }

        function progressLevel() {
            const isLearned = learnedItems.has(currentDataIndex);

            if (isLearned) {
                const nextLevel = (currentLevel % 3) + 1;
                setLevel(nextLevel);
            } else {
                if (currentLevel < 4) {
                    setLevel(currentLevel + 1);
                } else {
                    setLevel(1);
                }
            }

            if (currentLevel === 4 && !isLearned) {
                setTimeout(() => showQuiz(), 200);
            }
        }

        function createTextBoxes() {
            if (!isStatesMode) return;
            
            const svg = document.getElementById("svgCanvas");
            const declineCurve = document.getElementById("declineCurve");
            
            document.querySelectorAll('.textBox').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            textBoxElements = [];
            
            for (let i = 0; i < conceptData.length; i++) {
                const positionPercent = conceptData[i][4];
                const position = getPositionFromPercent(positionPercent);
                const point = declineCurve.getPointAtLength(position);
                
                const foreignObject = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
                foreignObject.setAttribute("x", point.x - 20);
                foreignObject.setAttribute("y", point.y - 10);
                foreignObject.setAttribute("width", "40");
                foreignObject.setAttribute("height", "15");
                foreignObject.setAttribute("class", "textBox");
                foreignObject.setAttribute("data-index", i);
                foreignObject.style.pointerEvents = "auto";
                foreignObject.style.zIndex = "500";
                
                const div = document.createElement("div");
                div.style.textAlign = "center";
                div.style.fontSize = "3px";
                div.style.fontFamily = "Arial, sans-serif";
                div.style.color = "black";
                div.style.cursor = "pointer";
                div.style.lineHeight = "1.2";
                
                switch(displayLevel) {
                    case 0: div.innerHTML = conceptData[i][1]; break;
                    case 1: div.innerHTML = conceptData[i][2]; break;
                    case 2: div.innerHTML = conceptData[i][0]; break;
                    case 3: div.innerHTML = "TLQ" + (i + 1); break;
                }
                // LOGOGRAPHIC CONVENTION: individual textboxes always start
                // showing TLR (Target Language Romanized), regardless of the
                // global "Show All" display level.
                div.innerHTML = conceptData[i][2];
                
                foreignObject.appendChild(div);
                
                if (learnedItems.has(`state_${i}`)) foreignObject.classList.add('learned');
                
                foreignObject.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    const div = this.querySelector('div');
                    
                    if (learnedItems.has(`state_${index}`)) {
                        // TLR -> TL -> SL -> TLQ -> TLR
                        if (div.innerHTML === conceptData[index][2]) {
                            div.innerHTML = conceptData[index][1];
                        } else if (div.innerHTML === conceptData[index][1]) {
                            div.innerHTML = conceptData[index][0];
                        } else if (div.innerHTML === conceptData[index][0]) {
                            div.innerHTML = "TLQ" + (index + 1);
                        } else {
                            div.innerHTML = conceptData[index][2];
                        }
                    } else {
                        // TLR -> TL -> SL -> Quiz
                        if (div.innerHTML === conceptData[index][2]) {
                            div.innerHTML = conceptData[index][1];
                        } else if (div.innerHTML === conceptData[index][1]) {
                            div.innerHTML = conceptData[index][0];
                        } else if (div.innerHTML === conceptData[index][0]) {
                            showQuizForStates(index, this);
                        } else {
                            div.innerHTML = conceptData[index][2];
                        }
                    }
                });
                
                const draggableFrame = document.getElementById('draggableFrame');
                if (draggableFrame && draggableFrame.parentNode) {
                    draggableFrame.parentNode.insertBefore(foreignObject, draggableFrame);
                } else {
                    svg.appendChild(foreignObject);
                }
                
                textBoxElements.push(foreignObject);
            }
            
            bringFrameToFront();
        }

        function initializeFramePosition() {
            const startPercent = 5;
            const startPosition = getPositionFromPercent(startPercent);
            const declineCurve = document.getElementById('declineCurve');
            const startPoint = declineCurve.getPointAtLength(startPosition);
            const frame = document.getElementById('draggableFrame');
            
            frame.setAttribute('x', startPoint.x - parseFloat(frame.getAttribute('width'))/2);
            frame.setAttribute('y', startPoint.y - parseFloat(frame.getAttribute('height'))/2);
            
            updateVisibleTextBoxes(startPoint);
            document.getElementById('concept-indicator').textContent = conceptData[0][0];
            
            bringFrameToFront();
            frame.style.pointerEvents = 'all';
            frame.style.cursor = 'grab';
            
        }

        function updateVisibleTextBoxes(point) {
            if (!isStatesMode) return -1;
            
            let closestIndex = -1;
            let minDistance = Infinity;
            
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x')) + 20;
                const y = parseFloat(textBox.getAttribute('y')) + 7.5;
                
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });
            
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                if (index === closestIndex && minDistance < activationDistance) {
                    textBox.classList.add('active');
                    textBox.classList.remove('hidden');
                    textBox.style.opacity = '1';
                    textBox.style.display = 'block';
                } else if (learnedItems.has(`state_${index}`)) {
                    textBox.classList.remove('active');
                    textBox.classList.remove('hidden');
                    textBox.classList.add('learned');
                    textBox.style.opacity = '0.5';
                    textBox.style.display = 'block';
                } else {
                    textBox.classList.remove('active', 'learned');
                    textBox.classList.add('hidden');
                    textBox.style.opacity = '0';
                    textBox.style.display = 'none';
                }
            });
            
            if (closestIndex !== -1 && minDistance < activationDistance && conceptData[closestIndex]) {
                document.getElementById('concept-indicator').textContent = conceptData[closestIndex][0];
            }
            
            return closestIndex;
        }

        function hideQuiz() {
            const quizContainer = document.getElementById('quizContainer');
            const quizInput = document.getElementById('quizInput');
            const quizFeedback = document.getElementById('quizFeedback');
            
            quizContainer.style.display = 'none';
            if (quizInput) quizInput.value = '';
            if (quizFeedback) quizFeedback.textContent = '';
            currentQuizIndex = -1;
        }

        function showQuiz() {
            const currentData = transitionsData[currentDataIndex];
            const quizInput = document.getElementById("quizInput");
            const quizFeedback = document.getElementById("quizFeedback");
            const quizContainer = document.getElementById("quizContainer");

            currentQuizIndex = currentDataIndex;
            
            quizInput.placeholder = currentData.question;
            quizInput.value = '';
            quizFeedback.textContent = '';
            
            quizContainer.style.display = 'block';
            quizContainer.style.visibility = 'visible';
            quizContainer.style.opacity = '1';
            quizContainer.style.zIndex = '9999';
            
            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing quiz input:", e);
                }
            }, 100);
        }

        function showQuizForStates(index, element) {
            currentQuizIndex = index;
            
            const questionText = conceptData[index][3];
            const quizInput = document.getElementById("quizInput");
            const quizFeedback = document.getElementById("quizFeedback");
            const quizContainer = document.getElementById("quizContainer");
            
            quizInput.placeholder = questionText;
            quizInput.value = '';
            quizFeedback.textContent = '';
            
            quizContainer.style.display = 'block';
            quizContainer.style.visibility = 'visible';
            quizContainer.style.opacity = '1';
            quizContainer.style.zIndex = '9999';
            
            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing quiz input:", e);
                }
            }, 100);
        }

        function checkQuizAnswer() {
            if (currentQuizIndex < 0) return;
            
            const quizInput = document.getElementById("quizInput");
            const quizFeedback = document.getElementById("quizFeedback");
            const quizContainer = document.getElementById("quizContainer");
            
            const userAnswer = quizInput.value.trim();
            let correctAnswer, correctAnswerRomanized;
            
            if (isStatesMode) {
                const correctAnswerHTML = conceptData[currentQuizIndex][1];
                correctAnswerRomanized = conceptData[currentQuizIndex][2];
                correctAnswer = correctAnswerHTML.replace(/<[^>]*>/g, '');
            } else {
                const currentData = transitionsData[currentQuizIndex];
                correctAnswer = currentData.targetLanguage;
                correctAnswerRomanized = currentData.romanized;
            }

            if (userAnswer === correctAnswer || 
                userAnswer.toLowerCase() === correctAnswer.toLowerCase() ||
                userAnswer === correctAnswerRomanized ||
                userAnswer.toLowerCase() === correctAnswerRomanized.toLowerCase()) {
                
                quizFeedback.textContent = 'Correct!';
                quizFeedback.style.color = 'green';
                
                if (isStatesMode) {
                    const stateKey = `state_${currentQuizIndex}`;
                    learnedItems.add(stateKey);
                    
                    const textBox = textBoxElements[currentQuizIndex];
                    if (textBox) {
                        textBox.classList.add('learned');
                        const div = textBox.querySelector('div');
                        if (div) div.innerHTML = conceptData[currentQuizIndex][2]; // Show TLR
                    }
                    
                    setTimeout(() => { quizContainer.style.display = 'none'; }, 1500);
                } else {
                    learnedItems.add(currentQuizIndex);
                    
                    const positionPercent = transitionsData[currentQuizIndex].positionPercent;
                    const isDecline = positionPercent < 50;
                    
                    if (isDecline && !addedDeclineItems[currentQuizIndex]) {
                        addLearnedToArray(currentQuizIndex, true);
                    } else if (!isDecline && !addedDegradedItems[currentQuizIndex]) {
                        addLearnedToArray(currentQuizIndex, false);
                    }
                    
                    const slidingText = document.getElementById('slidingText');
                    const interactiveText = document.getElementById('interactiveText');
                    slidingText.textContent = "Learned! Permanent decline mastered";
                    interactiveText.classList.add('learned');
                    
                    setTimeout(() => {
                        quizContainer.style.display = 'none';
                        
                        let nextIndex = currentDataIndex;
                        let attempts = 0;
                        do {
                            nextIndex = (nextIndex + 1) % transitionsData.length;
                            attempts++;
                        } while (learnedItems.has(nextIndex) && attempts < transitionsData.length);
                        
                        if (attempts < transitionsData.length) {
                            currentDataIndex = nextIndex;
                            const newPositionPercent = transitionsData[nextIndex].positionPercent;
                            const newPosition = getPositionFromPercent(newPositionPercent);
                            let newOffset = Math.max(5, Math.min(95, (newPosition / pathLength) * 100));
                            slidingText.setAttribute('startOffset', `${newOffset}%`);
                            interactiveText.classList.remove('learned');
                            setLevel(1);
                        } else {
                            slidingText.textContent = "All decline transitions mastered!";
                            interactiveText.classList.remove('learned');
                        }
                    }, 2000);
                }
            } else {
                quizFeedback.textContent = 'Try again';
                quizFeedback.style.color = 'red';
            }
        }

        function addLearnedToArray(index, isDecline) {
            const currentData = transitionsData[index];
            const itemElement = document.createElement('div');
            itemElement.className = 'vocabulary-item';
            
            const processDiv = document.createElement('div');
            processDiv.className = 'concept-ref';
            processDiv.textContent = currentData.process;
            
            const rowDiv = document.createElement('div');
            rowDiv.className = 'learned-row';
            
            const targetDiv = document.createElement('div');
            targetDiv.className = 'target-language-learned';
            targetDiv.textContent = currentData.targetLanguage;
            
            const romanizedDiv = document.createElement('div');
            romanizedDiv.className = 'romanized-learned';
            romanizedDiv.textContent = currentData.romanized;
            
            const sourceDiv = document.createElement('div');
            sourceDiv.className = 'source-language-learned';
            sourceDiv.textContent = currentData.sourceLanguage;
            
            [targetDiv, romanizedDiv, sourceDiv].forEach(div => {
                div.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
            });
            
            rowDiv.appendChild(targetDiv);
            rowDiv.appendChild(romanizedDiv);
            rowDiv.appendChild(sourceDiv);
            itemElement.appendChild(processDiv);
            itemElement.appendChild(rowDiv);
            
            if (isDecline) {
                const declineItems = document.getElementById("decline-items");
                declineItems.appendChild(itemElement);
                addedDeclineItems[currentDataIndex] = true;
            } else {
                const degradedItems = document.getElementById("degraded-items");
                degradedItems.appendChild(itemElement);
                addedDegradedItems[currentDataIndex] = true;
            }
        }

        function handleSlidingTextClick(e) {
            if (isStatesMode || hasMoved) return;
            e.preventDefault();
            e.stopPropagation();
            progressLevel();
        }

        let isDragging = false;
        let currentPathPosition = 0.05;
        
        function startDrag(e) {
            if (!isStatesMode) return;
            
            isDragging = true;
            const frame = document.getElementById('draggableFrame');
            frame.classList.add('dragging');
            frame.style.cursor = 'grabbing';
            
            e.preventDefault();
            e.stopPropagation();
        }
        
        function dragMove(e) {
            if (!isDragging || !isStatesMode) return;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            
            try {
                const svg = document.getElementById('svgCanvas');
                const declineCurve = document.getElementById('declineCurve');
                
                const svgPoint = svg.createSVGPoint();
                svgPoint.x = clientX;
                svgPoint.y = 0;
                const transformedPoint = svgPoint.matrixTransform(svg.getScreenCTM().inverse());
                const svgX = transformedPoint.x;
                
                let bestPosition = 0;
                let minDistance = Infinity;
                
                for (let i = 0; i <= 100; i++) {
                    const testLength = (i / 100) * pathLength;
                    const testPoint = declineCurve.getPointAtLength(testLength);
                    const distance = Math.abs(testPoint.x - svgX);
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        bestPosition = i / 100;
                    }
                }
                
                currentPathPosition = bestPosition;
                
                const curvePoint = declineCurve.getPointAtLength(currentPathPosition * pathLength);
                
                const frame = document.getElementById('draggableFrame');
                const frameWidth = parseFloat(frame.getAttribute('width'));
                const frameHeight = parseFloat(frame.getAttribute('height'));
                
                frame.setAttribute('x', curvePoint.x - frameWidth/2);
                frame.setAttribute('y', curvePoint.y - frameHeight/2);
                
                updateVisibleTextBoxes(curvePoint);
                
            } catch (error) {
                console.error("Error during drag:", error);
            }
            
            e.preventDefault();
            e.stopPropagation();
        }
        
        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                const frame = document.getElementById('draggableFrame');
                frame.classList.remove('dragging');
                frame.style.cursor = 'grab';
                
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        let isTextDragging = false;
        let lastX = 0;
        let textDragThreshold = 5;
        let hasMoved = false;
        
        function startTextDrag(e) {
            if (isStatesMode) return;
            
            isTextDragging = true;
            hasMoved = false;
            lastX = e.clientX || (e.touches && e.touches[0].clientX);
            e.preventDefault();
        }
        
        function textDragMove(e) {
            if (!isTextDragging || isStatesMode) return;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const deltaX = clientX - lastX;
            
            if (Math.abs(deltaX) > textDragThreshold) {
                hasMoved = true;
            }
            
            if (hasMoved) {
                lastX = clientX;
                
                let currentOffset = parseFloat(document.getElementById('slidingText').getAttribute('startOffset')) || 0;
                currentOffset += deltaX * 0.1;
                currentOffset = Math.max(5, Math.min(95, currentOffset));
                
                document.getElementById('slidingText').setAttribute('startOffset', `${currentOffset}%`);
                
                const newDataIndex = getDataIndexAtPosition(currentOffset);
                if (newDataIndex !== currentDataIndex) {
                    currentDataIndex = newDataIndex;
                    currentLevel = 1;
                    setLevel(1);
                }
            }
            
            e.preventDefault();
        }
        
        function endTextDrag() {
            isTextDragging = false;
            setTimeout(() => { hasMoved = false; }, 100);
        }

        function toggleMode() {
            isStatesMode = !isStatesMode;

            // Reset title to the new mode's TLR default — otherwise a
            // learner who had cycled to SL in the old mode would land on
            // an oddly-indexed (possibly nonexistent) state in the new one.
            currentTextIndex = 0;
            document.getElementById('title-box').textContent =
                titleTexts[isStatesMode ? 'states' : 'transitions'][0];
            
            const instructions = document.getElementById('instructions');
            
            if (isStatesMode) {
                document.getElementById('draggableFrame').style.display = 'block';
                document.getElementById('interactiveText').style.display = 'none';
                document.getElementById('display-mode-toggle').style.display = 'block';
                document.getElementById('level-indicator').style.display = 'none';
                document.getElementById('decline-array').style.display = 'none';
                document.getElementById('degraded-array').style.display = 'none';
                if (instructions) instructions.textContent = 'Drag the frame to explore permanent decline!';
                
                createTextBoxes();
                initializeFramePosition();
                
                setTimeout(() => {
                    bringFrameToFront();
                    const frame = document.getElementById('draggableFrame');
                    frame.style.pointerEvents = 'all';
                    frame.style.cursor = 'grab';
                }, 100);
                
            } else {
                document.getElementById('draggableFrame').style.display = 'none';
                document.getElementById('interactiveText').style.display = 'block';
                document.getElementById('display-mode-toggle').style.display = 'none';
                document.getElementById('level-indicator').style.display = 'block';
                document.getElementById('decline-array').style.display = 'block';
                document.getElementById('degraded-array').style.display = 'block';
                if (instructions) instructions.textContent = 'Click or drag the text to learn decline transitions!';
                
                const slidingText = document.getElementById('slidingText');
                slidingText.setAttribute('startOffset', '10%');
                currentLevel = 1;
                setLevel(1);
                
                document.querySelectorAll('.textBox').forEach(box => {
                    if (box && box.parentNode) box.parentNode.removeChild(box);
                });
                textBoxElements = [];
                
                setTimeout(() => {
                    document.getElementById('interactiveText').style.display = 'block';
                }, 50);
            }
            
            document.getElementById('quizContainer').style.display = 'none';
        }

        function switchTitleText() {
            const titleBox = document.getElementById('title-box');
            titleBox.classList.add('hidden');
            setTimeout(() => {
                const modeKey = isStatesMode ? 'states' : 'transitions';
                currentTextIndex = (currentTextIndex + 1) % titleTexts[modeKey].length;
                titleBox.textContent = titleTexts[modeKey][currentTextIndex];
                titleBox.classList.remove('hidden');
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', function() {
            
            try {
                const svg = document.getElementById("svgCanvas");
                const declineCurve = document.getElementById("declineCurve");
                const conceptBackground = document.getElementById("conceptBackground");
                const frame = document.getElementById("draggableFrame");
                const interactiveText = document.getElementById("interactiveText");
                const slidingText = document.getElementById("slidingText");
                const quizCheck = document.getElementById("quizCheck");
                const quizInput = document.getElementById("quizInput");
                const titleBox = document.getElementById("title-box");
                const modeToggleBtn = document.getElementById("modeToggle");
                
                if (!svg || !declineCurve || !frame || !titleBox || !modeToggleBtn || !interactiveText) {
                    console.error("Critical elements missing!");
                    return;
                }
                
                learnedItems = new Set();

                // Title box: TLR by default (matches the vocabulary-item
                // convention — see Conceptionary_Template_Definitions.md).
                // Was previously left showing a static HTML placeholder
                // until the title was clicked; now genuinely defaults to
                // real content from the moment the page loads.
                titleBox.textContent = titleTexts.states[0];
                currentTextIndex = 0;
                addedDeclineItems = new Array(transitionsData.length).fill(false);
                addedDegradedItems = new Array(transitionsData.length).fill(false);
                
                // Generate decline curve: starts high, declines to lowest point, then plateaus
                const curvePoints = [];
                const a = 30, b = 50, c = 15;
                
                // Declining portion (inverted Gaussian left half)
                for (let x = -30; x <= 50; x += 1) {
                    const y = 10 + a * Math.exp(-Math.pow(x - b, 2) / (2 * Math.pow(c, 2)));
                    curvePoints.push(`${x},${y}`);
                }
                
                // Plateau at the degraded level
                const degradedY = 10 + a * Math.exp(-Math.pow(50 - b, 2) / (2 * Math.pow(c, 2)));
                
                for (let x = 51; x <= 130; x += 1) {
                    curvePoints.push(`${x},${degradedY}`);
                }
                
                const declineCurvePath = `M ${curvePoints.join(' L ')}`;
                declineCurve.setAttribute('d', declineCurvePath);
                conceptBackground.setAttribute('d', `${declineCurvePath} L 130,50 L -30,50 Z`);
                pathLength = declineCurve.getTotalLength();

                frame.addEventListener('mousedown', startDrag);
                frame.addEventListener('touchstart', startDrag, { passive: false });
                document.addEventListener('mousemove', dragMove);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
                document.addEventListener('mouseleave', endDrag);
                
                interactiveText.addEventListener('mousedown', startTextDrag);
                interactiveText.addEventListener('touchstart', startTextDrag, { passive: false });
                document.addEventListener('mousemove', textDragMove);
                document.addEventListener('touchmove', textDragMove, { passive: false });
                document.addEventListener('mouseup', endTextDrag);
                document.addEventListener('touchend', endTextDrag);
                
                interactiveText.addEventListener('click', handleSlidingTextClick);
                slidingText.addEventListener('click', handleSlidingTextClick);
                
                document.addEventListener('click', function(e) {
                    const quizContainer = document.getElementById('quizContainer');
                    
                    if (quizContainer.style.display !== 'none' && 
                        !quizContainer.contains(e.target) && 
                        e.target !== interactiveText &&
                        e.target !== slidingText &&
                        !textBoxElements.includes(e.target) &&
                        !textBoxElements.some(tb => tb && tb.contains(e.target))) {
                        
                        quizContainer.style.display = 'none';
                        
                        if (!isStatesMode && currentLevel === 4) {
                            currentLevel = 1;
                            setLevel(1);
                        }
                    }
                });
                
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        const quizContainer = document.getElementById('quizContainer');
                        if (quizContainer.style.display !== 'none') {
                            quizContainer.style.display = 'none';
                            if (!isStatesMode && currentLevel === 4) {
                                currentLevel = 1;
                                setLevel(1);
                            }
                        }
                    }
                });
                
                titleBox.addEventListener('click', switchTitleText);
                modeToggleBtn.addEventListener('click', toggleMode);
                document.getElementById('display-mode-toggle').addEventListener('click', cycleDisplayLevel);
                
                document.getElementById('audio-button').addEventListener('click', function() {
                    if (isStatesMode) {
                        const activeTextBox = textBoxElements.find(tb => tb && tb.classList.contains('active'));
                        if (activeTextBox) {
                            const index = parseInt(activeTextBox.getAttribute('data-index'));
                            playAudio(conceptData[index][1], 'target-language');
                        } else {
                            alert('Move the frame to a position to hear pronunciation');
                        }
                    } else {
                        const currentData = transitionsData[currentDataIndex];
                        playAudio(currentData.targetLanguage, 'target-language');
                    }
                });
                
                quizCheck.addEventListener('click', checkQuizAnswer);
                
                quizInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        checkQuizAnswer();
                    } else if (e.key === 'Escape') {
                        hideQuiz();
                        if (!isStatesMode && currentLevel === 4) {
                            currentLevel = 1;
                            setLevel(1);
                        }
                    }
                });
                
                document.getElementById('toggle-decline').addEventListener('click', function() {
                    toggleArrayVisibility('decline');
                });
                
                document.getElementById('toggle-degraded').addEventListener('click', function() {
                    toggleArrayVisibility('degraded');
                });

                createTextBoxes();
                initializeFramePosition();
                
                setTimeout(() => {
                    bringFrameToFront();
                    frame.style.pointerEvents = 'all';
                    frame.style.cursor = 'grab';
                }, 500);
                
                interactiveText.style.display = 'none';
                document.getElementById('level-indicator').style.display = 'none';
                document.getElementById('quizContainer').style.display = 'none';
                document.getElementById('decline-array').style.display = 'none';
                document.getElementById('degraded-array').style.display = 'none';
                
                setTimeout(() => {
                    const instructions = document.getElementById('instructions');
                    if (instructions) {
                        instructions.classList.add('fade');
                        setTimeout(() => {
                            instructions.style.display = 'none';
                        }, 2000);
                    }
                }, 5000);
                
                
            } catch (error) {
                console.error("Error initializing GPCVN template:", error);
            }
        });
    </script>
