            const on = showAllLayer >= 0;
            const hideAll = (showAllLayer === SHOW_ALL_LAYERS.length);   // the Hide All level: no words at all
            const page = document.querySelector('.a4-page');
            if (page) page.classList.toggle('show-all-on', on);
            showAllBtn.classList.toggle('active', on);
            showAllBtn.textContent = !on ? 'Show All' : (hideAll ? 'Hide All' : 'Show All (' + SHOW_ALL_LAYERS[showAllLayer].label + ')');
            if (!on) return;

            closeQuiz();
            if (isDragging) endDrag();
            if (isDraggingText) endTextDrag();
            if (hideAll) return;   // .show-all-on already hides the frame, state labels, sliding word and note

            showAllGroup = document.createElementNS(SVG_NS, 'g');
            showAllGroup.setAttribute('id', 'showAllLayer');
            const words = [];

            if (isStatesMode) {
                conceptData.forEach(function (row, i) {
                    const point = pathEl.getPointAtLength((row[4] / 100) * pathLength);
                    const cfg = STATE_LABELS[i] || DEFAULT_STATE_LABEL;
                    const t = document.createElementNS(SVG_NS, 'text');
                    t.setAttribute('class', 'showall-word showall-state');
                    t.setAttribute('x', point.x + cfg.dx);
                    t.setAttribute('y', point.y + cfg.dy);
                    t.style.textAnchor = cfg.anchor;   // inline style, not the attribute (CSS specificity)
                    t.setAttribute('data-kind', 'state');
                    t.setAttribute('data-index', i);
                    showAllGroup.appendChild(t);
                    words.push({ kind: 'state', index: i, el: t, tp: null });
                });
            } else {
                transitionsData.forEach(function (row, i) {
                    const t = document.createElementNS(SVG_NS, 'text');
                    t.setAttribute('class', 'showall-word showall-trans');
                    t.setAttribute('data-kind', 'transition');
                    t.setAttribute('data-index', i);
                    const tp = document.createElementNS(SVG_NS, 'textPath');
                    tp.setAttribute('href', '#hybridPath');
                    tp.setAttribute('dy', '-5');            // same lift as the sliding word
                    tp.setAttribute('startOffset', '0%');
                    t.appendChild(tp);
                    showAllGroup.appendChild(t);
                    words.push({ kind: 'transition', index: i, el: t, tp: tp });
                });
            }

            svg.insertBefore(showAllGroup, frame);   // the frame stays last in document order

            // Fill and position the words once they are in the DOM (transition
            // words are measured to centre them in their zones)
            words.forEach(function (w) {
                applyShowAllWord(w);
                w.el.addEventListener('click', function (e) {
                    e.stopPropagation();
                    flipShowAllWord(w);
                });
            });
            showAllWords = words;
            if (!isStatesMode) resolveShowAllTransitionCollisions();   // transitions only - user testing found states mode has no overlap
        }

        function cycleShowAll() {
            showAllLayer = (showAllLayer + 1 > SHOW_ALL_LAYERS.length) ? -1 : showAllLayer + 1;   // ... last layer -> Hide All -> off
            showAllOverride = { state: [], transition: [] };   // the button sets every word afresh
            renderShowAll();
        }

        // ── Mode switching and title ────────────────────────────────────
        function toggleMode() {
            isStatesMode = !isStatesMode;
            updateModeToggleLabel();
            // The title restarts at its default (TLR) view in the new mode
            currentTextIndex = 0;

            if (isStatesMode) {
                frame.style.display = 'block';
                interactiveText.style.display = 'none';
                titleBox.textContent = titleTexts.states[currentTextIndex];

                createTextBoxes();
                initializeFramePosition();

                // The array holds Transitions items only
                vocabularyArray.style.display = 'none';
            } else {
                frame.style.display = 'none';
                interactiveText.style.display = 'block';
                titleBox.textContent = titleTexts.transitions[currentTextIndex];

                document.querySelectorAll('.textBox').forEach(box => {
                    if (box && box.parentNode) box.parentNode.removeChild(box);
                });
                textBoxElements = [];

                slidingTextMode = 0;
                currentOffset = 0;
                slidingText.setAttribute('startOffset', '0%');
                updateTextContent();

                if (vocabularyItems.children.length > 0) vocabularyArray.style.display = 'block';
            }
            closeQuiz();
            if (showAllLayer >= 0) renderShowAll();   // Show All follows the mode
        }

        // ── Reset ──────────────────────────────────────────────────────
        // A full fresh start: the same state as the page's very first load,
        // for a learner who has got stuck (e.g. Show All -> Hide All, with
        // no obvious way back to the states view) or simply wants to start
        // the concept over. Unlike Toggle Mode or Show All, this DOES clear
        // Quiz progress - every state and transition goes back to "not
        // learned", and the Learned Vocabulary list is emptied.
        function resetTemplate() {
            closeQuiz();
            if (isDragging) endDrag();
            if (isDraggingText) endTextDrag();

            showAllLayer = -1;
            showAllOverride = { state: [], transition: [] };
            renderShowAll();   // clears the Show All layer and the .show-all-on class

            statesLearnedItems = new Array(conceptData.length).fill(false);
            transitionsLearnedItems = new Array(transitionsData.length).fill(false);
            addedVocabularyItems = new Array(transitionsData.length).fill(false);
            if (vocabularyItems) vocabularyItems.innerHTML = '';
            arrayCollapsed = false;
            if (toggleVocabularyBtn) toggleVocabularyBtn.textContent = 'Hide All';
            if (vocabularyArray) {
                vocabularyArray.classList.remove('collapsed');
                vocabularyArray.style.display = 'none';
            }

            isStatesMode = true;
            currentTextIndex = 0;
            titleBox.textContent = titleTexts.states[0];
            frame.style.display = 'block';
            interactiveText.style.display = 'none';
            createTextBoxes();
            initializeFramePosition();

            slidingTextMode = 0;
            currentOffset = 0;
            slidingText.setAttribute('startOffset', '0%');

            updateModeToggleLabel();
        }

        function switchTitleText() {
            titleBox.classList.add('hidden');
            setTimeout(() => {
                currentTextIndex = (currentTextIndex + 1) % 3;
                const modeKey = isStatesMode ? 'states' : 'transitions';
                titleBox.textContent = titleTexts[modeKey][currentTextIndex];
                titleBox.classList.remove('hidden');
            }, 500);
        }

        // ── Event wiring ────────────────────────────────────────────────
        function setupEventListeners() {
            // Frame dragging
            frame.addEventListener('mousedown', startDrag);
            frame.addEventListener('touchstart', startDrag, { passive: false });
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);

            // Sliding-text dragging (mousedown/touchstart on the <text>; the
            // <textPath> inside it bubbles up to it)
            interactiveText.addEventListener('mousedown', startTextDrag);
            interactiveText.addEventListener('touchstart', startTextDrag, { passive: false });
            document.addEventListener('mousemove', dragText);
            document.addEventListener('touchmove', dragText, { passive: false });
            document.addEventListener('mouseup', endTextDrag);
            document.addEventListener('touchend', endTextDrag);

            // Mobile tap-to-cycle. Registered on document AFTER endTextDrag, so
            // it runs once isDraggingText has been reset. It replaces the desktop
            // 'click', which never fires on touch here because startTextDrag's
            // preventDefault() suppresses the synthetic click.
            document.addEventListener('touchend', function (e) {
                if (!isDraggingText && !isStatesMode && !hasMovedDuringDrag && interactiveText.contains(e.target)) {
                    toggleTextFormat();
                }
            });
            interactiveText.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                toggleTextFormat();
            });

            // Other UI controls
            if (showAllBtn) {
                showAllBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    cycleShowAll();
                });
            }
            titleBox.addEventListener('click', switchTitleText);
            modeToggleBtn.addEventListener('click', toggleMode);
            if (resetBtn) resetBtn.addEventListener('click', resetTemplate);
            quizCheck.addEventListener('click', checkQuizAnswer);
            quizInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') checkQuizAnswer();
            });

            // Keyboard-avoidance for the Quiz box: window.innerHeight does NOT
            // change when the on-screen keyboard opens, but visualViewport does.
            if (window.visualViewport) {
                const KEYBOARD_HEIGHT_THRESHOLD = 150;
                window.visualViewport.addEventListener('resize', function () {
                    const heightDiff = window.innerHeight - window.visualViewport.height;
                    quizContainer.classList.toggle('keyboard-open', heightDiff > KEYBOARD_HEIGHT_THRESHOLD);
                });
            }

            // Tools menu
            const toolsButton = document.querySelector('.tools-button');
            const toolsDropdown = document.querySelector('.tools-dropdown');
            const fullscreenToggle = document.getElementById('toggleFullscreen');
            const loadConceptBtn = document.getElementById('loadConcept');
            const startQuizBtn = document.getElementById('startQuiz');
            let dropdownOpen = false;

            function closeDropdown() {
                dropdownOpen = false;
                if (toolsDropdown) toolsDropdown.classList.remove('active');
            }

            if (toolsButton) {
                toolsButton.addEventListener('click', function (e) {
                    e.stopPropagation();
                    dropdownOpen = !dropdownOpen;
                    toolsDropdown.classList.toggle('active', dropdownOpen);
                });
            }

            document.addEventListener('click', function (e) {
                if (toolsButton && toolsDropdown &&
                    !toolsButton.contains(e.target) && !toolsDropdown.contains(e.target)) {
                    closeDropdown();
                }
            });

            // Full Screen. NOTE: iOS Safari does not implement the Fullscreen
            // API; the PWA build (display: standalone) is the real fix there.
            if (fullscreenToggle) {
                fullscreenToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (!document.fullscreenElement) {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen().catch(function (err) {
                                console.log('Full screen request failed or unsupported:', err);
                            });
                        }
                        fullscreenToggle.textContent = 'Exit Full Screen';
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                        fullscreenToggle.textContent = 'Full Screen';
                    }
                    closeDropdown();
                });
                // Keep the label right if fullscreen is exited via the browser's own UI
                document.addEventListener('fullscreenchange', function () {
                    fullscreenToggle.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
                });
            }

            if (loadConceptBtn) {
                loadConceptBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    closeDropdown();
                    alert("Load Concept feature will integrate with API to fetch vocabulary for any conceptual spectrum.");
                });
            }

            if (startQuizBtn) {
                startQuizBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    closeDropdown();
                    const currentData = isStatesMode ? conceptData : transitionsData;
                    showQuiz(Math.floor(Math.random() * currentData.length));
                });
            }

            // The array's own Hide All / Show All button (there is no Tools-menu
            // item for the array any more: Hide All clears it off the page).
            if (toggleVocabularyBtn) {
                toggleVocabularyBtn.addEventListener('click', function () {
                    setVocabularyCollapsed(!arrayCollapsed);
                });
            }

            // Document click: close the quiz when the learner clicks elsewhere
            document.addEventListener('click', function (e) {
                // Swallow the one synthetic click that follows a quiz-box drag-release
                if (quizJustDragged) {
                    quizJustDragged = false;
                    return;
                }
                if (quizContainer.style.display !== 'none' &&
                    !quizContainer.contains(e.target) &&
                    !(e.target.classList && e.target.classList.contains('textBox')) &&
                    !interactiveText.contains(e.target)) {

                    closeQuiz();

                    // Back to TLR if the sliding word was sitting at the Quiz step
                    if (!isStatesMode && slidingTextMode === 3) {
                        slidingTextMode = 0;
                        updateTextContent();
                    }
                }
            });

            setupArrayDrag();
            setupQuizDrag();
            setupTitleDrag();
        }

        // ── Learned Vocabulary array: default position + drag anywhere ──────
        // Default spot: 5% across / 2% down the template box (.a4-page). The array is
        // position:fixed so it can be dragged anywhere on the screen, e.g. clear of the
        // quiz box. Once the learner has moved it, it stays where they put it (also
        // across hide/show). It grows downward as entries are added.
        function setupArrayDrag() {
            const arr = document.getElementById('vocabulary-array');
            const list = document.getElementById('vocabulary-items');
            const page = document.querySelector('.a4-page');
            if (!arr) return;
            const ARRAY_DRAG_THRESHOLD_PX = 5;   // below this a press is a click (Hide All, tapping an entry)
            let userMoved = false, dragging = false, moved = false, wasShown = false;
            let offX = 0, offY = 0, startX = 0, startY = 0, activeId = null, justDragged = false;

            function place(left, top) {
                const maxLeft = Math.max(0, window.innerWidth - arr.offsetWidth);
                const maxTop = Math.max(0, window.innerHeight - arr.offsetHeight);
                arr.style.left = Math.min(Math.max(0, left), maxLeft) + 'px';
                arr.style.top = Math.min(Math.max(0, top), maxTop) + 'px';
            }
            function placeDefault() {
                const r = page ? page.getBoundingClientRect()
                               : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
                place(r.left + r.width * 0.05, r.top + r.height * 0.02);
            }
            function updateScrollable() {
                arr.classList.toggle('scrollable', arr.scrollHeight > arr.clientHeight + 1);
            }
            function isShown() { return arr.style.display === 'block'; }
            // Re-place after the content (and so the height) or the window changes; nudged
            // up if the bottom edge would otherwise fall off the screen.
            function refit() {
                if (!isShown()) return;
                if (userMoved) place(parseFloat(arr.style.left) || 0, parseFloat(arr.style.top) || 0);
                else placeDefault();
                updateScrollable();
            }

            // Watch for the array being shown (the JS shows it from several places), and
            // for entries being added, rather than patching every call site.
            new MutationObserver(function () {
                const shown = isShown();
                if (shown && !wasShown) {
                    wasShown = true;
                    if (userMoved) place(parseFloat(arr.style.left) || 0, parseFloat(arr.style.top) || 0);
                    else placeDefault();
                } else if (!shown) {
                    wasShown = false;
                }
                if (shown) updateScrollable();
            }).observe(arr, { attributes: true, attributeFilter: ['style'] });
            if (list) new MutationObserver(refit).observe(list, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });

            window.addEventListener('resize', refit);

            arr.addEventListener('pointerdown', function (e) {
                if (e.button) return;                                          // primary button / touch / pen only
                if (e.target.closest && e.target.closest('button')) return;    // let Hide All click through
                const r = arr.getBoundingClientRect();
                dragging = true; moved = false; activeId = e.pointerId;
                startX = e.clientX; startY = e.clientY;
                offX = e.clientX - r.left; offY = e.clientY - r.top;
            });
            document.addEventListener('pointermove', function (e) {
                if (!dragging || e.pointerId !== activeId) return;
                if (!moved) {
                    if (Math.hypot(e.clientX - startX, e.clientY - startY) < ARRAY_DRAG_THRESHOLD_PX) return;
                    moved = true;
                    arr.classList.add('dragging');
                    try { arr.setPointerCapture(activeId); } catch (_) {}
                }
                place(e.clientX - offX, e.clientY - offY);
                userMoved = true;
                if (e.cancelable) e.preventDefault();
            });
            function endArrayDrag(e) {
                if (!dragging || e.pointerId !== activeId) return;
                dragging = false;
                arr.classList.remove('dragging');
                try { arr.releasePointerCapture(activeId); } catch (_) {}
                if (moved) {
                    // The release fires a click; swallow it so it cannot dismiss the quiz
                    // box, close the Tools menu or toggle an entry (reset after 100ms if none arrives).
                    justDragged = true;
                    setTimeout(function () { justDragged = false; }, 100);
                }
                moved = false;
            }
            document.addEventListener('pointerup', endArrayDrag);
            document.addEventListener('pointercancel', endArrayDrag);
            document.addEventListener('click', function (e) {
                if (justDragged) { justDragged = false; e.stopPropagation(); e.preventDefault(); }
            }, true);
        }

        // ── Quiz box: drag to reposition anywhere on screen ─────────────
        // Grab it from anywhere except the input field and the Check button, so
        // typing and tapping Check still work. Mouse and touch alike.
        function setupQuizDrag() {
            let isDraggingQuiz = false;
            let dragMoved = false;
            let quizDragOffsetX = 0;
            let quizDragOffsetY = 0;

            function quizDragStart(e) {
                if (e.target === quizInput || e.target === quizCheck) return;
                isDraggingQuiz = true;
                dragMoved = false;
                const rect = quizContainer.getBoundingClientRect();
                const point = e.touches ? e.touches[0] : e;
                quizDragOffsetX = point.clientX - rect.left;
                quizDragOffsetY = point.clientY - rect.top;
                // Switch from centred (transform-based) to explicit pixel positioning
                quizContainer.style.left = rect.left + 'px';
                quizContainer.style.top = rect.top + 'px';
                quizContainer.style.transform = 'none';
                quizContainer.classList.add('dragging');
                if (e.touches) e.preventDefault();
            }

            function quizDragMove(e) {
                if (!isDraggingQuiz) return;
                const point = e.touches ? e.touches[0] : e;
                let newLeft = point.clientX - quizDragOffsetX;
                let newTop = point.clientY - quizDragOffsetY;
                const maxLeft = window.innerWidth - quizContainer.offsetWidth;
                const maxTop = window.innerHeight - quizContainer.offsetHeight;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                quizContainer.style.left = newLeft + 'px';
                quizContainer.style.top = newTop + 'px';
                // Remember where the learner put it, so the next quiz opens there
                quizPosition.x = newLeft;
                quizPosition.y = newTop;
                dragMoved = true;
                if (e.touches) e.preventDefault();
            }

            function quizDragEnd() {
                if (!isDraggingQuiz) return;
                isDraggingQuiz = false;
                quizContainer.classList.remove('dragging');
                // A drag-release fires a click at whatever is under the cursor; if that
                // lands just outside the box, the outside-click handler would close the
                // quiz. Flag it so that one click is swallowed.
                if (dragMoved) {
                    quizJustDragged = true;
                    setTimeout(function () { quizJustDragged = false; }, 100);
                }
            }

            quizContainer.addEventListener('mousedown', quizDragStart);
            document.addEventListener('mousemove', quizDragMove);
            document.addEventListener('mouseup', quizDragEnd);

            quizContainer.addEventListener('touchstart', quizDragStart, { passive: false });
            document.addEventListener('touchmove', quizDragMove, { passive: false });
            document.addEventListener('touchend', quizDragEnd);
        }

        // ── Title box: drag to reposition anywhere on screen ────────────
        // A movement threshold lets a short tap still cycle the title text
        // (switchTitleText) while a real drag repositions it and suppresses that click.
        function setupTitleDrag() {
            const tb = document.getElementById('title-box');
            let isDraggingTitle = false;
            let titleHasMoved = false;
            let titleDragStartX = 0;
            let titleDragStartY = 0;
            let titleDragOffsetX = 0;
            let titleDragOffsetY = 0;
            const TITLE_DRAG_THRESHOLD = 8; // screen pixels

            function titleDragStart(e) {
                const point = e.touches ? e.touches[0] : e;
                titleDragStartX = point.clientX;
                titleDragStartY = point.clientY;
                titleHasMoved = false;
                isDraggingTitle = true;
                const rect = tb.getBoundingClientRect();
                titleDragOffsetX = point.clientX - rect.left;
                titleDragOffsetY = point.clientY - rect.top;
            }

            function titleDragMove(e) {
                if (!isDraggingTitle) return;
                const point = e.touches ? e.touches[0] : e;
                const dx = point.clientX - titleDragStartX;
                const dy = point.clientY - titleDragStartY;

                if (!titleHasMoved && Math.hypot(dx, dy) > TITLE_DRAG_THRESHOLD) {
                    titleHasMoved = true;
                    tb.style.position = 'fixed';
                    tb.style.transform = 'none';
                    tb.classList.add('dragging');
                }

                if (titleHasMoved) {
                    let newLeft = point.clientX - titleDragOffsetX;
                    let newTop = point.clientY - titleDragOffsetY;
                    const maxLeft = window.innerWidth - tb.offsetWidth;
                    const maxTop = window.innerHeight - tb.offsetHeight;
                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));
                    tb.style.left = newLeft + 'px';
                    tb.style.top = newTop + 'px';
                    if (e.touches) e.preventDefault();
                }
            }

            function titleDragEnd() {
                isDraggingTitle = false;
                tb.classList.remove('dragging');
            }

            tb.addEventListener('mousedown', titleDragStart);
            document.addEventListener('mousemove', titleDragMove);
            document.addEventListener('mouseup', titleDragEnd);

            tb.addEventListener('touchstart', titleDragStart, { passive: true });
            document.addEventListener('touchmove', titleDragMove, { passive: false });
            document.addEventListener('touchend', titleDragEnd);

            // Capture phase, so this runs before switchTitleText's own
            // (bubble-phase) click listener and can stop it.
            tb.addEventListener('click', function (e) {
                if (titleHasMoved) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true);
        }

        // ── Initialisation ──────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function () {
            try {
                svg = document.getElementById("svgCanvas");
                pathEl = document.getElementById("hybridPath");
                conceptBackground = document.getElementById("conceptBackground");
                titleBox = document.getElementById("title-box");
                modeToggleBtn = document.getElementById("modeToggle");
                resetBtn = document.getElementById("resetBtn");
                frame = document.getElementById("draggableFrame");
                dragInstruction = document.getElementById("drag-instruction");
                interactiveText = document.getElementById("interactiveText");
                slidingText = document.getElementById("slidingText");
                quizContainer = document.getElementById("quizContainer");
                quizInput = document.getElementById("quizInput");
                quizCheck = document.getElementById("quizCheck");
                quizFeedback = document.getElementById("quizFeedback");
                vocabularyArray = document.getElementById("vocabulary-array");
                vocabularyItems = document.getElementById("vocabulary-items");
                toggleVocabularyBtn = document.getElementById("toggle-vocabulary");
                showAllBtn = document.getElementById("showAllBtn");

                if (!svg || !pathEl || !titleBox || !modeToggleBtn || !frame || !interactiveText) {
                    console.error("Critical elements are missing from the DOM");
                    return;
                }

                statesLearnedItems = new Array(conceptData.length).fill(false);
                transitionsLearnedItems = new Array(transitionsData.length).fill(false);
                addedVocabularyItems = new Array(transitionsData.length).fill(false);

                // Build the path and the background fill beneath it
                const pathD = buildPathData();
                pathEl.setAttribute('d', pathD);
                conceptBackground.setAttribute('d', pathD + ' L ' + VB_MAX_X + ',60 L ' + VB_MIN_X + ',60 Z');
                pathLength = pathEl.getTotalLength();

                setupEventListeners();

                titleBox.textContent = titleTexts.states[0];
                createTextBoxes();
                initializeFramePosition();
                updateModeToggleLabel();

                interactiveText.style.display = 'none';
                quizContainer.style.display = 'none';
                vocabularyArray.style.display = 'none';
                slidingText.setAttribute('startOffset', '0%');

                // Fade the instruction after 20 s if the first drag has not already done so
                if (dragInstruction) {
                    setTimeout(() => { dragInstruction.classList.add('fade'); }, 20000);
                }

                console.log("LOG-HTCVS template initialised: " + conceptData.length + " states, " +
                            transitionsData.length + " transitions, path length " + pathLength.toFixed(1));
            } catch (error) {
                console.error("Error initializing application:", error);
            }
        });
    </script>
</body>
