<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Temporary: Curve then Sudden Return (HTCVS) - Logographic Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            overflow: hidden;
        }

        :root {
            /* Named once so .page-wrapper (below) can size itself to match
               this box exactly - see the .page-wrapper rule for why. */
            --page-w: min(90vw, 70vh * 160 / 60);
            --page-h: min(70vh, 90vw * 60 / 160);
        }

        .page-wrapper {
            /* Wraps .a4-page together with its .tools-menu button bar,
               which is now a SIBLING of .a4-page in the HTML rather than a
               child (see the HTML comment where .tools-menu is defined).
               That is what lets the bar render OUTSIDE the frame's own box
               on touch devices - it stops sharing coordinate space with
               the diagram entirely, so it can never again overlap diagram
               content at any viewport width, closing the ~28px shortfall
               that was still possible at the narrowest phones under the
               previous "bottom strip inside the frame" fix.
               Width = --page-w + 10px: .a4-page uses content-box sizing
               with a 5px border on all sides, so its full rendered
               (border-box) width is --page-w + 10px; matching that here is
               what keeps this wrapper's centring (via the body's flexbox)
               pixel-identical to when .a4-page was centred directly. */
            position: relative;
            width: calc(var(--page-w) + 10px);
        }

        .template-id-badge {
            /* Build/test-phase only: tells YOU which template file you're
               looking at (there is no other visual cue once the title box
               still reads its generic placeholder text). A language
               learner has no reason to ever know the internal template
               code name, so index.html's injectAndOpen() strips this whole
               element out of the HTML before the live, LLM-populated page
               is ever opened - see the html.replace() call right before
               the Blob is created. If you're seeing this, you're looking
               at the raw generic file directly, which is exactly when
               it's useful. */
            text-align: center;
            font-family: monospace;
            font-size: 11px;
            color: #999;
            padding: 2px 0 4px;
            user-select: none;
        }

        .a4-page {
            /* Locked to the SVG viewBox's exact 160:60 ratio so the curve
               always reaches the frame edges (same approach as the GTCV
               family). content-box is deliberate: the width/height apply
               to the content area the SVG actually fills. */
            width: var(--page-w);
            height: var(--page-h);
            border: 5px solid black;
            background-color: white;
            box-sizing: content-box;
            position: relative;
            touch-action: none;
            z-index: 1;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .path-line {
            stroke: black;
            stroke-width: 0.25;
            fill: none;
        }

        /* Background gradient: sky blue while the concept builds, dark grey
           for the "normal" baseline on either side of it, with a hard edge
           at the sudden drop. */
        #conceptBackground {
            fill: url(#conceptGradient);
            opacity: 0.2;
        }

        /* States Template Elements.
           Hidden labels have pointer-events:none so an invisible label can
           never swallow a click meant for whatever is underneath it. */
        .textBox {
            cursor: pointer;
            font-size: 0.2em;
            fill: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5);
            text-anchor: middle;
        }

        .textBox.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1) translateY(0);
        }

        /* Learned items stay visible */
        .textBox.learned {
            opacity: 1;
            pointer-events: all;
            transform: scale(1) translateY(0);
            fill: green;
        }

        #draggableFrame {
            cursor: grab;
            fill: rgba(255, 255, 0, 0.6);
            stroke: #ccaa00;
            stroke-width: 0.1;
            pointer-events: all;
            opacity: 1;
            filter: drop-shadow(0 0.3px 0.5px rgba(0,0,0,0.3));
            transition: fill 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease, filter 0.2s ease;
        }

        #draggableFrame:hover {
            fill: rgba(255, 255, 0, 0.8);
            stroke: #ffcc00;
            stroke-width: 0.15;
            cursor: grab;
            filter: drop-shadow(0 0.5px 1px rgba(204, 170, 0, 0.6)) drop-shadow(0 0 2px rgba(255, 255, 100, 0.8));
        }

        #draggableFrame.dragging {
            cursor: grabbing;
            fill: transparent;
            stroke-width: 0.1;
            filter: drop-shadow(0 0.5px 1px rgba(255, 170, 0, 0.6)) drop-shadow(0 0 2px rgba(255, 220, 0, 0.8));
            stroke: #ffaa00;
        }

        @keyframes pulsateAttention {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .drag-instruction {
            /* Left-middle of the page: clear of the path start (bottom
               left), of the title box (right) and of the curve. It fades
               after 20 s or on the first drag. */
            position: absolute;
            top: 28%;
            left: 4%;
            font-size: 0.85em;
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 3;
            opacity: 1;
            transition: opacity 2s ease;
            text-align: left;
            max-width: 34%;
            animation: pulsateAttention 0.6s ease-in-out 3;
        }

        .drag-instruction.fade {
            opacity: 0;
            pointer-events: none;
        }

        /* Transitions Template Elements */
        .sliding-text {
            font-size: 3.5px;
            font-weight: bold;
            fill: blue;
            cursor: grab;
            dominant-baseline: auto;
            pointer-events: all;
        }

        .sliding-text.dragging {
            cursor: grabbing;
            fill: darkorange;
        }

        .sliding-text.learned {
            fill: green;
        }

        /* Common Title Box Styling. Default spot: the empty ground area
           below the baseline, to the right of the sudden drop - clear of
           every state label, the enlarged Tools button on phones, the
           Learned Vocabulary array (top left) and the sliding word. */
        .title-box {
            position: absolute;
            top: 70%;
            left: 84%;
            transform: translateX(-50%);
            width: max-content;   /* else the space right of left:84% (16%) squeezes it into a narrow tall box */
            max-width: 26%;
            box-sizing: border-box;
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            cursor: grab;
            border: 1px solid black;
            padding: 10px;
            background-color: white;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .title-box.dragging {
            cursor: grabbing;
            transition: none;
        }

        .title-box.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }

        /* Mode Toggle Button: lives in the top-right column, directly below
           Show All (it used to sit bottom-centre) */
        .mode-toggle {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.8em;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Reset: a full fresh start (position, Show All, Quiz progress) for
           a learner who has got stuck or wants to start the concept over.
           Kept visible next to Toggle Mode, not tucked inside Tools, so
           it's easy to find when frustrated. */
        .reset-btn {
            background-color: #fff4e0;
            border: 1px solid #e0a030;
            border-radius: 4px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.8em;
            cursor: pointer;
            white-space: nowrap;
            color: #8a5a00;
        }

        .reset-btn:hover {
            background-color: #ffe6b3;
        }

        /* Quiz container styles */
        .quiz-container {
            box-sizing: border-box;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 3px solid #3366cc;
            border-radius: 4px;
            padding: 12px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 360px;
            width: 360px;
            pointer-events: auto;
            visibility: visible;
            opacity: 1;
            cursor: grab;
            user-select: none;
        }

        .quiz-container.dragging {
            cursor: grabbing;
        }

        .quiz-container input {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: text;
            user-select: text;
        }

        .quiz-container button {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            background-color: #3366cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-container button:hover {
            background-color: #254e9c;
        }

        #quizFeedback {
            text-align: center;
            font-weight: bold;
            margin-top: 8px;
            min-height: 20px;
        }

        /* Applied via JS (visualViewport) when the on-screen keyboard is
           open: pins the quiz box near the top of the space still visible. */
        .quiz-container.keyboard-open {
            top: 8px;
            transform: translate(-50%, 0);
            max-width: 90vw;
            width: 320px;
            padding: 8px;
        }

        .quiz-container.keyboard-open input {
            font-size: 13px;
            padding: 6px;
            margin-bottom: 6px;
        }

        .quiz-container.keyboard-open #quizFeedback {
            min-height: 14px;
            margin-top: 4px;
        }

        /* Spelling-convention note in the Quiz box (from answerConfig.
           diacritic_instructions): how to type accented letters. Empty for
           languages that need no note, in which case it takes no space. */
        .quiz-diac-note {
            font-size: 11px;
            line-height: 1.35;
            color: #555;
            text-align: left;
            margin-bottom: 8px;
        }

        .quiz-diac-note:empty {
            display: none;
        }

        .quiz-container.keyboard-open .quiz-diac-note {
            font-size: 10px;
            margin-bottom: 4px;
        }

        /* Vocabulary array: ONE combined "Learned Vocabulary" list, kept in
           path order. This concept has a gradual increasing progression but
           no decreasing one (the return is a single sudden drop), so the
           Increasing/Decreasing split used by the GTCV family has no
           meaning here. Behaviour matches the Instant Change family. */
        .vocabulary-array {
            position: fixed;
            top: 2%;
            width: 22.5vw;
            max-height: calc(100vh - 40px);   /* grows with its content; only the screen height caps it */
            overflow-y: auto;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px;
            z-index: 4;
            display: none;
            touch-action: none;
        }

        #vocabulary-array {
            left: 5%;   /* fallback only: setupArrayDrag() places it at 5% across / 2% down the template box */
        }

        .vocabulary-array.scrollable {
            touch-action: pan-y;
        }

        .vocabulary-array.dragging {
            user-select: none;
            -webkit-user-select: none;
            opacity: 0.85;
        }

        /* .array-header wraps .array-title + the Hide All button in a flex
           row. It used to be just .array-title, with the button absolutely
           positioned on top of its top-right corner - fine on a wide
           desktop sidebar, but on a narrow phone .vocabulary-array's width
           (22.5vw) shrinks to under 90px while the Hide All button (bumped
           to a 48px touch target under the coarse-pointer rule below) is
           itself ~83px wide, so the button covered nearly the whole title.
           Putting them side by side in a real flex row means there is no
           position left for them to occupy at the same time - the title
           just wraps to a second line on the narrowest phones instead. */
        .array-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            transition: margin-bottom 0.6s ease-in-out;
        }

        .vocabulary-array.collapsed .array-header {
            margin-bottom: 0;
        }

        .array-title {
            flex: 1;
            min-width: 0;   /* lets the text wrap/shrink instead of forcing the row wider */
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
            padding: 5px;
            background-color: #e8f4fd;
            border-radius: 3px;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .vocabulary-array.dragging .array-title {
            cursor: grabbing;
        }

        .vocabulary-item {
            display: flex;
            flex-direction: column;
            font-size: 0.75em;
            margin: 5px 0;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background-color: white;
        }

        /* Each learned entry shows all three layers, in click-cycle order:
           TLR (bold, what the learner is quizzed on) -> TL -> SL. */
        .vocabulary-item .target-language-roman {
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .vocabulary-item .target-language {
            color: #2c5aa0;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .vocabulary-item .source-language {
            color: #666;
            cursor: pointer;
        }

        .vocabulary-item .target-language-roman.hidden,
        .vocabulary-item .target-language.hidden,
        .vocabulary-item .source-language.hidden {
            color: transparent;
            user-select: none;
            background-color: #f0f0f0;
        }

        .toggle-visibility {
            /* No longer position: absolute - see .array-header above. flex:
               none keeps it its own natural size instead of sharing space
               with .array-title's flex: 1. */
            flex: none;
            font-size: 0.65em;
            padding: 3px 8px;
            background-color: #e0e0e0;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
        }

        /* Tools Menu */
        .tools-menu {
            /* .tools-menu is now a sibling of .a4-page, not a child
               (see the HTML). Its containing block for this absolute
               rule is therefore .page-wrapper, not .a4-page - and
               .page-wrapper is 10px wider/taller than .a4-page's own
               content box (its border-box, see .page-wrapper's
               comment). right here is bumped by the 5px border so
               it reproduces the exact desktop pixel position this had
               when it was measured from .a4-page's content edge
               directly - verified pixel-for-pixel against the
               pre-restructure layout. top is left as it was: a fixed
               10px gets the same +5px bump, but a percentage (used by
               the *I variants to sit "just below the baseline") is
               already just an approximate visual anchor, and the ~1%
               drift from the taller containing block is imperceptible. */
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 5;
            display: flex;              /* Tools button, with Show All directly beneath it */
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .tools-button {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.8em;
            cursor: pointer;
        }

        /* Show All and Toggle Mode: one under the other on a desktop. On a
           touch screen (see the coarse-pointer block) they sit side by side,
           so the whole column stays short enough to clear the labels
           right of the sudden drop. */
        .tools-row {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .show-all-btn {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.8em;
            cursor: pointer;
            white-space: nowrap;
        }

        .show-all-btn.active {
            background-color: #d6e8ff;
            border-color: #3366cc;
            font-weight: bold;
        }

        /* Show All (quick reference). While it is on, the interactive pieces
           (frame, state boxes, sliding word, instruction) step aside and every
           word of the current mode is displayed at once in one language
           layer. !important because toggleMode() sets inline display styles. */
        .show-all-on #draggableFrame,
        .show-all-on .textBox,
        .show-all-on #interactiveText,
        .show-all-on #drag-instruction {
            display: none !important;
        }

        .showall-word {
            cursor: pointer;   /* click a word to flip it between TL and SL (no Quiz) */
            user-select: none;
            -webkit-user-select: none;
            pointer-events: all;   /* future audio: mouseover / tap a word to hear it */
        }

        .showall-state {
            /* Fixed SVG unit, not em - and NOT simply "whatever 0.2em
               used to compute to" either. Measured directly: despite
               getComputedStyle reporting 0.2em as 6px on desktop, the
               words' ACTUAL rendered glyph size (getComputedTextLength/
               getBBox, i.e. what really painted) was consistently ~1.88x
               SMALLER than a literal 6px - a genuine Chromium quirk where
               em-sized SVG <text> created via createElementNS resolves
               against a stale/default font context at paint time, not the
               value getComputedStyle later reports. 3.5px reproduces the
               size that was ACTUALLY being rendered all along (already
               proven overlap-free at desktop/small in testing), and - like
               .showall-trans below - needs no separate touch-viewport
               value, which removes the 0.3em touch bump that was the real
               cause of the narrow-viewport overlap this was fixing. */
            font-size: 3.5px;
            font-weight: bold;
        }

        .showall-trans {
            font-size: 3.5px;
            font-weight: bold;
        }

        /* Show All (Transitions): a word whose default placement would
           overlap a neighbour is shrunk by resolveShowAllTransitionCollisions()
           below, in the same pass that also tries moving it below the path. */
        .showall-trans.shrink {
            font-size: 2px;
        }

        .showall-trans.shrink2 {
            font-size: 1.3px;
        }

        .showall-word.layer-tl  { fill: #0b3d91; }
        .showall-word.layer-tlr { fill: #5b2c83; }
        .showall-word.layer-sl  { fill: #8b1a1a; }

        .tools-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 30px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 150px;
            padding: 5px 0;
            z-index: 10;
        }

        .tools-dropdown.active {
            display: block;
        }

        .tool-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            pointer-events: auto;
            user-select: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .tool-item:hover {
            background-color: #f5f5f5;
        }

        /* ── Mobile sizing (touch-primary devices) ─────────────────────
           Frame circle doubled (r 1.5 -> 3); text sizes as in the GTCV
           family; touch targets enlarged to the ~48px guideline. */
        @media (pointer: coarse) {
            body {
                /* Safety net for the restructured .tools-menu (see its
                   comment above): it is now a normal in-flow sibling below
                   .a4-page on touch devices, so .page-wrapper's rendered
                   height is .a4-page's height PLUS the button bar's own
                   height. On most phones that total still fits under the
                   fixed 100vh body, but on short/landscape viewports it can
                   exceed it - and with the desktop rule's height: 100vh +
                   overflow: hidden still active, the overflow would be
                   clipped symmetrically by the centering flexbox, cutting
                   the Tools bar off along with it and making it completely
                   unreachable (no scroll available to get to it). Letting
                   the body grow to its content and scroll instead is what
                   guarantees the bar can always be reached, at any
                   viewport height. */
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
                overflow-x: hidden;
            }
            #draggableFrame {
                r: 3;
            }
            .textBox {
                font-size: 0.3em;
            }
            /* .showall-state intentionally NOT bumped here any more - see
               the base rule above. */
            .sliding-text {
                font-size: 3.5px;
            }
            .title-box {
                font-size: 0.75em;
                padding: 6px 8px;
                max-width: 30%;
            }
            /* Button column moved from its desktop top-right corner to a
               full-width row along the BOTTOM on touch devices. Squeezing
               the column narrow (the old max-width: 34% approach) was not
               enough to keep it clear of the diagram - user testing on a
               real phone still found the Show All button sitting on top of
               path text near the curve's own busy areas. A centred bottom
               strip sits in the buffer zone already reserved for the
               watermark and for "below path" Show All placements, so it is
               structurally clear of diagram content instead of relying on
               there happening to be enough room. Desktop is untouched -
               everything below is coarse-pointer only. */
            .tools-dropdown {
                top: auto;
                bottom: 52px;   /* opens upward now, above the enlarged Tools button */
                left: 50%;
                right: auto;
                transform: translateX(-50%);   /* centred under the bar, not tied to where Tools lands in it */
            }
            .tools-menu {
                /* Switched from absolute to relative: .tools-menu is now a
                   normal in-flow block sibling below .a4-page (see the
                   HTML), so it needs to stay IN flow to actually push
                   itself below the frame and grow .page-wrapper's height
                   to fit - "static" would do that too, but "relative"
                   additionally keeps .tools-menu itself as the positioning
                   context for .tools-dropdown's own absolute rule (below),
                   exactly as it always was. No more manual bottom/clearance
                   math needed - it structurally cannot overlap the frame
                   any more, at any width. */
                position: relative;
                /* top/right MUST be reset here: the desktop rule above
                   sets top: 15px; right: 15px; for the (unrelated)
                   position: absolute placement, and those two properties
                   are NOT reset by switching position to relative - they
                   cascade straight through and get reinterpreted as
                   relative-offset shifts (found via testing: without this,
                   the bar rendered 15px lower than intended, floating with
                   a gap below the frame instead of sitting flush under it).
                   auto on a relative element means "no offset on this
                   axis", which is what an in-flow bar needs. */
                top: auto;
                right: auto;
                margin-top: 8px;
                max-width: 100%;
                flex-direction: row;
                align-items: center;
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: center;
                padding: 0 4px 4px;   /* room for the scrollbar/thumb without clipping button borders */
            }
            .tools-row {
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: center;
                /* Rendered first (left) in the bottom bar - Show All, Toggle
                   and Reset are what a learner actually needs during
                   practice, so they should be reachable without scrolling.
                   Tools (Full Screen / Load Concept / Start Quiz) is used
                   far less often and is fine sitting after them. */
                order: 1;
            }
            .tools-button {
                order: 2;
                flex: none;   /* never shrunk to make room for tools-row */
            }
            .tools-button,
            .show-all-btn,
            .mode-toggle,
            .reset-btn {
                box-sizing: border-box;   /* so min-height 48px is the real height */
                min-height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
                /* Padding trimmed to what the text needs - min-height above
                   already guarantees the full 48px touch target, so the old
                   12px top/bottom padding on top of that was pure excess
                   (reported in user testing as ~30% empty space above and
                   below the button text). */
                padding: 4px 16px;
                font-size: 1em;
            }
            .show-all-btn,
            .mode-toggle,
            .reset-btn {
                padding: 4px 10px;
                font-size: 0.85em;
            }
            /* Narrow phones (landscape ~ 667px): keep squeezing so the row
               still fits without excessive wrapping */
            @media (max-width: 760px) {
                .show-all-btn,
                .mode-toggle,
                .reset-btn {
                    padding: 4px 7px;
                    font-size: 0.75em;
                }
            }
            .tool-item {
                min-height: 48px;
                padding: 14px 15px;
                font-size: 0.95em;
            }
            .toggle-visibility {
                min-height: 48px;
                min-width: 48px;
                padding: 12px 16px;
                font-size: 0.9em;
            }
            /* 22.5vw (the desktop sidebar width) is under 90px on a phone -
               too narrow for "Learned Vocabulary" beside a 48px-tall Hide
               All button without the title wrapping down to one word per
               line (found in testing once the overlap above was fixed: no
               more overlap, but the title text was squeezed to ~10px wide).
               Wider here gives both room to sit on one line on anything but
               the narrowest phones, and to wrap sensibly on those. */
            .vocabulary-array {
                width: min(65vw, 280px);
            }
        }
    </style>
</head>
<body>
    <!-- .page-wrapper: groups the diagram frame with its Tools /
         Show All / Toggle / Reset button bar so the bar can render
         OUTSIDE the frame's own box on touch devices (see the
         .tools-menu coarse-pointer override in <style> above) instead
         of overlapping diagram content - the root cause of the Show
         All button blocking text that user testing found on narrow
         phones (states TL7, transitions T6). See .page-wrapper /
         .a4-page / .tools-menu in <style> for the full picture. -->
    <div class="page-wrapper">
    <div class="template-id-badge">LOG-HTCVS</div>
    <div class="a4-page">
        <div id="title-box" class="title-box">TL-Title / SL-Title</div>
        <div id="drag-instruction" class="drag-instruction">Mobile Phone users: click 'Tools' then 'Full Screen'.<br><br>Click on it, grab it and move it around.<br>Click on the words - and click again.</div>

        <!-- Vocabulary Array: ONE combined list of learned Transitions items, kept in path order -->
        <div id="vocabulary-array" class="vocabulary-array">
            <div class="array-header">
                <div class="array-title">Learned Vocabulary</div>
                <button class="toggle-visibility" id="toggle-vocabulary">Hide All</button>
            </div>
            <div id="vocabulary-items"></div>
        </div>

        <svg id="svgCanvas" viewBox="-30 0 160 60" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="conceptGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
                    <stop offset="66.67%" style="stop-color:#87ceeb;stop-opacity:1" />
                    <stop offset="66.67%" style="stop-color:#4a4a4a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
                </linearGradient>
            </defs>

            <path id="hybridPath" class="path-line"></path>
            <path id="conceptBackground"></path>

            <!-- States Mode Elements -->
            <circle id="draggableFrame" cx="-28.5" cy="40" r="1.5"/>

            <!-- Transitions Mode Elements -->
            <text id="interactiveText" class="sliding-text">
                <textPath id="slidingText" href="#hybridPath" startOffset="0%" dy="-5">
                    TL-T1
                </textPath>
            </text>
        </svg>
        <div class="watermark">
            &copy; 2026 Alan William Preston
        </div>
    </div>

    <!-- Tools Menu: now a SIBLING of .a4-page, not a child (see the
         .page-wrapper comment above). Desktop keeps its old top-right
         overlay position (position: absolute, visually unchanged);
         touch devices render it as a normal block below the frame
         instead (see the coarse-pointer override in <style>). -->
    <div class="tools-menu">
        <div class="tools-button">Tools</div>
        <div class="tools-dropdown">
            <div class="tool-item" id="toggleFullscreen">Full Screen</div>
            <div class="tool-item" id="loadConcept">Load Concept</div>
            <div class="tool-item" id="startQuiz">Quick Quiz</div>
        </div>
        <div class="tools-row">
            <button id="showAllBtn" class="show-all-btn" type="button" title="Quick reference: show every word at once, in TL, TLR or SL. Click any word to flip just that word to the next layer. Keep clicking to reach Hide All, which clears every word off the screen.">Show All</button>
            <button id="modeToggle" class="mode-toggle" type="button">Show Transitions</button>
            <button id="resetBtn" class="reset-btn" type="button" title="Start this concept over from the beginning: clears Quiz progress and returns to the start of the line.">Reset</button>
        </div>
    </div>
    </div>

    <!-- Quiz Container -->
    <div id="quizContainer" class="quiz-container">
        <input type="text" id="quizInput" placeholder="Enter the TLR word">
        <div id="quizDiacriticNote" class="quiz-diac-note"></div>
        <button id="quizCheck">Check</button>
        <div id="quizFeedback"></div>
    </div>

    <script>
        // ════════════════════════════════════════════════════════════════
        // LOG-HTCVS - Hybrid Temporary: Curve rise, then Sudden return
        // LOGOGRAPHIC version (4 steps: TLR -> TL -> SL -> Quiz). Built from the
        // tested ROM-HTCVS by adding the TLR layer: every data row gains a TLR
        // in column [0], so every other column moves up by one. The Quiz tests
        // the TLR (learners cannot type logographic characters).
        //
        // The left half of a GTCV curve (gradual, continuous build) meets
        // the right half of an IT5L (sudden drop straight back to the
        // starting condition). Read left to right:
        //   1. flat baseline (the "normal" state)
        //   2. a smooth curve rising to a SHARP apex (no plateau)
        //   3. an instant vertical drop back to the baseline
        //   4. the baseline again, to the right edge
        //
        // GEOMETRY. viewBox -30 0 160 60, baseline y=40, apex y=10.
        // The rising curve is GTCV's left half stretched horizontally by
        // 4/3 (GTCV: apex at x=50, c=15  ->  here: apex at x=76.67, c=20),
        // so the apex sits 2/3 of the way across, where IT5L's drop sits.
        // Path length ~198.8 units: curve ~58.1%, drop ~15.1%, baseline
        // ~26.8%. If any of the constants below change, the position
        // numbers in the two data arrays must be recomputed.
        //
        // DATA. Position = percent along the WHOLE path (length), not x.
        //   States rows       [TLR, TL, SL, Quiz prompt, position]
        //     9 states: 6 on the rise (position 5 ... 58.09; the last one
        //     IS the apex), 2 on the sudden drop (halfway down = 65.63, and
        //     the bottom = 73.18) and 1 halfway along the baseline that
        //     follows it (86.59).
        //   Transitions rows  [TLR, TL, SL, Quiz prompt, zoneStart, zoneEnd]
        //     7 transitions: five gradual verbs on the rise, one for the
        //     whole of the sudden drop (58.09 - 73.18) and one spanning the
        //     whole of the baseline after it (73.18 - 100). Each zone is the
        //     stretch of path over which that item shows while the sliding
        //     word's START is inside it; zones run 0-100 with no gaps.
        //   Column [0] is ALWAYS TLR (what the Quiz tests), [1] TL, [2] SL.
        // ════════════════════════════════════════════════════════════════
        const SVG_NS = "http://www.w3.org/2000/svg";
        const VB_MIN_X = -30;
        const VB_MAX_X = 130;
        const BASELINE_Y = 40;
        const APEX_HEIGHT = 30;     // apex is at y = BASELINE_Y - APEX_HEIGHT = 10
        const APEX_X = 76.67;       // 2/3 across the viewBox; the drop is at this x
        const CURVE_WIDTH_C = 20;   // GTCV's c=15 stretched by 4/3
        const CURVE_STEPS = 107;    // ~1 viewBox unit per step
        const MAX_TEXT_OFFSET_FALLBACK = 95;

        // Generic placeholder data - 9 states (6 rising incl. the apex, 2 on the drop, 1 on the baseline after it)
        const conceptData = [
            ["TLR1", "TL1", "SL1", "What is the TLR word for 'SL1'?", 5],        // flat lead-in: the normal state
            ["TLR2", "TL2", "SL2", "What is the TLR word for 'SL2'?", 20],
            ["TLR3", "TL3", "SL3", "What is the TLR word for 'SL3'?", 33],       // the rise begins
            ["TLR4", "TL4", "SL4", "What is the TLR word for 'SL4'?", 42],
            ["TLR5", "TL5", "SL5", "What is the TLR word for 'SL5'?", 50],
            ["TLR6", "TL6", "SL6", "What is the TLR word for 'SL6'?", 58.09],    // THE APEX (end of the curve)
            ["TLR7", "TL7", "SL7", "What is the TLR word for 'SL7'?", 65.63],    // halfway down the sudden drop ("in free fall")
            ["TLR8", "TL8", "SL8", "What is the TLR word for 'SL8'?", 73.18],    // the bottom of the drop (landing)
            ["TLR9", "TL9", "SL9", "What is the TLR word for 'SL9'?", 86.59]     // halfway along the baseline after the drop: back to normal
        ];

        // 7 transitions: five gradual (the rise), one for the whole sudden drop and one for the whole baseline after it
        const transitionsData = [
            ["TLR-T1", "TL-T1", "SL-T1", "What is the TLR word for 'SL-T1'?", 0, 20],
            ["TLR-T2", "TL-T2", "SL-T2", "What is the TLR word for 'SL-T2'?", 20, 33],
            ["TLR-T3", "TL-T3", "SL-T3", "What is the TLR word for 'SL-T3'?", 33, 42],
            ["TLR-T4", "TL-T4", "SL-T4", "What is the TLR word for 'SL-T4'?", 42, 50],
            ["TLR-T5", "TL-T5", "SL-T5", "What is the TLR word for 'SL-T5'?", 50, 58.09],
            ["TLR-T6", "TL-T6", "SL-T6", "What is the TLR word for 'SL-T6'?", 58.09, 73.18],  // the whole sudden drop
            ["TLR-T7", "TL-T7", "SL-T7", "What is the TLR word for 'SL-T7'?", 73.18, 100]     // the whole baseline after the drop
        ];

        // Where each state's label sits relative to its point on the path.
        // Hand-tuned so labels do not overlap each other or the curve: the
        // lead-in labels alternate below/above the flat baseline, the rising
        // labels stack diagonally up and to the left of the curve, the apex
        // label sits above the apex. The two drop labels sit beside the vertical
        // line: halfway down on its right, the bottom one on its left just above
        // the baseline (clear of the title box below-right and of the Toggle
        // Mode button below). States beyond these nine use the default.
        const STATE_LABELS = [
            { dx: -3, dy: 6,  anchor: "start"  },   // S1: below the flat lead-in
            { dx: 0,  dy: -4, anchor: "middle" },   // S2: above the baseline
            { dx: -2, dy: -5, anchor: "end"    },   // S3: up-left of the curve
            { dx: -2, dy: -5, anchor: "end"    },   // S4
            { dx: -2, dy: -5, anchor: "end"    },   // S5
            { dx: 0,  dy: -4, anchor: "middle" },   // S6: above the apex
            { dx: 3,  dy: 4,  anchor: "start" },    // S7: halfway down the drop, on its right (low enough to clear the Show All button on phones)
            { dx: -2, dy: -2, anchor: "end"    },   // S8: bottom of the drop, just above the baseline on its left (clear of Toggle Mode and the title box)
            { dx: 0,  dy: -4, anchor: "middle" }    // S9: above the baseline after the drop
        ];
        const DEFAULT_STATE_LABEL = { dx: 0, dy: -4, anchor: "middle" };

        // Title cycle: TLR (default) -> TL -> SL -> TLR, per mode. Deliberately
        // TLR-first with no combined bilingual entry: see "Logographic UI
        // Conventions" in Conceptionary_Template_Definitions.md.
        const titleTexts = {
            states: ["TLR-Title", "TL-Title", "SL-Title"],
            transitions: ["TLR-Transitions-Title", "TL-Transitions-Title", "SL-Transitions-Title"]
        };
        let currentTextIndex = 0;

        // ── Toggle Mode label: a loop, not a static caption ──────────────
        // Reads "Show Transitions" while in States mode and "Show States"
        // while in Transitions mode - i.e. it always names the mode a click
        // will switch TO. Defaults are English placeholders; the App
        // overwrites this block from the concept card's lang_config.ui
        // (show_transitions_label / show_states_label), same pattern as
        // titleTexts / answerConfig.
        const modeToggleLabels = {
            toTransitions: "Show Transitions",
            toStates: "Show States"
        };

        function updateModeToggleLabel() {
            modeToggleBtn.textContent = isStatesMode ? modeToggleLabels.toTransitions : modeToggleLabels.toStates;
        }

        // ── Answer checking: spelling conventions for the Quiz ───────────
        // The Quiz compares what the learner types with column 0 of the row
        // (the TLR, i.e. the romanisation). BOTH sides pass through the same normalisation, so any
        // spelling that the config below maps to the same canonical form is
        // accepted - a learner without the accented keys can still answer.
        // Language-specific content lives ONLY in answerConfig (the App
        // replaces it from the concept card's lang_config); AnswerUtils is
        // language-agnostic and, with the empty defaults, simply ignores
        // upper/lower case, spaces and hyphens.
        //   diacritic_map           [[accented, canonical], ...]
        //                           e.g. [["ā","a"]] or [["ä","ae"],["ß","ss"]]
        //   digraph_map             [[sequence, canonical], ...], applied after
        //                           diacritic_map, e.g. [["ou","o"]]
        //   collapse_double_vowels  true: aa->a ee->e ii->i oo->o uu->u
        //                           (e.g. Te Reo Māori "aa" is an alternative to "ā")
        //   diacritic_instructions  short note shown in the Quiz box telling
        //                           the learner how to type the accented letters
        const answerConfig = {
            diacritic_map: [],
            digraph_map: [],
            collapse_double_vowels: false,
            diacritic_instructions: ""
        };

        const AnswerUtils = {
            normalize: function(text) {
                let t = String(text == null ? "" : text).normalize("NFC").toLowerCase();
                (answerConfig.diacritic_map || []).forEach(function(pair) {
                    t = t.split(String(pair[0]).normalize("NFC").toLowerCase()).join(pair[1]);
                });
                (answerConfig.digraph_map || []).forEach(function(pair) {
                    t = t.split(String(pair[0]).normalize("NFC").toLowerCase()).join(pair[1]);
                });
                if (answerConfig.collapse_double_vowels) {
                    t = t.replace(/aa/g, "a").replace(/ee/g, "e").replace(/ii/g, "i")
                         .replace(/oo/g, "o").replace(/uu/g, "u");
                }
                return t.replace(/[\s\-]+/g, "").replace(/[.,!?;:]+/g, "");
            },
            checkAnswer: function(userInput, correct) {
                const u = this.normalize(userInput);
                return u !== "" && u === this.normalize(correct);
            }
        };

        (function showSpellingNote() {
            const note = document.getElementById("quizDiacriticNote");
            if (note) note.textContent = answerConfig.diacritic_instructions || "";
        })();

        // Global state
        let isStatesMode = true;
        let pathLength = 0;
        let currentQuizIndex = -1;
        let slidingTextMode = 0;              // 0: TLR, 1: TL, 2: SL, 3: Quiz
        let statesLearnedItems = [];          // separate tracking per mode - no cross-contamination
        let transitionsLearnedItems = [];
        let addedVocabularyItems = [];        // by transition index
        let textBoxElements = [];
        let currentTextLayer = [];            // per state box: 0 TLR, 1 TL, 2 SL, 3 Quiz
        let currentOffset = 0;                // where the sliding word STARTS, percent of path length
        let isDraggingText = false;
        let hasMovedDuringDrag = false;
        let dragStartClientX = 0;
        let dragStartClientY = 0;
        let dragGrabOffset = 0;               // path-length between the grab point and the word's start
        const DRAG_THRESHOLD_PX = 8;          // movement below this is a tap, not a drag
        let quizJustDragged = false;          // swallows the synthetic click a quiz-box drag-release makes
        let quizPosition = { x: null, y: null };   // null = default centred spot

        // DOM elements
        let svg, pathEl, conceptBackground, titleBox, modeToggleBtn, resetBtn, frame;
        let quizContainer, quizInput, quizCheck, quizFeedback;
        let vocabularyArray, vocabularyItems, toggleVocabularyBtn;
        let interactiveText, slidingText, dragInstruction;
        let showAllBtn, showAllGroup = null, showAllWords = [];   // showAllWords: the live Show All word list, for collision re-resolution on flip

        // ── Path ────────────────────────────────────────────────────────
        function buildPathData() {
            const pts = [];
            for (let k = 0; k <= CURVE_STEPS; k++) {
                const x = VB_MIN_X + (APEX_X - VB_MIN_X) * k / CURVE_STEPS;
                const y = BASELINE_Y - APEX_HEIGHT * Math.exp(-Math.pow(x - APEX_X, 2) / (2 * CURVE_WIDTH_C * CURVE_WIDTH_C));
                pts.push(x.toFixed(3) + ',' + y.toFixed(3));
            }
            pts.push(APEX_X + ',' + BASELINE_Y);       // the sudden drop
            pts.push(VB_MAX_X + ',' + BASELINE_Y);     // the baseline runs on to the right edge
            return 'M ' + pts.join(' L ');
        }

        // Client (screen) point -> SVG user units, via the live transform
        // matrix (robust against letterboxing from preserveAspectRatio).
        function getSvgPoint(clientX, clientY) {
            const p = svg.createSVGPoint();
            p.x = clientX;
            p.y = clientY;
            const m = svg.getScreenCTM();
            return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
        }

        // Nearest point on the path to an SVG-space point, as a length along
        // the path plus its distance. With aroundLength, only a window of the
        // path around it is searched, so a dragged word cannot teleport when
        // the pointer strays; null searches the whole path.
        function closestOnPath(x, y, aroundLength) {
            const total = pathLength;
            const WINDOW = 45;
            const lo = aroundLength === null ? 0 : Math.max(0, aroundLength - WINDOW);
            const hi = aroundLength === null ? total : Math.min(total, aroundLength + WINDOW);
            const step = aroundLength === null ? 0.5 : 0.25;
            let best = lo;
            let bestDist = Infinity;
            for (let L = lo; L <= hi + 1e-9; L += step) {
                const p = pathEl.getPointAtLength(Math.min(L, total));
                const d = Math.hypot(p.x - x, p.y - y);
                if (d < bestDist) {
                    bestDist = d;
                    best = L;
                }
            }
            return { len: Math.min(best, total), dist: bestDist };
        }

        // ── Which transition is this? ───────────────────────────────────
        // The zone each transition owns comes from the data (real path
        // positions), and ONE helper feeds the word shown, the item quizzed,
        // the item marked learned and the array entry, so they cannot
        // disagree.
        function getTransitionIndexForOffset(offset) {
            for (let i = 0; i < transitionsData.length; i++) {
                if (offset >= transitionsData[i][4] && offset <= transitionsData[i][5]) return i;
            }
            return transitionsData.length - 1;
        }

        function getTransitionItem(offset) {
            const index = getTransitionIndexForOffset(offset);
            return { index: index, data: transitionsData[index] };
        }

        // ── Frame (yellow circle) ───────────────────────────────────────
        // Kept fully inside the viewBox at both ends of the path (the circle
        // doubles on touch screens, matching the CSS rule).
        function getFrameRadius() {
            const r = parseFloat(frame.getAttribute('r')) || 1.5;
            return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? r * 2 : r;
        }

        function placeFrameAt(pt) {
            const r = getFrameRadius();
            frame.setAttribute('cx', Math.max(VB_MIN_X + r, Math.min(VB_MAX_X - r, pt.x)));
            frame.setAttribute('cy', pt.y);
        }

        function initializeFramePosition() {
            // Start at the extreme left of the path: the baseline / normal state
            placeFrameAt(pathEl.getPointAtLength(0));
            updateVisibleTextBoxes(0);
        }

        // ── States mode ─────────────────────────────────────────────────
        function createTextBoxes() {
            if (!isStatesMode) return;

            document.querySelectorAll('.textBox').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            textBoxElements = [];
            // Every box is rebuilt showing TL - a box left at the Quiz step must not come back showing the quiz prompt
            currentTextLayer = new Array(conceptData.length).fill(0);

            for (let i = 0; i < conceptData.length; i++) {
                const point = pathEl.getPointAtLength((conceptData[i][4] / 100) * pathLength);
                const cfg = STATE_LABELS[i] || DEFAULT_STATE_LABEL;

                const textBox = document.createElementNS(SVG_NS, "text");
                textBox.setAttribute("class", "textBox");
                textBox.setAttribute("x", point.x + cfg.dx);
                textBox.setAttribute("y", point.y + cfg.dy);
                textBox.setAttribute("data-index", i);
                // Inline style, not the attribute: the shared .textBox class declares
                // text-anchor, and a CSS declaration beats an SVG presentation attribute.
                textBox.style.textAnchor = cfg.anchor;
                textBox.textContent = conceptData[i][0];   // TLR first

                if (statesLearnedItems[i]) textBox.classList.add('learned');

                // Per-box click cycle: TLR -> TL -> SL -> Quiz -> TLR (unlearned);
                // TLR -> TL -> SL -> TLR (learned)
                textBox.addEventListener('click', function () {
                    const index = parseInt(this.getAttribute('data-index'), 10);

                    if (statesLearnedItems[index]) {
                        currentTextLayer[index] = (currentTextLayer[index] >= 2) ? 0 : currentTextLayer[index] + 1;
                        this.textContent = conceptData[index][currentTextLayer[index]];
                    } else if (currentTextLayer[index] === 0) {
                        currentTextLayer[index] = 1;             // TLR -> TL
                        this.textContent = conceptData[index][1];
                    } else if (currentTextLayer[index] === 1) {
                        currentTextLayer[index] = 2;             // TL -> SL
                        this.textContent = conceptData[index][2];
                    } else if (currentTextLayer[index] === 2) {
                        currentTextLayer[index] = 3;             // SL -> Quiz (the SL word stays on show)
                        showQuiz(index);
                    } else {
                        currentTextLayer[index] = 0;             // Quiz -> back to TLR
                        this.textContent = conceptData[index][0];
                        if (currentQuizIndex === index) closeQuiz();
                    }
                });

                svg.appendChild(textBox);
                textBoxElements.push(textBox);
            }

            // SVG stacking is document order: keep the frame last so it always
            // renders - and receives touches - above every label.
            svg.appendChild(frame);
        }

        // The label of the state nearest the frame ALONG THE PATH is the active
        // one; learned labels stay visible. An unlearned label that is no longer
        // active goes back to TL, so a newly focused item always starts fresh.
        function updateVisibleTextBoxes(framePercent) {
            if (!isStatesMode) return -1;

            let closestIndex = -1;
            let minDistance = Infinity;
            conceptData.forEach((row, index) => {
                const distance = Math.abs(row[4] - framePercent);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });

            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                textBox.classList.toggle('active', index === closestIndex);
                textBox.classList.toggle('learned', !!statesLearnedItems[index]);
                if (index !== closestIndex && !statesLearnedItems[index] && currentTextLayer[index] !== 0) {
                    currentTextLayer[index] = 0;
                    textBox.textContent = conceptData[index][0];
                }
            });
            return closestIndex;
        }

        // Frame dragging
        let isDragging = false;

        function startDrag(e) {
            if (!isStatesMode) return;
            isDragging = true;
            frame.classList.add('dragging');

            // Fade out the instruction on first interaction
            if (dragInstruction && !dragInstruction.classList.contains('fade')) {
                dragInstruction.classList.add('fade');
            }
            e.preventDefault();
        }

        function dragMove(e) {
            if (!isDragging || !isStatesMode) return;
            const src = e.touches ? e.touches[0] : e;
            const pt = getSvgPoint(src.clientX, src.clientY);

            // Nearest point on the WHOLE path (both x and y: the sudden drop
            // is vertical, so x alone cannot place the frame on it)
            const best = closestOnPath(pt.x, pt.y, null);
            placeFrameAt(pathEl.getPointAtLength(best.len));
            updateVisibleTextBoxes((best.len / pathLength) * 100);

            e.preventDefault();
            e.stopPropagation();
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                frame.classList.remove('dragging');
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        // ── Transitions mode ────────────────────────────────────────────
        function updateTextContent() {
            if (isStatesMode) return;
            const item = getTransitionItem(currentOffset);
            // TLR first; then TL; then SL (which also stays on show while the quiz is open)
            slidingText.textContent = item.data[(slidingTextMode >= 2) ? 2 : slidingTextMode];
            interactiveText.classList.toggle('learned', !!transitionsLearnedItems[item.index]);
        }

        // Keep the whole sliding word on the path: glyphs beyond the end of a
        // path are not drawn, so the word would be cut off. The offset is where
        // the word STARTS, so it must stop short of the end by the word's own
        // length. If the word cannot be measured, fall back to a fixed cap.
        function getMaxTextStartPercent() {
            try {
                const len = interactiveText.getComputedTextLength();
                if (len > 0 && pathLength > 0) return Math.max(0, 100 - (len / pathLength) * 100);
            } catch (e) { /* not measurable: keep the fallback */ }
            return MAX_TEXT_OFFSET_FALLBACK;
        }

        function startTextDrag(e) {
            if (isStatesMode) return;
            isDraggingText = true;
            hasMovedDuringDrag = false;
            interactiveText.classList.add('dragging');

            const src = e.touches ? e.touches[0] : e;
            dragStartClientX = src.clientX;
            dragStartClientY = src.clientY;

            // Remember where on the word the learner grabbed it, so the word
            // does not jump to put its start under the pointer.
            const pt = getSvgPoint(src.clientX, src.clientY);
            const startLen = (currentOffset / 100) * pathLength;
            dragGrabOffset = closestOnPath(pt.x, pt.y, null).len - startLen;

            if (dragInstruction && !dragInstruction.classList.contains('fade')) {
                dragInstruction.classList.add('fade');
            }
            e.preventDefault();
        }

        function dragText(e) {
            if (!isDraggingText || isStatesMode) return;
            const src = e.touches ? e.touches[0] : e;

            if (!hasMovedDuringDrag) {
                // Distance from where the drag STARTED (not from the last event),
                // so slow drags still register, and touchscreen jitter on a
                // stationary tap does not count as a drag.
                if (Math.hypot(src.clientX - dragStartClientX, src.clientY - dragStartClientY) <= DRAG_THRESHOLD_PX) {
                    if (e.cancelable) e.preventDefault();
                    return;
                }
                hasMovedDuringDrag = true;
            }

            const pt = getSvgPoint(src.clientX, src.clientY);
            // Search only a window of the path around the word, so it cannot
            // leap across to a distant stretch of the path.
            const curStartLen = (currentOffset / 100) * pathLength;
            const cur = closestOnPath(pt.x, pt.y, curStartLen + dragGrabOffset);
            const startLen = Math.min(pathLength, Math.max(0, cur.len - dragGrabOffset));

            currentOffset = (startLen / pathLength) * 100;
            updateTextContent();   // the word (and so its length) for this spot, so it can be measured
            currentOffset = Math.min(getMaxTextStartPercent(), currentOffset);
            slidingText.setAttribute('startOffset', currentOffset + '%');

            if (e.cancelable) e.preventDefault();
        }

        function endTextDrag() {
            if (isDraggingText) {
                isDraggingText = false;
                interactiveText.classList.remove('dragging');
            }
            setTimeout(() => { hasMovedDuringDrag = false; }, 100);
        }

        function toggleTextFormat() {
            if (isStatesMode || isDraggingText || hasMovedDuringDrag) return;
            const item = getTransitionItem(currentOffset);

            if (transitionsLearnedItems[item.index]) {
                // Learned: TLR -> TL -> SL -> TLR
                slidingTextMode = (slidingTextMode >= 2) ? 0 : slidingTextMode + 1;
                updateTextContent();
            } else if (slidingTextMode === 0) {
                slidingTextMode = 1;              // TLR -> TL
                updateTextContent();
            } else if (slidingTextMode === 1) {
                slidingTextMode = 2;              // TL -> SL
                updateTextContent();
            } else if (slidingTextMode === 2) {
                slidingTextMode = 3;              // SL -> Quiz (the SL word stays on show)
                showQuiz(item.index);
            } else {
                slidingTextMode = 0;              // Quiz -> back to TLR
                if (currentQuizIndex === item.index) closeQuiz();
                updateTextContent();
            }
        }

        // ── Quiz ────────────────────────────────────────────────────────
        function showQuiz(index) {
            const currentData = isStatesMode ? conceptData : transitionsData;
            if (!currentData[index]) {
                console.error("Invalid quiz index:", index);
                return;
            }
            currentQuizIndex = index;

            quizInput.placeholder = currentData[index][3];
            quizInput.value = '';
            quizFeedback.textContent = '';

            // Open where the learner last left it (or centred, the first time)
            if (quizPosition.x !== null && quizPosition.y !== null) {
                quizContainer.style.left = quizPosition.x + 'px';
                quizContainer.style.top = quizPosition.y + 'px';
                quizContainer.style.transform = 'none';
            } else {
                quizContainer.style.left = '50%';
                quizContainer.style.top = '40%';
                quizContainer.style.transform = 'translate(-50%, -50%)';
            }

            quizContainer.style.display = 'block';
            quizContainer.style.visibility = 'visible';
            quizContainer.style.opacity = '1';
            quizContainer.style.zIndex = '9999';

            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing quiz input:", e);
                }
            }, 100);
        }

        function closeQuiz() {
            quizContainer.style.display = 'none';
            currentQuizIndex = -1;
        }

        function checkQuizAnswer() {
            if (currentQuizIndex < 0) return;

            // The item is fixed when the quiz opens (currentQuizIndex), so moving
            // the frame or the sliding word meanwhile cannot make the answer be
            // checked against a different item.
            const currentData = isStatesMode ? conceptData : transitionsData;
            const entry = currentData[currentQuizIndex];
            if (!entry) return;

            // The Quiz tests the TLR (column 0). AnswerUtils applies the spelling conventions in
            // answerConfig to both the typed answer and the stored one.
            if (AnswerUtils.checkAnswer(quizInput.value, entry[0])) {
                quizFeedback.textContent = 'Correct!';
                quizFeedback.style.color = 'green';
                const answeredIndex = currentQuizIndex;

                if (isStatesMode) {
                    statesLearnedItems[answeredIndex] = true;
                    currentTextLayer[answeredIndex] = 0;
                    const textBox = textBoxElements[answeredIndex];
                    if (textBox) {
                        textBox.classList.add('learned');
                        textBox.textContent = entry[0];
                    }
                } else {
                    transitionsLearnedItems[answeredIndex] = true;
                    slidingTextMode = 0;
                    updateTextContent();
                    if (!addedVocabularyItems[answeredIndex]) addToVocabularyArray(answeredIndex);
                }

                setTimeout(() => {
                    // Only close OUR quiz - the learner may have opened another meanwhile
                    if (currentQuizIndex === answeredIndex) closeQuiz();
                }, 1500);
            } else {
                quizFeedback.textContent = 'Try again';
                quizFeedback.style.color = 'red';
            }
        }

        // ── Learned Vocabulary array ────────────────────────────────────
        // One combined list, kept in path order whatever order the items were
        // learned in: each entry carries data-index and is inserted before the
        // first existing entry with a larger one. Each item is filed once.
        function addToVocabularyArray(index) {
            try {
                const row = transitionsData[index];
                if (!row) return;

                const itemElement = document.createElement('div');
                itemElement.className = 'vocabulary-item';
                itemElement.setAttribute('data-index', index);

                // All three layers, in click-cycle order: TLR (bold: what the
                // learner is quizzed on) -> TL -> SL. Tapping a layer covers it.
                const tlrSpan = document.createElement('span');
                tlrSpan.className = 'target-language-roman';
                tlrSpan.textContent = row[0];

                const targetSpan = document.createElement('span');
                targetSpan.className = 'target-language';
                targetSpan.textContent = row[1];

                const sourceSpan = document.createElement('span');
                sourceSpan.className = 'source-language';
                sourceSpan.textContent = row[2];

                tlrSpan.addEventListener('click', function (e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                targetSpan.addEventListener('click', function (e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                sourceSpan.addEventListener('click', function (e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });

                itemElement.appendChild(tlrSpan);
                itemElement.appendChild(targetSpan);
                itemElement.appendChild(sourceSpan);

                let insertBeforeEl = null;
                for (const child of vocabularyItems.children) {
                    if (parseInt(child.getAttribute('data-index'), 10) > index) {
                        insertBeforeEl = child;
                        break;
                    }
                }
                vocabularyItems.insertBefore(itemElement, insertBeforeEl);
                addedVocabularyItems[index] = true;
                vocabularyArray.style.display = 'block';
                if (arrayCollapsed) setVocabularyCollapsed(false);
            } catch (error) {
                console.error("Error adding vocabulary item:", error);
            }
        }

        // Hide All / Show All. Hide All draws the whole list up into the title
        // bar (clearing the page); Show All rolls it back down and uncovers any
        // word the learner had covered by tapping it. An entry added while the
        // array is rolled up reopens it, so a newly learned word is never
        // hidden from the learner.
        let arrayCollapsed = false;
        let arrayAnimTimer = null;
        const ARRAY_ANIM_MS = 600;

        function setVocabularyCollapsed(collapse) {
            try {
                if (!vocabularyItems || !toggleVocabularyBtn || collapse === arrayCollapsed) return;
                arrayCollapsed = collapse;
                clearTimeout(arrayAnimTimer);
                const list = vocabularyItems;

                if (collapse) {
                    list.style.overflow = 'hidden';
                    list.style.maxHeight = list.scrollHeight + 'px';   // from natural height...
                    void list.offsetHeight;                            // ...commit it, then animate to 0
                    list.style.transition = 'max-height ' + ARRAY_ANIM_MS + 'ms ease-in-out, opacity ' + (ARRAY_ANIM_MS - 100) + 'ms ease-in-out';
                    list.style.maxHeight = '0px';
                    list.style.opacity = '0';
                    vocabularyArray.classList.add('collapsed');
                    toggleVocabularyBtn.textContent = 'Show All';
                } else {
                    list.querySelectorAll('.hidden').forEach(function (el) { el.classList.remove('hidden'); });
                    list.style.overflow = 'hidden';
                    list.style.transition = 'max-height ' + ARRAY_ANIM_MS + 'ms ease-in-out, opacity ' + ARRAY_ANIM_MS + 'ms ease-in-out';
                    list.style.maxHeight = list.scrollHeight + 'px';
                    list.style.opacity = '1';
                    vocabularyArray.classList.remove('collapsed');
                    toggleVocabularyBtn.textContent = 'Hide All';
                    arrayAnimTimer = setTimeout(function () {          // back to natural height so later entries fit
                        list.style.maxHeight = 'none';
                        list.style.overflow = '';
                        list.style.transition = '';
                    }, ARRAY_ANIM_MS + 50);
                }
            } catch (error) {
                console.error("Error in setVocabularyCollapsed:", error);
            }
        }

        // ── Show All (quick reference) ───────────────────────────────────
        // One button, just below Tools. Each click steps to the next language
        // layer and the last click switches it off again:
        //   Show All -> Show All (TL) -> Show All (TLR) -> Show All (SL) -> Hide All -> Show All (off)
        // "Hide All" is the last level before the loop returns to the normal
        // interactive view: it clears EVERY word off the page - including the
        // state labels a learner has already completed the Quiz on, which
        // otherwise stay on screen - leaving only the path, the title and the
        // buttons. Like the other levels it does not touch the learned /
        // quizzed status of anything; it is only a view.
        // It works on the CURRENT mode: in States mode every state label is
        // shown at once; in Transitions mode every transition word is laid
        // along the path, centred in its own zone. It does not touch the
        // learned / quizzed status of anything, and it is independent of the
        // frame, the state boxes, the sliding word and the Quiz, which step
        // aside while it is on.
        //
        // Each word can also be clicked on its own to flip it to the next
        // layer (TL -> SL -> TL ...), with no Quiz step. That choice is kept
        // per word - across a Toggle Mode and back - until the Show All
        // button is pressed again, which sets every word to its layer.
        // Every word carries data-kind / data-index / data-layer so audio can
        // later be attached to mouseover.
        // Logographic: three layers, in the order TL -> TLR -> SL (the script,
        // then how to read it, then what it means). To make it TLR-first, like
        // the title and the click cycle, put the TLR entry first.
        const SHOW_ALL_LAYERS = [
            { label: 'TL',  column: 1, cls: 'layer-tl'  },
            { label: 'TLR', column: 0, cls: 'layer-tlr' },
            { label: 'SL',  column: 2, cls: 'layer-sl'  }
        ];
        // -1 = off (the normal interactive view); 0 ... SHOW_ALL_LAYERS.length-1 =
        // a language layer; SHOW_ALL_LAYERS.length = the Hide All level
        let showAllLayer = -1;
        // Per-word layer chosen by clicking the word itself; undefined = follow the button
        let showAllOverride = { state: [], transition: [] };

        function clearShowAll() {
            if (showAllGroup && showAllGroup.parentNode) showAllGroup.parentNode.removeChild(showAllGroup);
            showAllGroup = null;
            showAllWords = [];
        }

        function showAllLayerFor(kind, index) {
            const own = showAllOverride[kind][index];
            return (own === undefined) ? showAllLayer : own;
        }

        // Show a word in its layer: text, colour class, data-layer; a
        // transition word is re-centred in its zone because its length changes.
        function applyShowAllWord(word) {
            const row = (word.kind === 'state') ? conceptData[word.index] : transitionsData[word.index];
            const layer = SHOW_ALL_LAYERS[showAllLayerFor(word.kind, word.index)];
            SHOW_ALL_LAYERS.forEach(function (l) { word.el.classList.remove(l.cls); });
            word.el.classList.add(layer.cls);
            word.el.setAttribute('data-layer', layer.label);
            (word.tp || word.el).textContent = row[layer.column];

            if (word.kind === 'transition') {
                // dy / shrink may have been set by resolveShowAllTransitionCollisions()
                // below to move this word clear of a neighbour; default is
                // the original placement (above the path, full size).
                word.el.classList.remove('shrink', 'shrink2');
                if (word.size) word.el.classList.add(word.size);
                word.tp.setAttribute('dy', word.dy === undefined ? -5 : word.dy);
                let lenPct = 0;
                try { lenPct = (word.el.getComputedTextLength() / pathLength) * 100; } catch (e) { /* keep 0 */ }
                const centre = (row[4] + row[5]) / 2;
                const start = Math.max(0, Math.min(100 - lenPct, centre - lenPct / 2));
                word.tp.setAttribute('startOffset', start + '%');
            }
        }

        function flipShowAllWord(word) {
            showAllOverride[word.kind][word.index] = (showAllLayerFor(word.kind, word.index) + 1) % SHOW_ALL_LAYERS.length;
            applyShowAllWord(word);
            if (word.kind === 'transition') resolveShowAllTransitionCollisions();   // its length just changed - reflow around it
        }

        // ── Show All (Transitions): collision avoidance ───────────────────
        // Real vocabulary varies wildly in length against the curve zones,
        // which run to only about 9-14 characters. Two measures keep
        // neighbours apart: words alternate sides of the path by default -
        // odd/even in path order, the usual way to fit a crowded row of
        // labels - and any pair that still overlaps has its least-adjusted
        // member try progressively smaller type on its OWN side, crossing to
        // the other side only as a last resort (so a long run of crowded
        // words spreads across both sides instead of all retreating to one).
        // A word with no collision keeps its default placement untouched.
        // Runs once after Show All (Transitions) is built, and again after
        // any word is flipped TL/TLR/SL, since that changes its length.
        // States mode does not run this solver: user testing found overlap
        // there was a .showall-state font-sizing bug (see its CSS rule),
        // not a spacing/collision problem - fixing the sizing removed it.
        const SHOW_ALL_ABOVE = [
            { dy: -5, size: ''        },   // default: above the path, full size
            { dy: -5, size: 'shrink'  },   // above, shrunk
            { dy: -5, size: 'shrink2' },   // above, smallest
            { dy: 8,  size: 'shrink2' }    // last resort: cross to below, smallest
        ];
        const SHOW_ALL_BELOW = [
            { dy: 8,  size: ''        },   // default: below the path, full size
            { dy: 8,  size: 'shrink'  },   // below, shrunk
            { dy: 8,  size: 'shrink2' },   // below, smallest
            { dy: -5, size: 'shrink2' }    // last resort: cross to above, smallest
        ];
        const SHOW_ALL_COLLISION_TOLERANCE = 2;   // px; ignores the near-touches rotated glyphs report

        function showAllBBox(el) {
            try {
                const b = el.getBBox();
                return { left: b.x, top: b.y, right: b.x + b.width, bottom: b.y + b.height };
            } catch (e) {
                return null;   // not yet in the DOM / not rendered - treat as no box, no collision
            }
        }

        function showAllBoxesOverlap(a, b, tol) {
            if (!a || !b) return false;
            return !(a.right <= b.left + tol || a.left >= b.right - tol ||
                     a.bottom <= b.top + tol || a.top >= b.bottom - tol);
        }

        function resolveShowAllTransitionCollisions() {
            // Settles by relaxation: every colliding PAIR escalates whichever
            // of the two has moved the least so far (each along its own
            // side's candidate list), repeating until nothing collides or
            // every word has tried its last candidate.
            const items = showAllWords
                .filter(function (w) { return w.kind === 'transition'; })
                .slice()
                .sort(function (a, b) {
                    const rowA = transitionsData[a.index], rowB = transitionsData[b.index];
                    return (rowA[4] + rowA[5]) - (rowB[4] + rowB[5]);   // path order, by zone centre
                });
            const maxC = SHOW_ALL_ABOVE.length - 1;   // SHOW_ALL_BELOW is the same length
            items.forEach(function (w, i) {
                w._candidates = (i % 2 === 0) ? SHOW_ALL_ABOVE : SHOW_ALL_BELOW;   // stagger by default
                w._candidate = 0;
                w.dy = w._candidates[0].dy;
                w.size = w._candidates[0].size;
                applyShowAllWord(w);
            });
            for (let round = 0; round <= maxC; round++) {
                const boxes = items.map(function (w) { return showAllBBox(w.el); });
                let escalated = false;
                for (let i = 0; i < items.length; i++) {
                    for (let j = i + 1; j < items.length; j++) {
                        if (!showAllBoxesOverlap(boxes[i], boxes[j], SHOW_ALL_COLLISION_TOLERANCE)) continue;
                        const a = items[i], b = items[j];
                        const target = (a._candidate <= b._candidate) ? a : b;
                        if (target._candidate >= maxC) continue;   // both out of room - leave the pair as the last-resort placement
                        target._candidate++;
                        const cand = target._candidates[target._candidate];
                        target.dy = cand.dy;
                        target.size = cand.size;
                        applyShowAllWord(target);
                        boxes[items.indexOf(target)] = showAllBBox(target.el);
                        escalated = true;
                    }
                }
                if (!escalated) break;   // stable - nothing left to gain from another round
            }
        }

        function renderShowAll() {
            clearShowAll();
