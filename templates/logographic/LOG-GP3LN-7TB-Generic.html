<body>
    <div class="a4-page">
        <div id="title-box" class="title-box"></div>
        <div id="concept-indicator" class="concept-indicator">Position 1</div>
        <div id="level-indicator" class="level-indicator">TL Roman</div>
        
        <div class="tools-menu">
            <div class="tools-button">Tools</div>
            <div class="tools-dropdown">
                <div class="tool-item" id="toggleFullscreen">Full Screen</div>
                <div class="tool-item" id="loadConcept">Load Concept</div>
                <div class="tool-item" id="startQuiz">Quick Quiz</div>
                <div class="tool-item" id="toggleArrays">Toggle Arrays</div>
                <div class="tool-item" id="toggleGrid">Toggle Coordinate Grid</div>
            </div>
        </div>
        
        <div id="changing-array" class="vocabulary-array">
            <div class="array-title">Degrading Process</div>
            <button class="toggle-visibility" id="toggle-changing">Hide All</button>
            <div id="changing-items"></div>
        </div>
        
        <div id="negative-array" class="vocabulary-array">
            <div class="array-title">Negative States</div>
            <button class="toggle-visibility" id="toggle-negative">Hide All</button>
            <div id="negative-items"></div>
        </div>
        
        <svg id="svgCanvas" viewBox="0 0 100 43.6" preserveAspectRatio="none">
            <defs>
                <linearGradient id="conceptGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <path id="gradualChangePath" class="path-line" />
            <path id="conceptBackground"></path>
            
            <circle id="draggableFrame" cx="0" cy="32" r="1.5"/>
            
            <text id="interactiveText" class="sliding-text">
                <textPath id="slidingText" href="#gradualChangePath" startOffset="0%">
                    TLR-T1
                </textPath>
            </text>
        </svg>
        <button id="modeToggle" class="mode-toggle">Toggle Mode</button>
        <div class="watermark">
            &copy; 2026 Alan William Preston
        </div>
    </div>

    <div id="quizContainer" class="quiz-container">
        <input type="text" id="quizInput" placeholder="Enter the target language roman">
        <button id="quizCheck">Check</button>
        <div id="quizFeedback"></div>
    </div>

    <script>
        // Data for 7 positions on REVERSED 3-line path: [TLR, SL, TL, QuizQuestion, Position]
        const conceptData = [
            ["TLR1", "TL1", "SL1", "What's the target language roman for 'SL1'?", 0],
            ["TLR2", "TL2", "SL2", "What's the target language roman for 'SL2'?", 15],
            ["TLR3", "TL3", "SL3", "What's the target language roman for 'SL3'?", 30],
            ["TLR4", "TL4", "SL4", "What's the target language roman for 'SL4'?", 40],
            ["TLR5", "TL5", "SL5", "What's the target language roman for 'SL5'?", 50],
            ["TLR6", "TL6", "SL6", "What's the target language roman for 'SL6'?", 75],
            ["TLR7", "TL7", "SL7", "What's the target language roman for 'SL7'?", 100]
        ];

        const transitionsData = [
            ["TLR-T1", "TL-T1", "SL-T1", "What's the target language roman for 'SL-T1'?", 0],
            ["TLR-T2", "TL-T2", "SL-T2", "What's the target language roman for 'SL-T2'?", 20],
            ["TLR-T3", "TL-T3", "SL-T3", "What's the target language roman for 'SL-T3'?", 40],
            ["TLR-T4", "TL-T4", "SL-T4", "What's the target language roman for 'SL-T4'?", 60],
            ["TLR-T5", "TL-T5", "SL-T5", "What's the target language roman for 'SL-T5'?", 80]
        ];

        let isStatesMode = true;
        let pathLength = 0;
        let currentQuizIndex = -1;
        let slidingTextMode = 0;
        let learnedItems = [];
        let learnedTransitions = [];
        let textBoxElements = [];
        let addedChangingItems = [];
        let addedNegativeItems = [];
        let currentTextLayer = new Array(7).fill(0);
        
        let startPercent = 0;
        let isDraggingText = false;
        let lastX = 0;
        let hasMovedDuringDrag = false;
        
        // Title cycle: TLR (default) → TL → SL → TLR, per mode. See
        // "Logographic UI Conventions" in Conceptionary_Template_Definitions.md.
        const titleTexts = {
            states: ["TLR_TITLE_STATES", "TL_TITLE_STATES", "SL_TITLE_STATES"],
            transitions: ["TLR_TITLE_TRANSITIONS", "TL_TITLE_TRANSITIONS", "SL_TITLE_TRANSITIONS"]
        };
        let currentTextIndex = 0;
        
        const activationDistance = 11.4;

        // REVERSED 3-line path coordinates
        const pathPoints = [
            `0,21.6`, `40,21.6`, `60,32.4`, `100,32.4`
        ];

        let svg, pathLine, conceptBackground, titleBox, conceptIndicator, levelIndicator;
        let modeToggleBtn, frame, quizContainer, quizInput, quizCheck, quizFeedback;
        let changingArray, negativeArray, changingItems, negativeItems;
        let toggleChangingBtn, toggleNegativeBtn;

        function getTransitionDataForPosition(percent) {
            if (percent < 20) return { index: 0, data: transitionsData[0] };
            else if (percent < 40) return { index: 1, data: transitionsData[1] };
            else if (percent < 60) return { index: 2, data: transitionsData[2] };
            else if (percent < 80) return { index: 3, data: transitionsData[3] };
            else return { index: 4, data: transitionsData[4] };
        }

        function updateTextBasedOnPosition(percent) {
            if (isStatesMode) return;
            
            percent = Math.min(100, Math.max(0, percent));
            const transitionData = getTransitionDataForPosition(percent);
            const index = transitionData.index;
            const data = transitionData.data;
            
            const textPath = document.getElementById("slidingText");
            if (!textPath) return;
            
            if (learnedTransitions[index]) {
                interactiveText.classList.add('learned');
                if (slidingTextMode === 0) textPath.textContent = data[0];
                else if (slidingTextMode === 1) textPath.textContent = data[1];
                else textPath.textContent = data[2];
            } else {
                interactiveText.classList.remove('learned');
                if (slidingTextMode === 0) textPath.textContent = data[0];
                else if (slidingTextMode === 1) textPath.textContent = data[1];
                else if (slidingTextMode === 2) textPath.textContent = data[2];
            }
            
            conceptIndicator.textContent = data[1];
            updateLevelIndicator();
        }

        function updateTextPosition(percent) {
            if (isStatesMode) return;
            
            percent = Math.min(100, Math.max(0, percent));
            const textPath = document.getElementById("slidingText");
            if (textPath) {
                textPath.setAttribute("startOffset", `${percent}%`);
            }
            updateTextBasedOnPosition(percent);
        }

        function updateLevelIndicator() {
            if (isStatesMode) {
                levelIndicator.style.display = 'none';
                return;
            }
            
            levelIndicator.style.display = 'block';
            
            switch (slidingTextMode) {
                case 0: levelIndicator.textContent = 'TL Roman'; break;
                case 1: levelIndicator.textContent = 'Source Language'; break;
                case 2: levelIndicator.textContent = 'Target Language'; break;
                case 3: levelIndicator.textContent = 'Quiz Mode'; break;
            }
        }

        function createTextBoxes() {
            if (!isStatesMode) return;
            
            document.querySelectorAll('.textBox').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            textBoxElements = [];
            
            const sevenPositions = [
                { percent: 0, anchor: "start" },
                { percent: 15, anchor: "middle" },
                { percent: 30, anchor: "middle" },
                { percent: 40, anchor: "middle" },
                { percent: 50, anchor: "middle" },
                { percent: 75, anchor: "middle" },
                { percent: 100, anchor: "end" }
            ];
            
            // Confirmed coordinates from the coordinate grid (Alan,
            // 2026-09-14) — updated following the Line 2 shift.
            const confirmedPositions = {
                0: { x: 0, y: 17.44 },   // TLR1: 0%, 40%
                1: { x: 23, y: 20.93 },  // TLR2: 23%, 48%
                2: { x: 40, y: 25.29 },  // TLR3: 40%, 58%
                3: { x: 52, y: 28.34 },  // TLR4: 52%, 65%
                4: { x: 60, y: 31.83 },  // TLR5: 60%, 73%
                5: { x: 75, y: 35.75 },  // TLR6: 75%, 82%
                6: { x: 98, y: 37.06 }   // TLR7: 98%, 85%
            };
            
            for (let i = 0; i < 7; i++) {
                const positionData = sevenPositions[i];
                const fixedPos = confirmedPositions[i];
                
                const textBox = document.createElementNS("http://www.w3.org/2000/svg", "text");
                textBox.setAttribute("class", "textBox");
                textBox.setAttribute("x", fixedPos.x);
                textBox.setAttribute("y", fixedPos.y);
                textBox.style.textAnchor = positionData.anchor;
                textBox.setAttribute("data-index", i);
                
                textBox.textContent = conceptData[i][currentTextLayer[i]];
                
                if (learnedItems[i]) textBox.classList.add('learned');
                
                textBox.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const index = parseInt(this.getAttribute('data-index'));
                    
                    if (learnedItems[index]) {
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1;
                            this.textContent = conceptData[index][1];
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2;
                            this.textContent = conceptData[index][2];
                        } else {
                            currentTextLayer[index] = 0;
                            this.textContent = conceptData[index][0];
                        }
                    } else {
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1;
                            this.textContent = conceptData[index][1];
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2;
                            this.textContent = conceptData[index][2];
                        } else if (currentTextLayer[index] === 2) {
                            currentTextLayer[index] = 3;
                            showQuiz(index, this);
                        } else {
                            currentTextLayer[index] = 0;
                            this.textContent = conceptData[index][0];
                        }
                    }
                });
                
                svg.appendChild(textBox);
                textBoxElements.push(textBox);
            }
            
            // Re-parent the drag frame to the end of the SVG's children so
            // it always renders — and receives pointer/touch events —
            // above every text box (SVG stacking is document-order only).
            if (frame && frame.parentNode) frame.parentNode.appendChild(frame);
        }

        function showQuiz(index, element) {
            const currentData = isStatesMode ? conceptData : transitionsData;
            
            if (index < 0 || index >= currentData.length) {
                console.error("Invalid quiz index:", index);
                return;
            }
            
            currentQuizIndex = index;
            
            quizInput.placeholder = currentData[index][3];
            quizInput.value = '';
            quizFeedback.textContent = '';
            
            quizContainer.style.display = 'block';
            
            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing input:", e);
                }
            }, 100);
        }

        function addToVocabularyArray(index, isChanging) {
            try {
                const currentData = transitionsData;
                const tlr = currentData[index][0];
                const targetLanguage = currentData[index][1];
                const sourceLanguage = currentData[index][2];
                
                const itemElement = document.createElement('div');
                itemElement.className = 'vocabulary-item';
                
                const tlrSpan = document.createElement('span');
                tlrSpan.className = 'target-language-roman';
                tlrSpan.textContent = tlr;
                
                const sourceSpan = document.createElement('span');
                sourceSpan.className = 'source-language';
                sourceSpan.textContent = sourceLanguage;
                
                const targetSpan = document.createElement('span');
                targetSpan.className = 'target-language';
                targetSpan.textContent = targetLanguage;
                
                [tlrSpan, sourceSpan, targetSpan].forEach(span => {
                    span.addEventListener('click', function(e) {
                        e.stopPropagation();
                        this.classList.toggle('hidden');
                    });
                });
                
                itemElement.appendChild(tlrSpan);
                itemElement.appendChild(sourceSpan);
                itemElement.appendChild(targetSpan);
                
                if (isChanging) {
                    changingItems.appendChild(itemElement);
                    addedChangingItems[index] = true;
                    changingArray.style.display = 'block';
                } else {
                    negativeItems.appendChild(itemElement);
                    addedNegativeItems[index] = true;
                    negativeArray.style.display = 'block';
                }
            } catch (error) {
                console.error("Error adding vocabulary:", error);
            }
        }

        function checkQuizAnswer() {
            if (currentQuizIndex < 0) return;
            
            const currentData = isStatesMode ? conceptData : transitionsData;
            const userAnswer = quizInput.value.trim().toLowerCase();
            const correctAnswer = currentData[currentQuizIndex][0].toLowerCase();
            
            if (userAnswer === correctAnswer) {
                quizFeedback.textContent = 'Correct!';
                quizFeedback.style.color = 'green';
                
                if (isStatesMode) {
                    learnedItems[currentQuizIndex] = true;
                    
                    const textBox = textBoxElements[currentQuizIndex];
                    if (textBox) {
                        textBox.classList.add('learned');
                        textBox.textContent = currentData[currentQuizIndex][0];
                        currentTextLayer[currentQuizIndex] = 0;
                    }
                } else {
                    learnedTransitions[currentQuizIndex] = true;
                    slidingTextMode = 0;
                    
                    const targetTextElement = document.getElementById("interactiveText");
                    if (targetTextElement) {
                        targetTextElement.classList.add('learned');
                        const textPath = document.getElementById("slidingText");
                        if (textPath) {
                            textPath.textContent = currentData[currentQuizIndex][0];
                        }
                    }
                    
                    const position = startPercent;
                    if (position < 50 && !addedChangingItems[currentQuizIndex]) {
                        addToVocabularyArray(currentQuizIndex, true);
                    } else if (position >= 50 && !addedNegativeItems[currentQuizIndex]) {
                        addToVocabularyArray(currentQuizIndex, false);
                    }
                    
                    updateLevelIndicator();
                    updateTextBasedOnPosition(startPercent);
                }
                
                setTimeout(() => { 
                    quizContainer.style.display = 'none'; 
                    currentQuizIndex = -1;
                }, 1500);
            } else {
                quizFeedback.textContent = 'Try again';
                quizFeedback.style.color = 'red';
            }
        }

        function updateVisibleTextBoxes(point) {
            if (!isStatesMode) return -1;
            
            let closestIndex = -1;
            let minDistance = Infinity;
            
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x'));
                const y = parseFloat(textBox.getAttribute('y'));
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });
            
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                if (index === closestIndex && minDistance < activationDistance) {
                    textBox.classList.add('active');
                } else if (learnedItems[index]) {
                    textBox.classList.remove('active');
                    textBox.classList.add('learned');
                } else {
                    textBox.classList.remove('active', 'learned');
                }
            });
            
            if (closestIndex !== -1 && minDistance < activationDistance && conceptData[closestIndex]) {
                conceptIndicator.textContent = `Position ${closestIndex + 1}`;
            }
            
            return closestIndex;
        }

        function initializeFramePosition() {
            const startPoint = pathLine.getPointAtLength(0);
            
            frame.setAttribute('cx', startPoint.x);
            frame.setAttribute('cy', startPoint.y);
            
            // Re-parent to the end of the SVG's children so the frame
            // always renders — and receives pointer/touch events —
            // above every text box (SVG stacking is document-order only).
            if (frame.parentNode) frame.parentNode.appendChild(frame);
            
            updateVisibleTextBoxes(startPoint);
            conceptIndicator.textContent = "Position 1";
        }

        let isDragging = false;
        let offsetX, offsetY;

        function startDrag(e) {
            if (!isStatesMode) return;
            isDragging = true;
            frame.classList.add('dragging');
            
            const point = getEventPoint(e);
            offsetX = point.x - parseFloat(frame.getAttribute("cx"));
            offsetY = point.y - parseFloat(frame.getAttribute("cy"));
            
            e.preventDefault();
            e.stopPropagation();
        }

        function dragMove(e) {
            if (!isDragging || !isStatesMode) return;
            
            const point = getEventPoint(e);
            const newX = point.x - offsetX;
            const newY = point.y - offsetY;

            const closestPoint = getClosestPointOnPath(newX, newY);
            
            frame.setAttribute("cx", closestPoint.x);
            frame.setAttribute("cy", closestPoint.y);

            updateVisibleTextBoxes(closestPoint);
            
            e.preventDefault();
            e.stopPropagation();
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                frame.classList.remove('dragging');
                
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        function getEventPoint(event) {
            const isTouchEvent = event.type.includes('touch');
            const point = svg.createSVGPoint();
            const clientX = isTouchEvent ? event.touches[0].clientX : event.clientX;
            const clientY = isTouchEvent ? event.touches[0].clientY : event.clientY;
            point.x = clientX;
            point.y = clientY;
            return point.matrixTransform(svg.getScreenCTM().inverse());
        }

        function getClosestPointOnPath(x, y) {
            let closestPoint = null;
            let closestDistance = Infinity;

            const sampleRate = 0.3;
            for (let i = 0; i < pathLength; i += sampleRate) {
                const point = pathLine.getPointAtLength(i);
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestPoint = point;
                }
            }

            return closestPoint || pathLine.getPointAtLength(0);
        }

        function startTextDrag(event) {
            if (isStatesMode) return;
            isDraggingText = true;
            hasMovedDuringDrag = false;
            lastX = event.touches ? event.touches[0].clientX : event.clientX;
            event.preventDefault();
        }

        function dragText(event) {
            if (!isDraggingText || isStatesMode) return;
            
            let currentX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientMovement = currentX - lastX;
            
            if (Math.abs(clientMovement) > 5) {
                hasMovedDuringDrag = true;
            }
            
            // Convert the screen-pixel movement into SVG-space movement
            // using the SVG's actual rendered width, rather than a fixed
            // pixel-to-percent multiplier — the old approach (movement *
            // 0.2) didn't account for how large .a4-page renders on any
            // given screen, which made drag speed inconsistent and feel
            // jittery depending on window/device size.
            const svg = document.getElementById('svgCanvas');
            const svgRect = svg.getBoundingClientRect();
            const SVG_VIEWBOX_WIDTH = 100; // matches viewBox="0 0 100 43.6"
            const svgMovement = svgRect.width > 0 ? (clientMovement / svgRect.width) * SVG_VIEWBOX_WIDTH : 0;
            
            lastX = currentX;
            startPercent += svgMovement;
            startPercent = Math.min(100, Math.max(0, startPercent));
            updateTextPosition(startPercent);
            
            if (event.cancelable) event.preventDefault();
        }

        function endTextDrag() {
            isDraggingText = false;
        }

        function toggleTextFormat(event) {
            if (isStatesMode || isDraggingText || hasMovedDuringDrag) return;
            
            const transitionData = getTransitionDataForPosition(startPercent);
            const index = transitionData.index;
            
            if (learnedTransitions[index]) {
                slidingTextMode = (slidingTextMode + 1) % 3;
                updateTextBasedOnPosition(startPercent);
            } else {
                if (slidingTextMode === 0) {
                    slidingTextMode = 1;
                    updateTextBasedOnPosition(startPercent);
                } else if (slidingTextMode === 1) {
                    slidingTextMode = 2;
                    updateTextBasedOnPosition(startPercent);
                } else if (slidingTextMode === 2) {
                    slidingTextMode = 3;
                    showQuiz(index, interactiveText);
                    return;
                } else {
                    slidingTextMode = 0;
                    updateTextBasedOnPosition(startPercent);
                }
            }
            
            updateLevelIndicator();
            if (event && event.cancelable) event.preventDefault();
        }

        function toggleMode() {
            isStatesMode = !isStatesMode;

            // Reset to TLR default on mode switch — otherwise a learner who
            // had cycled to SL/TL in the old mode lands on the same index
            // in the new mode instead of starting fresh at TLR.
            currentTextIndex = 0;
            
            if (isStatesMode) {
                frame.style.display = 'block';
                
                const interactiveText = document.getElementById("interactiveText");
                if (interactiveText) interactiveText.style.display = 'none';
                
                titleBox.textContent = titleTexts.states[currentTextIndex];
                levelIndicator.style.display = 'none';
                
                createTextBoxes();
                initializeFramePosition();
                
                changingArray.style.display = 'none';
                negativeArray.style.display = 'none';
            } else {
                frame.style.display = 'none';
                
                const interactiveText = document.getElementById("interactiveText");
                if (interactiveText) interactiveText.style.display = 'block';
                
                titleBox.textContent = titleTexts.transitions[currentTextIndex];
                slidingTextMode = 0;
                updateLevelIndicator();
                
                document.querySelectorAll('.textBox').forEach(box => {
                    if (box && box.parentNode) box.parentNode.removeChild(box);
                });
                textBoxElements = [];
                
                startPercent = 0;
                updateTextPosition(startPercent);
                
                if (changingItems && changingItems.children.length > 0) {
                    changingArray.style.display = 'block';
                }
                if (negativeItems && negativeItems.children.length > 0) {
                    negativeArray.style.display = 'block';
                }
            }
            
            quizContainer.style.display = 'none';
        }

        function switchTitleText() {
            titleBox.classList.add('hidden');
            setTimeout(() => {
                currentTextIndex = (currentTextIndex + 1) % titleTexts[isStatesMode ? 'states' : 'transitions'].length;
                const modeKey = isStatesMode ? 'states' : 'transitions';
                titleBox.textContent = titleTexts[modeKey][currentTextIndex];
                titleBox.classList.remove('hidden');
            }, 500);
        }

        function toggleArrayVisibility(arrayType) {
            try {
                const container = document.getElementById(arrayType + "-items");
                const button = document.getElementById("toggle-" + arrayType);
                if (!container || !button) return;
                
                const spans = container.querySelectorAll('.vocabulary-item .target-language-roman, .vocabulary-item .source-language, .vocabulary-item .target-language');
                
                let visibleCount = 0;
                spans.forEach(span => {
                    if (!span.classList.contains('hidden')) visibleCount++;
                });
                
                const mostlyVisible = visibleCount > spans.length / 2;
                
                spans.forEach(span => {
                    if (mostlyVisible) {
                        span.classList.add('hidden');
                    } else {
                        span.classList.remove('hidden');
                    }
                });
                
                button.textContent = mostlyVisible ? 'Show All' : 'Hide All';
            } catch (error) {
                console.error("Error in toggleArrayVisibility:", error);
            }
        }

        function setupEventListeners() {
            frame.addEventListener('mousedown', startDrag);
            frame.addEventListener('touchstart', startDrag, { passive: false });
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            
            titleBox.addEventListener('click', switchTitleText);
            modeToggleBtn.addEventListener('click', toggleMode);
            quizCheck.addEventListener('click', checkQuizAnswer);
            quizInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkQuizAnswer();
            });
            
            const interactiveText = document.getElementById("interactiveText");
            
            interactiveText.addEventListener("mousedown", startTextDrag);
            document.addEventListener("mousemove", dragText);
            document.addEventListener("mouseup", endTextDrag);
            
            interactiveText.addEventListener("click", function(e) {
                setTimeout(() => toggleTextFormat(e), 10);
            });
            
            interactiveText.addEventListener("touchstart", startTextDrag, { passive: false });
            document.addEventListener("touchmove", dragText, { passive: false });
            document.addEventListener("touchend", endTextDrag);
            
            interactiveText.addEventListener("touchend", function(e) {
                setTimeout(() => {
                    if (!hasMovedDuringDrag && !isStatesMode) {
                        toggleTextFormat(e);
                    }
                }, 10);
            });
            
            const toolsButton = document.querySelector('.tools-button');
            const toolsDropdown = document.querySelector('.tools-dropdown');
            const fullscreenBtn = document.getElementById("toggleFullscreen");
            
            let dropdownOpen = false;
            
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!document.fullscreenElement) {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen().catch(function(err) {
                                console.log('Full screen request failed or unsupported:', err);
                            });
                        }
                        fullscreenBtn.textContent = 'Exit Full Screen';
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                        fullscreenBtn.textContent = 'Full Screen';
                    }
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                });
                document.addEventListener('fullscreenchange', function() {
                    fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
                });
            }

            // ── Keyboard-avoidance for the Quiz box ──────────────────
            if (window.visualViewport) {
                const KEYBOARD_HEIGHT_THRESHOLD = 150;
                function handleViewportResize() {
                    const qc = document.getElementById('quizContainer');
                    if (!qc) return;
                    const heightDiff = window.innerHeight - window.visualViewport.height;
                    if (heightDiff > KEYBOARD_HEIGHT_THRESHOLD) {
                        qc.classList.add('keyboard-open');
                    } else {
                        qc.classList.remove('keyboard-open');
                    }
                }
                window.visualViewport.addEventListener('resize', handleViewportResize);
            }

            // ── Quiz box: drag to reposition anywhere on screen ──────
            (function setupQuizDrag() {
                const qc = document.getElementById('quizContainer');
                const qInput = document.getElementById('quizInput');
                const qCheck = document.getElementById('quizCheck');
                let isDraggingQuiz = false;
                let quizDragOffsetX = 0;
                let quizDragOffsetY = 0;

                function quizDragStart(e) {
                    if (e.target === qInput || e.target === qCheck) return;
                    isDraggingQuiz = true;
                    const rect = qc.getBoundingClientRect();
                    const point = e.touches ? e.touches[0] : e;
                    quizDragOffsetX = point.clientX - rect.left;
                    quizDragOffsetY = point.clientY - rect.top;
                    qc.style.left = rect.left + 'px';
                    qc.style.top = rect.top + 'px';
                    qc.style.transform = 'none';
                    qc.classList.add('dragging');
                    if (e.touches) e.preventDefault();
                }

                function quizDragMove(e) {
                    if (!isDraggingQuiz) return;
                    const point = e.touches ? e.touches[0] : e;
                    let newLeft = point.clientX - quizDragOffsetX;
                    let newTop = point.clientY - quizDragOffsetY;
                    const maxLeft = window.innerWidth - qc.offsetWidth;
                    const maxTop = window.innerHeight - qc.offsetHeight;
                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));
                    qc.style.left = newLeft + 'px';
                    qc.style.top = newTop + 'px';
                    if (e.touches) e.preventDefault();
                }

                function quizDragEnd() {
                    isDraggingQuiz = false;
                    qc.classList.remove('dragging');
                }

                qc.addEventListener('mousedown', quizDragStart);
                document.addEventListener('mousemove', quizDragMove);
                document.addEventListener('mouseup', quizDragEnd);

                qc.addEventListener('touchstart', quizDragStart, { passive: false });
                document.addEventListener('touchmove', quizDragMove, { passive: false });
                document.addEventListener('touchend', quizDragEnd);
            })();

            // ── Vocabulary arrays: drag to reposition anywhere on screen
            // Drag handle is the title bar (.array-title), so clicking
            // "Hide All" or a vocabulary item still works normally.
            function setupArrayDrag(arrayEl) {
                const handle = arrayEl.querySelector('.array-title');
                if (!handle) return;
                let isDraggingArray = false;
                let dragOffsetX = 0;
                let dragOffsetY = 0;

                function dragStart(e) {
                    isDraggingArray = true;
                    const rect = arrayEl.getBoundingClientRect();
                    const point = e.touches ? e.touches[0] : e;
                    dragOffsetX = point.clientX - rect.left;
                    dragOffsetY = point.clientY - rect.top;
                    arrayEl.style.left = rect.left + 'px';
                    arrayEl.style.top = rect.top + 'px';
                    arrayEl.style.right = 'auto';
                    arrayEl.classList.add('dragging');
                    if (e.touches) e.preventDefault();
                }

                function dragMove(e) {
                    if (!isDraggingArray) return;
                    const point = e.touches ? e.touches[0] : e;
                    let newLeft = point.clientX - dragOffsetX;
                    let newTop = point.clientY - dragOffsetY;
                    const maxLeft = window.innerWidth - arrayEl.offsetWidth;
                    const maxTop = window.innerHeight - arrayEl.offsetHeight;
                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));
                    arrayEl.style.left = newLeft + 'px';
                    arrayEl.style.top = newTop + 'px';
                    if (e.touches) e.preventDefault();
                }

                function dragEnd() {
                    isDraggingArray = false;
                    arrayEl.classList.remove('dragging');
                }

                handle.addEventListener('mousedown', dragStart);
                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);

                handle.addEventListener('touchstart', dragStart, { passive: false });
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('touchend', dragEnd);
            }
            
            const changingArrayEl = document.getElementById('changing-array');
            const negativeArrayEl = document.getElementById('negative-array');
            if (changingArrayEl) setupArrayDrag(changingArrayEl);
            if (negativeArrayEl) setupArrayDrag(negativeArrayEl);
            
            if (toolsButton) {
                toolsButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = !dropdownOpen;
                    toolsDropdown.classList.toggle('active', dropdownOpen);
                });
            }
            
            document.addEventListener('click', function(e) {
                if (toolsButton && toolsDropdown && 
                    !toolsButton.contains(e.target) && !toolsDropdown.contains(e.target)) {
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                }
            });
            
            const loadConceptBtn = document.getElementById("loadConcept");
            const startQuizBtn = document.getElementById("startQuiz");
            const toggleArraysBtn = document.getElementById("toggleArrays");
            const toggleGridBtn = document.getElementById("toggleGrid");
            
            // ── Coordinate grid overlay — for manually identifying
            // staggered text-box coordinates on this file's 100x43.6
            // viewBox. Red lines every 10% of width/height, labeled.
            if (toggleGridBtn) {
                let gridVisible = false;
                let gridGroup = null;
                
                function buildGrid() {
                    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    g.setAttribute("id", "coordinateGrid");
                    g.setAttribute("pointer-events", "none");
                    
                    for (let x = 0; x <= 100; x += 10) {
                        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", x);
                        line.setAttribute("y1", 0);
                        line.setAttribute("x2", x);
                        line.setAttribute("y2", 43.6);
                        line.setAttribute("stroke", "red");
                        line.setAttribute("stroke-width", "0.1");
                        line.setAttribute("opacity", "0.5");
                        g.appendChild(line);
                        
                        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        label.setAttribute("x", x + 0.3);
                        label.setAttribute("y", 1.5);
                        label.setAttribute("font-size", "1.2");
                        label.setAttribute("fill", "red");
                        label.textContent = x + "%";
                        g.appendChild(label);
                    }
                    
                    for (let y = 0; y <= 43.6; y += 4.36) {
                        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", 0);
                        line.setAttribute("y1", y);
                        line.setAttribute("x2", 100);
                        line.setAttribute("y2", y);
                        line.setAttribute("stroke", "red");
                        line.setAttribute("stroke-width", "0.1");
                        line.setAttribute("opacity", "0.5");
                        g.appendChild(line);
                        
                        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        label.setAttribute("x", 0.3);
                        label.setAttribute("y", y + 1.2);
                        label.setAttribute("font-size", "1.2");
                        label.setAttribute("fill", "red");
                        label.textContent = Math.round((y / 43.6) * 100) + "%";
                        g.appendChild(label);
                    }
                    
                    return g;
                }
                
                toggleGridBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    gridVisible = !gridVisible;
                    if (gridVisible) {
                        gridGroup = buildGrid();
                        svg.appendChild(gridGroup);
                    } else if (gridGroup && gridGroup.parentNode) {
                        gridGroup.parentNode.removeChild(gridGroup);
                        gridGroup = null;
                    }
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                });
            }
            
            if (loadConceptBtn) {
                loadConceptBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    alert("Load Concept feature will integrate with API to fetch vocabulary for logographic languages with TLR support.");
                });
            }
            
            if (startQuizBtn) {
                startQuizBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    const currentData = isStatesMode ? conceptData : transitionsData;
                    const randomIndex = Math.floor(Math.random() * currentData.length);
                    showQuiz(randomIndex, null);
                });
            }
            
            if (toggleArraysBtn) {
                toggleArraysBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    const visibility = changingArray.style.display === 'none' || changingArray.style.display === '';
                    changingArray.style.display = visibility ? 'block' : 'none';
                    negativeArray.style.display = visibility ? 'block' : 'none';
                });
            }
            
            if (toggleChangingBtn) {
                toggleChangingBtn.addEventListener('click', function() {
                    toggleArrayVisibility('changing');
                });
            }
            
            if (toggleNegativeBtn) {
                toggleNegativeBtn.addEventListener('click', function() {
                    toggleArrayVisibility('negative');
                });
            }
            
            document.addEventListener('click', function(e) {
                if (quizContainer.style.display !== 'none' && 
                    !quizContainer.contains(e.target) &&
                    !e.target.classList.contains('textBox') &&
                    !e.target.classList.contains('sliding-text')) {
                    
                    quizContainer.style.display = 'none';
                    currentQuizIndex = -1;
                    
                    if (!isStatesMode && slidingTextMode === 3) {
                        slidingTextMode = 0;
                        updateLevelIndicator();
                        updateTextBasedOnPosition(startPercent);
                    }
                }
            });
        }

        function initializeApp() {
            try {
                svg = document.getElementById("svgCanvas");
                pathLine = document.getElementById("gradualChangePath");
                conceptBackground = document.getElementById("conceptBackground");
                titleBox = document.getElementById("title-box");
                conceptIndicator = document.getElementById("concept-indicator");
                levelIndicator = document.getElementById("level-indicator");
                modeToggleBtn = document.getElementById("modeToggle");
                frame = document.getElementById("draggableFrame");
                quizContainer = document.getElementById("quizContainer");
                quizInput = document.getElementById("quizInput");
                quizCheck = document.getElementById("quizCheck");
                quizFeedback = document.getElementById("quizFeedback");
                
                changingArray = document.getElementById("changing-array");
                negativeArray = document.getElementById("negative-array");
                changingItems = document.getElementById("changing-items");
                negativeItems = document.getElementById("negative-items");
                toggleChangingBtn = document.getElementById("toggle-changing");
                toggleNegativeBtn = document.getElementById("toggle-negative");
                
                if (!svg || !pathLine || !titleBox || !modeToggleBtn || !frame) {
                    console.error("Critical elements missing");
                    return;
                }

                // Title box: TLR by default (matches the vocabulary-item
                // convention — see Conceptionary_Template_Definitions.md).
                // Was previously left showing a static HTML placeholder
                // until the title was clicked; now genuinely defaults to
                // real content from the moment the page loads.
                titleBox.textContent = titleTexts.states[0];
                currentTextIndex = 0;
                
                learnedItems = new Array(conceptData.length).fill(false);
                learnedTransitions = new Array(transitionsData.length).fill(false);
                addedChangingItems = new Array(transitionsData.length).fill(false);
                addedNegativeItems = new Array(transitionsData.length).fill(false);
                
                pathLine.setAttribute('d', `M ${pathPoints.join(' L ')}`);
                conceptBackground.setAttribute('d', `M ${pathPoints.join(' L ')} L 100,43.6 L 0,43.6 Z`);
                
                pathLength = pathLine.getTotalLength();
                
                isStatesMode = true;
                createTextBoxes();
                initializeFramePosition();
                setupEventListeners();
                
                const interactiveText = document.getElementById("interactiveText");
                if (interactiveText) interactiveText.style.display = 'none';
                
                levelIndicator.style.display = 'none';
                quizContainer.style.display = 'none';
                changingArray.style.display = 'none';
                negativeArray.style.display = 'none';
                
            } catch (error) {
                console.error("Error initializing:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

    </script>
</body>
</html>
