<script>
// ═══════════════════════════════════════════════════════════════════════
//  LOG-CR-CAL-S — Generic 365-Day Radial Calendar, Southern Hemisphere
//  © 2026 Alan William Preston
//
//  LOG (logographic) convention: 4-step click cycle TLR → TL → SL → Quiz. Quiz tests TLR. Title cycle: TLR_TITLE → TL_TITLE → SL_TITLE (no combined variant).
//  Direction: a LOG instance only exists when the language being TAUGHT (TL) uses a non-Latin script, so SL defaults to real English and TL/TLR are placeholders.
//  Data uses named object keys (sl/tl/tlr/i/type), not positional array columns (avoids the off-by-one bug class
//  that affected column-array Circular templates: see Session Starter Section 4, LOG-CR-CMP entry).
//  Season boundaries are defined ONCE (SEASON_BOUNDS) and consumed by seasonOf() and buildInnerDisc().
//  Southern Hemisphere variant: SAME day indices and angular structure as the N file (day 0 = 21 June), but the season and solar-event LABELS are swapped to what
//  actually happens in the Southern Hemisphere on those dates - mirrors the CR-SEA-TEMP-N/S precedent.
//  2026-10-30: brought to the 2026 standard - button row (Audio | Show All | Tools | Reset; there is no States/Transitions
//  mode in this template), Text size, colour schemes incl. No colour, Show All (the special-day words around the ring),
//  audio on hover/tap, Quiz tick button and movable top-left Quiz box, rounded phone frame, print. The code that does this
//  is the CR UI layer at the end of this file; the calendar logic above it is the original.
//
//  ⚠ MONTH-INDEX WARNING (established 2026-08-04, see Session Starter Section 9): month index 0 is JUNE, not January -
//  day 0 of this template is fixed at 21 June (the Northern summer solstice date; it is the Southern winter solstice here), not New Year's Day.
//  Explicit map, array index → real calendar month:
//    index 0 = JUNE  1 = JULY  2 = AUGUST  3 = SEPTEMBER  4 = OCTOBER  5 = NOVEMBER  6 = DECEMBER
//    index 7 = JANUARY  8 = FEBRUARY  9 = MARCH  10 = APRIL  11 = MAY  12 = JUNE again (wraps, days 1-20)
//  This is a DIFFERENT convention from LOG-CR-CAL-JAP.html, which starts at 1 January.
// ═══════════════════════════════════════════════════════════════════════

const LANG = {
    // --- Titles (TLR first, then TL, then SL - established LOG convention, no combined variant) ---
    titles: [
        "TLR_TITLE",          // e.g. romanized target-language title
        "TL_TITLE",           // e.g. target-language title in native script
        "SL_TITLE"            // e.g. "365-Day Calendar" (English default)
    ],
    // --- UI strings ---
    quiz_placeholder: "QUIZ_PLACEHOLDER_TEXT",       // e.g. "Type the romanized name…"
    quiz_button:      "QUIZ_BUTTON_LABEL",           // e.g. "Check"
    quiz_correct:     "QUIZ_CORRECT_LABEL",          // e.g. "Correct! ✓"
    quiz_wrong:       "QUIZ_WRONG_LABEL",            // e.g. "Try again"
    // Learned Vocabulary arrays: Right = day 0 (21 June) to day 182 (20 December); Left = day 183 (21 December) to day 364 (20 June).
    learned_vocab_right_label: "LEARNED_VOCAB_RIGHT_LABEL", // e.g. "Learned (Jun 21 - Dec 20)"
    learned_vocab_left_label:  "LEARNED_VOCAB_LEFT_LABEL",  // e.g. "Learned (Dec 21 - Jun 20)"
    // {sl} is replaced by the item's own SL text, e.g. "What is the TLR word for 'Summer Solstice'?"
    quiz_question_template: "QUIZ_QUESTION_TEMPLATE",
    // --- Season names (static labels on the inner disc; real English default) ---
    season_names: { summer: "Summer", autumn: "Autumn", winter: "Winter", spring: "Spring" },
    // --- Optional on-screen character buttons for the Quiz field; empty = no row. Accent-insensitive matching in checkQuiz() is a fallback.
    diacritic_chars: [],
    // --- Solar events (built in; universal real English SL content). Day 0 = 21 June, NOT 1 January. ---
    solarEvents: [
        { i: 0, sl: "Winter Solstice", tl: "TL-SOLAR-1", tlr: "TLR-SOLAR-1" },
        { i: 94, sl: "Spring Equinox", tl: "TL-SOLAR-2", tlr: "TLR-SOLAR-2" },
        { i: 183, sl: "Summer Solstice", tl: "TL-SOLAR-3", tlr: "TLR-SOLAR-3" },
        { i: 272, sl: "Autumnal Equinox", tl: "TL-SOLAR-4", tlr: "TLR-SOLAR-4" }
    ],
    // --- Cultural/holiday placeholder days (illustrative spacing only; replace per language) ---
    culturalDays: [
        { i: 30,  sl: "SL-SPECIAL-1", tl: "TL-SPECIAL-1", tlr: "TLR-SPECIAL-1" },
        { i: 75,  sl: "SL-SPECIAL-2", tl: "TL-SPECIAL-2", tlr: "TLR-SPECIAL-2" },
        { i: 150, sl: "SL-SPECIAL-3", tl: "TL-SPECIAL-3", tlr: "TLR-SPECIAL-3" },
        { i: 210, sl: "SL-SPECIAL-4", tl: "TL-SPECIAL-4", tlr: "TLR-SPECIAL-4" },
        { i: 260, sl: "SL-SPECIAL-5", tl: "TL-SPECIAL-5", tlr: "TLR-SPECIAL-5" },
        { i: 330, sl: "SL-SPECIAL-6", tl: "TL-SPECIAL-6", tlr: "TLR-SPECIAL-6" }
    ],
    // --- Months: [slName, tlName, tlrName, lastDay, startDay]. SL = real English; TL/TLR = placeholders. Day 0 = 21 June (see the MONTH-INDEX WARNING at the top). ---
    months: [
        ["June",      "TL-MONTH-1",  "TLR-MONTH-1",  30, 21], // idx 0  = JUNE (NOT January)
        ["July",      "TL-MONTH-2",  "TLR-MONTH-2",  31, 1],  // idx 1  = JULY
        ["August",    "TL-MONTH-3",  "TLR-MONTH-3",  31, 1],  // idx 2  = AUGUST
        ["September", "TL-MONTH-4",  "TLR-MONTH-4",  30, 1],  // idx 3  = SEPTEMBER
        ["October",   "TL-MONTH-5",  "TLR-MONTH-5",  31, 1],  // idx 4  = OCTOBER
        ["November",  "TL-MONTH-6",  "TLR-MONTH-6",  30, 1],  // idx 5  = NOVEMBER
        ["December",  "TL-MONTH-7",  "TLR-MONTH-7",  31, 1],  // idx 6  = DECEMBER
        ["January",   "TL-MONTH-8",  "TLR-MONTH-8",  31, 1],  // idx 7  = JANUARY
        ["February",  "TL-MONTH-9",  "TLR-MONTH-9",  28, 1],  // idx 8  = FEBRUARY, non-leap year default
        ["March",     "TL-MONTH-10", "TLR-MONTH-10", 31, 1],  // idx 9  = MARCH
        ["April",     "TL-MONTH-11", "TLR-MONTH-11", 30, 1],  // idx 10 = APRIL
        ["May",       "TL-MONTH-12", "TLR-MONTH-12", 31, 1],  // idx 11 = MAY
        ["June",      "TL-MONTH-1",  "TLR-MONTH-1",  20, 1]   // idx 12 = JUNE again, days 1-20, wraps to month 1
    ],
    // --- Date formats: {day}=numeral, {ord}=English ordinal, {month}=month name. SL = English ordinal style; TL/TLR = neutral placeholders. ---
    date_format_sl:  "{ord} {month}",
    date_format_tl:  "{day} {month}",
    date_format_tlr: "{day} {month}"
};

// ═══════════════════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════════════════
const CX = 50, CY = 50;
const R_IN  = 30;   // inner edge of day ring (= outer edge of seasonal disc)
const R_OUT = 40;   // outer edge of day ring
const DEG   = 360 / 365;   // degrees per day

// Season boundaries - SINGLE SOURCE OF TRUTH. Day 0 = 21 June, NOT 1 January. The LABELS are swapped relative to N: day-range [0,93] is winter south of the equator.
const SEASON_BOUNDS = { winter: [0, 93], spring: [94, 182], summer: [183, 271], autumn: [272, 364] };

// Colour palette
const SC = {
    summer: { base: 'rgba(34,139,34,0.35)',   hover: 'rgba(15,90,15,0.62)'   },
    autumn: { base: 'rgba(255,140,0,0.35)',   hover: 'rgba(190,95,0,0.62)'   },
    winter: { base: 'rgba(176,224,230,0.50)', hover: 'rgba(90,150,180,0.75)' },
    spring: { base: 'rgba(144,238,144,0.50)', hover: 'rgba(40,170,40,0.70)'  }
};

function ord(n) {
    const s = ['th','st','nd','rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function formatDate(day, month, template) {
    return template.replace('{ord}', ord(day)).replace('{day}', day).replace('{month}', month);
}
function buildDays() {
    const days = [];
    LANG.months.forEach(([mSL, mTL, mTLR, last, start]) => {
        for (let d = start; d <= last; d++) {
            days.push({
                index: days.length,
                day: d, mSL, mTL, mTLR,
                dateTLR: formatDate(d, mTLR, LANG.date_format_tlr),
                dateTL:  formatDate(d, mTL,  LANG.date_format_tl),
                dateSL:  formatDate(d, mSL,  LANG.date_format_sl)
            });
        }
    });
    return days; // exactly 365
}
const DAYS = buildDays();

function seasonOf(i) {
    for (const name of Object.keys(SEASON_BOUNDS)) {
        const [s, e] = SEASON_BOUNDS[name];
        if (i >= s && i <= e) return name;
    }
    return 'summer';
}
// Polar → SVG  (0° = top, clockwise)
function pol(angleDeg, r) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
}
// Arc path for one day segment (ring between R_IN and R_OUT)
function arcPath(i) {
    const a1 = (i * DEG - 90) * Math.PI / 180;
    const a2 = ((i + 1) * DEG - 90) * Math.PI / 180;
    const xi1 = CX + R_IN  * Math.cos(a1), yi1 = CY + R_IN  * Math.sin(a1);
    const xi2 = CX + R_IN  * Math.cos(a2), yi2 = CY + R_IN  * Math.sin(a2);
    const xo1 = CX + R_OUT * Math.cos(a1), yo1 = CY + R_OUT * Math.sin(a1);
    const xo2 = CX + R_OUT * Math.cos(a2), yo2 = CY + R_OUT * Math.sin(a2);
    return `M${xi1} ${yi1} L${xo1} ${yo1} A${R_OUT} ${R_OUT} 0 0 1 ${xo2} ${yo2} L${xi2} ${yi2} A${R_IN} ${R_IN} 0 0 0 ${xi1} ${yi1}Z`;
}
// Diacritic-insensitive fallback comparison - strips combining marks so e.g. "Müller" vs "Muller" still matches.
function normalizeForCompare(str) {
    return str.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}

// SPECIAL DAYS (solar events + cultural placeholders, merged)
const SPECIAL = [
    ...LANG.solarEvents.map(s => ({ ...s, t: 'solar'   })),
    ...LANG.culturalDays.map(s => ({ ...s, t: 'holiday' }))
];
const SPECIAL_MAP = {};
SPECIAL.forEach(s => { SPECIAL_MAP[s.i] = s; });

// STATE
const clickState = {};    // dayIndex → 0 (hidden) | 1 (TLR) | 2 (TL) | 3 (SL)
const learned    = {};    // dayIndex → boolean
SPECIAL.forEach(s => { clickState[s.i] = 0; learned[s.i] = false; });
let activeDay      = -1;
let currentQuizDay = -1;

// BUILD INNER SEASONAL DISC (sectors derived from SEASON_BOUNDS so they align with the outer ring and seasonOf())
function buildInnerDisc() {
    const g  = document.getElementById('inner-disc');
    const lg = document.getElementById('season-labels');
    Object.keys(SEASON_BOUNDS).forEach(name => {
        const [s, eIncl] = SEASON_BOUNDS[name];
        const e = eIncl + 1; // exclusive end for angle math
        const angStart = s * DEG;
        const angEnd   = e * DEG;
        const span     = angEnd - angStart;
        const a1 = (angStart - 90) * Math.PI / 180;
        const a2 = (angEnd   - 90) * Math.PI / 180;
        const x1 = CX + R_IN * Math.cos(a1), y1 = CY + R_IN * Math.sin(a1);
        const x2 = CX + R_IN * Math.cos(a2), y2 = CY + R_IN * Math.sin(a2);
        const laf = span > 180 ? 1 : 0;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', `M${CX} ${CY} L${x1} ${y1} A${R_IN} ${R_IN} 0 ${laf} 1 ${x2} ${y2} Z`);
        p.style.fill        = SC[name].base;
        p.style.stroke      = '#bbb';
        p.style.strokeWidth = '0.2';
        g.appendChild(p);
        const midAng = angStart + span / 2;
        const [lx, ly] = pol(midAng, 18);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', lx); t.setAttribute('y', ly);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.setAttribute('font-size', '2.8');
        t.setAttribute('font-weight', 'bold');
        t.setAttribute('font-family', 'Arial,sans-serif');
        t.setAttribute('fill', '#444');
        t.textContent = LANG.season_names[name].toUpperCase();
        lg.appendChild(t);
    });
}

// BUILD 365-DAY OUTER RING
function buildDayRing() {
    const g       = document.getElementById('day-ring');
    const tooltip = document.getElementById('day-tooltip');
    const tipTLR  = document.getElementById('tip-tlr');
    const tipTL   = document.getElementById('tip-tl');
    DAYS.forEach(day => {
        const i   = day.index;
        const col = SC[seasonOf(i)];
        const sp  = SPECIAL_MAP[i];
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', arcPath(i));
        path.setAttribute('data-day', i);
        path.style.fill        = learned[i] ? 'rgba(255,215,0,0.55)' : col.base;
        path.style.stroke      = sp ? (sp.t === 'solar' ? '#FFD700' : '#D4900A') : 'rgba(0,0,0,0.07)';
        path.style.strokeWidth = sp ? (sp.t === 'solar' ? '0.35' : '0.22') : '0.05';
        path.style.cursor      = sp ? 'pointer' : 'default';
        if (learned[i]) path.classList.add('cal-learned');
        path.addEventListener('mouseenter', () => {
            if (!learned[i]) path.style.fill = col.hover;
            if (sp) path.style.strokeWidth = sp.t === 'solar' ? '0.55' : '0.40';
            tipTLR.textContent = day.dateTLR;
            tipTL.textContent  = day.dateTL;
            tooltip.style.display = 'block';
            updateDecoration(i);
        });
        path.addEventListener('mousemove', e => {
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top  = (e.clientY - 40) + 'px';
        });
        path.addEventListener('mouseleave', () => {
            path.style.fill = learned[i] ? 'rgba(255,215,0,0.55)' : col.base;
            if (sp) path.style.strokeWidth = sp.t === 'solar' ? '0.35' : '0.22';
            tooltip.style.display = 'none';
        });
        if (sp) path.addEventListener('click', () => handleSpecialClick(i));
        g.appendChild(path);
    });
}

// SPECIAL DAY CLICK HANDLER (TLR → TL → SL → Quiz, 4-step LOG cycle)
const infoPanel = document.getElementById('info-panel');
const infoTLR   = document.getElementById('info-tlr');
const infoTL    = document.getElementById('info-tl');
const infoSL    = document.getElementById('info-sl');
const infoDate  = document.getElementById('info-date');

function handleSpecialClick(dayIdx) {
    if (learned[dayIdx]) return;
    const sp  = SPECIAL_MAP[dayIdx];
    const day = DAYS[dayIdx];
    if (activeDay !== dayIdx) {
        clickState[dayIdx] = 1;
        activeDay = dayIdx;
    } else {
        clickState[dayIdx]++;
    }
    const state = clickState[dayIdx];
    const dateLine = day.dateTLR + '  ·  ' + day.dateTL + '  ·  ' + day.dateSL;
    if (state === 1) {
        infoTLR.textContent      = sp.tlr;
        infoTL.style.display     = 'none';
        infoSL.style.display     = 'none';
        infoDate.textContent     = dateLine;
        infoPanel.style.display  = 'block';
    } else if (state === 2) {
        infoTLR.textContent      = sp.tlr;
        infoTL.textContent       = sp.tl;
        infoTL.style.display     = 'block';
        infoSL.style.display     = 'none';
        infoDate.textContent     = dateLine;
        infoPanel.style.display  = 'block';
    } else if (state === 3) {
        infoTLR.textContent      = sp.tlr;
        infoTL.textContent       = sp.tl;
        infoTL.style.display     = 'block';
        infoSL.textContent       = sp.sl;
        infoSL.style.display     = 'block';
        infoDate.textContent     = dateLine;
        infoPanel.style.display  = 'block';
    } else {
        infoPanel.style.display = 'none';
        launchQuiz(dayIdx);
    }
}

// QUIZ
function launchQuiz(dayIdx) {
    currentQuizDay = dayIdx;
    const sp = SPECIAL_MAP[dayIdx];
    document.getElementById('quizQuestion').textContent =
        LANG.quiz_question_template.replace('{sl}', sp.sl);
    document.getElementById('quizInput').value = '';
    document.getElementById('quizFeedback').textContent = '';
    document.getElementById('quizContainer').style.display = 'block';
    setTimeout(() => { try { document.getElementById('quizInput').focus(); } catch(e) {} }, 100);
}

function checkQuiz() {
    if (currentQuizDay < 0) return;
    const sp     = SPECIAL_MAP[currentQuizDay];
    const answer = document.getElementById('quizInput').value.trim();
    const fb     = document.getElementById('quizFeedback');
    const exact      = answer.toLowerCase() === sp.tlr.toLowerCase();
    const normalized = normalizeForCompare(answer) === normalizeForCompare(sp.tlr);
    if (exact || normalized) {
        fb.textContent = LANG.quiz_correct;
        fb.style.color = 'green';
        learned[currentQuizDay] = true;
        markLearned(currentQuizDay);
        addToVocabularyArray(currentQuizDay);
        setTimeout(() => {
            document.getElementById('quizContainer').style.display = 'none';
            currentQuizDay = -1;
            activeDay = -1;
        }, 1500);
    } else {
        fb.textContent = LANG.quiz_wrong;
        fb.style.color = 'red';
    }
}

function markLearned(dayIdx) {
    const path = document.querySelector(`[data-day="${dayIdx}"]`);
    if (path) {
        path.classList.add('cal-learned');
        path.style.fill        = 'rgba(255,215,0,0.55)';
        path.style.stroke      = '#B8860B';
        path.style.strokeWidth = '0.45';
    }
}

function addToVocabularyArray(dayIdx) {
    const sp = SPECIAL_MAP[dayIdx];
    if (!sp) return;
    const entry = document.createElement('div');
    entry.className = 'lv-entry';
    entry.innerHTML =
        `<span class="lv-tlr">${sp.tlr}</span>` +
        `<span class="lv-tl">${sp.tl}</span><br>` +
        `<span class="lv-sl">${sp.sl}</span>`;
    // Right: day 0 (21 June) through day 182 (20 December). Left: day 183 (21 December) through day 364 (20 June).
    const targetId = dayIdx <= 182 ? 'lv-list-right' : 'lv-list-left';
    document.getElementById(targetId).appendChild(entry);
}

// CENTRAL SEASONAL DECORATION
function updateDecoration(dayIdx) {
    const ids = ['snowflake','cherry1','cherry2','cherry3','cherry4','cherry5','summer-sun','leaf'];
    ids.forEach(id => { const el = document.getElementById(id); if (el) el.setAttribute('opacity','0'); });
    switch (seasonOf(dayIdx)) {
        case 'winter': document.getElementById('snowflake').setAttribute('opacity','1'); break;
        case 'spring': ['cherry1','cherry2','cherry3','cherry4','cherry5'].forEach(id => document.getElementById(id).setAttribute('opacity','1')); break;
        case 'summer': document.getElementById('summer-sun').setAttribute('opacity','1'); break;
        case 'autumn': document.getElementById('leaf').setAttribute('opacity','1'); break;
    }
}

// TITLE CYCLE
let titleIdx = 0;

// DIACRITIC CHARACTER ROW (built from LANG.diacritic_chars; hidden if empty)
function buildCharRow() {
    const row = document.getElementById('charRow');
    if (!LANG.diacritic_chars || LANG.diacritic_chars.length === 0) { row.classList.add('empty'); return; }
    LANG.diacritic_chars.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'char-button';
        btn.type = 'button';
        btn.textContent = ch;
        btn.addEventListener('click', e => {
            e.preventDefault();
            const inp = document.getElementById('quizInput');
            const pos = inp.selectionStart;
            inp.value = inp.value.substring(0, pos) + ch + inp.value.substring(pos);
            inp.focus();
            inp.setSelectionRange(pos + 1, pos + 1);
        });
        row.appendChild(btn);
    });
}

// OUTSIDE-CLICK DISMISSAL (the Quiz box is moved by the CR UI layer below)
document.addEventListener('click', e => {
    const ring = document.getElementById('day-ring');
    const qc   = document.getElementById('quizContainer');
    if (infoPanel.style.display !== 'none' && !infoPanel.contains(e.target) && !ring.contains(e.target)) {
        infoPanel.style.display = 'none';
        if (activeDay >= 0) clickState[activeDay] = 0;
        activeDay = -1;
    }
    if (qc.style.display !== 'none' && !qc.contains(e.target) && !ring.contains(e.target)) {
        qc.style.display = 'none';
        if (currentQuizDay >= 0) clickState[currentQuizDay] = 0;
        currentQuizDay = -1;
    }
});

// INITIALISE
function init() {
    buildInnerDisc();
    buildDayRing();
    buildCharRow();
    updateDecoration(0);
    document.getElementById('title-box').textContent = LANG.titles[0];
    document.getElementById('title-box').addEventListener('click', function () {
        this.classList.add('hidden');
        setTimeout(() => {
            titleIdx = (titleIdx + 1) % LANG.titles.length;
            this.textContent = LANG.titles[titleIdx];
            this.classList.remove('hidden');
        }, 500);
    });
    document.getElementById('quizInput').placeholder = LANG.quiz_placeholder;
    document.getElementById('quizCheck').textContent  = LANG.quiz_button;
    document.getElementById('quizCheck').addEventListener('click', checkQuiz);
    document.getElementById('quizInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkQuiz(); });
    document.querySelector('#learned-vocab-left .lv-title').textContent  = LANG.learned_vocab_left_label;
    document.querySelector('#learned-vocab-right .lv-title').textContent = LANG.learned_vocab_right_label;
}
document.addEventListener('DOMContentLoaded', init);

        const open = SPECIAL.filter(function (s) { return !learned[s.i]; });

    });
    $('quizToggle').addEventListener('click', function (e) {

    // ----- Quiz box: opens top-left, below the left Learned list; grab it anywhere except the text field and buttons to move it -----
    (function () {

        }

            const inp = $('quizInput'), row = document.createElement('div'); row.className = 'quizRow';
            inp.parentNode.insertBefore(row, inp); row.appendChild(inp);
            const tick = document.createElement('button'); tick.id = 'quizTick'; tick.type = 'button'; tick.textContent = '✓'; tick.title = 'Check my answer'; tick.setAttribute('aria-label', 'Check my answer');
            row.appendChild(tick);

    }

        }

    } };
})();

<script>
// 2026-10-28 audio cycle + tick + timing ------------------------------------------------------------------------------------------------------------
// AUDIO BUTTON. One click cycles:  TL + SL (default: hear the target language, then the source language on the next tap)
//                                   ->  TL only  ->  Silent  ->  back to TL + SL.   The volume slider runs along the bottom of the button.
// The language names on the button come from the App (window.CONCEPTIONARY_AUDIO_LANG / _SL_LANG codes, or the label overrides
// window.CONCEPTIONARY_AUDIO_TL_LABEL / _SL_LABEL, e.g. 'IND' or '中文'). Logographic (LOG) templates stay silent on the TLR layer on purpose.
(function () {
    const api = window.__auApi, oldBtn = document.getElementById('audioBtn');
    if (!api || !oldBtn || document.getElementById('auCycle')) return;
    const AB = { en: 'ENG', id: 'IND', ms: 'MSA', ja: 'JPN', ko: 'KOR', zh: '中文', fr: 'FRA', de: 'DEU', es: 'SPA', it: 'ITA', pt: 'POR', ru: 'RUS', ar: 'ARA', hi: 'HIN', th: 'THA', vi: 'VIE', mi: 'MRI', fil: 'FIL', tl: 'FIL', nl: 'NLD', sv: 'SWE', tr: 'TUR', pl: 'POL', el: 'ELL', he: 'HEB', sm: 'SMO', to: 'TON', fj: 'FIJ' };
    const AUDIO_API_URL = window.CONCEPTIONARY_AUDIO_API_URL || '';
    const st = { mode: 0, vol: 0.8, last: '', lastT: 0, timer: null, cur: null, pt: 'mouse' };      // mode 0 = TL+SL, 1 = TL only, 2 = silent
    const tlCode = function () { return window.CONCEPTIONARY_AUDIO_LANG || ''; };
    const slCode = function () { return window.CONCEPTIONARY_AUDIO_SL_LANG || ''; };
    function abbr(code, fallback, override) { if (override) return override; if (!code) return fallback; const b = code.toLowerCase().split(/[-_]/)[0]; return AB[b] || b.toUpperCase(); }
    const tlName = function () { return abbr(tlCode(), 'TL', window.CONCEPTIONARY_AUDIO_TL_LABEL); };
    const slName = function () { return abbr(slCode(), 'SL', window.CONCEPTIONARY_AUDIO_SL_LABEL); };

    // ----- the button -----
    const wrap = document.createElement('div'); wrap.id = 'audioWrap'; wrap.className = 'reset-btn audio-btn';
    const cyc = document.createElement('button'); cyc.id = 'auCycle'; cyc.type = 'button';
    const vol = document.createElement('input'); vol.type = 'range'; vol.id = 'auVol2'; vol.min = 0; vol.max = 100; vol.step = 5; vol.value = 80; vol.setAttribute('aria-label', 'Volume');
    const ico = document.createElement('span'); ico.id = 'auSpk'; ico.title = 'Audio'; const SPK = {"0": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path fill=\"black\" d=\"M2 9v6h4l5 4V5L6 9H2z\"/><g fill=\"none\" stroke=\"black\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13\"/></g></svg>", "1": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path fill=\"black\" d=\"M2 9v6h4l5 4V5L6 9H2z\"/><g fill=\"none\" stroke=\"black\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M16 8.5a5 5 0 0 1 0 7\"/></g></svg>", "2": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path fill=\"black\" d=\"M2 9v6h4l5 4V5L6 9H2z\"/><g fill=\"none\" stroke=\"black\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M16 9l6 6M22 9l-6 6\"/></g></svg>"};
    ico.addEventListener('click', function (e) { e.stopPropagation(); cyc.click(); });
    wrap.appendChild(cyc); wrap.appendChild(ico); wrap.appendChild(vol); oldBtn.parentNode.insertBefore(wrap, oldBtn); oldBtn.style.display = 'none';
    const toast = document.createElement('div'); toast.id = 'auToast'; document.body.appendChild(toast);
    let toastT = null;
    function note(text) {
        toast.textContent = text; toast.style.opacity = '1';
        const r = wrap.getBoundingClientRect();
        toast.style.left = '0px'; toast.style.top = '0px';
        const w = toast.offsetWidth, h = toast.offsetHeight;
        toast.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px';
        toast.style.top = Math.max(6, r.top - h - 8) + 'px';
        clearTimeout(toastT); toastT = setTimeout(function () { toast.style.opacity = '0'; }, 2600);
    }
    function label() {
        cyc.textContent = st.mode === 0 ? tlName() + '+' + slName() : st.mode === 1 ? tlName() : 'Silent'; ico.style.webkitMaskImage = ico.style.maskImage = 'url(data:image/svg+xml,' + encodeURIComponent(SPK[st.mode]) + ')';   /* a mask, not an inline <svg>: pages look up the first <svg> in the document */ cyc.setAttribute('aria-label', 'Audio: ' + cyc.textContent);
        cyc.title = 'Click to change: ' + tlName() + ' + ' + slName() + ' / ' + tlName() + ' only / Silent. The slider is the volume.';
    }
    function describe() { return st.mode === 0 ? 'Audio: hear the target language (' + tlName() + '), then the source language (' + slName() + ')' : st.mode === 1 ? 'Audio: target language (' + tlName() + ') only' : 'Audio: silent'; }

    // ----- speaking -----
    function pickVoice(code) {
        const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
        if (!code) return null;
        const c = code.toLowerCase(), base = c.split('-')[0]; let best = null, bs = -1;
        vs.forEach(function (v) {
            const l = (v.lang || '').toLowerCase().replace('_', '-');
            if (l !== c && l.split('-')[0] !== base) return;
            const s = (l === c ? 4 : 0) + (/natural|neural|online/i.test(v.name) ? 3 : 0) + (/google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
            if (s > bs) { best = v; bs = s; }
        });
        return best;
    }
    function stop() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} if (st.cur) { try { st.cur.pause(); } catch (e) {} st.cur = null; } }
    function playUrl(u) { stop(); const a = new Audio(u); a.volume = st.vol; st.cur = a; a.play().catch(function () { note('The browser blocked the sound: tap the page once and try again.'); }); }
    function viaBrowser(text, code) {
        if (!window.speechSynthesis) { note('This browser cannot speak.'); return; }
        const v = pickVoice(code);
        if (code && !v) { note('No ' + code + ' voice on this device.'); return; }
        if (st.cur) { try { st.cur.pause(); } catch (e) {} st.cur = null; }
        const u = new SpeechSynthesisUtterance(text);
        if (code) u.lang = code; if (v) u.voice = v; u.volume = st.vol;

        let started = false; u.onstart = function () { started = true; };
        u.onerror = function (ev) { if (ev.error && ev.error !== 'interrupted' && ev.error !== 'canceled') note('The device could not speak (' + ev.error + ').'); };
        const go = function () {
            try { speechSynthesis.resume(); } catch (e) {}
            speechSynthesis.speak(u);
            setTimeout(function () { if (!started && window.__auUtt === u) { try { speechSynthesis.cancel(); } catch (e) {} } }, 2500);   // stuck phone queue: clear it so the next tap works
        };
        if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 120); } else go();
    }
    function viaCloud(text, code) {
        fetch(AUDIO_API_URL + '?text=' + encodeURIComponent(text) + '&lang=' + encodeURIComponent(code))
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
            .then(function (b) { playUrl(URL.createObjectURL(b)); })
            .catch(function () { note('The audio service could not be reached.'); });
    }
    function speak(text, code) {
        if (st.mode === 2 || !text) return;
        const key = code + '|' + text, now = Date.now();
        if (key === st.last && now - st.lastT < 1200) return;   // one word, one sound
        st.last = key; st.lastT = now;
        const files = window.CONCEPTIONARY_AUDIO_FILES;
        if (files && files[text]) { playUrl(files[text]); return; }
        if (AUDIO_API_URL && code) viaCloud(text, code); else viaBrowser(text, code);
    }
    // Speak what the word is showing right now: the TL layer, or (in TL+SL mode) the SL layer. The LOG romanisation layer is never spoken.
    function speakEl(el) {
        if (st.mode === 2) return;
        const i = api.info(el); if (!i) return;
        if (i.tl && i.shown === i.tl) { st.slDone = null; speak(i.tl, tlCode()); }
        else if (i.tlr && i.shown === i.tlr) { st.slDone = null; return; }
        else if (st.mode === 0 && i.sl && i.shown === i.sl) { if (st.slDone && st.slDone.el === el && st.slDone.text === i.sl) return; st.slDone = { el: el, text: i.sl }; speak(i.sl, slCode()); }   // the SL is heard once: the click on to the Quiz does not repeat it
    }
    const SEL = '.textBox,.showall-word,#interactiveText,#transitionText,.vocabulary-item span,#titleBox,#title-box,#day-ring path,.lv-entry span';
    const find = function (e) { const t = e.target; return (t && t.closest) ? t.closest(SEL) : null; };
    document.addEventListener('pointerover', function (e) { st.pt = e.pointerType || 'mouse'; }, true);
    document.addEventListener('pointerdown', function (e) { st.pt = e.pointerType || 'mouse'; if (e.pointerType === 'mouse' || st.mode === 2) return; const el = find(e); if (el) speakEl(el); }, true);   // touch: speak the word you tapped, before it changes layer
    // MOUSEOVER = audio. One hover per arrival on a word (also a word lying under the yellow frame); leaving the word re-arms it.
    const FRAMES = ['draggableFrame', 'statesFrame', 'transitionsFrame', 'transitionFrame'];
    let curHover = null;
    function wordAt(e) {
        const el = find(e); if (el) return el;
        const t = e.target;
        if (t && t.id && FRAMES.indexOf(t.id) >= 0) { const hit = document.elementsFromPoint(e.clientX, e.clientY).find(function (n) { return n !== t && n.matches && n.matches(SEL) && n.textContent.trim(); }); return hit || null; }
        return null;
    }
    document.addEventListener('mousemove', function (e) {
        if (st.pt !== 'mouse') return;
        const el = wordAt(e);
        if (el === curHover) return;
        curHover = el; st.slDone = null; clearTimeout(st.timer);
        if (el && st.mode !== 2) st.timer = setTimeout(function () { speakEl(el); }, 130);
    });
    document.addEventListener('mouseleave', function () { curHover = null; clearTimeout(st.timer); });
    document.addEventListener('click', function (e) { if (st.pt !== 'mouse' || st.mode === 2) return; const el = find(e); if (el) setTimeout(function () { speakEl(el); }, 80); }, true);   // mouse: after the click has changed the layer

    cyc.addEventListener('click', function (e) {
        e.stopPropagation();
        st.mode = (st.mode + 1) % 3; label(); if (st.mode === 2) stop();

    window.addEventListener('load', label); label();
    vol.style.setProperty('--p', vol.value + '%'); vol.addEventListener('input', function () { vol.style.setProperty('--p', vol.value + '%'); });
    window.__auCycle = { get mode() { return st.mode; }, label: label };
})();

// 2026-10-28 audio cycle + tick + timing ------------------------------------------------------------------------------------------------------------
// QUIZ TICK: a small tick button at the right end of the text field replaces the Check button (never hidden behind a phone keyboard)
(function () {
    const inp = document.getElementById('quizInput'), chk = document.getElementById('quizCheck');
    if (!inp || !chk || document.getElementById('quizTick')) return;
    const row = document.createElement('div'); row.className = 'quizRow';
    inp.parentNode.insertBefore(row, inp); row.appendChild(inp);
    const tick = document.createElement('button'); tick.id = 'quizTick'; tick.type = 'button'; tick.textContent = '✓'; tick.title = 'Check my answer'; tick.setAttribute('aria-label', 'Check my answer');
    row.appendChild(tick);
    tick.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep the keyboard open and the cursor in the text field
    tick.addEventListener('click', function () { chk.click(); });
})();

<script>
// 2026-10-29b interaction standard: the click the browser sends to the yellow frame after a tap/click that was passed down to a word must not reach the page
// (it would count as a click "outside" the Quiz box and close it).
(function () {
    let lastSyn = 0;
    document.addEventListener('click', function (e) { if (!e.isTrusted) lastSyn = Date.now(); }, true);
    ['draggableFrame', 'statesFrame', 'transitionsFrame', 'transitionFrame'].forEach(function (id) {
        const fr = document.getElementById(id); if (!fr) return;
        fr.addEventListener('click', function (e) { if (e.isTrusted && Date.now() - lastSyn < 500) { e.stopPropagation(); e.preventDefault(); } }, true);
    });
})();
