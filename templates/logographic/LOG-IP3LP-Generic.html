<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG-IP3LP Generic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            overflow: hidden;
        }

        .a4-page {
            width: 90vw;
            height: 70vh;
            border: 5px solid black;
            background-color: white;
            box-sizing: border-box;
            position: relative;
            touch-action: none;
            z-index: 1;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .path-line {
            stroke: black;
            stroke-width: 0.025;
            fill: none;
        }

        /* Background gradient - positive theme */
        #conceptBackground {
            fill: url(#positiveGradient);
            opacity: 0.3;
        }

        /* States Template Elements */
        .textBox {
            cursor: pointer;
            font-size: 0.4em;
            fill: black;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5);
        }

        .textBox.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .textBox.learned {
            opacity: 1;
            transform: scale(1) translateY(0);
            fill: green;
        }

        #draggableFrame {
            cursor: grab;
            fill: rgba(255, 255, 0, 0.6);
            stroke: #ccaa00;
            stroke-width: 0.1;
            pointer-events: all;
            opacity: 1;
            filter: drop-shadow(0 0.3px 0.5px rgba(0,0,0,0.3));
            transition: fill 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease, filter 0.2s ease;
        }

        #draggableFrame:hover {
            fill: rgba(255, 255, 0, 0.8);
            stroke: #ffcc00;
            stroke-width: 0.15;
            cursor: grab;
            filter: drop-shadow(0 0.5px 1px rgba(204, 170, 0, 0.6)) drop-shadow(0 0 2px rgba(255, 255, 100, 0.8));
        }

        #draggableFrame.dragging {
            cursor: grabbing;
            fill: transparent;
            stroke-width: 0.1;
            filter: drop-shadow(0 0.5px 1px rgba(255, 170, 0, 0.6)) drop-shadow(0 0 2px rgba(255, 220, 0, 0.8));
            stroke: #ffaa00;
        }

        /* Transitions Template Elements */
        .sliding-text {
            font-size: 4px;
            font-weight: bold;
            fill: #2e7d32;
            cursor: pointer;
        }
        
        .sliding-text.learned {
            fill: #1b5e20;
        }

        /* Common Title Box Styling */
        .title-box {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 1px solid black;
            padding: 10px;
            background-color: white;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .title-box.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }
        
        /* Mode Toggle Button */
        .mode-toggle {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            padding: 8px 16px;
            background-color: #e8f5e8;
            border: 1px solid #4caf50;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
        }
        
        /* Mode Indicator (tap to switch between TL and SL) */
        .mode-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9em;
            font-weight: bold;
            padding: 8px 16px;
            background-color: white;
            border: 2px solid #4caf50;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
            user-select: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .mode-indicator.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }

        /* Instruction panel: fades after 12 s (pointer-events none so it
           can never block the frame or the sliding text underneath) */
        .drag-instruction {
            position: absolute;
            top: 106px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85em;
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 3;
            opacity: 1;
            transition: opacity 2s ease;
            text-align: center;
            pointer-events: none;
        }

        .drag-instruction.fade {
            opacity: 0;
        }

        /* Concept Indicator */
        .concept-indicator {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #4caf50;
            border-radius: 4px;
            z-index: 3;
        }
        
        /* Level indicator for transitions mode */
        .level-indicator {
            position: absolute;
            top: 106px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #4caf50;
            border-radius: 4px;
            z-index: 3;
        }

        /* Quiz container styles */
        .quiz-container {
            box-sizing: border-box;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 3px solid #4caf50;
            border-radius: 4px;
            padding: 12px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 92vw;

            pointer-events: auto;
            visibility: visible;
            cursor: grab;
            user-select: none;
            opacity: 1;
        }
        
        .quiz-container.dragging {
            cursor: grabbing;
        }

        .quiz-container.keyboard-open {
            top: 8px;
            transform: translate(-50%, 0);
            max-width: 90vw;

            padding: 8px;

        .quiz-container.keyboard-open input {

        .quiz-container.keyboard-open #quizFeedback {

        .quiz-container input {

        .quiz-container button {

        .quiz-container button:hover {

        #quizFeedback {
            text-align: center;

            margin-top: 8px;

        }

        /* Vocabulary Arrays Styles */
        .vocabulary-array {
            position: fixed;
            top: 2%;
            width: 22.5vw;
            max-height: calc(100vh - 40px);   /* grows with its content; only the screen height caps it (40px allows for padding + border) */
            overflow-y: auto;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #4caf50;
            border-radius: 4px;
            padding: 5px;
            z-index: 4;
            display: none;
        }

        #vocabulary-array {
            left: 5%;   /* fallback only: setupArrayDrag() places it at 5% across / 2% down the template box */
        }

        /* Learned Vocabulary array is draggable anywhere on screen (see setupArrayDrag).
           touch-action:none lets a finger drag it; when the list overflows, JS adds
           .scrollable so vertical swipes scroll the list instead (title stays a drag handle). */
        .vocabulary-array {
            touch-action: none;
        }
        .vocabulary-array.scrollable {
            touch-action: pan-y;
        }
        .vocabulary-array.dragging {
            user-select: none;
            -webkit-user-select: none;

        .array-title {

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .vocabulary-array.dragging .array-title {

        }

        /* Redundant in this family (removed from view 2026-09-20). The elements and the JS that

        .level-indicator,
        .concept-indicator {

            color: #1b5e20;

            padding: 2px 5px;

        .vocabulary-item .target-language-roman.hidden,
        .vocabulary-item .source-language.hidden,

        /* Toggle visibility button */
        .toggle-visibility {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7em;
            padding: 2px 5px;
            background-color: #e8f5e8;

            border-radius: 3px;

        .tools-menu {

        .tools-button {
            background-color: #e8f5e8;

        .tools-dropdown.active {

        .tool-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            pointer-events: auto;

        /* ── Mobile sizing: text and touch targets ────────────────────
           Text roughly doubled for SVG text, touch targets enlarged to
           meet the ~48px guideline, matching the fix applied across the
           GT5L/GP3L/IT5L family. The frame circle's radius is doubled in
           JS (setFrameRadiusForDevice) because the drag code reads it
           via getAttribute(). Not yet visually confirmed on a real
           device. Treat as a starting point. */
        @media (pointer: coarse) {
            .textBox {
                font-size: 0.8em;
            }
            .sliding-text {
                font-size: 8px;
            }
            .tools-button,
            .mode-toggle {

            }
            .mode-indicator {

            .concept-indicator {
                bottom: 110px;
            }
            .toggle-visibility {
                min-height: 48px;
                min-width: 48px;

                font-size: 0.9em;
            }
            .tools-dropdown {
                top: 56px;
            }
            .tool-item {
                min-height: 48px;
                padding: 16px 15px;
                font-size: 0.95em;
            }

<body>
    <div class="a4-page">
        <div id="title-box" class="title-box"></div>
        <div id="concept-indicator" class="concept-indicator">Position</div>
        <div id="level-indicator" class="level-indicator">TL Roman</div>
        <div id="mode-indicator" class="mode-indicator">SL States Mode</div>
        <div id="drag-instruction" class="drag-instruction">Mobile Phone users: click 'Tools' then 'Full Screen'.<br><br>Click on it, grab it and move it around.<br>Click on the words - and click again.</div>
        
        <!-- Tools Menu -->
        <div class="tools-menu">
            <div class="tools-button">Tools</div>
            <div class="tools-dropdown">
                <div class="tool-item" id="toggleFullscreen">Full Screen</div>
                <div class="tool-item" id="loadConcept">Load Concept</div>
                <div class="tool-item" id="startQuiz">Quick Quiz</div>
                <div class="tool-item" id="toggleArrays">Toggle Vocabulary</div>
            </div>
        </div>
        
        <!-- Vocabulary Array: ONE combined list of learned items, kept in path order (T1..T3).
             Instant-change concepts have no "increasing" or "decreasing" progression. -->
        <div id="vocabulary-array" class="vocabulary-array">
            <div class="array-title">Learned Vocabulary</div>
            <button class="toggle-visibility" id="toggle-vocabulary">Hide All</button>
            <div id="vocabulary-items"></div>
        </div>
        
        <svg id="svgCanvas" viewBox="-30 0 160 50" preserveAspectRatio="xMidYMid meet">
            <!-- Positive Gradient -->
            <defs>
                <linearGradient id="positiveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#81c784;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#a5d6a7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <path id="gradualChangePath" class="path-line" />
            <path id="conceptBackground"></path>
            
            <!-- States Mode Elements -->
            <circle id="draggableFrame" cx="-28.5" cy="40" r="1.5"/>
            
            <!-- Transitions Mode Elements - Single Draggable Text -->
            <text id="interactiveText" class="sliding-text">
                <textPath id="slidingText" href="#gradualChangePath" startOffset="0%">
                    TLR-T1
                </textPath>
            </text>
        </svg>
        <button id="modeToggle" class="mode-toggle">Toggle Mode</button>
        <div class="watermark">
            &copy; 2026 Alan William Preston
        </div>
    </div>

    <!-- Quiz Container -->
    <div id="quizContainer" class="quiz-container">
        <input type="text" id="quizInput" placeholder="Enter the target language roman">
        <button id="quizCheck">Check</button>
        <div id="quizFeedback"></div>
    </div>

    <script>
        // Instant Permanent Positive Logographic template data with TLR
        // Format: [TLR, TL, SL, Quiz Question, Position]
        // 3 textboxes positioned at midpoints of each line
        const conceptData = [
            ["TLR1", "TL1", "SL1", "What's the target language roman for this positive change?", 25],  // Line 1 midpoint
            ["TLR2", "TL2", "SL2", "What's the target language roman for this positive change?", 50],  // Line 2 midpoint (vertical)
            ["TLR3", "TL3", "SL3", "What's the target language roman for this positive change?", 75]   // Line 3 midpoint
        ];

        // Transitions data for instant permanent positive changes
        const transitionsData = [
            ["TLR-T1", "TL-T1", "SL-T1", "What's the target language roman for this positive transition?", 25],
            ["TLR-T2", "TL-T2", "SL-T2", "What's the target language roman for this positive transition?", 50],
            ["TLR-T3", "TL-T3", "SL-T3", "What's the target language roman for this positive transition?", 75]
        ];

        // Global variables
        let isStatesMode = true;
        let pathLength = 0;
        let currentQuizIndex = -1;
        let slidingTextMode = 0; // 0: TLR, 1: TL, 2: SL, 3: Quiz
        let learnedItems = []; // For States Mode (conceptData)
        let learnedTransitions = []; // Separate array for Transitions Mode
        let textBoxElements = [];
        let addedVocabularyItems = [];
        let currentTextLayer = new Array(3).fill(0); // Start with TLR (index 0) - now only 3 boxes
        
        // TRANSITIONS MODE VARIABLES
        let startPercent = 0;
        let isDraggingText = false;
        let dragStartClientX = 0;   // pointer position at the start of a text drag (px)
        let dragStartClientY = 0;
        let dragGrabOffset = 0;     // path-length between the grab point and the text start
        const DRAG_THRESHOLD_PX = 8; // movement below this is a tap, not a drag
        let hasMovedDuringDrag = false;
        
        // Title text options
        // Title cycle: TLR (default) → TL → SL → TLR, per mode. See
        // "Logographic UI Conventions" in Conceptionary_Template_Definitions.md.
        const titleTexts = {
            states: ["TLR_TITLE_STATES", "TL_TITLE_STATES", "SL_TITLE_STATES"],
            transitions: ["TLR_TITLE_TRANSITIONS", "TL_TITLE_TRANSITIONS", "SL_TITLE_TRANSITIONS"]
        };
        let currentTextIndex = 0;

        // Mode indicator: tap to switch between TL and SL wording (default SL)
        let currentModeIndicatorIndex = 1;
        const modeIndicatorTexts = {
            states: ["TL States Mode", "SL States Mode"],
            transitions: ["TL Transitions Mode", "SL Transitions Mode"]
        };

        // Quiz box position (dragged by the learner; null = default centred)
        let quizPosition = { x: null, y: null };
        let quizJustDragged = false; // swallows the synthetic click a drag-release generates
        
        // Activation distance for text boxes
        const activationDistance = 11.4;

        // 3-LINE SYSTEM: Line1(horizontal) -> Line2(vertical up) -> Line3(horizontal, extended to 100%)
        // ViewBox: -30 to 130 (160 units wide)
        const pathPoints = [
            // Line 1: Horizontal from left edge to center connection point
            `-30,40`, 
            `50,40`,
            // Line 2: Vertical going up
            `50,20`,
            // Line 3: Horizontal extended to 100% width (full A4 frame)
            `130,20`
        ];

        // DOM elements
        let svg, pathLine, conceptBackground, titleBox, conceptIndicator, levelIndicator;
        let modeToggleBtn, frame, quizContainer, quizInput, quizCheck, quizFeedback;
        let vocabularyArray, vocabularyItems;
        let toggleVocabularyBtn;

        // TRANSITIONS MODE FUNCTIONS
        
        // Each transition owns the stretch of path belonging to its line
        // (Line 1 = T1 ... Line 3 = T3). The ranges are computed from
        // pathPoints, so they follow the real segment lengths (the two
        // vertical lines are much shorter than the horizontals) rather
        // than equal fifths of the path. Every consumer (display, quiz,
        // learned tracking) goes through getTransitionDataForPosition().
        let transitionRanges = [];

        function computeTransitionRanges() {
            const pts = pathPoints.map(p => p.split(',').map(Number));
            const lens = [];
            let total = 0;
            for (let i = 1; i < pts.length; i++) {
                const len = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
                lens.push(len);
                total += len;
            }
            transitionRanges = [];
            let acc = 0;
            lens.forEach(len => {
                transitionRanges.push([(acc / total) * 100, ((acc + len) / total) * 100]);
                acc += len;
            });
        }

        function getTransitionDataForPosition(percent) {
            if (transitionRanges.length === 0) computeTransitionRanges();
            let index = transitionsData.length - 1;
            for (let i = 0; i < transitionRanges.length && i < transitionsData.length; i++) {
                if (percent < transitionRanges[i][1]) { index = i; break; }
            }
            return { index: index, data: transitionsData[index] };
        }

        function updateTextBasedOnPosition(percent) {
            if (isStatesMode) return;
            
            percent = Math.min(100, Math.max(0, percent));
            const transitionData = getTransitionDataForPosition(percent);
            const index = transitionData.index;
            const data = transitionData.data;
            
            const textPath = document.getElementById("slidingText");
            if (!textPath) return;
            const interactiveText = document.getElementById("interactiveText");
            
            if (learnedTransitions[index]) {
                interactiveText.classList.add('learned');
                // For learned items, cycle between TLR, TL, and SL
                if (slidingTextMode === 0) {
                    textPath.textContent = data[0]; // TLR
                } else if (slidingTextMode === 1) {
                    textPath.textContent = data[1]; // TL
                } else {
                    textPath.textContent = data[2]; // SL
                }
            } else {
                interactiveText.classList.remove('learned');
                // For unlearned items, show based on current mode
                if (slidingTextMode === 0) {
                    textPath.textContent = data[0]; // TLR
                } else if (slidingTextMode === 1) {
                    textPath.textContent = data[1]; // TL
                } else if (slidingTextMode === 2) {
                    textPath.textContent = data[2]; // SL
                }
            }
            
            conceptIndicator.textContent = data[1]; // Always show SL in indicator
            updateLevelIndicator();
        }

        function updateTextPosition(percent) {
            if (isStatesMode) return;
            
            percent = Math.min(100, Math.max(0, percent));
            const textPath = document.getElementById("slidingText");
            if (textPath) {
                textPath.setAttribute("startOffset", `${percent}%`);
            }
            updateTextBasedOnPosition(percent);
        }

        // Nearest point on the path (as a length along it) to an SVG-space
        // point. When aroundLength is given, only a window of the path around
        // it is searched, so the text cannot teleport to a different line
        // when the pointer strays between two lines; null searches it all.
        function getClosestLengthOnPath(x, y, aroundLength) {
            const WINDOW = 45;
            const lo = aroundLength === null ? 0 : Math.max(0, aroundLength - WINDOW);
            const hi = aroundLength === null ? pathLength : Math.min(pathLength, aroundLength + WINDOW);
            let best = lo;
            let bestDist = Infinity;
            for (let L = lo; L <= hi; L += 0.25) {
                const p = pathLine.getPointAtLength(L);
                const dx = p.x - x;
                const dy = p.y - y;
                const d = dx * dx + dy * dy;
                if (d < bestDist) {
                    bestDist = d;
                    best = L;
                }
            }
            return best;
        }

        // The furthest the text may start along the path: any further and its
        // end runs off the end of the path, where glyphs are not drawn (the last
        // word would be cut off). Falls back to 100 if the length is unavailable.
        function getMaxTextStartPercent() {
            try {
                const len = document.getElementById("interactiveText").getComputedTextLength();
                if (len > 0 && pathLength > 0) return Math.max(0, 100 - (len / pathLength) * 100);
            } catch (e) { /* not measurable: no extra limit */ }
            return 100;
        }

        function startTextDrag(event) {
            if (isStatesMode) return;

            isDraggingText = true;
            hasMovedDuringDrag = false;
            const src = event.touches ? event.touches[0] : event;
            dragStartClientX = src.clientX;
            dragStartClientY = src.clientY;

            // Remember where on the text the learner grabbed it, so the text
            // does not jump so that its start sits under the pointer.
            const pt = getEventPoint(event);
            const startLength = (startPercent / 100) * pathLength;
            dragGrabOffset = getClosestLengthOnPath(pt.x, pt.y, null) - startLength;
            event.preventDefault();
        }

        function dragText(event) {
            if (!isDraggingText || isStatesMode) return;

            const src = event.touches ? event.touches[0] : event;
            if (!hasMovedDuringDrag) {
                // Distance from where the drag STARTED, not from the last
                // event, so slow drags still register as drags
                if (Math.hypot(src.clientX - dragStartClientX, src.clientY - dragStartClientY) <= DRAG_THRESHOLD_PX) {
                    if (event.cancelable) event.preventDefault();
                    return;
                }
                hasMovedDuringDrag = true;
            }

            // The text follows the pointer's nearest point on the path,
            // whatever the screen size or which line it is on.
            const pt = getEventPoint(event);
            const startLength = (startPercent / 100) * pathLength;
            const L = getClosestLengthOnPath(pt.x, pt.y, startLength + dragGrabOffset);
            startPercent = ((L - dragGrabOffset) / pathLength) * 100;
            startPercent = Math.min(getMaxTextStartPercent(), Math.max(0, startPercent));
            updateTextPosition(startPercent);

            if (event.cancelable) event.preventDefault();
        }

        function endTextDrag() {
            isDraggingText = false;
        }

        function toggleTextFormat(event) {
            if (isStatesMode || isDraggingText || hasMovedDuringDrag) {
                return;
            }
            
            const transitionData = getTransitionDataForPosition(startPercent);
            const index = transitionData.index;
            const data = transitionData.data;
            
            if (learnedTransitions[index]) {
                // Cycle between TLR, TL, SL for learned items
                slidingTextMode = (slidingTextMode + 1) % 3;
                updateTextBasedOnPosition(startPercent);
            } else {
                // TLR(0) -> TL(1) -> SL(2) -> Quiz(3) for unlearned items
                if (slidingTextMode === 0) {
                    // From TLR to TL
                    slidingTextMode = 1;
                    updateTextBasedOnPosition(startPercent);
                } else if (slidingTextMode === 1) {
                    // From TL to SL
                    slidingTextMode = 2;
                    updateTextBasedOnPosition(startPercent);
                } else if (slidingTextMode === 2) {
                    // From SL to Quiz
                    slidingTextMode = 3;
                    showQuiz(index, document.getElementById("interactiveText"));
                    return;
                } else {
                    // From Quiz back to TLR
                    slidingTextMode = 0;
                    updateTextBasedOnPosition(startPercent);
                }
            }
            
            updateLevelIndicator();
            if (event && event.cancelable) event.preventDefault();
        }

        function updateLevelIndicator() {
            if (isStatesMode) {
                levelIndicator.style.display = 'none';
                return;
            }
            
            levelIndicator.style.display = 'block';
            
            switch (slidingTextMode) {
                case 0:
                    levelIndicator.textContent = 'TL Roman';
                    break;
                case 1:
                    levelIndicator.textContent = 'Target Language';
                    break;
                case 2:
                    levelIndicator.textContent = 'Source Language';
                    break;
                case 3:
                    levelIndicator.textContent = 'Quiz Mode';
                    break;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            console.log("Initializing Instant Permanent Positive (3-line) Logographic Template with TLR...");
            
            try {
                // Get DOM elements
                svg = document.getElementById("svgCanvas");
                pathLine = document.getElementById("gradualChangePath");
                conceptBackground = document.getElementById("conceptBackground");
                titleBox = document.getElementById("title-box");

                levelIndicator = document.getElementById("level-indicator");

                toggleVocabularyBtn = document.getElementById("toggle-vocabulary");
                
                if (!svg || !pathLine || !titleBox || !modeToggleBtn || !frame) {
                    console.error("Critical elements are missing from the DOM");
                    return;
                }

                // Title box: TLR by default (matches the vocabulary-item

                // Initialize arrays (now only 5 items for States Mode)
                learnedItems = new Array(conceptData.length).fill(false); // Only for States Mode
                learnedTransitions = new Array(transitionsData.length).fill(false); // Only for Transitions Mode
                addedVocabularyItems = new Array(transitionsData.length).fill(false);
                
                // 3-LINE SYSTEM: Set the path coordinates
                computeTransitionRanges();
                console.log("Setting 3-line path coordinates:", pathPoints);
                pathLine.setAttribute('d', `M ${pathPoints.join(' L ')}`);
                conceptBackground.setAttribute('d', `M ${pathPoints.join(' L ')} L 130,50 L -30,50 Z`);

                console.log("Path length:", pathLength);
                
                // Initialize States mode
                isStatesMode = true;

                            dragInstruction.style.display = 'none';

            } catch (error) {

        }

        function createTextBoxes() {
            if (!isStatesMode) return;
            
            // Clear existing text boxes
            document.querySelectorAll('.textBox').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            textBoxElements = [];
            
            // 3-BOX SYSTEM: Positioned at midpoints of each line
            const textBoxConfig = [
                { x: 10, y: 38, anchor: "middle", index: 0 },        // TLR1 - Line 1 midpoint
                { x: 52, y: 30, anchor: "start", index: 1 },         // TLR2 - Line 2 midpoint (vertical)
                { x: 90, y: 18, anchor: "middle", index: 2 }         // TLR3 - Line 3 midpoint (extended line)
            ];
            
            // Create text boxes with TLR 4-level cycling
            for (let i = 0; i < textBoxConfig.length; i++) {
                const config = textBoxConfig[i];
                
                const textBox = document.createElementNS("http://www.w3.org/2000/svg", "text");
                textBox.setAttribute("class", "textBox");
                textBox.setAttribute("x", config.x);
                textBox.setAttribute("y", config.y);
                textBox.style.textAnchor = config.anchor; // inline style, not attribute (see Session Starter)
                textBox.setAttribute("data-index", config.index);
                
                // Set initial text based on current layer (starts with TLR)
                textBox.textContent = conceptData[config.index][currentTextLayer[config.index]];
                
                if (learnedItems[config.index]) textBox.classList.add('learned');
                
                // Add click event listener with TLR 4-level cycling
                textBox.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const index = parseInt(this.getAttribute('data-index'));
                    
                    if (learnedItems[index]) {
                        // Cycle between TLR, TL, SL for learned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TLR -> TL
                            this.textContent = conceptData[index][1];
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2; // TL -> SL
                            this.textContent = conceptData[index][2];
                        } else {
                            currentTextLayer[index] = 0; // SL -> TLR
                            this.textContent = conceptData[index][0];
                        }
                    } else {
                        // TLR -> TL -> SL -> Quiz cycle for unlearned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TLR -> TL
                            this.textContent = conceptData[index][1];
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2; // TL -> SL
                            this.textContent = conceptData[index][2];
                        } else if (currentTextLayer[index] === 2) {
                            currentTextLayer[index] = 3; // SL -> Quiz
                            showQuiz(index, this);
                        } else {
                            currentTextLayer[index] = 0; // Reset to TLR
                            this.textContent = conceptData[index][0];
                        }
                    }
                });
                
                svg.appendChild(textBox);
                textBoxElements.push(textBox);
            }
            
            bringFrameToFront();
            console.log("Created", textBoxElements.length, "text boxes with TLR 4-level cycling (3-box version)");
        }

        function showQuiz(index, element) {
            const currentData = isStatesMode ? conceptData : transitionsData;
            
            if (index < 0 || index >= currentData.length) {
                console.error("Invalid quiz index:", index, "Max length:", currentData.length);
                return;
            }
            
            currentQuizIndex = index;
            
            // Ask for the TLR, cued by the SL word (the quiz tests TLR, index 0)
            quizInput.placeholder = `What is the TLR word for '${currentData[index][2]}'?`;
            quizInput.value = '';
            quizFeedback.textContent = '';
            
            // Position quiz container (where the learner last dragged it, or centred)
            if (quizPosition.x !== null && quizPosition.y !== null) {
                quizContainer.style.left = quizPosition.x + 'px';
                quizContainer.style.top = quizPosition.y + 'px';
                quizContainer.style.transform = 'none';
            } else {
                quizContainer.style.left = '50%';
                quizContainer.style.top = '40%';
                quizContainer.style.transform = 'translate(-50%, -50%)';
            }

            quizContainer.style.display = 'block';
            quizContainer.style.visibility = 'visible';
            quizContainer.style.opacity = '1';
            quizContainer.style.zIndex = '9999';
            
            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing quiz input:", e);
                }
            }, 100);
        }

        function addToVocabularyArray(index) {
            try {
                const currentData = transitionsData;
                const tlr = currentData[index][0];            // TLR: what the quiz tests
                const targetLanguage = currentData[index][1]; // TL
                const sourceLanguage = currentData[index][2]; // SL
                
                const itemElement = document.createElement('div');
                itemElement.className = 'vocabulary-item';
                
                const tlrSpan = document.createElement('span');
                tlrSpan.className = 'target-language-roman';
                tlrSpan.textContent = tlr;
                
                const sourceSpan = document.createElement('span');
                sourceSpan.className = 'source-language';
                sourceSpan.textContent = sourceLanguage;
                
                const targetSpan = document.createElement('span');
                targetSpan.className = 'target-language';
                targetSpan.textContent = targetLanguage;
                
                tlrSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                sourceSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                targetSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                itemElement.appendChild(tlrSpan);
                itemElement.appendChild(targetSpan);
                itemElement.appendChild(sourceSpan);
                
                // One combined list, kept in path order (T1..T3) whatever order
                // the items were learned in: insert before the first entry
                // with a higher index (null = append at the end).
                itemElement.setAttribute('data-index', index);
                let insertBeforeEl = null;
                for (const child of vocabularyItems.children) {
                    if (parseInt(child.getAttribute('data-index'), 10) > index) {
                        insertBeforeEl = child;
                        break;
                    }
                }
                vocabularyItems.insertBefore(itemElement, insertBeforeEl);
                addedVocabularyItems[index] = true;
                
                console.log("Added vocabulary item:", tlr, "->", sourceLanguage, "->", targetLanguage);
            } catch (error) {
                console.error("Error adding vocabulary item:", error);
            }
        }

        function checkQuizAnswer() {
            if (currentQuizIndex < 0) {
                console.error("No valid quiz index");
                return;
            }
            
            const currentData = isStatesMode ? conceptData : transitionsData;
            const userAnswer = quizInput.value.trim().toLowerCase();
            const correctAnswer = currentData[currentQuizIndex][0].toLowerCase();
            
            if (userAnswer === correctAnswer) {
                quizFeedback.textContent = 'Correct!';
                quizFeedback.style.color = 'green';
                const answeredIndex = currentQuizIndex;
                
                if (isStatesMode) {
                    learnedItems[currentQuizIndex] = true;
                    const textBox = textBoxElements[currentQuizIndex];
                    if (textBox) {
                        textBox.classList.add('learned');
                        textBox.textContent = currentData[currentQuizIndex][0];
                        currentTextLayer[currentQuizIndex] = 0;
                    }
                } else {
                    learnedTransitions[currentQuizIndex] = true;
                    slidingTextMode = 0;
                    
                    const targetTextElement = document.getElementById("interactiveText");
                    if (targetTextElement) {
                        targetTextElement.classList.add('learned');
                        const textPath = document.getElementById("slidingText");
                        if (textPath) {
                            textPath.textContent = currentData[currentQuizIndex][0];
                        }
                    }
                    
                    // One combined list; each item is filed once, whatever the slider position
                    if (!addedVocabularyItems[currentQuizIndex]) {
                        addToVocabularyArray(currentQuizIndex);
                    }
                    
                    updateLevelIndicator();
                    updateTextBasedOnPosition(startPercent);
                }
                
                setTimeout(() => {
                    // Only close our own quiz - the learner may already have opened another
                    if (currentQuizIndex === answeredIndex) {
                        quizContainer.style.display = 'none';
                        currentQuizIndex = -1;
                    }
                }, 1500);
            } else {
                quizFeedback.textContent = 'Try again';
                quizFeedback.style.color = 'red';
            }
        }

        function updateVisibleTextBoxes(point) {
            if (!isStatesMode) return -1;
            
            let closestIndex = -1;
            let minDistance = Infinity;
            
            // Find closest text box
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x'));
                const y = parseFloat(textBox.getAttribute('y'));
                
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });
            
            // Update visibility
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                if (index === closestIndex && minDistance < activationDistance) {
                    textBox.classList.add('active');
                } else if (learnedItems[index]) {
                    textBox.classList.remove('active');
                    textBox.classList.add('learned');
                } else {
                    textBox.classList.remove('active', 'learned');
                }
            });
            
            if (closestIndex !== -1 && minDistance < activationDistance && conceptData[closestIndex]) {
                conceptIndicator.textContent = conceptData[closestIndex][1]; // Show SL in indicator
            }
            
            return closestIndex;
        }

        const VIEWBOX_MIN_X = -30;
        const VIEWBOX_MAX_X = 130;

        // The frame is a circle centred on a path point. At the two ends of
        // the path the centre is nudged in by one radius, so the whole circle
        // stays visible and grabbable.
        function placeFrameAt(pt) {
            const r = parseFloat(frame.getAttribute('r'));
            const cx = Math.max(VIEWBOX_MIN_X + r, Math.min(VIEWBOX_MAX_X - r, pt.x));
            frame.setAttribute('cx', cx);
            frame.setAttribute('cy', pt.y);
        }

        function setFrameRadiusForDevice() {
            if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
                frame.setAttribute('r', '3');
            }
        }

        function bringFrameToFront() {
            // SVG stacking is document order: keep the frame last so it renders
            // (and receives pointer/touch events) above every text box.
            if (frame && frame.parentNode) {
                frame.parentNode.appendChild(frame);
            }
        }

        function initializeFramePosition() {
            const startPoint = pathLine.getPointAtLength(0);
            placeFrameAt(startPoint);
            bringFrameToFront();

            updateVisibleTextBoxes(startPoint);
            conceptIndicator.textContent = conceptData[0][1]; // Show TL
        }

        // Frame dragging functionality
        let isDragging = false;
        let offsetX, offsetY;

        function startDrag(e) {
            if (!isStatesMode) return;
            isDragging = true;
            frame.classList.add('dragging');
            
            const point = getEventPoint(e);
            offsetX = point.x - parseFloat(frame.getAttribute("cx"));
            offsetY = point.y - parseFloat(frame.getAttribute("cy"));
            
            e.preventDefault();
            e.stopPropagation();
        }

        function dragMove(e) {
            if (!isDragging || !isStatesMode) return;
            
            const point = getEventPoint(e);
            const newX = point.x - offsetX;
            const newY = point.y - offsetY;

            const closestPoint = getClosestPointOnPath(newX, newY);
            
            placeFrameAt(closestPoint);

            updateVisibleTextBoxes(closestPoint);
            
            e.preventDefault();
            e.stopPropagation();
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                frame.classList.remove('dragging');
                
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        function getEventPoint(event) {
            const isTouchEvent = event.type.includes('touch');
            const point = svg.createSVGPoint();
            const clientX = isTouchEvent ? event.touches[0].clientX : event.clientX;
            const clientY = isTouchEvent ? event.touches[0].clientY : event.clientY;
            point.x = clientX;
            point.y = clientY;
            return point.matrixTransform(svg.getScreenCTM().inverse());
        }

        function getClosestPointOnPath(x, y) {
            let closestPoint = null;
            let closestDistance = Infinity;

            const sampleRate = 0.3;
            for (let i = 0; i < pathLength; i += sampleRate) {
                const point = pathLine.getPointAtLength(i);
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestPoint = point;
                }
            }

            return closestPoint || pathLine.getPointAtLength(0);
        }

        function toggleMode() {
            isStatesMode = !isStatesMode;

            // Reset to TLR default on mode switch — otherwise a learner who
            // had cycled to SL/TL in the old mode lands on the same index
            // in the new mode instead of starting fresh at TLR.
            currentTextIndex = 0;
            
            if (isStatesMode) {
                // Switch to States mode
                frame.style.display = 'block';
                
                // Hide the single sliding text element
                const interactiveText = document.getElementById("interactiveText");
                if (interactiveText) {
                    interactiveText.style.display = 'none';
                }
                
                titleBox.textContent = titleTexts.states[currentTextIndex];
                const modeIndicatorStates = document.getElementById('mode-indicator');
                if (modeIndicatorStates) modeIndicatorStates.textContent = modeIndicatorTexts.states[currentModeIndicatorIndex];
                levelIndicator.style.display = 'none';
                
                createTextBoxes();
                initializeFramePosition();
                
                vocabularyArray.style.display = 'none';
            } else {
                // Switch to Transitions mode
                frame.style.display = 'none';
                
                // Show the single sliding text element
                const interactiveText = document.getElementById("interactiveText");
                if (interactiveText) {
                    interactiveText.style.display = 'block';
                }
                
                titleBox.textContent = titleTexts.transitions[currentTextIndex];
                const modeIndicatorTrans = document.getElementById('mode-indicator');
                if (modeIndicatorTrans) modeIndicatorTrans.textContent = modeIndicatorTexts.transitions[currentModeIndicatorIndex];
                slidingTextMode = 0; // Start with TLR
                updateLevelIndicator();
                
                // Remove text boxes
                document.querySelectorAll('.textBox').forEach(box => {
                    if (box && box.parentNode) box.parentNode.removeChild(box);
                });
                textBoxElements = [];
                
                // Initialize sliding text position
                startPercent = 0;
                updateTextPosition(startPercent);
                
                vocabularyArray.style.display = 'block';
            }
            
            quizContainer.style.display = 'none';
        }

        function switchModeIndicatorText() {
            const modeIndicator = document.getElementById('mode-indicator');
            if (!modeIndicator) return;

            modeIndicator.classList.add('hidden');
            setTimeout(() => {
                currentModeIndicatorIndex = (currentModeIndicatorIndex + 1) % 2;
                const modeKey = isStatesMode ? 'states' : 'transitions';
                modeIndicator.textContent = modeIndicatorTexts[modeKey][currentModeIndicatorIndex];
                modeIndicator.classList.remove('hidden');
            }, 500);
        }

        function switchTitleText() {
            titleBox.classList.add('hidden');
            setTimeout(() => {
                currentTextIndex = (currentTextIndex + 1) % 3;
                const modeKey = isStatesMode ? 'states' : 'transitions';
                titleBox.textContent = titleTexts[modeKey][currentTextIndex];
                titleBox.classList.remove('hidden');
            }, 500);
        }

        function toggleArrayVisibility(arrayType) {
            try {
                const container = document.getElementById(arrayType + "-items");
                const button = document.getElementById("toggle-" + arrayType);
                if (!container || !button) {
                    console.error("Container or button not found for " + arrayType);
                    return;
                }
                
                const spans = container.querySelectorAll('.vocabulary-item .target-language-roman, .vocabulary-item .source-language, .vocabulary-item .target-language');
                
                let visibleCount = 0;
                spans.forEach(span => {
                    if (!span.classList.contains('hidden')) {
                        visibleCount++;
                    }
                });
                
                const mostlyVisible = visibleCount > spans.length / 2;
                
                spans.forEach(span => {
                    if (mostlyVisible) {
                        span.classList.add('hidden');
                    } else {
                        span.classList.remove('hidden');
                    }
                });
                
                button.textContent = mostlyVisible ? 'Show All' : 'Hide All';
            } catch (error) {
                console.error("Error in toggleArrayVisibility:", error);
            }
        }

        function setupEventListeners() {
            // Frame dragging events
            frame.addEventListener('mousedown', startDrag);
            frame.addEventListener('touchstart', startDrag, { passive: false });
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            
            // UI events
            titleBox.addEventListener('click', switchTitleText);
            const modeIndicatorEl = document.getElementById('mode-indicator');
            if (modeIndicatorEl) modeIndicatorEl.addEventListener('click', switchModeIndicatorText);
            modeToggleBtn.addEventListener('click', toggleMode);
            quizCheck.addEventListener('click', checkQuizAnswer);
            quizInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkQuizAnswer();
            });
            
            // TRANSITIONS MODE EVENT SETUP
            const interactiveText = document.getElementById("interactiveText");
            
            // Mouse events
            interactiveText.addEventListener("mousedown", startTextDrag);
            document.addEventListener("mousemove", dragText);
            document.addEventListener("mouseup", endTextDrag);
            
            // Click event with proper delay to allow drag detection
            interactiveText.addEventListener("click", function(e) {
                setTimeout(() => {
                    toggleTextFormat(e);
                }, 10);
            });
            
            // Touch events
            interactiveText.addEventListener("touchstart", startTextDrag, { passive: false });
            document.addEventListener("touchmove", dragText, { passive: false });
            document.addEventListener("touchend", endTextDrag);
            
            // Touch end event with proper delay
            interactiveText.addEventListener("touchend", function(e) {
                setTimeout(() => {
                    if (!hasMovedDuringDrag && !isStatesMode) {
                        toggleTextFormat(e);
                    }
                }, 10);
            });
            
            // Tools menu setup
            const toolsButton = document.querySelector('.tools-button');
            const toolsDropdown = document.querySelector('.tools-dropdown');
            const loadConceptBtn = document.getElementById("loadConcept");
            const startQuizBtn = document.getElementById("startQuiz");
            const toggleArraysBtn = document.getElementById("toggleArrays");
            
            let dropdownOpen = false;

            const fullscreenBtn = document.getElementById("toggleFullscreen");
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!document.fullscreenElement) {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen().catch(function(err) {
                                console.log('Full screen request failed or unsupported:', err);
                            });
                        }
                        fullscreenBtn.textContent = 'Exit Full Screen';
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                        fullscreenBtn.textContent = 'Full Screen';
                    }
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                });
                document.addEventListener('fullscreenchange', function() {
                    fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
                });
            }

            // ── Keyboard-avoidance for the Quiz box ──────────────────
            if (window.visualViewport) {
                const KEYBOARD_HEIGHT_THRESHOLD = 150;
                function handleViewportResize() {
                    const qc = document.getElementById('quizContainer');
                    if (!qc) return;
                    const heightDiff = window.innerHeight - window.visualViewport.height;
                    if (heightDiff > KEYBOARD_HEIGHT_THRESHOLD) {
                        qc.classList.add('keyboard-open');
                    } else {
                        qc.classList.remove('keyboard-open');
                    }
                }
                window.visualViewport.addEventListener('resize', handleViewportResize);
            }

            // ── Learned Vocabulary array: default position + drag anywhere ──────
            // Default spot: 5% across / 2% down the template box (.a4-page). The array is
            // position:fixed so it can be dragged anywhere on the screen, e.g. clear of the quiz box.
            // Once the learner has moved it, it stays where they put it (also across hide/show).
            (function setupArrayDrag() {
                const arr = document.getElementById('vocabulary-array');
                const list = document.getElementById('vocabulary-items');
                const page = document.querySelector('.a4-page');
                if (!arr) return;
                const DRAG_THRESHOLD_PX = 5;   // below this a press is a click (Hide All, tapping an entry)
                let userMoved = false, dragging = false, moved = false, wasShown = false;
                let offX = 0, offY = 0, startX = 0, startY = 0, activeId = null, justDragged = false;

                function place(left, top) {
                    const maxLeft = Math.max(0, window.innerWidth - arr.offsetWidth);
                    const maxTop = Math.max(0, window.innerHeight - arr.offsetHeight);
                    arr.style.left = Math.min(Math.max(0, left), maxLeft) + 'px';
                    arr.style.top = Math.min(Math.max(0, top), maxTop) + 'px';
                }
                function placeDefault() {
                    const r = page ? page.getBoundingClientRect()
                                   : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
                    place(r.left + r.width * 0.05, r.top + r.height * 0.02);
                }
                function updateScrollable() {
                    arr.classList.toggle('scrollable', arr.scrollHeight > arr.clientHeight + 1);
                }
                function isShown() { return arr.style.display === 'block'; }
                // Re-place after the content (and so the height) or the window changes: the array
                // grows downward as entries are added, and is nudged up if its bottom edge would
                // otherwise fall off the screen.
                function refit() {
                    if (!isShown()) return;
                    if (userMoved) place(parseFloat(arr.style.left) || 0, parseFloat(arr.style.top) || 0);
                    else placeDefault();
                    updateScrollable();
                }

                // Watch for the array being shown (the JS shows it from several places), and for
                // entries being added, rather than patching every call site.
                new MutationObserver(function () {
                    const shown = isShown();
                    if (shown && !wasShown) {
                        wasShown = true;
                        if (userMoved) place(parseFloat(arr.style.left) || 0, parseFloat(arr.style.top) || 0);
                        else placeDefault();
                    } else if (!shown) {
                        wasShown = false;
                    }
                    if (shown) updateScrollable();
                }).observe(arr, { attributes: true, attributeFilter: ['style'] });
                if (list) new MutationObserver(refit).observe(list, { childList: true, subtree: true });

                window.addEventListener('resize', refit);

                arr.addEventListener('pointerdown', function (e) {
                    if (e.button) return;                        // primary button / touch / pen only
                    if (e.target.closest && e.target.closest('button')) return;   // let Hide All click through
                    const r = arr.getBoundingClientRect();
                    dragging = true; moved = false; activeId = e.pointerId;
                    startX = e.clientX; startY = e.clientY;
                    offX = e.clientX - r.left; offY = e.clientY - r.top;
                });
                document.addEventListener('pointermove', function (e) {
                    if (!dragging || e.pointerId !== activeId) return;
                    if (!moved) {
                        if (Math.hypot(e.clientX - startX, e.clientY - startY) < DRAG_THRESHOLD_PX) return;
                        moved = true;
                        arr.classList.add('dragging');
                        try { arr.setPointerCapture(activeId); } catch (_) {}
                    }
                    place(e.clientX - offX, e.clientY - offY);
                    userMoved = true;
                    if (e.cancelable) e.preventDefault();
                });
                function endDrag(e) {
                    if (!dragging || e.pointerId !== activeId) return;
                    dragging = false;
                    arr.classList.remove('dragging');
                    try { arr.releasePointerCapture(activeId); } catch (_) {}
                    if (moved) {
                        // The release fires a click; swallow it so it can't dismiss the quiz box,
                        // close the Tools menu or toggle an entry (reset after 100ms if none arrives).
                        justDragged = true;
                        setTimeout(function () { justDragged = false; }, 100);
                    }
                    moved = false;
                }
                document.addEventListener('pointerup', endDrag);
                document.addEventListener('pointercancel', endDrag);
                document.addEventListener('click', function (e) {
                    if (justDragged) { justDragged = false; e.stopPropagation(); e.preventDefault(); }
                }, true);
            })();

            // ── Quiz box: drag to reposition anywhere on screen ──────
            (function setupQuizDrag() {
                const qc = document.getElementById('quizContainer');
                const qInput = document.getElementById('quizInput');
                const qCheck = document.getElementById('quizCheck');
                let isDraggingQuiz = false;
                let dragMoved = false;
                let quizDragOffsetX = 0;
                let quizDragOffsetY = 0;

                function quizDragStart(e) {
                    if (e.target === qInput || e.target === qCheck) return;
                    isDraggingQuiz = true;
                    dragMoved = false;
                    const rect = qc.getBoundingClientRect();
                    const point = e.touches ? e.touches[0] : e;
                    quizDragOffsetX = point.clientX - rect.left;
                    quizDragOffsetY = point.clientY - rect.top;
                    qc.style.left = rect.left + 'px';
                    qc.style.top = rect.top + 'px';
                    qc.style.transform = 'none';
                    qc.classList.add('dragging');
                    if (e.touches) e.preventDefault();
                }

                function quizDragMove(e) {
                    if (!isDraggingQuiz) return;
                    const point = e.touches ? e.touches[0] : e;
                    let newLeft = point.clientX - quizDragOffsetX;
                    let newTop = point.clientY - quizDragOffsetY;
                    const maxLeft = window.innerWidth - qc.offsetWidth;
                    const maxTop = window.innerHeight - qc.offsetHeight;
                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));
                    qc.style.left = newLeft + 'px';
                    qc.style.top = newTop + 'px';
                    // Remember where the learner put it, so the next quiz opens there
                    quizPosition.x = newLeft;
                    quizPosition.y = newTop;
                    dragMoved = true;
                    if (e.touches) e.preventDefault();
                }

                function quizDragEnd() {
                    if (!isDraggingQuiz) return;
                    isDraggingQuiz = false;
                    qc.classList.remove('dragging');
                    // A drag-release fires a click at whatever is under the cursor;
                    // if that lands just outside the box, the outside-click dismiss
                    // handler would close the quiz. Flag it so that one click is
                    // swallowed (reset after 100ms in case no click ever arrives).
                    if (dragMoved) {
                        quizJustDragged = true;
                        setTimeout(function () { quizJustDragged = false; }, 100);
                    }
                }

                qc.addEventListener('mousedown', quizDragStart);
                document.addEventListener('mousemove', quizDragMove);
                document.addEventListener('mouseup', quizDragEnd);

                qc.addEventListener('touchstart', quizDragStart, { passive: false });
                document.addEventListener('touchmove', quizDragMove, { passive: false });
                document.addEventListener('touchend', quizDragEnd);
            })();
            
            if (toolsButton) {
                toolsButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = !dropdownOpen;
                    toolsDropdown.classList.toggle('active', dropdownOpen);
                });
            }
            
            document.addEventListener('click', function(e) {
                if (toolsButton && toolsDropdown && 
                    !toolsButton.contains(e.target) && !toolsDropdown.contains(e.target)) {
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                }
            });
            
            if (loadConceptBtn) {
                loadConceptBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    alert("Load Concept feature will integrate with API to fetch vocabulary for instant permanent positive changes with TLR support.");
                });
            }
            
            if (startQuizBtn) {
                startQuizBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    const currentData = isStatesMode ? conceptData : transitionsData;
                    const randomIndex = Math.floor(Math.random() * currentData.length);
                    showQuiz(randomIndex, null);
                });
            }
            
            if (toggleArraysBtn) {
                toggleArraysBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    const visibility = vocabularyArray.style.display === 'none' || vocabularyArray.style.display === '';
                    vocabularyArray.style.display = visibility ? 'block' : 'none';
                });
            }
            
            if (toggleVocabularyBtn) {
                toggleVocabularyBtn.addEventListener('click', function() {
                    toggleArrayVisibility('vocabulary');
                });
            }
            

            
            // Document click handler for closing quizzes
            document.addEventListener('click', function(e) {
                // Swallow the one synthetic click that follows a quiz-box drag-release
                if (quizJustDragged) {
                    quizJustDragged = false;
                    return;
                }
                if (quizContainer.style.display !== 'none' && 
                    !quizContainer.contains(e.target) &&
                    !e.target.classList.contains('textBox') &&
                    !e.target.classList.contains('sliding-text')) {
                    
                    quizContainer.style.display = 'none';
                    currentQuizIndex = -1;
                    
                    // Reset to TLR mode if quiz was open
                    if (!isStatesMode && slidingTextMode === 3) {
                        slidingTextMode = 0; // Reset to TLR
                        updateLevelIndicator();
                        updateTextBasedOnPosition(startPercent);
                    }
                }
            });
        }

    </script>
</body>
</html>
