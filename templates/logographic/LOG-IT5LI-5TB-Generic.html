<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG-IT5LI-5TB Generic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            overflow: hidden;
        }

        .a4-page {
            width: 90vw;
            height: 70vh;
            border: 5px solid black;
            background-color: white;
            box-sizing: border-box;
            position: relative;
            touch-action: none;
            z-index: 1;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .path-line {
            stroke: black;
            stroke-width: 0.025;
            fill: none;
        }

        /* Extension path lines - dashed and cyan */
        .extension-path {
            stroke: #00CED1;
            stroke-width: 0.2;
            stroke-dasharray: 1.5, 1;
            fill: none;
            opacity: 0.5;
            cursor: pointer;
        }

        .extension-path:hover {
            stroke: #00FFFF;
            opacity: 0.9;
            stroke-width: 0.3;
        }

        /* Extension text boxes */
        .textBox.extension {
            fill: #008B8B;
            font-style: italic;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5);
        }

        /* Background gradient */
        #conceptBackground {
            fill: url(#conceptGradient);
            opacity: 0.2;
        }

        /* States Template Elements */
        .textBox {
            cursor: pointer;
            fill: black;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5);
        }

        .textBox.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .textBox.learned {
            opacity: 1;
            transform: scale(1) translateY(0);
            fill: green;
        }

        #draggableFrame {
            cursor: grab;
            fill: rgba(255, 255, 0, 0.6);
            stroke: #ccaa00;
            stroke-width: 0.1;
            pointer-events: all;
            opacity: 1;
            z-index: 10000;
            filter: drop-shadow(0 0.3px 0.5px rgba(0,0,0,0.3));
            transition: fill 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease, filter 0.2s ease;
        }

        #draggableFrame:hover {
            fill: rgba(255, 255, 0, 0.8);
            stroke: #ffcc00;
            stroke-width: 0.15;
            cursor: grab;
            filter: drop-shadow(0 0.5px 1px rgba(204, 170, 0, 0.6)) drop-shadow(0 0 2px rgba(255, 255, 100, 0.8));
        }

        #draggableFrame.dragging {
            cursor: grabbing;
            fill: transparent;
            stroke-width: 0.1;
            filter: drop-shadow(0 0.5px 1px rgba(255, 170, 0, 0.6)) drop-shadow(0 0 2px rgba(255, 220, 0, 0.8));
            stroke: #ffaa00;
        }

        /* Transitions Template Elements */
        .sliding-text {
            font-weight: bold;
            fill: blue;
            cursor: grab;
        }
        
        .sliding-text.dragging {
            cursor: grabbing;
            fill: darkorange;
        }
        
        .sliding-text.learned {
            fill: green;
        }

        /* Common Title Box Styling */
        .title-box {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 1px solid black;
            padding: 10px;
            background-color: white;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .title-box.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }
        
        /* Mode Toggle Button */
        .mode-toggle {
            font-size: 0.8em;
            padding: 8px 16px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
        }
        
        .mode-indicator {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9em;
            font-weight: bold;
            padding: 8px 16px;
            background-color: white;
            border: 2px solid #3366cc;
            border-radius: 4px;
            cursor: pointer;
            z-index: 3;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .mode-indicator.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }
        
        /* Concept Indicator */
        .concept-indicator {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 3;
            display: none;
        }
        
        /* Level indicator for transitions mode */
        .level-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            padding: 5px 10px;
            background-color: white;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 3;
            display: none;
        }

        /* Path indicator */
        .path-indicator {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7em;
            padding: 5px 10px;
            background-color: #ffe8e8;
            border: 1px solid #cc3366;
            border-radius: 4px;
            z-index: 3;
            display: none;
        }

        /* Quiz container styles */
        .quiz-container {
            box-sizing: border-box;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 3px solid #3366cc;
            border-radius: 4px;
            padding: 12px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            min-width: 280px;
            max-width: 600px;
            width: auto;
            cursor: grab;
            user-select: none;
        }

        .quiz-container.dragging {
            cursor: grabbing;
        }
        
        .quiz-container input {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .quiz-container button {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            background-color: #3366cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .quiz-container button:hover {
            background-color: #254e9c;
        }

        .quiz-container.keyboard-open {
            top: 8px;
            transform: translate(-50%, 0);
            max-width: 90vw;
            width: 320px;
            padding: 8px;
        }

        .quiz-container.keyboard-open input {
            font-size: 13px;
            padding: 6px;
            margin-bottom: 6px;
        }

        .quiz-container.keyboard-open #quizFeedback {
            min-height: 14px;
            margin-top: 4px;
        }
        
        #quizFeedback {
            text-align: center;
            font-weight: bold;
            margin-top: 8px;
            min-height: 20px;
        }

        /* .page-wrapper groups the diagram frame with its Tools / mode button
           button bar so that, on touch devices, the bar can render OUTSIDE the
           frame's own box (see the coarse-pointer block at the end of this
           <style>) instead of overlapping diagram content. Desktop is
           pixel-identical to before: .tools-menu is position: static and
           .tools-bar / .tools-row use display: contents there, so the three
           buttons are still absolutely positioned against this wrapper. The
           wrapper's width equals .a4-page's (90vw, border-box), and every
           absolute offset below is the old value + 5px, because they are now
           measured from the frame's outer edge, not from inside its border. */
        .page-wrapper {
            position: relative;
            width: 90vw;
        }

        /* Build/test-phase only: names the template file you are looking at.
           index.html's injectAndOpen() strips this whole element out before a
           learner ever sees a live page. Taken out of flow (absolute, above
           the frame) so it cannot change the page's height or centring. */
        .template-id-badge {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            text-align: center;
            font-family: monospace;
            font-size: 11px;
            color: #999;
            padding: 2px 0 4px;
            user-select: none;
        }

        /* Tools Menu: a column in the top-right corner (Tools, Show All, Toggle
           Mode, Reset). .tools-menu is only the positioning context;
           .tools-bar holds the buttons; .tools-dropdown is a SIBLING of
           .tools-bar so nothing that scrolls or clips the bar can clip it. */
        .tools-menu {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 5;
        }

        .tools-bar {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        /* Show All, mode button and Reset: one under the other on a desktop; side by
           side in the bar below the frame on a touch screen */
        .tools-row {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .tools-button {
            padding: 8px 12px;
            font-size: 0.8em;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            z-index: 4;
        }

        .show-all-btn,
        .reset-btn {
            font-family: inherit;
            font-size: 0.8em;
            padding: 5px 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .show-all-btn.active {
            background-color: #d6e8ff;
            border-color: #3366cc;
            font-weight: bold;
        }

        /* Reset: a full fresh start. Kept visible next to mode button, not tucked
           inside Tools, so it is easy to find when a learner is stuck. */
        .reset-btn {
            background-color: #fff4e0;
            border-color: #e0a030;
            color: #8a5a00;
        }

        .reset-btn:hover {
            background-color: #ffe6b3;
        }

        /* Show All: while it is on, the interactive pieces (frame, state labels,
           sliding word, instruction) step aside and every word of the current
           mode is displayed at once in one language layer. !important because
           the JS sets inline display styles. */
        .show-all-on #draggableFrame,
        .show-all-on .textBox,
        .show-all-on #interactiveText,
        .show-all-on #drag-instruction {
            display: none !important;
        }

        .showall-word {
            font-weight: bold;
            cursor: pointer;   /* click a word to flip just that word to its next layer (no Quiz) */
            user-select: none;
            -webkit-user-select: none;
            pointer-events: all;   /* future audio: mouseover / tap a word to hear it */
        }

        .showall-word.layer-tl  { fill: #0b3d91; }
        .showall-word.layer-tlr { fill: #5b2c83; }
        .showall-word.layer-sl  { fill: #8b1a1a; }

        /* Here the mode indicator box sits right where the labels do, so it steps aside too
           (the Show All button already names the layer on show). */
        .show-all-on .mode-indicator {
            visibility: hidden;
        }

        .tools-dropdown {
            position: absolute;
            top: 30px;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 4;
            display: none;
            min-width: 180px;
        }

        .tools-dropdown.active {
            display: block;
        }

        .tools-dropdown button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            font-size: 0.75em;
            background-color: white;
            border: none;
            border-bottom: 1px solid #eee;
            text-align: left;
            cursor: pointer;
        }

        .tools-dropdown button:hover {
            background-color: #f0f0f0;
        }

        .tools-dropdown button:last-child {
            border-bottom: none;
        }

        /* Vocabulary arrays */
        .vocabulary-array {
            position: fixed;
            top: 2%;
            width: 18vw;
            max-height: calc(100vh - 40px);   /* grows with its content; only the screen height caps it (40px allows for padding + border) */
            overflow-y: auto;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px;
            z-index: 4;
            display: none;
        }

        #vocabulary-array {
            left: 5%;   /* fallback only: setupArrayDrag() places it at 5% across / 2% down the template box */
        }

        /* Learned Vocabulary array is draggable anywhere on screen (see setupArrayDrag).
           touch-action:none lets a finger drag it; when the list overflows, JS adds
           .scrollable so vertical swipes scroll the list instead (title stays a drag handle). */
        .vocabulary-array {
            touch-action: none;
        }
        .vocabulary-array.scrollable {
            touch-action: pan-y;
        }
        .vocabulary-array.dragging {
            user-select: none;
            -webkit-user-select: none;
            opacity: 0.85;
        }
        .array-title {
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .vocabulary-array.dragging .array-title {
            cursor: grabbing;
        }

        /* Redundant in this family (removed from view 2026-09-20). The elements and the JS that
           updates them are left in place so nothing throws; !important beats the inline
           display:block the JS sets. */
        .level-indicator,
        .concept-indicator {
            display: none !important;
        }

        /* .array-header puts the title and the Hide All button side by side in a
           real flex row. The button used to be absolutely positioned over the
           title's top-right corner, which covered most of the title on a
           narrow phone (the touch-size button is ~83px wide, the array under
           90px). Dragging still works unchanged: it is bound to the whole
           array, not to the title. */
        .array-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            transition: margin-bottom 0.6s ease-in-out;
        }

        .vocabulary-array.collapsed .array-header {
            margin-bottom: 0;
        }

        .array-title {
            flex: 1;
            min-width: 0;   /* lets the title wrap instead of forcing the row wider */
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
            padding: 5px;
            background-color: #e8f4fd;
            border-radius: 3px;
        }

        .vocabulary-item {
            display: flex;
            flex-direction: column;
            font-size: 0.75em;
            margin: 5px 0;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background-color: white;
        }

        /* Each learned entry shows all three layers, in click-cycle order:
           TLR (bold, what the learner is quizzed on) -> TL -> SL. */
        .vocabulary-item .target-language-roman {
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .vocabulary-item .target-language {
            color: #2c5aa0;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .vocabulary-item .source-language {
            color: #666;
            cursor: pointer;
        }

        .vocabulary-item .target-language-roman.hidden,
        .vocabulary-item .target-language.hidden,
        .vocabulary-item .source-language.hidden {
            color: transparent;
            user-select: none;
            background-color: #f0f0f0;
        }

        .toggle-visibility {
            flex: none;   /* no longer position: absolute - see .array-header */
            font-size: 0.65em;
            padding: 3px 8px;
            background-color: #e0e0e0;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
        }

        .drag-instruction {
            position: absolute;
            top: 40%;
            left: 5%;
            font-size: 0.85em;
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 3;
            opacity: 1;
            transition: opacity 2s ease;
            text-align: center;
        }
        
        .drag-instruction.fade {
            opacity: 0;
        }

        /* ── Mobile sizing: frame and touch targets ───────────────────
           Text sizing is handled in calculateFontSize() (JS), not here,
           since those sizes are set inline per text box and would
           override any CSS rule. Frame radius roughly doubled, and
           touch targets enlarged to meet the ~48px guideline, matching
           the fix applied across the GT5L/GP3L/IT5L family. Not yet
           visually confirmed on a real device. Treat as a starting
           point. */
        @media (pointer: coarse) {
            body {
                /* The button bar is now an in-flow block BELOW the frame, so
                   .page-wrapper is taller than the frame alone. With the
                   desktop rule's height: 100vh + overflow: hidden the excess
                   would be clipped and the bar unreachable on short phone
                   viewports. Let the body grow and scroll instead. */
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
                overflow-x: hidden;
            }
            #draggableFrame {
                r: 6;
            }
            .tools-button,
            .mode-toggle {
                min-height: 48px;
                padding: 14px 18px;
                font-size: 1em;
            }
            .toggle-visibility {
                min-height: 48px;
                min-width: 48px;
                padding: 12px 16px;
                font-size: 0.9em;
            }
            .tools-dropdown button {
                min-height: 48px;
                padding: 16px 15px;
                font-size: 0.95em;
            }
            /* Button bar: a normal in-flow row BELOW the frame, so it cannot
               overlap diagram content at any width. position: relative (not
               static) keeps .tools-menu the containing block for
               .tools-dropdown. top/right must be reset explicitly: they do
               not reset themselves when position changes. */
            .tools-menu {
                position: relative;
                top: auto;
                right: auto;
                margin-top: 8px;
            }
            /* The scrolling/flex duties live on .tools-bar, NOT on .tools-menu:
               overflow-x: auto silently forces overflow-y: auto too, which would
               clip .tools-dropdown (a sibling of .tools-bar, opening upward past
               the bar's own box). */
            .tools-bar {
                max-width: 100%;
                flex-direction: row;
                align-items: center;
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: center;
                padding: 0 4px 4px;
            }
            .tools-row {
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: center;
                order: 1;   /* Show All, mode button and Reset first (left): used constantly during practice */
            }
            .tools-button {
                order: 2;
                flex: none;
            }
            .tools-dropdown {
                top: auto;
                right: auto;
                bottom: 52px;   /* opens upward, above the enlarged button row */
                left: 50%;
                transform: translateX(-50%);
            }
            .show-all-btn,
            .mode-toggle,
            .reset-btn {
                box-sizing: border-box;   /* so min-height 48px is the real height */
                min-height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 4px 10px;
                font-size: 0.85em;
                white-space: nowrap;
            }
            /* Narrow phones (landscape ~ 667px): keep squeezing so the row still fits */
            @media (max-width: 760px) {
                .show-all-btn,
                .mode-toggle,
                .reset-btn {
                    padding: 4px 7px;
                    font-size: 0.75em;
                }
            }
            /* 22.5vw is under 90px on a phone: too narrow for the title beside a
               48px-tall Hide All button. */
            .vocabulary-array {
                width: min(65vw, 280px);
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
    <div class="template-id-badge">LOG-IT5LI-5TB</div>
    <div class="a4-page">
        <div id="title-box" class="title-box"></div>
        <div id="mode-indicator" class="mode-indicator">SL States Mode</div>
        <div id="concept-indicator" class="concept-indicator">SL1</div>
        <div id="level-indicator" class="level-indicator">Target Language</div>
        <div id="path-indicator" class="path-indicator">Main Path</div>
        <div id="drag-instruction" class="drag-instruction">Mobile Phone users: click 'Tools' then 'Full Screen'.<br><br>Click on it, grab it and move it around.<br>Click on the words - and click again.</div>
        
        <!-- Vocabulary Array: ONE combined list of learned items, kept in path order.
             Instant-change concepts have no "increasing" or "decreasing" progression. -->
        <div id="vocabulary-array" class="vocabulary-array">
            <div class="array-header">
                <div class="array-title">Learned Vocabulary</div>
                <button class="toggle-visibility" id="toggle-vocabulary">Hide All</button>
            </div>
            <div id="vocabulary-items"></div>
        </div>
        
        <svg id="svgCanvas" viewBox="-30 0 160 50" preserveAspectRatio="xMidYMid meet">
            <!-- Concept Gradient -->
            <defs>
                <linearGradient id="conceptGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#87ceeb;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <path id="gradualChangePath" class="path-line" />
            <path id="conceptBackground"></path>
            
            <!-- Extension paths (horizontal continuations) -->
            <path id="extensionPath1" class="extension-path" d="M 23.33,15 L 130,15" />
            <path id="extensionPath2" class="extension-path" d="M 76.67,35 L 130,35" />
            
            <!-- States Mode Elements -->
            <!-- Circular draggable frame -->
            <circle id="draggableFrame" cx="-24" cy="17.5" r="3" 
                  style="z-index: 10000; pointer-events: all; cursor: grab;"/>
            
            <!-- Transitions Mode Elements - Single Draggable Text -->
            <text id="interactiveText" class="sliding-text">
                <textPath id="slidingText" href="#gradualChangePath" startOffset="0%">
                    TL-T1
                </textPath>
            </text>
        </svg>
        <div class="watermark">
            &copy; 2026 Alan William Preston
        </div>
    </div>

    <!-- Tools Menu: a SIBLING of .a4-page (not a child), so on touch devices it
         renders below the frame instead of over the diagram. .tools-dropdown is
         a sibling of .tools-bar so the bar's horizontal scrolling can never
         clip it. -->
    <div class="tools-menu">
        <div class="tools-dropdown">
            <button id="toggleFullscreen">Full Screen</button>
            <button id="loadConcept">Load Concept</button>
            <button id="startQuiz">Start Random Quiz</button>
        </div>
        <div class="tools-bar">
            <button class="tools-button">Tools ▼</button>
            <div class="tools-row">
                <button id="showAllBtn" class="show-all-btn" type="button" title="Quick reference: show every word at once. Click any word to flip just that word to its next language layer. Keep clicking to reach Hide All, which clears every word off the screen.">Show All</button>
                <button id="modeToggle" class="mode-toggle" type="button">Show Transitions</button>
                <button id="resetBtn" class="reset-btn" type="button" title="Start this concept over from the beginning: clears Quiz progress and returns to the start of the line.">Reset</button>
            </div>
        </div>
    </div>
    </div>

    <div id="quizContainer" class="quiz-container">
        <input type="text" id="quizInput" placeholder="Enter the TLR word">
        <button id="quizCheck">Check</button>
        <div id="quizFeedback"></div>
    </div>

    <script>
        // Sample vocabulary data - replace with actual concepts
        // Format: [TLR, TL, SL, Quiz, Position]
        const conceptData = [
            ["TLR1", "TL1", "SL1", "What is the TLR word for 'SL1'?", 13.33],   // Line 1 midpoint
            ["TLR2", "TL2", "SL2", "What is the TLR word for 'SL2'?", 31.67],     // Line 2 midpoint
            ["TLR3", "TL3", "SL3", "What is the TLR word for 'SL3'?", 50],       // Line 3 midpoint
            ["TLR4", "TL4", "SL4", "What is the TLR word for 'SL4'?", 68.33],     // Line 4 midpoint
            ["TLR5", "TL5", "SL5", "What is the TLR word for 'SL5'?", 86.67]    // Line 5 midpoint
        ];

        const transitionsData = [
            ["TLR-T1", "TL-T1", "SL-T1", 0, 26.67],      // Line 1: 0% to 26.67%
            ["TLR-T2", "TL-T2", "SL-T2", 26.67, 36.67],  // Line 2: 26.67% to 36.67%
            ["TLR-T3", "TL-T3", "SL-T3", 36.67, 63.33],  // Line 3: 36.67% to 63.33%
            ["TLR-T4", "TL-T4", "SL-T4", 63.33, 73.33],  // Line 4: 63.33% to 73.33%
            ["TLR-T5", "TL-T5", "SL-T5", 73.33, 100]     // Line 5: 73.33% to 100%
        ];

        // Extension vocabulary for continuation paths
        // Format: [TLR, TL, SL, Quiz]
        const extensionData = [
            ["TLR1+", "TL1+", "SL1+", "What is the TLR word for 'SL1+'?"],  // Extension from Line 1
            ["TLR3+", "TL3+", "SL3+", "What is the TLR word for 'SL3+'?"],  // Extension from Line 3
            ["TLR+5", "TL+5", "SL+5", "What is the TLR word for 'SL+5'?"]   // Extension from Line 5
        ];

        // Extension vocabulary expanded for transitions mode
        const extension1TransitionData = [
            ["TLR-Ext1-A", "TL-Ext1-A", "SL-Ext1-A"]
        ];

        const extension2TransitionData = [
            ["TLR-Ext2-A", "TL-Ext2-A", "SL-Ext2-A"]
        ];

        // Global variables
        let isStatesMode = true;
        
        let currentModeIndicatorIndex = 1;
        const modeIndicatorTexts = {
            states: ["TL States Mode", "SL States Mode"],
            transitions: ["TL Transitions Mode", "SL Transitions Mode"]
        };
        let pathLength = 0;
        let currentQuizIndex = -1;
        let currentQuizIsExtension = false; // Track if current quiz is for extension textbox
        let currentQuizExtIndex = -1; // Extension index for extension textboxes
        
        // Quiz container drag state (the drag itself is wired in setupQuizDrag())
        let quizPosition = { x: null, y: null }; // null = use default centered position
        let quizJustDragged = false; // swallows the synthetic click a drag-release generates
        let slidingTextMode = 0; // 0: TLR, 1: TL, 2: SL, 3: Quiz
        let learnedItemsStates = []; // Separate tracking for States Mode
        let learnedItemsTransitions = []; // Separate tracking for Transitions Mode
        let textBoxElements = [];
        let addedVocabularyItems = [];
        let currentTextLayer = new Array(11).fill(0);
        let extensionTextBoxes = [];
        let extensionTextLayers = [0, 0, 0];
        
        // TRANSITIONS MODE VARIABLES
        let currentPath = 'main'; // 'main', 'ext1', 'ext2'
        let currentOffset = 0;
        let isDraggingText = false;
        let lastDragPoint = null;
        let hasMovedDuringDrag = false;
        let dragStartClientX = 0, dragStartClientY = 0, dragGrabOffset = 0;
        const DRAG_THRESHOLD_PX = 8;   // movement below this is a tap, not a drag
        const MAX_TEXT_OFFSET = 95;    // fallback cap if the word cannot be measured
        
        // Title text options
        // Title cycle: TLR (default) → TL → SL → TLR, per mode. See
        // "Logographic UI Conventions" in Conceptionary_Template_Definitions.md.
        const titleTexts = {
            states: ["TLR_TITLE_STATES", "TL_TITLE_STATES", "SL_TITLE_STATES"],
            transitions: ["TLR_TITLE_TRANSITIONS", "TL_TITLE_TRANSITIONS", "SL_TITLE_TRANSITIONS"]
        };
        let currentTextIndex = 0;
        
        // Activation distance for text boxes
        const activationDistance = 11.4;

        // CENTERED: Rebuilt 5-line system with perfect center alignment
        // INVERTED, in the 160x50 fitted frame: Lines 1 and 5 high (y=15), Line 3 low (y=35);
        // the two vertical lines are 20 units long.
        const pathPoints = [
            `-30,15`, 
            `23.33,15`,
            `23.33,35`,
            `76.67,35`,
            `76.67,15`,
            `130,15`
        ];

        // DOM elements
        let svg, pathLine, conceptBackground, titleBox, conceptIndicator, levelIndicator, pathIndicator;
        let modeToggleBtn, frame, quizContainer, quizInput, quizCheck, quizFeedback;
        let vocabularyArray, vocabularyItems;
        let toggleVocabularyBtn;
        let interactiveText, slidingText;
        let ext1Path, ext2Path;

        // TRANSITIONS MODE FUNCTIONS
        
        function getPathObject(pathName) {
            switch(pathName) {
                case 'ext1':
                    return ext1Path;
                case 'ext2':
                    return ext2Path;
                default:
                    return pathLine;
            }
        }

        function getPointOnPath(pathName, offset) {
            const path = getPathObject(pathName);
            const length = path.getTotalLength();
            const position = (offset / 100) * length;
            return path.getPointAtLength(position);
        }

        // ── Which vocabulary item is this? ─────────────────────────────
        // Transition items live in three lists (main path, extension 1,
        // extension 2). Everything that needs "which item?" goes through
        // these helpers, and an item is identified by ONE global index:
        // the main path first (0-4), then extension 1, then extension 2 -
        // the same order the learned-vocabulary list is kept in.
        //
        // On the main path Line 1 = T1 ... Line 5 = T5. The zones are
        // computed from pathPoints, so they follow the real segment lengths
        // (the two vertical lines are much shorter than the horizontals)
        // rather than equal fifths of the path.
        let transitionRanges = [];

        function computeTransitionRanges() {
            const pts = pathPoints.map(p => p.split(',').map(Number));
            const lens = [];
            let total = 0;
            for (let i = 1; i < pts.length; i++) {
                const len = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
                lens.push(len);
                total += len;
            }
            transitionRanges = [];
            let acc = 0;
            lens.forEach(len => {
                transitionRanges.push([(acc / total) * 100, ((acc + len) / total) * 100]);
                acc += len;
            });
        }

        function getTransitionList(pathName) {
            if (pathName === 'ext1') return extension1TransitionData;
            if (pathName === 'ext2') return extension2TransitionData;
            return transitionsData;
        }

        function getTransitionBase(pathName) {
            if (pathName === 'ext1') return transitionsData.length;
            if (pathName === 'ext2') return transitionsData.length + extension1TransitionData.length;
            return 0;
        }

        // The item shown at a given path and offset (percent along that path).
        function getTransitionItem(pathName, offset) {
            const list = getTransitionList(pathName);
            let dataIndex = list.length - 1;
            if (pathName === 'main') {
                if (transitionRanges.length === 0) computeTransitionRanges();
                for (let i = 0; i < transitionRanges.length && i < list.length; i++) {
                    if (offset < transitionRanges[i][1]) { dataIndex = i; break; }
                }
            } else {
                dataIndex = Math.min(list.length - 1, Math.max(0, Math.floor((offset / 100) * list.length)));
            }
            return { path: pathName, dataIndex: dataIndex, index: getTransitionBase(pathName) + dataIndex, data: list[dataIndex] };
        }

        // The item for a global index (what the quiz and the array work from).
        function getTransitionItemByIndex(index) {
            let pathName = 'main';
            let dataIndex = index;
            if (index >= transitionsData.length + extension1TransitionData.length) {
                pathName = 'ext2';
                dataIndex = index - transitionsData.length - extension1TransitionData.length;
            } else if (index >= transitionsData.length) {
                pathName = 'ext1';
                dataIndex = index - transitionsData.length;
            }
            const list = getTransitionList(pathName);
            if (index < 0 || dataIndex >= list.length) return null;
            return { path: pathName, dataIndex: dataIndex, index: index, data: list[dataIndex] };
        }

        function getSvgPoint(clientX, clientY) {
            const p = svg.createSVGPoint();
            p.x = clientX;
            p.y = clientY;
            return p.matrixTransform(svg.getScreenCTM().inverse());
        }

        // Nearest point on one path element to an SVG-space point, as a
        // length along that path plus its distance. When aroundLength is
        // given only a window of the path around it is searched, so the
        // text cannot teleport to a different line when the pointer strays
        // between two lines; null searches the whole path.
        function closestOnPathEl(el, x, y, aroundLength) {
            const total = el.getTotalLength();
            const WINDOW = 45;
            const lo = aroundLength === null ? 0 : Math.max(0, aroundLength - WINDOW);
            const hi = aroundLength === null ? total : Math.min(total, aroundLength + WINDOW);
            const step = aroundLength === null ? 0.5 : 0.25;
            let best = lo;
            let bestDist = Infinity;
            for (let L = lo; L <= hi + 1e-9; L += step) {
                const p = el.getPointAtLength(Math.min(L, total));
                const d = Math.hypot(p.x - x, p.y - y);
                if (d < bestDist) {
                    bestDist = d;
                    best = L;
                }
            }
            return { len: Math.min(best, total), dist: bestDist };
        }

        function updatePathIndicator() {
            if (isStatesMode) {
                pathIndicator.style.display = 'none';
                return;
            }
            
            pathIndicator.style.display = 'none';
            
            switch(currentPath) {
                case 'main':
                    pathIndicator.textContent = 'Main Path (Lines 1-5)';
                    pathIndicator.style.backgroundColor = '#e8f4fd';
                    pathIndicator.style.borderColor = '#3366cc';
                    break;
                case 'ext1':
                    pathIndicator.textContent = 'Extension: Line 1+ Continues';
                    pathIndicator.style.backgroundColor = '#e8ffe8';
                    pathIndicator.style.borderColor = '#33cc66';
                    break;
                case 'ext2':
                    pathIndicator.textContent = 'Extension: Line 3+ Continues';
                    pathIndicator.style.backgroundColor = '#fffce8';
                    pathIndicator.style.borderColor = '#cccc33';
                    break;
            }
        }

        function switchToPath(newPath, offset = 0) {
            currentPath = newPath;
            currentOffset = offset;
            
            let targetHref = '#gradualChangePath';
            if (newPath === 'ext1') {
                targetHref = '#extensionPath1';
            } else if (newPath === 'ext2') {
                targetHref = '#extensionPath2';
            }
            
            // Left-aligned on the main path and extension 1 (the offset is where the word
            // starts); right-aligned on extension 2 (the offset is where it ends), as in ROM-IT5L-11TB
            interactiveText.style.textAnchor = (newPath === 'ext2') ? 'end' : 'start';
            slidingText.setAttribute('href', targetHref);
            slidingText.setAttribute('startOffset', `${offset}%`);
            
            updateTextContent();   // shows the word, sizes it and keeps all of it on its line / path
            updatePathIndicator();
            
            console.log("Switched to path:", newPath, "at offset:", offset);
        }

        // Sliding-text size, as in ROM-IT5L-11TB: larger for short words, smaller for
        // long ones, doubled on touch screens. The 11TB template's sizes are in its own
        // 100x50 stretched frame; this frame is 160x50 and fitted (not stretched), so the
        // sizes are rescaled (x1.4) to give the same on-screen size.
        function calculateFontSize(text) {
            const length = (text || '').trim().length;
            let baseSize;
            if (length <= 10) baseSize = 2.1;
            else if (length <= 20) baseSize = 1.8;
            else if (length <= 40) baseSize = 1.5;
            else if (length <= 60) baseSize = 1.2;
            else if (length <= 80) baseSize = 1.05;
            else if (length <= 100) baseSize = 0.9;
            else baseSize = 0.75;
            if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) baseSize *= 2;
            const ratio = 1.4;   // 160x50 frame vs the 11TB's 100x50: gives the same on-screen size at a desktop window (and scales with the diagram)
            return baseSize * ratio;
        }

        // Which main-path line (0-4) a position (percent along the path) is on.
        function zoneAtPercent(p) {
            if (transitionRanges.length === 0) computeTransitionRanges();
            for (let i = 0; i < transitionRanges.length; i++) {
                if (p < transitionRanges[i][1]) return i;
            }
            return transitionRanges.length - 1;
        }

        // Shrinks the word, never below 30% of its normal size, until it fits maxLen
        // (the length of its line or path, in SVG units). Returns the word's length.
        function shrinkToFit(maxLen) {
            let len = 0;
            try { len = interactiveText.getComputedTextLength(); } catch (e) { return 0; }
            if (len > maxLen * 0.96 && len > 0) {
                const natural = parseFloat(interactiveText.style.fontSize) || 6.4;
                interactiveText.style.fontSize = (natural * Math.max(0.3, (maxLen * 0.96) / len)) + 'px';
                try { len = interactiveText.getComputedTextLength(); } catch (e) { /* keep len */ }
            }
            return len;
        }

        // Keeps the sliding word on ITS OWN line of the main path: shrunk if the line is
        // too short for it (the two vertical lines are short), then held between that
        // line's two ends, so it can never bend round a corner onto the neighbouring
        // line. Returns the (possibly adjusted) start position, in %.
        function fitMainWord(zone, offset) {
            const r = transitionRanges[zone];
            if (!r) return offset;
            const len = shrinkToFit(((r[1] - r[0]) / 100) * pathLength);
            const lenPct = (len / pathLength) * 100;
            return Math.min(Math.max(r[0], r[1] - lenPct), Math.max(r[0], offset));
        }

        // zoneOverride (given while dragging on the main path) says which line the
        // POINTER is on; the word belongs to that line.
        function updateTextContent(zoneOverride) {
            if (isStatesMode) return;

            let item;
            let zone = -1;
            if (currentPath === 'main') {
                zone = (zoneOverride === undefined) ? zoneAtPercent(currentOffset) : zoneOverride;
                item = { path: 'main', dataIndex: zone, index: zone, data: transitionsData[zone] };
            } else {
                item = getTransitionItem(currentPath, currentOffset);
            }
            // TLR first, then TL, then SL (SL also stays on show while the quiz is open)
            const displayText = item.data[Math.min(slidingTextMode, 2)];
            slidingText.textContent = displayText;
            interactiveText.style.fontSize = calculateFontSize(displayText) + "px";
            interactiveText.classList.toggle('learned', !!learnedItemsTransitions[item.index]);

            // The word is now showing: keep ALL of it on its own line / path
            if (currentPath === 'main') {
                currentOffset = fitMainWord(zone, currentOffset);
            } else {
                shrinkToFit(getPathObject(currentPath).getTotalLength());   // a phrase longer than the extension path
                currentOffset = clampTextOffset(currentOffset);
            }
            slidingText.setAttribute('startOffset', `${currentOffset}%`);
        }

        function updateLevelIndicator() {
            if (isStatesMode) {
                levelIndicator.style.display = 'none';
                return;
            }
            
            levelIndicator.style.display = 'none';
            
            switch (slidingTextMode) {
                case 0:
                    levelIndicator.textContent = 'Target Language Romanized (TLR)';
                    break;
                case 1:
                    levelIndicator.textContent = 'Target Language (TL)';
                    break;
                case 2:
                    levelIndicator.textContent = 'Source Language (SL)';
                    break;
                case 3:
                    levelIndicator.textContent = 'Quiz Mode';
                    break;
            }
        }

        // Keep the whole sliding word on its path: glyphs beyond the end of a path
        // are not drawn, so a word dragged to the end would be cut off. The offset
        // is where the word STARTS, so it must stop short of the end by the
        // word's length. If the word can't be measured there is no extra limit.
        function clampTextOffset(offset) {
            let lo = 0, hi = MAX_TEXT_OFFSET;
            try {
                const len = document.getElementById("interactiveText").getComputedTextLength();
                const pathLen = getPathObject(currentPath).getTotalLength();
                if (len > 0 && pathLen > 0) {
                    const lenPct = (len / pathLen) * 100;
                    if (currentPath === 'ext2') { lo = Math.min(100, lenPct); hi = 100; }
                    else { lo = 0; hi = Math.max(0, 100 - lenPct); }
                }
            } catch (e) { /* not measurable: keep the fallback */ }
            return Math.min(hi, Math.max(lo, offset));
        }

        function startTextDrag(e) {
            if (isStatesMode) return;

            isDraggingText = true;
            hasMovedDuringDrag = false;
            interactiveText.classList.add('dragging');

            const src = e.touches ? e.touches[0] : e;
            dragStartClientX = src.clientX;
            dragStartClientY = src.clientY;

            // Remember where on the text the learner grabbed it, so the text
            // does not jump so that its start sits under the pointer.
            const pt = getSvgPoint(src.clientX, src.clientY);
            const el = getPathObject(currentPath);
            const startLen = (currentOffset / 100) * el.getTotalLength();
            dragGrabOffset = closestOnPathEl(el, pt.x, pt.y, null).len - startLen;

            e.preventDefault();
        }

        function dragText(e) {
            if (!isDraggingText || isStatesMode) return;

            const src = e.touches ? e.touches[0] : e;
            if (!hasMovedDuringDrag) {
                // Distance from where the drag STARTED, not from the last
                // event, so slow drags still register as drags
                if (Math.hypot(src.clientX - dragStartClientX, src.clientY - dragStartClientY) <= DRAG_THRESHOLD_PX) {
                    if (e.cancelable) e.preventDefault();
                    return;
                }
                hasMovedDuringDrag = true;
            }

            const pt = getSvgPoint(src.clientX, src.clientY);

            // Stay on the current path (searching only a window around the text
            // so it cannot jump to a far-off line) unless the pointer is clearly
            // nearer another path - then the text hops onto that path.
            const curEl = getPathObject(currentPath);
            const curTotal = curEl.getTotalLength();
            const curStartLen = (currentOffset / 100) * curTotal;
            const cur = closestOnPathEl(curEl, pt.x, pt.y, curStartLen + dragGrabOffset);

            let bestPath = currentPath;
            let bestLen = cur.len;
            let bestDist = cur.dist;
            ['main', 'ext1', 'ext2'].forEach(name => {
                if (name === currentPath) return;
                const c = closestOnPathEl(getPathObject(name), pt.x, pt.y, null);
                if (c.dist < bestDist - 0.05) {
                    bestPath = name;
                    bestLen = c.len;
                    bestDist = c.dist;
                }
            });

            if (bestPath !== currentPath) {
                const total = getPathObject(bestPath).getTotalLength();
                switchToPath(bestPath, Math.min(100, Math.max(0, (bestLen / total) * 100)));
                dragGrabOffset = 0;
            } else {
                const startLen = Math.min(curTotal, Math.max(0, bestLen - dragGrabOffset));
                currentOffset = (startLen / curTotal) * 100;
                // On the main path the word belongs to the line the POINTER is on
                updateTextContent(currentPath === 'main' ? zoneAtPercent((bestLen / curTotal) * 100) : undefined);
            }

            if (e.cancelable) e.preventDefault();
        }

        function endTextDrag(e) {
            if (isDraggingText) {
                isDraggingText = false;
                interactiveText.classList.remove('dragging');
            }
        }

        function toggleTextFormat(e) {
            if (isStatesMode || isDraggingText || hasMovedDuringDrag) return;

            const item = getTransitionItem(currentPath, currentOffset);

            if (learnedItemsTransitions[item.index]) {
                // Cycle TLR -> TL -> SL -> TLR for learned items
                slidingTextMode = (slidingTextMode + 1) % 3;
                updateTextContent();
                updateLevelIndicator();
            } else {
                // TLR -> TL -> SL -> Quiz for unlearned items
                if (slidingTextMode === 0) {
                    slidingTextMode = 1;
                    updateTextContent();
                    updateLevelIndicator();
                } else if (slidingTextMode === 1) {
                    slidingTextMode = 2;
                    updateTextContent();
                    updateLevelIndicator();
                } else if (slidingTextMode === 2) {
                    slidingTextMode = 3;
                    updateLevelIndicator();
                    showQuiz(item.index, interactiveText);
                } else {
                    slidingTextMode = 0;
                    updateTextContent();
                    updateLevelIndicator();
                }
            }
        }

        function handleExtensionClick(extensionId) {
            if (isStatesMode) return;
            
            if (extensionId === 'ext1') {
                switchToPath('ext1', 0);
            } else if (extensionId === 'ext2') {
                switchToPath('ext2', 0);
            }
        }

        // STATES MODE FUNCTIONS
        
        let isDragging = false;
        let currentPathPosition = 0;

        // The frame circle's real radius in path units: CSS doubles it to 3 on
        // touch devices (pointer: coarse), so the left/right clamp must too, or
        // the circle is half cut off at either end of the path.
        function getFrameRadius() {
            return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? 6 : 3;
        }

        function startDrag(e) {
            if (!isStatesMode) return;
            
            isDragging = true;
            frame.classList.add('dragging');
            
            e.preventDefault();
            e.stopPropagation();
        }

        function dragMove(e) {
            if (!isDragging || !isStatesMode) return;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            try {
                const sp = getSvgPoint(clientX, clientY);
                const svgX = sp.x;
                const svgY = sp.y;
                
                // Find closest point on ALL paths (main + extensions)
                let closestPoint = null;
                let minDistance = Infinity;
                let closestPathName = 'main';
                
                const sampleRate = 0.5;
                
                // Check main path
                for (let i = 0; i < pathLength; i += sampleRate) {
                    const point = pathLine.getPointAtLength(i);
                    const distance = Math.sqrt(Math.pow(point.x - svgX, 2) + Math.pow(point.y - svgY, 2));
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestPoint = point;
                        closestPathName = 'main';
                    }
                }
                
                // Check extension path 1 (Line 1+)
                const ext1Length = ext1Path.getTotalLength();
                for (let i = 0; i < ext1Length; i += sampleRate) {
                    const point = ext1Path.getPointAtLength(i);
                    const distance = Math.sqrt(Math.pow(point.x - svgX, 2) + Math.pow(point.y - svgY, 2));
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestPoint = point;
                        closestPathName = 'ext1';
                    }
                }
                
                // Check extension path 2 (Line 3+)
                const ext2Length = ext2Path.getTotalLength();
                for (let i = 0; i < ext2Length; i += sampleRate) {
                    const point = ext2Path.getPointAtLength(i);
                    const distance = Math.sqrt(Math.pow(point.x - svgX, 2) + Math.pow(point.y - svgY, 2));
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestPoint = point;
                        closestPathName = 'ext2';
                    }
                }
                
                if (closestPoint) {
                    // Circle radius is 1.5 units
                    const radius = getFrameRadius();
                    
                    // Constrain circle to stay within viewBox (-30 to 130 on x-axis)
                    const minX = -30 + radius;   // left edge of the viewBox
                    const maxX = 130 - radius;   // right edge of the viewBox
                    
                    const constrainedX = Math.max(minX, Math.min(maxX, closestPoint.x));
                    
                    // Position circle centered on the path
                    frame.setAttribute('cx', constrainedX);
                    frame.setAttribute('cy', closestPoint.y);
                    
                    // Use constrained position for textbox updates
                    updateVisibleTextBoxes({ x: constrainedX, y: closestPoint.y });
                    
                    // Update concept indicator based on which path we're on
                    if (closestPathName === 'main') {
                        // Find position along main path for concept indicator
                        let bestPos = 0;
                        let minDist = Infinity;
                        for (let i = 0; i <= 100; i++) {
                            const testLength = (i / 100) * pathLength;
                            const testPoint = pathLine.getPointAtLength(testLength);
                            const dist = Math.sqrt(Math.pow(testPoint.x - constrainedX, 2) + Math.pow(testPoint.y - closestPoint.y, 2));
                            if (dist < minDist) {
                                minDist = dist;
                                bestPos = i;
                            }
                        }
                        updateConceptIndicator(bestPos);
                    } else if (closestPathName === 'ext1') {
                        conceptIndicator.textContent = extensionData[0][1] + " (Line 1+)";
                    } else if (closestPathName === 'ext2') {
                        conceptIndicator.textContent = extensionData[1][1] + " (Line 3+)";
                    }
                    
                }
                
            } catch (error) {
                console.error("Error during drag:", error);
            }
            
            e.preventDefault();
            e.stopPropagation();
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                frame.classList.remove('dragging');
                
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        function updateConceptIndicator(position) {
            const closestIndex = conceptData.reduce((closest, data, index) => {
                const distance = Math.abs(data[4] - position);
                return distance < closest.distance ? { index, distance } : closest;
            }, { index: 0, distance: Infinity }).index;
            
            conceptIndicator.textContent = conceptData[closestIndex][1];
        }

        function initializeFramePosition() {
            currentPathPosition = 0;
            const startPoint = pathLine.getPointAtLength(0);
            
            // Circle radius is 1.5 units
            const radius = getFrameRadius();
            
            // Constrain x position: left edge should not go below -30 (viewBox start)
            const minX = -30 + radius;   // left edge of the viewBox
            const maxX = 130 - radius;   // right edge of the viewBox
            const constrainedX = Math.max(minX, Math.min(maxX, startPoint.x));
            
            // Position circle centered on the path
            frame.setAttribute('cx', constrainedX);
            frame.setAttribute('cy', startPoint.y);
            
            updateVisibleTextBoxes({ x: constrainedX, y: startPoint.y });
            updateConceptIndicator(0);
            
            bringFrameToFront();
            frame.style.pointerEvents = 'all';
            frame.style.cursor = 'grab';
            
        }

        function updateVisibleTextBoxes(point) {
            if (!isStatesMode) return -1;
            
            let closestIndex = -1;
            let minDistance = Infinity;
            let closestIsExtension = false;
            let closestExtIndex = -1;
            
            // Check main textboxes
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x'));
                const y = parseFloat(textBox.getAttribute('y'));
                
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                    closestIsExtension = false;
                }
            });
            
            // Check extension textboxes
            extensionTextBoxes.forEach((textBox, extIndex) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x'));
                const y = parseFloat(textBox.getAttribute('y'));
                
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = extIndex;
                    closestExtIndex = extIndex;
                    closestIsExtension = true;
                }
            });
            
            // Update main textboxes
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                if (!closestIsExtension && index === closestIndex && minDistance < activationDistance) {
                    textBox.classList.add('active');
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else if (learnedItemsStates[index]) {
                    textBox.classList.remove('active');
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else {
                    textBox.classList.remove('active');
                    textBox.style.opacity = '0';
                    textBox.style.transform = 'scale(0.5)';
                }
            });
            
            // Update extension textboxes
            extensionTextBoxes.forEach((textBox, extIndex) => {
                if (!textBox) return;
                
                // Extension textboxes use indices 5-7 in learnedItemsStates array
                const dataIndex = conceptData.length + extIndex; // 5 + extIndex
                
                if (closestIsExtension && extIndex === closestExtIndex && minDistance < activationDistance) {
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else if (learnedItemsStates[dataIndex]) {
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else {
                    textBox.style.opacity = '0';
                    textBox.style.transform = 'scale(0.5)';
                }
            });
            
            return closestIsExtension ? -1 : closestIndex;
        }


        function createTextBoxes() {
            if (!isStatesMode) return;
            
            // Clear existing text boxes
            document.querySelectorAll('.textBox:not(.extension)').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            textBoxElements = [];
            
            // INVERTED layout: Lines 1 and 5 at y=15, Line 3 at y=35. Each label sits beside its own line.
            const textBoxConfig = [
                { x: -3.33, y: 13, anchor: "middle", index: 0 },     // TLR1 - Line 1 middle, above the line
                { x: 25.33, y: 25, anchor: "start", index: 1 },      // TLR2 - Line 2 (vertical, going down), to its right
                { x: 50, y: 37, anchor: "middle", index: 2 },        // TLR3 - Line 3 middle, below the line
                { x: 78.67, y: 25, anchor: "start", index: 3 },      // TLR4 - Line 4 (vertical, going up), to its right
                { x: 103.33, y: 13, anchor: "middle", index: 4 }     // TLR5 - Line 5 middle, above the line
            ];
            
            // Create text boxes with Phonographic 3-level cycling
            for (let i = 0; i < textBoxConfig.length; i++) {
                const config = textBoxConfig[i];
                
                const textBox = document.createElementNS("http://www.w3.org/2000/svg", "text");
                textBox.setAttribute("class", "textBox");
                textBox.setAttribute("x", config.x);
                textBox.setAttribute("y", config.y);
                textBox.style.textAnchor = config.anchor;   // inline style, not the attribute (CSS specificity)
                textBox.setAttribute("data-index", config.index);
                
                // Set initial text based on current layer (starts with TL)
                textBox.textContent = conceptData[config.index][currentTextLayer[config.index]];
                textBox.style.fontSize = calculateFontSize(conceptData[config.index][currentTextLayer[config.index]]) + "px";
                
                if (learnedItemsStates[config.index]) textBox.classList.add('learned');
                
                // Add click event listener with Phonographic 3-level cycling
                textBox.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const index = parseInt(this.getAttribute('data-index'));
                    
                    if (learnedItemsStates[index]) {
                        // Cycle between TLR, TL, and SL for learned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TLR -> TL
                            this.textContent = conceptData[index][1];
                            this.style.fontSize = calculateFontSize(conceptData[index][1]) + "px";
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2; // TL -> SL
                            this.textContent = conceptData[index][2];
                            this.style.fontSize = calculateFontSize(conceptData[index][2]) + "px";
                        } else {
                            currentTextLayer[index] = 0; // SL -> TLR
                            this.textContent = conceptData[index][0];
                            this.style.fontSize = calculateFontSize(conceptData[index][0]) + "px";
                        }
                    } else {
                        // TLR -> TL -> SL -> Quiz cycle for unlearned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TLR -> TL
                            this.textContent = conceptData[index][1];
                            this.style.fontSize = calculateFontSize(conceptData[index][1]) + "px";
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2; // TL -> SL
                            this.textContent = conceptData[index][2];
                            this.style.fontSize = calculateFontSize(conceptData[index][2]) + "px";
                        } else if (currentTextLayer[index] === 2) {
                            currentTextLayer[index] = 3; // SL -> Quiz
                            showQuiz(index, this);
                        } else {
                            currentTextLayer[index] = 0; // Reset to TL
                            this.textContent = conceptData[index][0];
                            this.style.fontSize = calculateFontSize(conceptData[index][0]) + "px";
                        }
                    }
                });
                
                svg.appendChild(textBox);
                textBoxElements.push(textBox);
            }
            
            // Ensure frame is on top after creating text boxes
            bringFrameToFront();
            
        }

        function bringFrameToFront() {
            // Move frame to end of SVG to ensure it's on top
            if (frame && frame.parentNode) {
                frame.parentNode.appendChild(frame);
                // Re-apply cursor style to ensure it's visible
                frame.style.cursor = 'grab';
            }
        }

        function createExtensionTextBoxes() {

            svg.appendChild(ext1Box);
            extensionTextBoxes.push(ext1Box);
            
            // Extension 2 text box (on Line 3+ path) - positioned at MIDPOINT of extension path 2
            // Extension path 2 goes from x=66.67 to x=100 at y=24.77
            const ext2MidX = (76.67 + 130) / 2;   // 103.335: midpoint of the Line 3 continuation (x=76.67 to 130, y=35)
            const ext2Box = document.createElementNS("http://www.w3.org/2000/svg", "text");
            ext2Box.setAttribute("x", ext2MidX);
            ext2Box.setAttribute("y", 39.5);
            ext2Box.setAttribute("text-anchor", "middle");
            ext2Box.setAttribute("class", "textBox extension");
            ext2Box.setAttribute("data-extension-index", 1);
            ext2Box.setAttribute("data-index", 6);
            ext2Box.textContent = extensionData[1][0];
            ext2Box.style.fontSize = calculateFontSize(extensionData[1][0]) + "px";
            ext2Box.style.opacity = '0';
            ext2Box.style.transform = 'scale(0.5)';
            
            ext2Box.addEventListener('click', function() {
                const extIndex = 1;
                const dataIndex = conceptData.length + extIndex; // 5 + 1 = 6
                
                if (learnedItemsStates[dataIndex]) {
                    // Cycle between TLR, TL, and SL for learned items
                    if (extensionTextLayers[extIndex] === 0) {
                        extensionTextLayers[extIndex] = 1; // TLR -> TL
                        this.textContent = extensionData[extIndex][1];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][1]) + "px";
                    } else if (extensionTextLayers[extIndex] === 1) {
                        extensionTextLayers[extIndex] = 2; // TL -> SL
                        this.textContent = extensionData[extIndex][2];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][2]) + "px";
                    } else {
                        extensionTextLayers[extIndex] = 0; // SL -> TLR
                        this.textContent = extensionData[extIndex][0];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][0]) + "px";
                    }
                } else {
                    // TLR -> TL -> SL -> Quiz cycle for unlearned items
                    if (extensionTextLayers[extIndex] === 0) {
                        extensionTextLayers[extIndex] = 1; // TLR -> TL
                        this.textContent = extensionData[extIndex][1];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][1]) + "px";
                    } else if (extensionTextLayers[extIndex] === 1) {
                        extensionTextLayers[extIndex] = 2; // TL -> SL
                        this.textContent = extensionData[extIndex][2];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][2]) + "px";
                    } else if (extensionTextLayers[extIndex] === 2) {
                        extensionTextLayers[extIndex] = 3; // SL -> Quiz
                        showQuiz(dataIndex, this);
                    } else {

                        this.textContent = extensionData[extIndex][0];

            svg.appendChild(ext2Box);
