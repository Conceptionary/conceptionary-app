<!DOCTYPE html>
<!-- Last updated: 2026-08-04 @ 7:56 p.m. (Mangawhai, NZ) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG-CR-TML Generic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #f9f9f9; overflow: hidden;
        }
        .a4-page {
            width: 90vw; height: 88vh;
            border: 5px solid black; background-color: white;
            box-sizing: border-box; position: relative;
            touch-action: none; z-index: 1; overflow: hidden;
        }
        .watermark {
            position: absolute; bottom: 5px; width: 100%;
            text-align: center; font-size: 11px;
            color: rgba(0,0,0,0.3); font-weight: bold;
            pointer-events: none; user-select: none; z-index: 0;
        }
        svg { width: 100%; height: 100%; overflow: visible; }
        .circle-path { stroke: #2c5aa0; stroke-width: 0.5; fill: none; }
        .tide-segment { stroke: #cdd; stroke-width: 0.3; transition: fill 0.3s ease; }
        .segment-highlighted { stroke: #2c5aa0; stroke-width: 1px; filter: brightness(1.15); }
        /* Colors sourced from LOG-CR-TDL-Generic.html's tidalHeightGradient
           per Alan's request 2026-07-24 — the darkest (0%) and lightest
           (100%) stops of that 5-stop gradient, at the same opacities TDL
           uses for those stops, so the two templates share a genuine
           color relationship rather than similar-looking ad hoc blues. */
        .spring-segment { fill: rgba(0,51,153,0.85); }   /* TDL gradient 0%: #003399 */
        .neap-segment   { fill: rgba(107,243,252,0.55); } /* TDL gradient 100%: #6bf3fc */
        .textBox {
            cursor: pointer; font-size: 0.8em; fill: black;
            opacity: 0; display: none;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.5); text-anchor: middle; font-family: Arial, sans-serif;
        }
        .textBox.active  { opacity: 1; display: block; transform: scale(1) translateY(0); }
        .textBox.learned { opacity: 0.5; display: block; transform: scale(1) translateY(0); fill: green; }
        .textBox.learned.active { opacity: 1; }
        .textBox.hidden  { opacity: 0; display: none; }
        #draggableFrame {
            cursor: grab; fill: url(#moonGradient);
            pointer-events: all; opacity: 1; transition: opacity 0.15s ease; z-index: 1000;
        }
        #draggableFrame.dragging { cursor: grabbing; opacity: 0.2; }
        .title-box {
            position: absolute; top: 2%; left: 50%; transform: translateX(-50%);
            font-size: 1em; font-weight: bold; text-align: center; cursor: pointer;
            border: 1px solid black; padding: 10px; background-color: white;
            z-index: 2; transition: opacity 0.5s ease, transform 0.5s ease;
            font-family: Arial, sans-serif; white-space: nowrap;
        }
        .title-box.hidden { opacity: 0; transform: translateX(-50%) scale(0.9); }
        .mode-toggle {
            position: absolute; top: 90%; left: 75%; transform: translate(-50%, -50%);
            font-size: 0.8em; padding: 8px 16px; background-color: #f0f0f0;
            border: 1px solid #ccc; border-radius: 4px; cursor: pointer; z-index: 3;
        }
        .drag-instruction {
            position: absolute; top: 60px; right: 10px; font-size: 0.9em;
            padding: 5px 10px; background-color: rgba(255,255,255,0.9);
            border: 1px solid #ccc; border-radius: 4px; z-index: 3;
            opacity: 1; transition: opacity 3s ease; max-width: 180px;
        }
        .drag-instruction.fade { opacity: 0; }
        .quiz-container {
            position: fixed; top: 40%; left: 75%; transform: translate(-50%,-50%);
            background-color: white; border: 3px solid #3366cc; border-radius: 4px;
            padding: 12px; z-index: 9999; display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); max-width: 320px; width: 320px;
            pointer-events: auto; visibility: visible; opacity: 1; cursor: grab;
        }
        .quiz-container.dragging { cursor: grabbing; }
        .quiz-container input { cursor: text; }
        .quiz-container input {
            width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc;
            border-radius: 4px; margin-bottom: 10px; font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        .quiz-container button {
            width: 100%; padding: 8px; background-color: #3366cc; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .quiz-container button:hover { background-color: #254e9c; }
        #quizFeedback { text-align: center; font-weight: bold; margin-top: 8px; min-height: 20px; }
        .learned-vocabulary {
            position: absolute; width: 22%; top: 2%;
            max-height: 60vh; overflow-y: auto;
            background-color: rgba(255,255,255,0.9); border: 1px solid #ccc;
            border-radius: 4px; padding: 5px; z-index: 4; display: block;
        }
        .learned-vocabulary-left  { left: 2%; }
        .learned-vocabulary-right { right: 2%; }
        .array-title {
            font-size: 0.9em; text-align: center; font-weight: bold;
            margin-bottom: 5px; padding: 3px; background-color: #f0f0f0;
            border-bottom: 1px solid #ccc;
        }
        .vocabulary-item {
            display: flex; flex-direction: column; font-size: 0.75em;
            margin: 3px 0; padding: 5px; border: 1px solid #ddd;
            border-radius: 3px; background-color: #f9f9f9;
            transition: background-color 0.3s ease;
        }
        .vocabulary-item:hover { background-color: #eaf2ff; }
        .vocabulary-item .tlr-word {
            font-weight: bold; color: #b8860b; cursor: pointer;
            padding: 2px 5px; border-radius: 3px; font-family: Arial, sans-serif;
        }
        .vocabulary-item .tl-word {
            font-weight: bold; color: green; cursor: pointer;
            padding: 2px 5px; border-radius: 3px; font-family: Arial, sans-serif;
        }
        .vocabulary-item .sl-word {
            color: #555; cursor: pointer; padding: 2px 5px; border-radius: 3px;
        }
        .vocabulary-item .tlr-word.hidden,
        .vocabulary-item .tl-word.hidden,
        .vocabulary-item .sl-word.hidden {
            color: transparent; user-select: none; background-color: #f0f0f0;
        }
        .toggle-visibility {
            position: absolute; top: 5px; right: 5px; font-size: 0.7em;
            padding: 2px 5px; background-color: #eee; border: 1px solid #ccc;
            border-radius: 3px; cursor: pointer; z-index: 5;
        }
        .day-marker  { font-size: 2.2px; fill: #2c5aa0; font-weight: bold; text-anchor: middle; pointer-events: none; }
        .phase-marker{ font-size: 1.9px; fill: #1a3a6e; font-style: italic; text-anchor: middle; pointer-events: none; }
        .tidal-icon  { opacity: 0.2; pointer-events: none; }
    </style>
</head>
<body>
<div class="a4-page">

    <div id="drag-instruction" class="drag-instruction">DRAG_INSTRUCTION_PLACEHOLDER</div>

    <div id="learned-vocabulary-left" class="learned-vocabulary learned-vocabulary-left">

    <div id="learned-vocabulary-right" class="learned-vocabulary learned-vocabulary-right">

        <div id="learned-items-right-states"></div>
        <div id="learned-items-right-transitions" style="display:none"></div>
    </div>

    <svg id="svgCanvas" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Moon gradient for the draggableFrame — ported from
                 LOG-CR-TDL-Generic.html per Alan's request 2026-07-24.
                 Colors originally sampled directly from Alan's reference
                 photo (Moon.jpg): actual pixel brightness across the disc
                 (15th to 98th percentile, excluding the black night-sky
                 background), giving the real warm gold/bronze tones of

            <radialGradient id="moonGradient" cx="50%" cy="50%" r="50%">

        <circle id="circlePath" cx="50" cy="50" r="30" class="circle-path"/>

        <!-- Spring/neap tide quadrant segments -->
        <path id="spring-new-seg"  class="tide-segment spring-segment"/>
        <path id="neap-first-seg"  class="tide-segment neap-segment"/>
        <path id="spring-full-seg" class="tide-segment spring-segment"/>
        <path id="neap-third-seg"  class="tide-segment neap-segment"/>

        <!-- Day / phase markers — populated from LANG config at runtime -->
        <text id="dm-0"  class="day-marker"   x="50"   y="14.5"></text>
        <text id="pm-0"  class="phase-marker" x="50"   y="17.2"></text>
        <text id="dm-3"  class="day-marker"   x="70.5" y="23"></text>
        <text id="dm-6"  class="day-marker"   x="80.5" y="37"></text>
        <text id="dm-7"  class="day-marker"   x="84"   y="48"></text>
        <text id="pm-7"  class="phase-marker" x="84"   y="51"></text>
        <text id="dm-10" class="day-marker"   x="80"   y="65"></text>
        <text id="dm-13" class="day-marker"   x="65"   y="78"></text>
        <text id="dm-15" class="day-marker"   x="50"   y="85.5"></text>
        <text id="pm-15" class="phase-marker" x="50"   y="88.2"></text>
        <text id="dm-17" class="day-marker"   x="35"   y="78"></text>

        <!-- Tidal wave decorations -->
        <g id="tidal-decorations" class="tidal-icon">
            <path id="spring-waves"
                  d="M 41 46.5 Q 44 43.5 47 46.5 Q 50 49.5 53 46.5 Q 56 43.5 59 46.5
                     M 41 53.5 Q 44 50.5 47 53.5 Q 50 56.5 53 53.5 Q 56 50.5 59 53.5"
                  stroke="#1E3A8A" stroke-width="0.7" fill="none" opacity="0"/>
            <path id="neap-waves"
                  d="M 43 48.5 Q 45 47 47 48.5 Q 49 50 51 48.5 Q 53 47 55 48.5 Q 57 50 59 48.5
                     M 43 51.5 Q 45 50 47 51.5 Q 49 53 51 51.5 Q 53 50 55 51.5 Q 57 53 59 51.5"
                  stroke="#87CEEB" stroke-width="0.45" fill="none" opacity="0"/>
        </g>

        <circle id="moon-center" cx="50" cy="50" r="4.5"

        <circle cx="50"   cy="21.5" r="1.3" fill="#1a1a2e" opacity="0.55" pointer-events="none"/>

        <circle cx="50"   cy="78.5" r="1.3" fill="#ffd700" opacity="0.65" pointer-events="none"/>

        <circle id="draggableFrame" cx="50" cy="20" r="4"/>

    <button id="modeToggle" class="mode-toggle">STATES_MODE_LABEL</button>

    <div class="watermark">&copy; 2026 Alan William Preston</div>

<div id="quizContainer" class="quiz-container">
    <input type="text" id="quizInput" placeholder="QUIZ_PLACEHOLDER">
    <button id="quizCheck">QUIZ_BUTTON_LABEL</button>
    <div id="quizFeedback"></div>
    <div id="quizDiacriticNote" style="font-size:10px;color:#888;text-align:center;margin-top:6px;padding-top:6px;border-top:1px solid #eee;"></div>
</div>

<script>

// =====================================================================
// =====================================================================
// LOGOGRAPHIC VARIANT — 4-level cycle: TLR (default) → TL → SL → Quiz
// Quiz tests TLR (romanized) reproduction with diacritic normalization.
// =====================================================================
// LANGUAGE CONFIGURATION BLOCK
// To create a new language pair, replace ALL values in this section.
// SL = Source Language  |  TL = Target Language (language being learned)
//
// STRUCTURE: This template maps the 29.5-day spring/neap tide cycle onto
// a circular dial, divided into 4 quadrants alternating Spring tide
// (New/Full Moon, greatest tidal range) and Neap tide (1st/3rd Quarter,
// smallest tidal range). 12 States items + 12 Transitions items are
// distributed at 30° intervals (offset by 15° for transitions).
// Day/phase markers around the rim show the lunar day number (0-29) and
// the 4 lunar phase names at the cardinal points.
// Do NOT change anything outside this block.
// =====================================================================
const LANG = {

    // --- Title cycle (click title box to cycle) ----------------------
    // Title cycle: TLR (default) → TL → SL → TLR. See "Logographic
    // UI Conventions" in Conceptionary_Template_Definitions.md.
    // Previously this array's first element was the literal string
    // "LOG-CR-TML Generic" (a disconnected placeholder shown by
    // default on load) sitting before three otherwise-correctly-
    // ordered TLR/TL/SL elements — removed, so TLR now correctly
    // becomes the default. Fixed 2026-07-21.
    titles: [
        "TLR_TITLE",
        "TL_TITLE",
        "SL_TITLE"
    ],

    // --- UI strings --------------------------------------------------
    drag_instruction:  "DRAG_INSTRUCTION",   // e.g. "Drag the moon around the orbit to explore the cycle!"
    array_title_left:  "ARRAY_TITLE_LEFT",   // e.g. "Learned Vocabulary (Day 15-27)"
    array_title_right: "ARRAY_TITLE_RIGHT",  // e.g. "Learned Vocabulary (Day 0-13)"
    hide_all_label:    "HIDE_ALL_LABEL",      // e.g. "Hide All"
    show_all_label:    "SHOW_ALL_LABEL",      // e.g. "Show All"
    states_mode_label: "STATES_MODE_LABEL",   // e.g. "Switch to Transitions Mode"
    trans_mode_label:  "TRANS_MODE_LABEL",    // e.g. "Switch to States Mode"
    quiz_placeholder:  "QUIZ_PLACEHOLDER",    // e.g. "Enter the [TL] phrase"
    quiz_button:       "QUIZ_BUTTON_LABEL",   // e.g. "Check"
    quiz_correct:      "QUIZ_CORRECT",        // e.g. "Correct!"
    quiz_wrong:        "QUIZ_WRONG",          // e.g. "Try again"
    // --- Diacritic / romanization normalization --------------------------
    // Shown near the quiz input so learners know they can type plain vowels.
    diacritic_instructions: "DIACRITIC_INSTRUCTIONS",
    // e.g. "Tip: macrons (ā→a, ō→o) may be typed as plain vowels."
    diacritic_map: [
        // ["ā","a"], ["ī","i"], ["ū","u"], ["ē","e"], ["ō","o"]
    ],
    // Digraph alternatives for the same long-vowel sounds above, e.g.
    // Japanese Hepburn romaji frequently writes "ō" as "ou" on a plain
    // keyboard (see Japanese-Romanization-Standards.md). Empty by default;
    // populate per target language.
    digraph_map: [
        // ["ou","o"], ["uu","u"], ["ei","e"]
    ],
    collapse_double_vowels: false,
    // Strip apostrophes before comparison (e.g. Japanese "n'" marking a
    // syllabic n boundary, as in "shin'ya"). Off by default.
    strip_apostrophes: false,

    // --- Day / phase markers around the rim ---------------------------
    // dayMarkers: lunar day numbers shown at 16 positions around the ring.
    // phaseMarkers: phase names shown at the 4 cardinal points (New Moon,
    // 1st Quarter, Full Moon, 3rd Quarter).
    dayMarkers: {
        0: "DAY_0", 3: "DAY_3", 6: "DAY_6", 7: "DAY_7", 10: "DAY_10",
        13: "DAY_13", 15: "DAY_15", 17: "DAY_17", 20: "DAY_20",
        22: "DAY_22", 24: "DAY_24", 27: "DAY_27"
    },
    phaseMarkers: {
        0:  "PHASE_NEW_MOON",
        7:  "PHASE_FIRST_QUARTER",
        15: "PHASE_FULL_MOON",
        22: "PHASE_THIRD_QUARTER"
    },

    // --- Vocabulary data (12 States + 12 Transitions) --------------------
    // Format: [ SL phrase, TL phrase, Quiz question, Angle (0-360°) ]
    // Angle 0° = top of circle (New Moon, Spring tide); increases clockwise.
    // States items sit at 30° intervals (0,30,60...330); Transitions sit
    // at the midpoints (15,45,75...345). Both halves of the 360° cycle
    // repeat the same 6 concepts (New Moon→Full Moon→New Moon).
    statesData: [
        ["SL-S1", "TL-S1", "TLR-S1", "QUIZ-S1",  0  ],
        ["SL-S2", "TL-S2", "TLR-S2", "QUIZ-S2",  30 ],
        ["SL-S3", "TL-S3", "TLR-S3", "QUIZ-S3",  60 ],
        ["SL-S4", "TL-S4", "TLR-S4", "QUIZ-S4",  90 ],
        ["SL-S5", "TL-S5", "TLR-S5", "QUIZ-S5",  120],
        ["SL-S6", "TL-S6", "TLR-S6", "QUIZ-S6",  150],
        ["SL-S1", "TL-S1", "TLR-S1", "QUIZ-S1",  180],
        ["SL-S2", "TL-S2", "TLR-S2", "QUIZ-S2",  210],
        ["SL-S3", "TL-S3", "TLR-S3", "QUIZ-S3",  240],
        ["SL-S4", "TL-S4", "TLR-S4", "QUIZ-S4",  270],
        ["SL-S5", "TL-S5", "TLR-S5", "QUIZ-S5",  300],
        ["SL-S6", "TL-S6", "TLR-S6", "QUIZ-S6",  330]
    ],
    transitionsData: [
        ["SL-T1", "TL-T1", "TLR-T1", "QUIZ-T1", 15 ],
        ["SL-T2", "TL-T2", "TLR-T2", "QUIZ-T2", 45 ],
        ["SL-T3", "TL-T3", "TLR-T3", "QUIZ-T3", 75 ],
        ["SL-T4", "TL-T4", "TLR-T4", "QUIZ-T4", 105],
        ["SL-T5", "TL-T5", "TLR-T5", "QUIZ-T5", 135],
        ["SL-T6", "TL-T6", "TLR-T6", "QUIZ-T6", 165],
        ["SL-T1", "TL-T1", "TLR-T1", "QUIZ-T1", 195],
        ["SL-T2", "TL-T2", "TLR-T2", "QUIZ-T2", 225],
        ["SL-T3", "TL-T3", "TLR-T3", "QUIZ-T3", 255],
        ["SL-T4", "TL-T4", "TLR-T4", "QUIZ-T4", 285],
        ["SL-T5", "TL-T5", "TLR-T5", "QUIZ-T5", 315],
        ["SL-T6", "TL-T6", "TLR-T6", "QUIZ-T6", 345]
    ]
};
// =====================================================================
// END OF LANGUAGE CONFIGURATION BLOCK

// --- Answer normalization (diacritic-tolerant for TLR quiz answers) ---
const AnswerUtils = {
    normalize: function(text) {
        let t = text.toLowerCase();
        // 1. Macron/diacritic -> plain (e.g. "ō" -> "o")
        LANG.diacritic_map.forEach(([accented, plain]) => {
            t = t.split(accented).join(plain);
        });
        // 2. Digraph alternative -> plain (e.g. "ou" -> "o"; Japanese
        //    Hepburn romanization commonly writes long vowels this way
        //    on a plain QWERTY keyboard instead of using a macron —
        //    see Japanese-Romanization-Standards.md). Empty/language-
        //    agnostic by default; populated per target language.
        (LANG.digraph_map || []).forEach(([digraph, plain]) => {
            t = t.split(digraph).join(plain);
        });
        // 3. Same-letter double vowels -> single (only if enabled)
        if (LANG.collapse_double_vowels) {
            t = t.replace(/aa/g,'a').replace(/ee/g,'e').replace(/ii/g,'i')
                 .replace(/oo/g,'o').replace(/uu/g,'u');
        }
        // 4. Apostrophes (e.g. Japanese "n'" syllable-boundary marker)
        if (LANG.strip_apostrophes) {
            t = t.replace(/'/g, '');
        }
        return t.replace(/\s+/g,' ').trim().toLowerCase();
    },
    checkAnswer: function(userInput, correct) {
        return this.normalize(userInput) === this.normalize(correct);
    }
};

// No language-specific content appears below this line.
// =====================================================================


// --- Apply UI strings & markers from config ---------------------------
document.getElementById('title-box').textContent        = LANG.titles[0];
document.getElementById('drag-instruction').textContent = LANG.drag_instruction;
document.querySelectorAll('#learned-vocabulary-left .array-title')[0].textContent  = LANG.array_title_left;
document.querySelectorAll('#learned-vocabulary-right .array-title')[0].textContent = LANG.array_title_right;
document.getElementById('toggle-learned-left').textContent  = LANG.hide_all_label;
document.getElementById('toggle-learned-right').textContent = LANG.hide_all_label;
document.getElementById('quizInput').placeholder        = LANG.quiz_placeholder;
document.getElementById('quizCheck').textContent        = LANG.quiz_button;
    const _dNote = document.getElementById('quizDiacriticNote');
    if (_dNote) _dNote.textContent = LANG.diacritic_instructions;
document.getElementById('modeToggle').textContent       = LANG.states_mode_label;

Object.entries(LANG.dayMarkers).forEach(([day, text]) => {
    const el = document.getElementById(`dm-${day}`);
    if (el) el.textContent = text;
});
Object.entries(LANG.phaseMarkers).forEach(([day, text]) => {
    const el = document.getElementById(`pm-${day}`);
    if (el) el.textContent = text;
});

// --- Runtime state -----------------------------------------------------
let isStatesMode = true;
let currentQuizIndex = -1;
let learnedItemsStates      = new Array(LANG.statesData.length).fill(false);
let learnedItemsTransitions = new Array(LANG.transitionsData.length).fill(false);
let textBoxElements = [];
let currentPosition = 0;
let isDragging = false;
let currentTextIndex = 0;
let closedIdx = -1;

// --- Helpers -------------------------------------------------------------
function getLearnedRadius() { return 22; }

function getZoneCentroid(angleDeg) {
    const a = ((angleDeg % 360) + 360) % 360;
    if (a < 45 || a >= 315) return { centreDeg:   0, r: 17 }; // Spring — New Moon  (top)
    if (a < 135)            return { centreDeg:  90, r: 19 }; // Neap   — 1st Qtr   (right)
    if (a < 225)            return { centreDeg: 180, r: 17 }; // Spring — Full Moon  (bottom)
    return                         { centreDeg: 270, r: 19 }; // Neap   — 3rd Qtr   (left)
}

// Per Alan's request 2026-07-28: in States mode, the centre item of each
// segment stays at 100% text size; the two flanking (day-marker-aligned)
// items drop to 75% to reduce visual weight/crowding around them. In
// Transitions mode, all items drop to 50% — Transitions has significant
// overlap that a size differentiation alone wouldn't fix, so combined
// here with a much wider, non-wrapping box (see createTextBoxes) so a
// full phrase can sit on one line rather than wrapping into neighbours.
const STATES_EDGE_INDICES = new Set([1, 2, 4, 5, 7, 8, 10, 11]);
function getItemFontSize(index) {
    if (!isStatesMode) return "2.6px";
    return STATES_EDGE_INDICES.has(index) ? "3.9px" : "5.2px";
}

function toggleArrayVisibility(side) {
    const modeSuffix = isStatesMode ? 'states' : 'transitions';
    const container = document.getElementById(`learned-items-${side}-${modeSuffix}`);
    const button    = document.getElementById(`toggle-learned-${side}`);
    if (!container || !button) return;
    const spans = container.querySelectorAll('.vocabulary-item .tlr-word, .vocabulary-item .tl-word, .vocabulary-item .sl-word');
    let visibleCount = 0;
    spans.forEach(s => { if (!s.classList.contains('hidden')) visibleCount++; });
    const mostlyVisible = visibleCount > spans.length / 2;
    spans.forEach(s => s.classList.toggle('hidden', mostlyVisible));
    button.textContent = mostlyVisible ? LANG.show_all_label : LANG.hide_all_label;
}

function addToVocabularyArray(index, data) {
    const item = document.createElement('div');
    item.className = 'vocabulary-item';
    const tlrSpan = document.createElement('span');
    tlrSpan.className = 'tlr-word';
    tlrSpan.textContent = data[index][2];
    const tlSpan = document.createElement('span');
    tlSpan.className = 'tl-word';
    tlSpan.textContent = data[index][1];
    const slSpan = document.createElement('span');
    slSpan.className = 'sl-word';
    slSpan.textContent = data[index][0];
    [tlrSpan, tlSpan, slSpan].forEach(sp => {
        sp.addEventListener('click', function(e) { e.stopPropagation(); this.classList.toggle('hidden'); });
    });
    item.appendChild(tlrSpan);
    item.appendChild(tlSpan);
    item.appendChild(slSpan);
    // Indices 0-5 sit in the first half of the cycle (roughly Day 0-13);
    // indices 6-11 repeat the same 6 concepts in the second half (roughly
    // Day 15-27). Per Alan's request 2026-07-29, split across two
    // containers by day-range, and — per his follow-up request — further
    // split per mode, so States and Transitions track their learned
    // items entirely separately rather than sharing one list.
    const modeSuffix = isStatesMode ? "states" : "transitions";
    const targetId = (index < 6 ? "learned-items-right-" : "learned-items-left-") + modeSuffix;
    document.getElementById(targetId).appendChild(item);
}

// --- Segments --------------------------------------------------------------
function createSegments() {
    const cx = 50, cy = 50, r = 30;
    document.getElementById('spring-new-seg').setAttribute('d',  `M ${cx} ${cy} L 28.79 28.79 A ${r} ${r} 0 0 1 71.21 28.79 Z`);
    document.getElementById('neap-first-seg').setAttribute('d',  `M ${cx} ${cy} L 71.21 28.79 A ${r} ${r} 0 0 1 71.21 71.21 Z`);
    document.getElementById('spring-full-seg').setAttribute('d', `M ${cx} ${cy} L 71.21 71.21 A ${r} ${r} 0 0 1 28.79 71.21 Z`);
    document.getElementById('neap-third-seg').setAttribute('d',  `M ${cx} ${cy} L 28.79 71.21 A ${r} ${r} 0 0 1 28.79 28.79 Z`);
}

function updateSegmentHighlight(angle) {
    const a = ((angle % 360) + 360) % 360;
    ['spring-new-seg','neap-first-seg','spring-full-seg','neap-third-seg']
        .forEach(id => document.getElementById(id).classList.remove('segment-highlighted'));
    if      (a < 45 || a >= 315) { document.getElementById('spring-new-seg').classList.add('segment-highlighted');  updateTidalDecoration('spring'); }
    else if (a < 135)            { document.getElementById('neap-first-seg').classList.add('segment-highlighted');  updateTidalDecoration('neap');   }
    else if (a < 225)            { document.getElementById('spring-full-seg').classList.add('segment-highlighted'); updateTidalDecoration('spring'); }
    else                         { document.getElementById('neap-third-seg').classList.add('segment-highlighted');  updateTidalDecoration('neap');   }
}

function updateTidalDecoration(phase) {
    const sw = document.getElementById('spring-waves');
    const nw = document.getElementById('neap-waves');
    const mc = document.getElementById('moon-center');
    if (phase === 'spring') {
        sw.setAttribute('opacity','0.85'); nw.setAttribute('opacity','0');
        mc.setAttribute('fill','#ffd700'); mc.setAttribute('opacity','0.60');
    } else {
        sw.setAttribute('opacity','0');    nw.setAttribute('opacity','0.85');
        mc.setAttribute('fill','#b8cce4'); mc.setAttribute('opacity','0.40');
    }
}

// --- Text boxes -----------------------------------------------------------
function createTextBoxes() {
    const svg = document.getElementById("svgCanvas");
    document.querySelectorAll('.textBox').forEach(b => { if (b.parentNode) b.parentNode.removeChild(b); });
    textBoxElements = [];
    const center       = { x: 50, y: 50 };
    const currentData  = isStatesMode ? LANG.statesData : LANG.transitionsData;
    const learnedItems = isStatesMode ? learnedItemsStates : learnedItemsTransitions;

    // Per-index position overrides for STATES mode only (index into
    // LANG.statesData) — per Alan's request 2026-07-28. Each of the 4
    // segments holds exactly 3 state items: the middle one keeps its
    // existing "centre of segment" position (getZoneCentroid, below,
    // unchanged); the first and third are pulled out to sit at the exact
    // x,y of their segment's first and third day markers respectively —
    // fixing a real overlap bug where all 3 items in a segment previously
    // shared the identical centroid position before being learned.
    // These same coordinates now apply whether the item is learned or
    // not — see checkQuizAnswer(), which no longer moves items to a
    // separate "learned" position.
    //   spring-new-seg : idx11(S6)->day27, idx0(S1)=centre, idx1(S2)->day3
    //   neap-first-seg : idx2(S3)->day6,   idx3(S4)=centre, idx4(S5)->day10
    //   spring-full-seg: idx5(S6)->day13,  idx6(S1)=centre, idx7(S2)->day17
    //   neap-third-seg : idx8(S3)->day20,  idx9(S4)=centre, idx10(S5)->day24
    const statesPositionOverrides = {
        11: { x: 31,   y: 22 },
        1:  { x: 70.5, y: 23 },
        2:  { x: 80.5, y: 37 },
        4:  { x: 80,   y: 65 },
        5:  { x: 65,   y: 78 },
        7:  { x: 35,   y: 78 },
        8:  { x: 20,   y: 65 },
        10: { x: 20,   y: 37 }
    };

    currentData.forEach((item, index) => {
        let x, y;
        const override = isStatesMode ? statesPositionOverrides[index] : undefined;
        if (override) {
            x = override.x;
            y = override.y;
        } else if (isStatesMode) {
            // Centre item of its segment — unchanged.
            const zone = getZoneCentroid(item[4]);
            const rad  = (zone.centreDeg - 90) * Math.PI / 180;
            x = center.x + zone.r * Math.cos(rad);
            y = center.y + zone.r * Math.sin(rad);
        } else {
            // Transitions mode — per Alan's request 2026-07-29: use each
            // item's own angle (the same position it already correctly
            // moved to once learned) as the DEFAULT too, not just after
            // a successful quiz. Previously all 3 items in a segment
            // shared the same getZoneCentroid position until learned,
            // which is exactly the overlap bug States mode had before
            // its 2026-07-28 fix. This also means the position is now
            // constant throughout — no separate repositioning happens
            // on quiz success any more (see checkQuizAnswer).
            const angle = (item[4] - 90) * Math.PI / 180;
            x = center.x + getLearnedRadius() * Math.cos(angle);
            y = center.y + getLearnedRadius() * Math.sin(angle);
        }

        // Transitions mode: much wider, shorter box so a full phrase
        // (up to ~30 characters) fits on one line instead of wrapping
        // into neighbouring items — per Alan's request 2026-07-28.
        // States mode box is unchanged.
        const boxWidth  = isStatesMode ? 28 : 55;
        const boxHeight = isStatesMode ? 26 : 8;

        const fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
        fo.setAttribute("x", x - boxWidth / 2);
        fo.setAttribute("y", y - boxHeight / 2);
        fo.setAttribute("width",  boxWidth);
        fo.setAttribute("height", boxHeight);
        fo.setAttribute("class", "textBox");
        fo.setAttribute("data-index", index);
        fo.style.pointerEvents = "auto";
        fo.style.zIndex = "500";

        const div = document.createElement("div");
        // Vertical centering: previously only text-align:center
        // (horizontal) was set. A plain div flows from the TOP of its
        // container, so text rendered near the box's top edge rather
        // than its true center — the same root-cause bug found and
        // fixed on LOG-CR-TDL via a debug-marker test. Fixed the same
        // way here with flexbox, filling the full box. Fixed 2026-07-21
        // as part of the systematic re-fix across the Circular family.
        div.style.display        = "flex";
        div.style.alignItems     = "center";
        div.style.justifyContent = "center";
        div.style.width          = "100%";
        div.style.height         = "100%";
        div.style.boxSizing      = "border-box";
        div.style.textAlign    = "center";
        div.style.fontSize     = getItemFontSize(index);
        div.style.fontFamily   = "Arial, sans-serif";
        div.style.color        = "black";
        div.style.cursor       = "pointer";
        div.style.lineHeight   = "1.3";
        div.style.fontWeight   = "normal";
        div.style.textShadow   =
            "-1px -1px 3px rgba(255,255,255,0.95), " +
            " 1px -1px 3px rgba(255,255,255,0.95), " +
            "-1px  1px 3px rgba(255,255,255,0.95), " +
            " 1px  1px 3px rgba(255,255,255,0.95), " +
            " 0px  0px 5px rgba(255,255,255,0.9)";
        if (isStatesMode) {
            div.style.whiteSpace   = "normal";
            div.style.wordWrap     = "break-word";
            div.style.overflowWrap = "break-word";
        } else {
            // Single line, no wrap — the wide box above exists precisely
            // so a full phrase fits without wrapping into neighbours.
            div.style.whiteSpace   = "nowrap";
            div.style.overflow     = "visible";
        }
        div.style.width        = "100%";
        div.textContent = item[2]; // start with TLR
        fo.appendChild(div);

        if (learnedItems[index]) fo.classList.add('learned');

        fo.addEventListener('click', function() {
            const idx = parseInt(this.getAttribute('data-index'));
            const d   = this.querySelector('div');
            const qc  = document.getElementById("quizContainer");
            if (qc.style.display !== 'none' && currentQuizIndex === idx) return;
            const li = isStatesMode ? learnedItemsStates : learnedItemsTransitions;
            const cd = isStatesMode ? LANG.statesData : LANG.transitionsData;
            const tlText = cd[idx][1], slText = cd[idx][0];
            if (li[idx]) {
                d.textContent = (d.textContent === tlText) ? slText : tlText;
                d.style.fontSize = getItemFontSize(idx);
            } else {
                if (d.textContent === tlText) {
                    d.textContent = slText; d.style.fontSize = getItemFontSize(idx);
                } else if (d.textContent === slText) {
                    showQuiz(idx);
                } else {
                    d.textContent = tlText; d.style.fontSize = getItemFontSize(idx);
                }
            }
        });

        const frame = document.getElementById('draggableFrame');
        if (frame && frame.parentNode) frame.parentNode.insertBefore(fo, frame);
        else svg.appendChild(fo);
        textBoxElements.push(fo);
    });

    const frame = document.getElementById('draggableFrame');
    if (frame && frame.parentNode) frame.parentNode.appendChild(frame);
}

function findClosestItem(angle) {
    const n = ((angle % 360) + 360) % 360;
    const cd = isStatesMode ? LANG.statesData : LANG.transitionsData;
    let best = 0, min = 360;
    cd.forEach((item, i) => {
        let diff = Math.abs(n - item[4]);
        if (diff > 180) diff = 360 - diff;
        if (diff < min) { min = diff; best = i; }
    });
    return best;
}

function updateVisibleTextBoxes(itemIndex) {
    const learnedItems = isStatesMode ? learnedItemsStates : learnedItemsTransitions;
    textBoxElements.forEach((tb, i) => {
        if (!tb) return;
        if (i === itemIndex) {
            tb.classList.add('active'); tb.classList.remove('hidden');
            tb.style.opacity = '1';    tb.style.display = 'block';
        } else if (learnedItems[i]) {
            tb.classList.remove('active'); tb.classList.remove('hidden');
            tb.style.opacity = '0.5';      tb.style.display = 'block';
        } else {
            tb.classList.remove('active'); tb.classList.add('hidden');
            tb.style.opacity = '0';        tb.style.display = 'none';
        }
    });
}

// --- Quiz -----------------------------------------------------------------
function showQuiz(index) {
    const cd = isStatesMode ? LANG.statesData : LANG.transitionsData;
    currentQuizIndex = index;
    const qc = document.getElementById("quizContainer");
    const qi = document.getElementById("quizInput");
    const qf = document.getElementById("quizFeedback");
    qi.placeholder = cd[index][3]; // QUIZ prompt, not the TLR answer
    qi.value = '';
    qf.textContent = '';
    qc.style.display = 'block'; qc.style.visibility = 'visible';
    qc.style.opacity = '1';     qc.style.zIndex = '9999';
    setTimeout(() => { try { qi.focus(); } catch(e) {} }, 100);
}

// --- Quiz container drag-anywhere ------------------------------------
function makeQuizDraggable() {
    const qc = document.getElementById('quizContainer');
    let qDragging = false, offsetX = 0, offsetY = 0;

    function qStart(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        e.stopPropagation();
        const rect = qc.getBoundingClientRect();
        qc.style.transform = 'none';
        qc.style.left = rect.left + 'px';
        qc.style.top  = rect.top + 'px';
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        qDragging = true;
        qc.classList.add('dragging');
        e.preventDefault();
    }
    function qMove(e) {
        if (!qDragging) return;
        e.stopPropagation();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        qc.style.left = (clientX - offsetX) + 'px';
        qc.style.top  = (clientY - offsetY) + 'px';
        e.preventDefault();
    }
    function qEnd(e) {
        if (!qDragging) return;
        qDragging = false;
        qc.classList.remove('dragging');
        // A drag-release (mouseup) synthesizes a click event immediately
        // afterward, targeted at whatever's under the cursor at that exact
        // pixel — which, on a fast or slightly imprecise drag, can easily
        // land just outside the container's own bounds even though the
        // user was clearly still interacting with it. Without this guard,
        // that synthetic click gets misread by the outside-click handler
        // below as "user clicked away," dismissing the quiz immediately
        // after every drag. Swallow exactly one click event here;
        // quizJustDragged is consumed and reset by the outside-click
        // handler itself. (Same fix as Rice-Growing/LUN/MEN, 2026-08-03/04.)
        quizJustDragged = true;
        if (e) e.stopPropagation();
    }

    qc.addEventListener('mousedown', qStart);
    qc.addEventListener('touchstart', qStart, { passive: false });
    document.addEventListener('mousemove', qMove);
    document.addEventListener('touchmove', qMove, { passive: false });
    document.addEventListener('mouseup', qEnd);
    document.addEventListener('touchend', qEnd);
}
let quizJustDragged = false;

function checkQuizAnswer() {
    if (currentQuizIndex < 0) return;
    const cd = isStatesMode ? LANG.statesData : LANG.transitionsData;
    const li = isStatesMode ? learnedItemsStates : learnedItemsTransitions;
    const userAnswer = document.getElementById("quizInput").value.trim();
    const correct    = cd[currentQuizIndex][2]; // TLR
    const qf         = document.getElementById("quizFeedback");

    if (AnswerUtils.checkAnswer(userAnswer, correct)) {
        qf.textContent = LANG.quiz_correct; qf.style.color = 'green';
        li[currentQuizIndex] = true;
        const tb = textBoxElements[currentQuizIndex];
        if (tb) {
            tb.classList.add('learned');
            const d = tb.querySelector('div');
            if (d) d.textContent = correct;
            // Neither mode repositions on success any more — per Alan's
            // requests 2026-07-28 (States) and 2026-07-29 (Transitions):
            // every item's default position IS its correct, final
            // position (day-marker-aligned/segment-centre for States,
            // own-angle-at-getLearnedRadius for Transitions), set once in
            // createTextBoxes and never moved afterward.
        }
        addToVocabularyArray(currentQuizIndex, cd);
        closedIdx = currentQuizIndex;
        setTimeout(() => {
            if (currentQuizIndex === closedIdx) {
                document.getElementById("quizContainer").style.display = 'none';
                currentQuizIndex = -1;
            }
        }, 1500);
    } else {
        qf.textContent = LANG.quiz_wrong; qf.style.color = 'red';
        const tb = textBoxElements[currentQuizIndex];
        if (tb) { const d = tb.querySelector('div'); if (d) { d.textContent = correct; d.style.fontSize = getItemFontSize(currentQuizIndex); } }
    }
}

// --- Frame position ---------------------------------------------------------
function positionFrameOnItem(itemIndex) {
    const cd = isStatesMode ? LANG.statesData : LANG.transitionsData;
    const angle = (cd[itemIndex][4] - 90) * Math.PI / 180;
    const x = 50 + 30 * Math.cos(angle);
    const y = 50 + 30 * Math.sin(angle);
    const frame = document.getElementById("draggableFrame");
    frame.setAttribute('cx', x); frame.setAttribute('cy', y);
    currentPosition = itemIndex;
    updateVisibleTextBoxes(itemIndex);
    updateSegmentHighlight(cd[itemIndex][4]);
}

// --- Mode toggle ------------------------------------------------------------
function toggleMode() {
    isStatesMode = !isStatesMode;
    document.getElementById("modeToggle").textContent =
        isStatesMode ? LANG.states_mode_label : LANG.trans_mode_label;
    createTextBoxes();
    positionFrameOnItem(0);
    // Per Alan's follow-up request 2026-07-29: States and Transitions now
    // track their learned items in fully separate lists (see
    // addToVocabularyArray) rather than sharing one — so instead of
    // hiding the whole Learned Vocabulary container in Transitions mode,
    // both containers stay visible throughout and simply show whichever
    // mode's sub-list is current.
    document.getElementById("learned-items-left-states").style.display        = isStatesMode ? "block" : "none";
    document.getElementById("learned-items-left-transitions").style.display   = isStatesMode ? "none"  : "block";
    document.getElementById("learned-items-right-states").style.display       = isStatesMode ? "block" : "none";
    document.getElementById("learned-items-right-transitions").style.display  = isStatesMode ? "none"  : "block";
}

// --- Init -------------------------------------------------------------------
function initializeApp() {
    const svg   = document.getElementById("svgCanvas");
    const frame = document.getElementById("draggableFrame");
    if (!svg || !frame) { console.error("Critical elements missing"); return; }

    createSegments();
    createTextBoxes();
    positionFrameOnItem(0);
    makeQuizDraggable();
    frame.style.pointerEvents = 'all';
    frame.style.cursor = 'grab';

    const startDrag = (e) => {
        isDragging = true; frame.classList.add('dragging'); frame.style.cursor = 'grabbing';
        e.preventDefault(); e.stopPropagation();
    };
    const dragMove = (e) => {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        const svgRect = svg.getBoundingClientRect();

        // The SVG's viewBox is a square with preserveAspectRatio=
        // "xMidYMid meet", but the .a4-page container is NOT square
        // (90vw × 70vh) — letterboxed rather than stretched. Fixed
        // 2026-07-21 as part of the systematic re-fix.
        const renderedSize = Math.min(svgRect.width, svgRect.height);
        const offsetX = svgRect.left + (svgRect.width  - renderedSize) / 2;
        const offsetY = svgRect.top  + (svgRect.height - renderedSize) / 2;

        const svgX = ((clientX - offsetX) / renderedSize) * 100;
        const svgY = ((clientY - offsetY) / renderedSize) * 100;
        const angle = Math.atan2(svgY - 50, svgX - 50);
        frame.setAttribute('cx', 50 + 30 * Math.cos(angle));
        frame.setAttribute('cy', 50 + 30 * Math.sin(angle));
        const angleDeg = (angle * 180 / Math.PI + 90 + 360) % 360;
        const idx = findClosestItem(angleDeg);
        currentPosition = idx;
        updateVisibleTextBoxes(idx);
        updateSegmentHighlight(angleDeg);
        e.preventDefault(); e.stopPropagation();
    };
    const endDrag = (e) => {
        if (!isDragging) return;
        isDragging = false; frame.classList.remove('dragging'); frame.style.cursor = 'grab';
        // Snap-to-nearest-marker on release removed per Alan's standing
        // preference across Circular templates.
        if (e) { e.preventDefault(); e.stopPropagation(); }
    };

    frame.addEventListener('mousedown', startDrag);
    frame.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('mousemove', dragMove);
    document.addEventListener('touchmove', dragMove, { passive: false });
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
    document.addEventListener('mouseleave', endDrag);

    document.getElementById("title-box").addEventListener('click', function() {
        this.classList.add('hidden');
        setTimeout(() => {
            currentTextIndex = (currentTextIndex + 1) % LANG.titles.length;
            this.textContent = LANG.titles[currentTextIndex];
            this.classList.remove('hidden');
        }, 500);
    });

    document.getElementById("modeToggle").addEventListener('click', toggleMode);
    document.getElementById("quizCheck").addEventListener('click', checkQuizAnswer);
    document.getElementById("quizInput").addEventListener('keydown', e => { if (e.key === 'Enter') checkQuizAnswer(); });
    document.getElementById("toggle-learned-left").addEventListener('click', () => toggleArrayVisibility('left'));
    document.getElementById("toggle-learned-right").addEventListener('click', () => toggleArrayVisibility('right'));

    document.addEventListener('click', function(e) {
        if (quizJustDragged) { quizJustDragged = false; return; }
        const qc = document.getElementById("quizContainer");
        if (qc.style.display !== 'none' &&
            !qc.contains(e.target) &&
            !textBoxElements.some(b => b && b.contains(e.target))) {
            const li = isStatesMode ? learnedItemsStates : learnedItemsTransitions;
            const cd = isStatesMode ? LANG.statesData : LANG.transitionsData;
            if (currentQuizIndex >= 0 && !li[currentQuizIndex]) {
                const tb = textBoxElements[currentQuizIndex];
                if (tb) { const d = tb.querySelector('div'); if (d) { d.textContent = cd[currentQuizIndex][2]; d.style.fontSize = getItemFontSize(currentQuizIndex); } }
            }
            qc.style.display = 'none';
            currentQuizIndex = -1;
        }
    });

    document.getElementById("quizContainer").style.display = 'none';

    setTimeout(() => {
        const di = document.getElementById('drag-instruction');
        if (di) { di.classList.add('fade'); setTimeout(() => { di.style.display = 'none'; }, 3000); }
    }, 15000);
}

document.addEventListener('DOMContentLoaded', initializeApp);
</script>
