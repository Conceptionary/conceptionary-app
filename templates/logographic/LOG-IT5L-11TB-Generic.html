            ["TLR-T2", "TL-T2", "SL-T2", 26.7, 36.6],   // Line 2: 26.7% to 36.6%

            ["TLR-T4", "TL-T4", "SL-T4", 63.4, 73.3],   // Line 4: 63.4% to 73.3%

        ];

        // Extension vocabulary for continuation paths
        // Format: [TLR, TL, SL, Quiz]
        const extensionData = [
            ["TLR+1", "TL+1", "SL+1", "What is the TLR word for 'SL+1'?"],  // Extension from Line 1
            ["TLR+3", "TL+3", "SL+3", "What is the TLR word for 'SL+3'?"],  // Extension from Line 3
            ["TLR+5", "TL+5", "SL+5", "What is the TLR word for 'SL+5'?"]   // Extension from Line 5
        ];

        // Extension vocabulary expanded for transitions mode
        const extension1TransitionData = [
            ["TLR-Ext1-A", "TL-Ext1-A", "SL-Ext1-A"]
        ];

        const extension2TransitionData = [
            ["TLR-Ext2-A", "TL-Ext2-A", "SL-Ext2-A"]
        ];

        // Global variables
        let isStatesMode = true;
        
        let currentModeIndicatorIndex = 1;
        const modeIndicatorTexts = {

        let learnedItemsTransitions = []; // Separate tracking for Transitions Mode
        let textBoxElements = [];

        let currentTextLayer = new Array(11).fill(0);

        // TRANSITIONS MODE VARIABLES
        let currentPath = 'main'; // 'main', 'ext1', 'ext2'
        let currentOffset = 0;
        let isDraggingText = false;
        let lastDragPoint = null;

        // Title text options
        // Title cycle: TLR (default) → TL → SL → TLR, per mode. See
        // "Logographic UI Conventions" in Conceptionary_Template_Definitions.md.
        const titleTexts = {
            states: ["TLR_TITLE_STATES", "TL_TITLE_STATES", "SL_TITLE_STATES"],
            transitions: ["TLR_TITLE_TRANSITIONS", "TL_TITLE_TRANSITIONS", "SL_TITLE_TRANSITIONS"]
        };
        let currentTextIndex = 0;
        
        // Activation distance for text boxes
        const activationDistance = 11.4;

        // CENTERED: Rebuilt 5-line system with perfect center alignment
        // STANDARDIZED to viewBox="0 0 100 50" for consistency with GT5L+
        const pathPoints = [
            `0,37.16`, 
            `33.33,37.16`,
            `33.33,24.77`,
            `66.67,24.77`,
            `66.67,37.16`,
            `100,37.16`
        ];

        // DOM elements
        let svg, pathLine, conceptBackground, titleBox, conceptIndicator, levelIndicator, pathIndicator;
        let modeToggleBtn, frame, quizContainer, quizInput, quizCheck, quizFeedback;
        let vocabularyArray, vocabularyItems;

        let ext1Path, ext2Path;

        // TRANSITIONS MODE FUNCTIONS
        
        function getPathObject(pathName) {
            switch(pathName) {
                case 'ext1':
                    return ext1Path;
                case 'ext2':
                    return ext2Path;
                default:
                    return pathLine;
            }
        }

        function getPointOnPath(pathName, offset) {
            const path = getPathObject(pathName);
            const length = path.getTotalLength();
            const position = (offset / 100) * length;
            return path.getPointAtLength(position);
        }

        function findClosestPointOnAllPaths(x, y) {
            let closestPoint = null;
            let closestDistance = Infinity;
            let closestPath = 'main';
            let closestOffset = 0;
            
            const sampleRate = 0.5;
            
            // Check main path
            for (let i = 0; i < pathLength; i += sampleRate) {
                const point = pathLine.getPointAtLength(i);
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestPoint = point;
                    closestPath = 'main';
                    closestOffset = (i / pathLength) * 100;
                }
            }
            
            // Check extension path 1
            const ext1Length = ext1Path.getTotalLength();
            for (let i = 0; i < ext1Length; i += sampleRate) {
                const point = ext1Path.getPointAtLength(i);
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestPoint = point;
                    closestPath = 'ext1';
                    closestOffset = (i / ext1Length) * 100;
                }
            }
            
            // Check extension path 2
            const ext2Length = ext2Path.getTotalLength();
            for (let i = 0; i < ext2Length; i += sampleRate) {
                const point = ext2Path.getPointAtLength(i);
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestPoint = point;
                    closestPath = 'ext2';
                    closestOffset = (i / ext2Length) * 100;
                }
            }
            
            return { point: closestPoint, path: closestPath, offset: closestOffset };
        }

        function updatePathIndicator() {
            if (isStatesMode) {
                pathIndicator.style.display = 'none';
                return;
            }
            
            pathIndicator.style.display = 'none';
            
            switch(currentPath) {
                case 'main':
                    pathIndicator.textContent = 'Main Path (Lines 1-5)';
                    pathIndicator.style.backgroundColor = '#e8f4fd';
                    pathIndicator.style.borderColor = '#3366cc';
                    break;
                case 'ext1':
                    pathIndicator.textContent = 'Extension: Line 1+ Continues';
                    pathIndicator.style.backgroundColor = '#e8ffe8';
                    pathIndicator.style.borderColor = '#33cc66';
                    break;
                case 'ext2':
                    pathIndicator.textContent = 'Extension: Line 3+ Continues';
                    pathIndicator.style.backgroundColor = '#fffce8';
                    pathIndicator.style.borderColor = '#cccc33';
                    break;
            }
        }

        function switchToPath(newPath, offset = 0) {
            currentPath = newPath;
            currentOffset = offset;
            
            let targetHref = '#gradualChangePath';
            if (newPath === 'ext1') {
                targetHref = '#extensionPath1';
                interactiveText.style.textAnchor = 'start';  // Left-align for ext1
            } else if (newPath === 'ext2') {
                targetHref = '#extensionPath2';
                interactiveText.style.textAnchor = 'end';  // Right-align for ext2 to keep visible
            } else {
                interactiveText.style.textAnchor = 'start';  // Left-align for main path
            }
            
            slidingText.setAttribute('href', targetHref);
            slidingText.setAttribute('startOffset', `${Math.min(offset, 95)}%`);
            
            updateTextContent();
            // Now the word for this path is showing: keep all of it on the path
            currentOffset = clampTextOffset(offset);
            slidingText.setAttribute('startOffset', `${currentOffset}%`);
            updatePathIndicator();
            
        }

        // Single source of truth for "which main-path transition is the sliding
        // text on?" — uses the explicit [start, end] ranges in transitionsData
        // (which follow the real path-segment lengths), NOT equal fifths of the
        // path. Both the display (updateTextContent) and the quiz/learned
        // tracking (toggleTextFormat) must use this, or in ~21% of the path the
        // learner sees one item but is quizzed on / credited with another.
        function getTransitionIndexForOffset(offset) {
            for (let i = 0; i < transitionsData.length; i++) {
                if (offset >= transitionsData[i][3] && offset <= transitionsData[i][4]) {
                    return i;
                }
            }
            return transitionsData.length - 1;
        }

        function updateTextContent() {
            if (isStatesMode) return;
            
            let displayText = '';
            
            if (currentPath === 'main') {
                // Find which transition range the current offset falls into
                const selectedData = transitionsData[getTransitionIndexForOffset(currentOffset)];
                
                if (selectedData) {
                    if (slidingTextMode === 0) {
                        displayText = selectedData[0]; // TLR
                    } else if (slidingTextMode === 1) {
                        displayText = selectedData[1]; // TL
                    } else if (slidingTextMode === 2) {
                        displayText = selectedData[2]; // SL
                    }
                }
            } else if (currentPath === 'ext1') {
                const index = Math.floor((currentOffset / 100) * extension1TransitionData.length);
                const data = extension1TransitionData[Math.min(index, extension1TransitionData.length - 1)];
                
                if (slidingTextMode === 0) {
                    displayText = data[0]; // TLR
                } else if (slidingTextMode === 1) {
                    displayText = data[1]; // TL
                } else if (slidingTextMode === 2) {
                    displayText = data[2]; // SL
                }
            } else if (currentPath == 'ext2') {
                const index = Math.floor((currentOffset / 100) * extension2TransitionData.length);
                const data = extension2TransitionData[Math.min(index, extension2TransitionData.length - 1)];
                
                if (slidingTextMode === 0) {
                    displayText = data[0]; // TLR
                } else if (slidingTextMode === 1) {
                    displayText = data[1]; // TL
                } else if (slidingTextMode === 2) {
                    displayText = data[2]; // SL
                }
            }
            
            slidingText.textContent = displayText;
            interactiveText.style.fontSize = calculateFontSize(displayText) + "px";
        }

        function updateLevelIndicator() {
            if (isStatesMode) {
                levelIndicator.style.display = 'none';
                return;
            }
            
            levelIndicator.style.display = 'none';
            
            switch (slidingTextMode) {
                case 0:
                    levelIndicator.textContent = 'Target Language Romanized (TLR)';
                    break;
                case 1:
                    levelIndicator.textContent = 'Target Language (TL)';
                    break;
                case 2:
                    levelIndicator.textContent = 'Source Language (SL)';
                    break;
                case 3:
                    levelIndicator.textContent = 'Quiz Mode';
                    break;
            }
        }

        // Keep the whole sliding word on its path: glyphs beyond either end of a
        // path are not drawn, so the word would be cut off. The main path and
        // ext1 are left-aligned (the offset is where the word STARTS, so it must
        // stop short of the end by the word's length); ext2 is right-aligned
        // (the offset is where the word ENDS, so it must not go below the word's
        // length). If the word can't be measured, fall back to the old 95% cap.
        function clampTextOffset(offset) {
            let lo = 0, hi = 95;
            try {
                const len = document.getElementById("interactiveText").getComputedTextLength();
                const pathLen = getPathObject(currentPath).getTotalLength();
                if (len > 0 && pathLen > 0) {
                    const lenPct = (len / pathLen) * 100;
                    if (currentPath === 'ext2') { lo = Math.min(100, lenPct); hi = 100; }
                    else { lo = 0; hi = Math.max(0, 100 - lenPct); }
                }
            } catch (e) { /* not measurable: keep the fallback */ }
            return Math.min(hi, Math.max(lo, offset));
        }

        function startTextDrag(e) {
            if (isStatesMode) return;
            
            isDraggingText = true;
            hasMovedDuringDrag = false;
            interactiveText.classList.add('dragging');
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            lastDragPoint = { x: clientX, y: clientY };
            
            e.preventDefault();
        }

        function dragText(e) {
            if (!isDraggingText || isStatesMode) return;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const deltaX = clientX - lastDragPoint.x;
            const deltaY = clientY - lastDragPoint.y;
            
            if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
                hasMovedDuringDrag = true;
            }
            
            if (hasMovedDuringDrag) {
                const svgRect = svg.getBoundingClientRect();
                const svgX = ((clientX - svgRect.left) / svgRect.width) * 100;
                const svgY = ((clientY - svgRect.top) / svgRect.height) * 50;
                
                const closest = findClosestPointOnAllPaths(svgX, svgY);
                
                if (closest.path !== currentPath) {
                    switchToPath(closest.path, closest.offset);
                } else {
                    // Apply alignment based on current path
                    if (currentPath === 'ext2') {
                        interactiveText.style.textAnchor = 'end';  // Right-align for ext2
                    } else {
                        interactiveText.style.textAnchor = 'start';  // Left-align for main and ext1
                    }
                    
                    currentOffset = closest.offset;
                    updateTextContent();   // the word (and font size) for this spot, so it can be measured
                    currentOffset = clampTextOffset(currentOffset);
                    slidingText.setAttribute('startOffset', `${currentOffset}%`);
                }
                
                lastDragPoint = { x: clientX, y: clientY };
            }
            
            e.preventDefault();
        }

        function endTextDrag(e) {
            if (isDraggingText) {
                isDraggingText = false;
                interactiveText.classList.remove('dragging');
            }
        }

        function toggleTextFormat(e) {
            if (isStatesMode) return;
            
            // Get current data based on path and offset
            let currentData;
            let dataIndex;
            let learnedItemsIndex;
            
            if (currentPath === 'main') {
                dataIndex = getTransitionIndexForOffset(currentOffset);
                currentData = transitionsData;
                learnedItemsIndex = dataIndex;
            } else if (currentPath === 'ext1') {
                dataIndex = Math.floor((currentOffset / 100) * extension1TransitionData.length);
                dataIndex = Math.min(dataIndex, extension1TransitionData.length - 1);
                currentData = extension1TransitionData;
                learnedItemsIndex = transitionsData.length + dataIndex;
            } else if (currentPath === 'ext2') {
                dataIndex = Math.floor((currentOffset / 100) * extension2TransitionData.length);
                dataIndex = Math.min(dataIndex, extension2TransitionData.length - 1);
                currentData = extension2TransitionData;
                learnedItemsIndex = transitionsData.length + extension1TransitionData.length + dataIndex;
            }
            
            
            if (learnedItemsTransitions[learnedItemsIndex]) {
                // Cycle TL -> TLR -> SL -> TL for learned items
                if (slidingTextMode === 0) {
                    slidingTextMode = 1; // TLR -> TL
                } else if (slidingTextMode === 1) {
                    slidingTextMode = 2; // TL -> SL
                } else {
                    slidingTextMode = 0; // SL -> TLR
                }
                updateTextContent();
                updateLevelIndicator();
            } else {
                // TLR -> TL -> SL -> Quiz for unlearned items
                if (slidingTextMode === 0) {
                    slidingTextMode = 1; // TLR -> TL
                    updateTextContent();
                    updateLevelIndicator();
                } else if (slidingTextMode === 1) {
                    slidingTextMode = 2; // TL -> SL
                    updateTextContent();
                    updateLevelIndicator();
                } else if (slidingTextMode === 2) {
                    slidingTextMode = 3; // SL -> Quiz
                    updateLevelIndicator();
                    showQuiz(learnedItemsIndex, interactiveText);
                } else {
                    slidingTextMode = 0; // Reset to TLR
                    updateTextContent();
                    updateLevelIndicator();
                }
            }
        }

        function handleExtensionClick(extensionId) {
            if (isStatesMode) return;
            
            if (extensionId === 'ext1') {
                switchToPath('ext1', 0);
            } else if (extensionId === 'ext2') {
                switchToPath('ext2', 0);
            }
        }

        // STATES MODE FUNCTIONS
        
        let isDragging = false;
        let currentPathPosition = 0;

        // The frame circle's real radius in path units: CSS doubles it to 3 on
        // touch devices (pointer: coarse), so the left/right clamp must too, or
        // the circle is half cut off at either end of the path.
        function getFrameRadius() {
            return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? 3 : 1.5;
        }

        function startDrag(e) {
            if (!isStatesMode) return;
            
            isDragging = true;
            frame.classList.add('dragging');
            
            e.preventDefault();
            e.stopPropagation();
        }

        function dragMove(e) {
            if (!isDragging || !isStatesMode) return;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            try {
                const svgRect = svg.getBoundingClientRect();
                const svgX = ((clientX - svgRect.left) / svgRect.width) * 100;
                const svgY = ((clientY - svgRect.top) / svgRect.height) * 50;
                
                // Find closest point on ALL paths (main + extensions)
                let closestPoint = null;
                let minDistance = Infinity;
                let closestPathName = 'main';
                
                const sampleRate = 0.5;
                
                // Check main path
                for (let i = 0; i < pathLength; i += sampleRate) {
                    const point = pathLine.getPointAtLength(i);
                    const distance = Math.sqrt(Math.pow(point.x - svgX, 2) + Math.pow(point.y - svgY, 2));
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestPoint = point;
                        closestPathName = 'main';
                    }
                }
                
                // Check extension path 1 (Line 1+)
                const ext1Length = ext1Path.getTotalLength();
                for (let i = 0; i < ext1Length; i += sampleRate) {
                    const point = ext1Path.getPointAtLength(i);
                    const distance = Math.sqrt(Math.pow(point.x - svgX, 2) + Math.pow(point.y - svgY, 2));
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestPoint = point;
                        closestPathName = 'ext1';
                    }
                }
                
                // Check extension path 2 (Line 3+)
                const ext2Length = ext2Path.getTotalLength();
                for (let i = 0; i < ext2Length; i += sampleRate) {
                    const point = ext2Path.getPointAtLength(i);
                    const distance = Math.sqrt(Math.pow(point.x - svgX, 2) + Math.pow(point.y - svgY, 2));
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestPoint = point;
                        closestPathName = 'ext2';
                    }
                }
                
                if (closestPoint) {
                    // Circle radius is 1.5 units
                    const radius = getFrameRadius();
                    
                    // Constrain circle to stay within viewBox (-30 to 130 on x-axis)
                    const minX = 0 + radius;  // -28.5 units (left edge at 0)
                    const maxX = 100 - radius;   // 128.5 units (right edge at 100)
                    
                    const constrainedX = Math.max(minX, Math.min(maxX, closestPoint.x));
                    
                    // Position circle centered on the path
                    frame.setAttribute('cx', constrainedX);
                    frame.setAttribute('cy', closestPoint.y);
                    
                    // Use constrained position for textbox updates
                    updateVisibleTextBoxes({ x: constrainedX, y: closestPoint.y });
                    
                    // Update concept indicator based on which path we're on
                    if (closestPathName === 'main') {
                        // Find position along main path for concept indicator
                        let bestPos = 0;
                        let minDist = Infinity;
                        for (let i = 0; i <= 100; i++) {
                            const testLength = (i / 100) * pathLength;
                            const testPoint = pathLine.getPointAtLength(testLength);
                            const dist = Math.sqrt(Math.pow(testPoint.x - constrainedX, 2) + Math.pow(testPoint.y - closestPoint.y, 2));
                            if (dist < minDist) {
                                minDist = dist;
                                bestPos = i;
                            }
                        }
                        updateConceptIndicator(bestPos);
                    } else if (closestPathName === 'ext1') {
                        conceptIndicator.textContent = extensionData[0][1] + " (Line 1+)";
                    } else if (closestPathName === 'ext2') {
                        conceptIndicator.textContent = extensionData[1][1] + " (Line 3+)";
                    }
                    
                }
                
            } catch (error) {
                console.error("Error during drag:", error);
            }
            
            e.preventDefault();
            e.stopPropagation();
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                frame.classList.remove('dragging');
                
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        function updateConceptIndicator(position) {
            const closestIndex = conceptData.reduce((closest, data, index) => {
                const distance = Math.abs(data[4] - position);
                return distance < closest.distance ? { index, distance } : closest;
            }, { index: 0, distance: Infinity }).index;
            
            conceptIndicator.textContent = conceptData[closestIndex][1];
        }

        function initializeFramePosition() {
            currentPathPosition = 0;
            const startPoint = pathLine.getPointAtLength(0);
            
            // Circle radius is 1.5 units
            const radius = getFrameRadius();
            
            // Constrain x position: left edge should not go below -30 (viewBox start)
            const minX = 0 + radius;  // -28.5 units (so left edge is at 0)
            const maxX = 100 - radius;   // 128.5 units (so right edge is at 100)
            const constrainedX = Math.max(minX, Math.min(maxX, startPoint.x));
            
            // Position circle centered on the path
            frame.setAttribute('cx', constrainedX);
            frame.setAttribute('cy', startPoint.y);
            
            updateVisibleTextBoxes({ x: constrainedX, y: startPoint.y });
            updateConceptIndicator(0);
            
            bringFrameToFront();
            frame.style.pointerEvents = 'all';
            frame.style.cursor = 'grab';
            
        }

        function updateVisibleTextBoxes(point) {
            if (!isStatesMode) return -1;
            
            let closestIndex = -1;
            let minDistance = Infinity;
            let closestIsExtension = false;
            let closestExtIndex = -1;
            
            // Check main textboxes
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x'));
                const y = parseFloat(textBox.getAttribute('y'));
                
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                    closestIsExtension = false;
                }
            });
            
            // Check extension textboxes
            extensionTextBoxes.forEach((textBox, extIndex) => {
                if (!textBox) return;
                
                const x = parseFloat(textBox.getAttribute('x'));
                const y = parseFloat(textBox.getAttribute('y'));
                
                const distance = Math.sqrt(Math.pow(point.x - x, 2) + Math.pow(point.y - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = extIndex;
                    closestExtIndex = extIndex;
                    closestIsExtension = true;
                }
            });
            
            // Update main textboxes
            textBoxElements.forEach((textBox, index) => {
                if (!textBox) return;
                
                if (!closestIsExtension && index === closestIndex && minDistance < activationDistance) {
                    textBox.classList.add('active');
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else if (learnedItemsStates[index]) {
                    textBox.classList.remove('active');
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else {
                    textBox.classList.remove('active');
                    textBox.style.opacity = '0';
                    textBox.style.transform = 'scale(0.5)';
                }
            });
            
            // Update extension textboxes
            extensionTextBoxes.forEach((textBox, extIndex) => {
                if (!textBox) return;
                
                // Extension textboxes use indices 11-13 in learnedItemsStates array
                const dataIndex = conceptData.length + extIndex; // 11 + extIndex
                
                if (closestIsExtension && extIndex === closestExtIndex && minDistance < activationDistance) {
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else if (learnedItemsStates[dataIndex]) {
                    textBox.style.opacity = '1';
                    textBox.style.transform = 'scale(1)';
                } else {
                    textBox.style.opacity = '0';
                    textBox.style.transform = 'scale(0.5)';
                }
            });
            
            return closestIsExtension ? -1 : closestIndex;
        }

        function calculateFontSize(text) {
            const length = text.length;
            let baseSize;
            if (length <= 10) baseSize = 2.1;
            else if (length <= 20) baseSize = 1.8;
            else if (length <= 40) baseSize = 1.5;
            else if (length <= 60) baseSize = 1.2;
            else if (length <= 80) baseSize = 1.05;
            else if (length <= 100) baseSize = 0.9;
            else baseSize = 0.75;
            
            // Roughly double on coarse-pointer (touch) devices, matching
            // the mobile-sizing convention used via CSS elsewhere in this
            // family. This can't be done via a CSS media query since
            // these sizes are set inline per text box, and inline styles
            // always override CSS class rules regardless of specificity.
            if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
                return baseSize * 2;
            }
            return baseSize;
        }


        function createTextBoxes() {
            if (!isStatesMode) return;
            
            // Clear existing text boxes
            document.querySelectorAll('.textBox:not(.extension)').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            textBoxElements = [];
            
            // STANDARDIZED to viewBox="0 0 100 50"
            // Same coordinate system as GT5L+ for visual continuity
            const textBoxConfig = [
                { x: 0, y: 34.66, anchor: "start", index: 0 },      // TL1 - Line 1 start (y=34.66 (GT5L+ 30.22), raised from line)
                { x: 16.67, y: 37.16, anchor: "middle", index: 1 },     // TL2 - Line 1 center (y=37.16 (GT5L+ 32.4), on Line 1)
                { x: 33.33, y: 41.16, anchor: "middle", index: 2 },     // TL3 - Line 1 end (y=41.16 (GT5L+ 35.89), dropped from line)
                { x: 34.58, y: 30.96, anchor: "start", index: 3 },      // TL4 - Line 2 middle (y=30.96 (GT5L+ 27), on Line 2 midpoint)
                { x: 33.33, y: 22.27, anchor: "middle", index: 4 },   // TL5 - Line 3 start (y=22.27 (GT5L+ 19.42), raised from line)
                { x: 50, y: 24.77, anchor: "middle", index: 5 },        // TL6 - Line 3 center (y=24.77 (GT5L+ 21.6), on Line 3)
                { x: 66.67, y: 28.77, anchor: "middle", index: 6 },     // TL7 - Line 3 end (y=28.77 (GT5L+ 25.09), dropped from line)
                { x: 67.92, y: 30.96, anchor: "start", index: 7 },      // TL8 - Line 4 middle (y=30.96 (GT5L+ 27), on Line 4 midpoint)
                { x: 66.67, y: 34.66, anchor: "middle", index: 8 },   // TL9 - Line 5 start (y=34.66 (GT5L+ 30.22), raised from line)
                { x: 83.33, y: 37.16, anchor: "middle", index: 9 },    // TL10 - Line 5 center (y=37.16 (GT5L+ 32.4), on Line 5)
                { x: 100, y: 41.16, anchor: "end", index: 10 }          // TL11 - Line 5 end (y=41.16 (GT5L+ 35.89), dropped from line)
            ];
            
            // Create text boxes with Phonographic 3-level cycling
            for (let i = 0; i < textBoxConfig.length; i++) {
                const config = textBoxConfig[i];
                
                const textBox = document.createElementNS("http://www.w3.org/2000/svg", "text");
                textBox.setAttribute("class", "textBox");
                textBox.setAttribute("x", config.x);
                textBox.setAttribute("y", config.y);
                textBox.setAttribute("text-anchor", config.anchor);
                textBox.setAttribute("data-index", config.index);
                
                // Set initial text based on current layer (starts with TL)
                textBox.textContent = conceptData[config.index][currentTextLayer[config.index]];
                textBox.style.fontSize = calculateFontSize(conceptData[config.index][currentTextLayer[config.index]]) + "px";
                
                if (learnedItemsStates[config.index]) textBox.classList.add('learned');
                
                // Add click event listener with Phonographic 3-level cycling
                textBox.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const index = parseInt(this.getAttribute('data-index'));
                    
                    if (learnedItemsStates[index]) {
                        // Cycle between TLR, TL, and SL for learned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TLR -> TL
                            this.textContent = conceptData[index][1];
                            this.style.fontSize = calculateFontSize(conceptData[index][1]) + "px";
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2; // TL -> SL
                            this.textContent = conceptData[index][2];
                            this.style.fontSize = calculateFontSize(conceptData[index][2]) + "px";
                        } else {
                            currentTextLayer[index] = 0; // SL -> TLR
                            this.textContent = conceptData[index][0];
                            this.style.fontSize = calculateFontSize(conceptData[index][0]) + "px";
                        }
                    } else {
                        // TLR -> TL -> SL -> Quiz cycle for unlearned items
                        if (currentTextLayer[index] === 0) {
                            currentTextLayer[index] = 1; // TLR -> TL
                            this.textContent = conceptData[index][1];
                            this.style.fontSize = calculateFontSize(conceptData[index][1]) + "px";
                        } else if (currentTextLayer[index] === 1) {
                            currentTextLayer[index] = 2; // TL -> SL
                            this.textContent = conceptData[index][2];
                            this.style.fontSize = calculateFontSize(conceptData[index][2]) + "px";
                        } else if (currentTextLayer[index] === 2) {
                            currentTextLayer[index] = 3; // SL -> Quiz
                            showQuiz(index, this);
                        } else {
                            currentTextLayer[index] = 0; // Reset to TL
                            this.textContent = conceptData[index][0];
                            this.style.fontSize = calculateFontSize(conceptData[index][0]) + "px";
                        }
                    }
                });
                
                svg.appendChild(textBox);
                textBoxElements.push(textBox);
            }
            
            // Ensure frame is on top after creating text boxes
            bringFrameToFront();
            
        }

        function bringFrameToFront() {
            // Move frame to end of SVG to ensure it's on top
            if (frame && frame.parentNode) {
                frame.parentNode.appendChild(frame);
                // Re-apply cursor style to ensure it's visible
                frame.style.cursor = 'grab';
            }
        }

        function createExtensionTextBoxes() {
            if (!isStatesMode) return;
            
            document.querySelectorAll('.textBox.extension').forEach(box => {
                if (box && box.parentNode) box.parentNode.removeChild(box);
            });
            extensionTextBoxes = [];
            extensionTextLayers = [0, 0, 0];
            
            // Extension 1 text box (on Line 1+ path) - positioned at 50% of x-axis (middle of screen)
            // ViewBox x-axis goes from -30 to 130, so 50% is at x = 50
            const ext1X = 50; // 50% on x-axis (middle of screen)

                } else {
                    // TLR -> TL -> SL -> Quiz cycle for unlearned items
                    if (extensionTextLayers[extIndex] === 0) {

            svg.appendChild(ext1Box);
            extensionTextBoxes.push(ext1Box);
            
            // Extension 2 text box (on Line 3+ path) - positioned at MIDPOINT of extension path 2
            // Extension path 2 goes from x=66.67 to x=100 at y=24.77
            const ext2MidX = (66.67 + 100) / 2; // 83.335 - midpoint of Line 3+ extension
            const ext2Box = document.createElementNS("http://www.w3.org/2000/svg", "text");
            ext2Box.setAttribute("x", ext2MidX);
            ext2Box.setAttribute("y", 20);
            ext2Box.setAttribute("text-anchor", "middle");
            ext2Box.setAttribute("class", "textBox extension");
            ext2Box.setAttribute("data-extension-index", 1);
            ext2Box.setAttribute("data-index", 6);
            ext2Box.textContent = extensionData[1][0];
            ext2Box.style.fontSize = calculateFontSize(extensionData[1][0]) + "px";
            ext2Box.style.opacity = '0';

            ext2Box.addEventListener('click', function() {
                const extIndex = 1;
                const dataIndex = conceptData.length + extIndex; // 11 + 1 = 12
                
                if (learnedItemsStates[dataIndex]) {
                    // Cycle between TLR, TL, and SL for learned items
                    if (extensionTextLayers[extIndex] === 0) {
                        extensionTextLayers[extIndex] = 1; // TLR -> TL
                        this.textContent = extensionData[extIndex][1];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][1]) + "px";
                    } else if (extensionTextLayers[extIndex] === 1) {
                        extensionTextLayers[extIndex] = 2; // TL -> SL
                        this.textContent = extensionData[extIndex][2];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][2]) + "px";
                    } else {
                        extensionTextLayers[extIndex] = 0; // SL -> TLR
                        this.textContent = extensionData[extIndex][0];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][0]) + "px";
                    }
                } else {
                    // TLR -> TL -> SL -> Quiz cycle for unlearned items
                    if (extensionTextLayers[extIndex] === 0) {
                        extensionTextLayers[extIndex] = 1; // TLR -> TL
                        this.textContent = extensionData[extIndex][1];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][1]) + "px";
                    } else if (extensionTextLayers[extIndex] === 1) {
                        extensionTextLayers[extIndex] = 2; // TL -> SL
                        this.textContent = extensionData[extIndex][2];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][2]) + "px";
                    } else if (extensionTextLayers[extIndex] === 2) {
                        extensionTextLayers[extIndex] = 3; // SL -> Quiz
                        showQuiz(dataIndex, this);
                    } else {
                        extensionTextLayers[extIndex] = 0; // Reset to TL
                        this.textContent = extensionData[extIndex][0];
                        this.style.fontSize = calculateFontSize(extensionData[extIndex][0]) + "px";

            });
            
            svg.appendChild(ext2Box);
            extensionTextBoxes.push(ext2Box);
            
            // Ensure frame is on top after creating extension text boxes

        function showQuiz(index, element) {
            let currentData;
            let dataIndex; // Index within the specific data array
            
            if (isStatesMode) {
                // Check if this is an extension textbox by looking at the element's class
                const isExtension = element && element.classList && element.classList.contains('extension');
                
                if (isExtension) {
                    // Extension textboxes use extensionData
                    const extIndex = parseInt(element.getAttribute('data-extension-index'));
                    currentData = extensionData;
                    currentQuizIndex = index;
                    currentQuizIsExtension = true;
                    currentQuizExtIndex = extIndex;
                    const slWord = extensionData[extIndex][2]; // SL is at index 2
                    quizInput.placeholder = `What is the TLR word for '${slWord}'?`;
                } else {
                    // All 11 main textboxes (indices 0-10) use conceptData
                    currentData = conceptData;
                    currentQuizIndex = index;
                    currentQuizIsExtension = false;
                    currentQuizExtIndex = -1;
                    const slWord = conceptData[index][2]; // SL is at index 2
                    quizInput.placeholder = `What is the TLR word for '${slWord}'?`;
                }
            } else {
                // Transitions mode - index is the learnedItemsIndex
                currentQuizIndex = index;
                
                // Determine which data array and calculate dataIndex
                if (currentPath === 'main') {
                    currentData = transitionsData;
                    dataIndex = index; // Direct mapping for main path (0-4)
                } else if (currentPath === 'ext1') {
                    currentData = extension1TransitionData;
                    dataIndex = index - transitionsData.length; // Subtract offset (index 5 -> dataIndex 0)
                } else if (currentPath === 'ext2') {
                    currentData = extension2TransitionData;
                    dataIndex = index - transitionsData.length - extension1TransitionData.length; // Subtract offset
                }
                
                const slWord = currentData[dataIndex][2]; // SL is at index 2
                quizInput.placeholder = `What is the TLR word for '${slWord}'?`;
                
            }
            
            quizInput.value = '';
            quizFeedback.textContent = '';
            
            // Dynamic width based on question length
            const questionLength = quizInput.placeholder.length;
            let calculatedWidth;
            if (questionLength < 30) {
                calculatedWidth = 280;
            } else if (questionLength < 50) {
                calculatedWidth = 360;
            } else if (questionLength < 70) {
                calculatedWidth = 450;
            } else {
                calculatedWidth = 600;
            }
            quizContainer.style.width = calculatedWidth + 'px';
            
            // Position quiz container (custom position or default centered)
            if (quizPosition.x !== null && quizPosition.y !== null) {
                // Use saved custom position
                quizContainer.style.left = quizPosition.x + 'px';
                quizContainer.style.top = quizPosition.y + 'px';
                quizContainer.style.transform = 'none'; // Disable centering transform
            } else {
                // Use default centered position
                quizContainer.style.left = '50%';
                quizContainer.style.top = '40%';
                quizContainer.style.transform = 'translate(-50%, -50%)';
            }
            
            quizContainer.style.display = 'block';
            quizContainer.style.visibility = 'visible';
            quizContainer.style.opacity = '1';
            quizContainer.style.zIndex = '9999';
            
            setTimeout(() => {
                try {
                    quizInput.focus();
                } catch (e) {
                    console.error("Error focusing quiz input:", e);
                }
            }, 100);
        }

        function addToVocabularyArray(index, trackingIndex) {
            try {
                // Use trackingIndex if provided, otherwise use index (for backwards compatibility)
                const indexToTrack = trackingIndex !== undefined ? trackingIndex : index;
                
                // Determine which data to use based on current path in transitions mode
                let currentData;
                if (currentPath === 'ext1') {
                    currentData = extension1TransitionData;
                } else if (currentPath === 'ext2') {
                    currentData = extension2TransitionData;
                } else {
                    currentData = transitionsData;
                }
                
                const tlr = currentData[index][0];            // TLR — what the quiz tests
                const targetLanguage = currentData[index][1]; // TL
                const sourceLanguage = currentData[index][2]; // SL
                
                const itemElement = document.createElement('div');
                itemElement.className = 'vocabulary-item';
                
                const tlrSpan = document.createElement('span');
                tlrSpan.className = 'target-language-roman';
                tlrSpan.textContent = tlr;
                
                const targetSpan = document.createElement('span');
                targetSpan.className = 'target-language';
                targetSpan.textContent = targetLanguage;
                
                const sourceSpan = document.createElement('span');
                sourceSpan.className = 'source-language';
                sourceSpan.textContent = sourceLanguage;
                
                tlrSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                targetSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                sourceSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('hidden');
                });
                
                
                itemElement.appendChild(tlrSpan);
                itemElement.appendChild(targetSpan);
                itemElement.appendChild(sourceSpan);
                
                // One combined list, kept in path order whatever order the items
                // were learned in (main path first, then extension 1, then
                // extension 2, by global index): insert before the first entry
                // with a higher index (null = append at the end).
                itemElement.setAttribute('data-index', indexToTrack);
                let insertBeforeEl = null;
                for (const child of vocabularyItems.children) {
                    if (parseInt(child.getAttribute('data-index'), 10) > indexToTrack) {
                        insertBeforeEl = child;
                        break;
                    }
                }
                vocabularyItems.insertBefore(itemElement, insertBeforeEl);
                addedVocabularyItems[indexToTrack] = true;
                vocabularyArray.style.display = 'block';
                

            } catch (error) {
                console.error("Error adding vocabulary item:", error);
            }
        }

        function checkQuizAnswer() {
            if (currentQuizIndex < 0) return;
            
            let currentData;
            let dataIndex;
            
            if (isStatesMode) {
                // Use the tracking variables set by showQuiz
                if (currentQuizIsExtension) {
                    // Extension textbox
                    currentData = extensionData;
                    dataIndex = currentQuizExtIndex;
                } else {
                    // Main textbox (all 11 main textboxes use conceptData)
                    currentData = conceptData;
                    dataIndex = currentQuizIndex;
                }
            } else {
                if (currentPath === 'main') {
                    currentData = transitionsData;
                    dataIndex = currentQuizIndex;
                } else if (currentPath === 'ext1') {
                    currentData = extension1TransitionData;
                    dataIndex = currentQuizIndex - transitionsData.length;
                } else if (currentPath === 'ext2') {
                    currentData = extension2TransitionData;
                    dataIndex = currentQuizIndex - transitionsData.length - extension1TransitionData.length;
                }
            }
            
            const userAnswer = quizInput.value.trim();
            const correctAnswer = currentData[dataIndex][0]; // TLR is at index 0
            
            if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
                quizFeedback.textContent = 'Correct!';
                quizFeedback.style.color = 'green';
                const answeredIndex = currentQuizIndex;
                
                if (isStatesMode) {
                    // Mark as learned in States Mode only
                    if (currentQuizIsExtension) {
                        // Extension textbox - use correct index (11-13)
                        const correctIndex = conceptData.length + currentQuizExtIndex;
                        learnedItemsStates[correctIndex] = true;
                        
                        const extBox = extensionTextBoxes[currentQuizExtIndex];
                        if (extBox) {
                            extBox.classList.add('learned');
                            extBox.textContent = extensionData[currentQuizExtIndex][0];
                        }
                        extensionTextLayers[currentQuizExtIndex] = 0;
                    } else {
                        // Main textbox - use currentQuizIndex directly (0-10)
                        learnedItemsStates[currentQuizIndex] = true;
                        
                        const textBox = textBoxElements[currentQuizIndex];
                        if (textBox) {
                            textBox.classList.add('learned');
                            textBox.textContent = conceptData[currentQuizIndex][0];
                        }
                        currentTextLayer[currentQuizIndex] = 0;
                    }
                } else {
                    // Mark as learned in Transitions Mode only
                    learnedItemsTransitions[currentQuizIndex] = true;
                    
                    slidingTextMode = 0;
                    updateTextContent();
                    updateLevelIndicator();
                    
                    // Add to the one combined vocabulary list. currentQuizIndex is the
                    // global index (main path, then ext1, then ext2), so each item is
                    // filed once and sorted into path order.
                    if (!addedVocabularyItems[currentQuizIndex]) {
                        addToVocabularyArray(dataIndex, currentQuizIndex);
                    }
                }
                
                setTimeout(() => {
                    // Only close our own quiz - the learner may already have opened another
                    if (currentQuizIndex === answeredIndex) {
                        quizContainer.style.display = 'none';
                        currentQuizIndex = -1;
                    }
                }, 1500);
            } else {
                quizFeedback.textContent = 'Try again';
                quizFeedback.style.color = 'red';
            }
        }

        function switchModeIndicatorText() {
            const modeIndicator = document.getElementById('mode-indicator');
            if (!modeIndicator) return;
            
            modeIndicator.classList.add('hidden');
            setTimeout(() => {
                currentModeIndicatorIndex = (currentModeIndicatorIndex + 1) % 2;
                const modeKey = isStatesMode ? 'states' : 'transitions';
                modeIndicator.textContent = modeIndicatorTexts[modeKey][currentModeIndicatorIndex];
                modeIndicator.classList.remove('hidden');
            }, 500);
        }

        function toggleMode() {
            isStatesMode = !isStatesMode;

            // Reset to TLR default on mode switch — otherwise a learner who
            // had cycled to SL/TL in the old mode lands on the same index
            // in the new mode instead of starting fresh at TLR.
            currentTextIndex = 0;
            
            if (isStatesMode) {
                // Switch to States mode
                frame.style.display = 'block';
                interactiveText.style.display = 'none';
                
                titleBox.textContent = titleTexts.states[currentTextIndex];
                levelIndicator.style.display = 'none';
                pathIndicator.style.display = 'none';
                conceptIndicator.style.display = 'none';
                
                const modeIndicator = document.getElementById("mode-indicator");
                if (modeIndicator) modeIndicator.textContent = modeIndicatorTexts.states[currentModeIndicatorIndex];
                
                createTextBoxes();
                createExtensionTextBoxes();
                initializeFramePosition();
                
                setTimeout(() => {
                    bringFrameToFront();
                    frame.style.pointerEvents = 'all';
                    frame.style.cursor = 'grab';
                }, 100);
                
                vocabularyArray.style.display = 'none';
            } else {
                // Switch to Transitions mode
                frame.style.display = 'none';
                interactiveText.style.display = 'block';
                
                titleBox.textContent = titleTexts.transitions[currentTextIndex];
                slidingTextMode = 0;
                updateLevelIndicator();
                updatePathIndicator();
                
                const modeIndicator = document.getElementById("mode-indicator");
                if (modeIndicator) modeIndicator.textContent = modeIndicatorTexts.transitions[currentModeIndicatorIndex];
                
                // Remove text boxes
                document.querySelectorAll('.textBox').forEach(box => {
                    if (box && box.parentNode) box.parentNode.removeChild(box);
                });
                textBoxElements = [];
                
                // Initialize on main path
                currentPath = 'main';
                currentOffset = 0;
                switchToPath('main', 0);
                
                if (vocabularyItems && vocabularyItems.children.length > 0) {
                    vocabularyArray.style.display = 'block';
                }
            }
            
            quizContainer.style.display = 'none';
        }

        function switchTitleText() {
            titleBox.classList.add('hidden');
            setTimeout(() => {
                currentTextIndex = (currentTextIndex + 1) % 3;
                const modeKey = isStatesMode ? 'states' : 'transitions';
                titleBox.textContent = titleTexts[modeKey][currentTextIndex];
                titleBox.classList.remove('hidden');
            }, 500);
        }

        function toggleArrayVisibility(arrayType) {
            try {
                const container = document.getElementById(arrayType + "-items");
                const button = document.getElementById("toggle-" + arrayType);
                if (!container || !button) {
                    console.error("Container or button not found for " + arrayType);
                    return;
                }
                
                const spans = container.querySelectorAll('.vocabulary-item .target-language-roman, .vocabulary-item .target-language, .vocabulary-item .source-language');
                
                let visibleCount = 0;
                spans.forEach(span => {
                    if (!span.classList.contains('hidden')) {
                        visibleCount++;
                    }
                });
                
                const mostlyVisible = visibleCount > spans.length / 2;
                
                spans.forEach(span => {
                    if (mostlyVisible) {
                        span.classList.add('hidden');
                    } else {
                        span.classList.remove('hidden');
                    }
                });
                
                button.textContent = mostlyVisible ? 'Show All' : 'Hide All';
            } catch (error) {
                console.error("Error in toggleArrayVisibility:", error);
            }
        }

            // ── Keyboard-avoidance for the Quiz box ──────────────────
            if (window.visualViewport) {
                const KEYBOARD_HEIGHT_THRESHOLD = 150;
                function handleViewportResize() {
                    const qc = document.getElementById('quizContainer');
                    if (!qc) return;
                    const heightDiff = window.innerHeight - window.visualViewport.height;
                    if (heightDiff > KEYBOARD_HEIGHT_THRESHOLD) {
                        qc.classList.add('keyboard-open');

                    }
                }
                window.visualViewport.addEventListener('resize', handleViewportResize);
            }

            // ── Learned Vocabulary array: default position + drag anywhere ──────
            // Default spot: 5% across / 2% down the template box (.a4-page). The array is
            // position:fixed so it can be dragged anywhere on the screen, e.g. clear of the quiz box.
            // Once the learner has moved it, it stays where they put it (also across hide/show).
            (function setupArrayDrag() {
                const arr = document.getElementById('vocabulary-array');
                const list = document.getElementById('vocabulary-items');
                const page = document.querySelector('.a4-page');
                if (!arr) return;
                const DRAG_THRESHOLD_PX = 5;   // below this a press is a click (Hide All, tapping an entry)
                let userMoved = false, dragging = false, moved = false, wasShown = false;
                let offX = 0, offY = 0, startX = 0, startY = 0, activeId = null, justDragged = false;

                function place(left, top) {
                    const maxLeft = Math.max(0, window.innerWidth - arr.offsetWidth);
                    const maxTop = Math.max(0, window.innerHeight - arr.offsetHeight);
                    arr.style.left = Math.min(Math.max(0, left), maxLeft) + 'px';
                    arr.style.top = Math.min(Math.max(0, top), maxTop) + 'px';
                }
                function placeDefault() {
                    const r = page ? page.getBoundingClientRect()
                                   : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
                    place(r.left + r.width * 0.05, r.top + r.height * 0.02);
                }
                function updateScrollable() {
                    arr.classList.toggle('scrollable', arr.scrollHeight > arr.clientHeight + 1);
                }
                function isShown() { return arr.style.display === 'block'; }
                // Re-place after the content (and so the height) or the window changes: the array
                // grows downward as entries are added, and is nudged up if its bottom edge would
                // otherwise fall off the screen.
                function refit() {
                    if (!isShown()) return;
                    if (userMoved) place(parseFloat(arr.style.left) || 0, parseFloat(arr.style.top) || 0);
                    else placeDefault();
                    updateScrollable();
                }

                // Watch for the array being shown (the JS shows it from several places), and for
                // entries being added, rather than patching every call site.
                new MutationObserver(function () {
                    const shown = isShown();
                    if (shown && !wasShown) {
                        wasShown = true;
                        if (userMoved) place(parseFloat(arr.style.left) || 0, parseFloat(arr.style.top) || 0);
                        else placeDefault();
                    } else if (!shown) {
                        wasShown = false;
                    }
                    if (shown) updateScrollable();
                }).observe(arr, { attributes: true, attributeFilter: ['style'] });
                if (list) new MutationObserver(refit).observe(list, { childList: true, subtree: true });

                window.addEventListener('resize', refit);

                arr.addEventListener('pointerdown', function (e) {
                    if (e.button) return;                        // primary button / touch / pen only
                    if (e.target.closest && e.target.closest('button')) return;   // let Hide All click through
                    const r = arr.getBoundingClientRect();
                    dragging = true; moved = false; activeId = e.pointerId;
                    startX = e.clientX; startY = e.clientY;
                    offX = e.clientX - r.left; offY = e.clientY - r.top;
                });
                document.addEventListener('pointermove', function (e) {
                    if (!dragging || e.pointerId !== activeId) return;
                    if (!moved) {
                        if (Math.hypot(e.clientX - startX, e.clientY - startY) < DRAG_THRESHOLD_PX) return;
                        moved = true;
                        arr.classList.add('dragging');
                        try { arr.setPointerCapture(activeId); } catch (_) {}
                    }
                    place(e.clientX - offX, e.clientY - offY);
                    userMoved = true;
                    if (e.cancelable) e.preventDefault();
                });
                function endDrag(e) {
                    if (!dragging || e.pointerId !== activeId) return;
                    dragging = false;
                    arr.classList.remove('dragging');
                    try { arr.releasePointerCapture(activeId); } catch (_) {}
                    if (moved) {
                        // The release fires a click; swallow it so it can't dismiss the quiz box,
                        // close the Tools menu or toggle an entry (reset after 100ms if none arrives).
                        justDragged = true;
                        setTimeout(function () { justDragged = false; }, 100);
                    }
                    moved = false;
                }
                document.addEventListener('pointerup', endDrag);
                document.addEventListener('pointercancel', endDrag);
                document.addEventListener('click', function (e) {
                    if (justDragged) { justDragged = false; e.stopPropagation(); e.preventDefault(); }
                }, true);
            })();

            // ── Quiz box: drag to reposition anywhere on screen ──────
            (function setupQuizDrag() {
                const qc = document.getElementById('quizContainer');
                const qInput = document.getElementById('quizInput');
                const qCheck = document.getElementById('quizCheck');
                let isDraggingQuiz = false;
                let dragMoved = false;
                let quizDragOffsetX = 0;
                let quizDragOffsetY = 0;

                function quizDragStart(e) {
                    if (e.target === qInput || e.target === qCheck) return;
                    isDraggingQuiz = true;
                    dragMoved = false;
                    const rect = qc.getBoundingClientRect();
                    const point = e.touches ? e.touches[0] : e;
                    quizDragOffsetX = point.clientX - rect.left;
                    quizDragOffsetY = point.clientY - rect.top;
                    qc.style.left = rect.left + 'px';
                    qc.style.top = rect.top + 'px';
                    qc.style.transform = 'none';
                    qc.classList.add('dragging');
                    if (e.touches) e.preventDefault();
                }

                function quizDragMove(e) {
                    if (!isDraggingQuiz) return;
                    const point = e.touches ? e.touches[0] : e;
                    let newLeft = point.clientX - quizDragOffsetX;
                    let newTop = point.clientY - quizDragOffsetY;
                    const maxLeft = window.innerWidth - qc.offsetWidth;
                    const maxTop = window.innerHeight - qc.offsetHeight;
                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));
                    qc.style.left = newLeft + 'px';
                    qc.style.top = newTop + 'px';
                    // Remember where the learner put it, so the next quiz opens there
                    quizPosition.x = newLeft;
                    quizPosition.y = newTop;
                    dragMoved = true;
                    if (e.touches) e.preventDefault();
                }

                function quizDragEnd() {
                    if (!isDraggingQuiz) return;
                    isDraggingQuiz = false;
                    qc.classList.remove('dragging');
                    // A drag-release fires a click at whatever is under the cursor;
                    // if that lands just outside the box, the outside-click dismiss
                    // handler would close the quiz. Flag it so that one click is
                    // swallowed (reset after 100ms in case no click ever arrives).
                    if (dragMoved) {
                        quizJustDragged = true;
                        setTimeout(function () { quizJustDragged = false; }, 100);
                    }
                }

                qc.addEventListener('mousedown', quizDragStart);
                document.addEventListener('mousemove', quizDragMove);
                document.addEventListener('mouseup', quizDragEnd);

                qc.addEventListener('touchstart', quizDragStart, { passive: false });
                document.addEventListener('touchmove', quizDragMove, { passive: false });
                document.addEventListener('touchend', quizDragEnd);
            })();
            
            if (toolsButton) {
                toolsButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = !dropdownOpen;
                    toolsDropdown.classList.toggle('active', dropdownOpen);
                });
            }
            
            document.addEventListener('click', function(e) {
                if (toolsButton && toolsDropdown && 
                    !toolsButton.contains(e.target) && !toolsDropdown.contains(e.target)) {
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                }
            });
            
            if (loadConceptBtn) {
                loadConceptBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    alert("Load Concept feature will integrate with API to fetch vocabulary for phonographic language concepts.");
                });
            }
            
            if (startQuizBtn) {
                startQuizBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    if (isStatesMode) {
                        showQuiz(Math.floor(Math.random() * conceptData.length), null);
                    } else {
                        // Transitions quiz indices are global across paths (main,
                        // then ext1, then ext2) and showQuiz()/checkQuizAnswer()
                        // resolve them via currentPath — so pick within the path
                        // the sliding text is currently on.
                        let base = 0;
                        let count = transitionsData.length;
                        if (currentPath === 'ext1') {
                            base = transitionsData.length;
                            count = extension1TransitionData.length;
                        } else if (currentPath === 'ext2') {
                            base = transitionsData.length + extension1TransitionData.length;
                            count = extension2TransitionData.length;
                        }
                        showQuiz(base + Math.floor(Math.random() * count), null);
                    }
                });
            }
            
            if (toggleArraysBtn) {
                toggleArraysBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownOpen = false;
                    toolsDropdown.classList.remove('active');
                    
                    const visibility = vocabularyArray.style.display === 'none' || vocabularyArray.style.display === '';
                    vocabularyArray.style.display = visibility ? 'block' : 'none';
                });
            }
            
            if (toggleVocabularyBtn) {
                toggleVocabularyBtn.addEventListener('click', function() {
                    toggleArrayVisibility('vocabulary');
                });
            }
            

            
            // Document click handler for closing quizzes
            document.addEventListener('click', function(e) {
                // Swallow the one synthetic click that follows a quiz-box drag-release
                if (quizJustDragged) {
                    quizJustDragged = false;
                    return;
                }
                if (quizContainer.style.display !== 'none' && 
                    !quizContainer.contains(e.target) &&
                    !e.target.classList.contains('textBox') &&
                    !e.target.classList.contains('sliding-text')) {
                    
                    quizContainer.style.display = 'none';
                    currentQuizIndex = -1;
                    
                    if (!isStatesMode && slidingTextMode === 2) {
                        slidingTextMode = 0;
                        updateLevelIndicator();
                        updateTextContent();
                    }
                }
            });
        }

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', function() {
            try {
                
                // Get all DOM references
                svg = document.getElementById("svgCanvas");
                pathLine = document.getElementById("gradualChangePath");
                conceptBackground = document.getElementById("conceptBackground");
                titleBox = document.getElementById("title-box");
                conceptIndicator = document.getElementById("concept-indicator");
                levelIndicator = document.getElementById("level-indicator");
                pathIndicator = document.getElementById("path-indicator");
                modeToggleBtn = document.getElementById("modeToggle");
                frame = document.getElementById("draggableFrame");
                quizContainer = document.getElementById("quizContainer");
                quizInput = document.getElementById("quizInput");
                quizCheck = document.getElementById("quizCheck");
                quizFeedback = document.getElementById("quizFeedback");
                vocabularyArray = document.getElementById("vocabulary-array");
                vocabularyItems = document.getElementById("vocabulary-items");
                toggleVocabularyBtn = document.getElementById("toggle-vocabulary");
                interactiveText = document.getElementById("interactiveText");
                slidingText = document.getElementById("slidingText");
                ext1Path = document.getElementById("extensionPath1");
                ext2Path = document.getElementById("extensionPath2");
                
                if (!svg || !pathLine || !frame) {
                    console.error("Critical SVG elements missing");
                    return;
                }

                // Title box: TLR by default (matches the vocabulary-item
                // convention — see Conceptionary_Template_Definitions.md).
                // Was previously left showing a static HTML placeholder
                // until the title was clicked; now genuinely defaults to
                // real content from the moment the page loads.
                titleBox.textContent = titleTexts.states[0];
                currentTextIndex = 0;
                
                // Initialize learned items arrays - separate for States and Transitions modes
                const statesItemsCount = conceptData.length + extensionData.length; // 5 + 3 = 8
                const transitionsItemsCount = transitionsData.length + 
                                              extension1TransitionData.length + 
                                              extension2TransitionData.length;
                
                learnedItemsStates = new Array(statesItemsCount).fill(false);
                learnedItemsTransitions = new Array(transitionsItemsCount).fill(false);
                addedVocabularyItems = new Array(transitionsItemsCount).fill(false);
                
                // Create the main path
                const pathD = `M ${pathPoints.join(' L ')}`;
                pathLine.setAttribute('d', pathD);
                
                // Create background
                const backgroundPath = `${pathD} L 130,50 L -30,50 Z`;
                conceptBackground.setAttribute('d', backgroundPath);
                
                // Get path length
                pathLength = pathLine.getTotalLength();
                
                // Setup event listeners
                setupEventListeners();
                
                // Initialize in States Mode
                createTextBoxes();
                createExtensionTextBoxes();
                initializeFramePosition();
                
                // Hide elements that should start hidden
                interactiveText.style.display = 'none';
                levelIndicator.style.display = 'none';
                pathIndicator.style.display = 'none';
                quizContainer.style.display = 'none';
                vocabularyArray.style.display = 'none';
                
                // Hide drag instruction after 12 seconds
                setTimeout(() => {
                    const dragInstruction = document.getElementById('drag-instruction');
                    if (dragInstruction) {
                        dragInstruction.classList.add('fade');
                        setTimeout(() => {
                            dragInstruction.style.display = 'none';
                        }, 2000);
                    }
                }, 12000);
                
                // Final frame setup to ensure it's fully interactive
                setTimeout(() => {
                    bringFrameToFront();
                    frame.style.pointerEvents = 'all';
                    frame.style.cursor = 'grab';
                }, 500);
                
            } catch (error) {
                console.error("Error initializing application:", error);
            }
        });

    </script>
</body>
</html>
