<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steering Wheel — Directions — Logographic — Generic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#c4eaf8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;font-family:'Segoe UI',Arial,sans-serif;}
#sb{width:100%;max-width:700px;}
#sv{width:100%;height:auto;display:block;touch-action:none;cursor:grab;user-select:none;}
</style>
</head>
<body>
<div id="sb">
<svg id="sv" viewBox="-420 -465 840 850" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="rimGrad" x1="0" y1="-195" x2="0" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#b0b0b0"/>
      <stop offset="18%"  stop-color="#505050"/>
      <stop offset="50%"  stop-color="#1a1a1a"/>
      <stop offset="82%"  stop-color="#505050"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="32%" cy="26%" r="72%">
      <stop offset="0%"   stop-color="#d0d0d0"/>
      <stop offset="22%"  stop-color="#909090"/>
      <stop offset="55%"  stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="hubInnerGrad" cx="36%" cy="30%" r="66%">
      <stop offset="0%"   stop-color="#c0c0c0"/>
      <stop offset="30%"  stop-color="#606060"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="pipGrad" cx="30%" cy="25%" r="65%">
      <stop offset="0%"   stop-color="#e0e0e0"/>
      <stop offset="45%"  stop-color="#707070"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="handGrad" cx="35%" cy="28%" r="62%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </radialGradient>
    <radialGradient id="handInnerGrad" cx="38%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </radialGradient>
  </defs>

  <rect x="-420" y="-465" width="840" height="850" fill="#c4eaf8" rx="12"/>

  <!-- Title box: TLR default (per LOG convention), click to cycle TLR→TL→SL→TLR -->
  <foreignObject x="-221" y="-465" width="442" height="80">
    <div id="title-box" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#c4eaf8;border:1.5px solid #4a8aaa;border-radius:0 0 6px 6px;box-sizing:border-box;cursor:pointer;padding:4px 8px;text-align:center;">
      <span id="ttl-tlr" style="font-size:38px;font-family:Segoe UI,Arial,sans-serif;font-weight:700;font-style:italic;color:#1a4a6a;white-space:nowrap;">TLR_TITLE</span>
      <span id="ttl-tl" style="font-size:40px;font-family:Segoe UI,Arial,sans-serif;font-weight:700;color:#0d2d42;white-space:nowrap;display:none;">TL_TITLE</span>
      <span id="ttl-sl" style="font-size:38px;font-family:Segoe UI,Arial,sans-serif;font-weight:700;font-style:italic;color:#1a4a6a;white-space:nowrap;display:none;">SL_TITLE</span>
    </div>
  </foreignObject>

  <!-- Instructions panel: SL default (so a beginner can read them before
       knowing the target language), click to cycle SL→TLR→TL→SL -->
  <foreignObject id="fobj-instr" x="-420" y="-295" width="250" height="390">
    <div id="instr-box" style="width:100%;height:100%;background:rgba(255,255,255,0.82);border:1.5px solid #4a8aaa;border-radius:0 6px 6px 0;padding:12px 14px;box-sizing:border-box;cursor:pointer;overflow:hidden;transition:opacity 0.6s ease;">
      <div id="instr-tlr" style="font-size:20px;font-family:Segoe UI,Arial,sans-serif;font-style:italic;color:#1a4a6a;line-height:1.45;display:none;">
        <span style="color:#888;font-style:italic;">INSTR_DISAPPEAR_TLR</span><br><br>
        INSTR_BODY_TLR
      </div>
      <div id="instr-tl" style="font-size:20px;font-family:Segoe UI,Arial,sans-serif;color:#0d2d42;line-height:1.45;display:none;">
        <span style="color:#888;font-style:italic;">INSTR_DISAPPEAR_TL</span><br><br>
        INSTR_BODY_TL
      </div>
      <div id="instr-sl" style="font-size:20px;font-family:Segoe UI,Arial,sans-serif;color:#0d2d42;line-height:1.45;">
        <span style="color:#888;font-style:italic;">INSTR_DISAPPEAR_SL</span><br><br>
        INSTR_BODY_SL
      </div>
    </div>
  </foreignObject>

  <!-- Display-all button: TL default label -->
  <foreignObject x="322" y="-465" width="98" height="98">
    <div id="disp-btn" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#c4eaf8;border:1.5px solid #4a8aaa;border-radius:0 0 0 6px;box-sizing:border-box;cursor:pointer;padding:4px 6px;text-align:center;">
      <span id="disp-txt" style="font-size:20px;font-family:Segoe UI,Arial,sans-serif;font-weight:500;color:#0d2d42;line-height:1.3;">DISP_LABEL_0</span>
    </div>
  </foreignObject>

  <!-- Rim -->
  <circle cx="0" cy="0" r="183" fill="none" stroke="url(#rimGrad)" stroke-width="20"/>
  <circle cx="0" cy="0" r="174" fill="none" stroke="rgba(180,180,180,0.18)" stroke-width="2"/>
  <circle cx="0" cy="0" r="192" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>

  <!-- Hub -->
  <circle cx="0" cy="0" r="36" fill="url(#hubGrad)"/>
  <circle cx="0" cy="0" r="36" fill="none" stroke="rgba(200,200,200,0.25)" stroke-width="1.5"/>
  <circle cx="0" cy="0" r="22" fill="url(#hubInnerGrad)"/>
  <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(180,180,180,0.2)" stroke-width="1"/>
  <circle cx="0" cy="0" r="9"  fill="url(#pipGrad)"/>

  <!-- Rotating group -->
  <g id="st" transform="rotate(0)">
    <line x1="-163" y1="0" x2="163" y2="0" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round"/>
    <line x1="-145" y1="0" x2="145" y2="0" stroke="#787878" stroke-width="6"  stroke-linecap="round"/>
    <line x1="-145" y1="0" x2="145" y2="0" stroke="#b8b8b8" stroke-width="2"  stroke-linecap="round"/>
    <line x1="0" y1="36"  x2="0" y2="163" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round"/>
    <line x1="0" y1="44"  x2="0" y2="155" stroke="#787878" stroke-width="6"  stroke-linecap="round"/>
    <line x1="0" y1="44"  x2="0" y2="155" stroke="#b8b8b8" stroke-width="2"  stroke-linecap="round"/>
    <circle cx="163"  cy="0" r="36" fill="url(#handGrad)" stroke="#a0a0a0" stroke-width="1.5"/>
    <circle cx="163"  cy="0" r="19" fill="url(#handInnerGrad)" stroke="#c8c8c8" stroke-width="1"/>
    <circle cx="163"  cy="0" r="7"  fill="#e0e0e0"/>
    <circle cx="-163" cy="0" r="36" fill="url(#handGrad)" stroke="#a0a0a0" stroke-width="1.5"/>
    <circle cx="-163" cy="0" r="19" fill="url(#handInnerGrad)" stroke="#c8c8c8" stroke-width="1"/>
    <circle cx="-163" cy="0" r="7"  fill="#e0e0e0"/>
  </g>

  <g id="lg"></g>

  <text x="415" y="377" text-anchor="end" font-size="24" font-family="Segoe UI,Arial,sans-serif" fill="rgba(8,53,80,0.28)">&#169; 2026 Alan William Preston</text>

</svg>
</div>

<script>
/* =====================================================================
   LANGUAGE CONFIGURATION BLOCK
   To create a new language pair, replace ALL values in this section.
   SL = Source Language  |  TL = Target Language (language being learned)

   STRUCTURE: A rotating steering wheel with up to 20 directional phrases
   positioned around the rim. Each item has:
     a    — angle (0-360°) on the wheel where it activates while dragging
     posA — (optional) display angle, if different from 'a' (for items
            that should activate over a range but display at one point)
     py   — (optional) absolute y-position override for the label
     dy   — (optional) y-offset adjustment from the default position
     tl   — Target Language phrase (shown by default, Level 1)
     sl   — Source Language phrase (shown on click, Level 2)
   Quiz (Level 3) tests the TL spelling.
   Do NOT change anything outside this block.
   ===================================================================== */

const LANG = {
  // --- Title ----------------------------------------------------------
  title_tl: "TL_TITLE",   // e.g. "Tell me where to go"
  title_sl: "SL_TITLE",   // e.g. "Show me the way"

  // --- Instructions panel ----------------------------------------------
  instr_disappear_tl: "INSTR_DISAPPEAR_TL", // e.g. "(This will disappear in 15 seconds)"
  instr_disappear_sl: "INSTR_DISAPPEAR_SL",
  instr_body_tl: "INSTR_BODY_TL", // e.g. "Grab either white circle and turn the wheel..."
  instr_body_sl: "INSTR_BODY_SL",

  // --- Display-all button cycle (4 states for logographic) ---------------
  // 0: normal mode, 1: show all TLR, 2: show all TL, 3: show all SL
  display_cycle: [
    "DISP_LABEL_0", // e.g. "Show<br>all TLR"
    "DISP_LABEL_1", // e.g. "Show<br>all TL"
    "DISP_LABEL_2", // e.g. "Show<br>all SL"
    "DISP_LABEL_3"  // e.g. "Normal<br>view"
  ],

  // --- Quiz strings -------------------------------------------------------
  quiz_placeholder: "QUIZ_PLACEHOLDER", // e.g. "Type the romanized reading..."
  quiz_correct:     "QUIZ_CORRECT",     // e.g. "Correct! ✓"
  quiz_wrong:       "QUIZ_WRONG",       // e.g. "Try again!"

  // --- Diacritic / romanization normalization ----------------------------
  diacritic_instructions: "DIACRITIC_INSTRUCTIONS",
  // e.g. "Tip: macrons (ā→a, ō→o) may be typed as plain vowels."
  diacritic_map: [
      // ["ā","a"], ["ī","i"], ["ū","u"], ["ē","e"], ["ō","o"]
  ],
  collapse_double_vowels: false,

  // --- Vocabulary data (up to 20 directional phrases) ---------------------
  // Each item: tl = target language script, tlr = romanized, sl = source language
  // Level cycle: 1=TLR (default) → 2=TL (script) → 3=SL → 4=Quiz (tests TLR)
  V: [
    {a:0,          tl:"TL-StraightAhead",    tlr:"TLR-StraightAhead",    sl:"SL-StraightAhead",    py:-355},
    {a:5,  posA:0, tl:"TL-ContinueAsIs",     tlr:"TLR-ContinueAsIs",     sl:"SL-ContinueAsIs",     py:-317},
    {a:15,         tl:"TL-VeerSlightlyR",    tlr:"TLR-VeerSlightlyR",    sl:"SL-VeerSlightlyR"},
    {a:340,        tl:"TL-VeerSlightlyL",    tlr:"TLR-VeerSlightlyL",    sl:"SL-VeerSlightlyL",    dy:15},
    {a:40,         tl:"TL-VeerR",            tlr:"TLR-VeerR",            sl:"SL-VeerR"},
    {a:320,        tl:"TL-VeerL",            tlr:"TLR-VeerL",            sl:"SL-VeerL"},
    {a:70,         tl:"TL-TurnR",            tlr:"TLR-TurnR",            sl:"SL-TurnR"},
    {a:290,        tl:"TL-TurnL",            tlr:"TLR-TurnL",            sl:"SL-TurnL"},
    {a:80,         tl:"TL-HangR",            tlr:"TLR-HangR",            sl:"SL-HangR"},
    {a:280,        tl:"TL-HangL",            tlr:"TLR-HangL",            sl:"SL-HangL"},
    {a:90,         tl:"TL-TurnHardR",        tlr:"TLR-TurnHardR",        sl:"SL-TurnHardR"},
    {a:270,        tl:"TL-TurnHardL",        tlr:"TLR-TurnHardL",        sl:"SL-TurnHardL"},
    {a:120,        tl:"TL-DoubleBackR",      tlr:"TLR-DoubleBackR",      sl:"SL-DoubleBackR"},
    {a:240,        tl:"TL-DoubleBackL",      tlr:"TLR-DoubleBackL",      sl:"SL-DoubleBackL"},
    {a:160,        tl:"TL-UTurn",            tlr:"TLR-UTurn",            sl:"SL-UTurn"},
    {a:150,        tl:"TL-UeyR",             tlr:"TLR-UeyR",             sl:"SL-UeyR"},
    {a:210,        tl:"TL-UeyL",             tlr:"TLR-UeyL",             sl:"SL-UeyL"},
    {a:175,        tl:"TL-BackUp",           tlr:"TLR-BackUp",           sl:"SL-BackUp",           py:210},
    {a:185,        tl:"TL-GoStraightBack",   tlr:"TLR-GoStraightBack",   sl:"SL-GoStraightBack"},
    {a:180,        tl:"TL-Reverse",          tlr:"TLR-Reverse",          sl:"SL-Reverse",          py:365}
  ]
};
/* =====================================================================
   END OF LANGUAGE CONFIGURATION BLOCK
   No language-specific content appears below this line.
   ===================================================================== */


/* --- Apply title, instructions, display cycle, quiz strings ---------- */
document.getElementById('ttl-tlr').textContent = LANG.title_tlr;
document.getElementById('ttl-tl').textContent = LANG.title_tl;
document.getElementById('ttl-sl').textContent = LANG.title_sl;

const instrTlrEl = document.getElementById('instr-tlr');
const instrTlEl = document.getElementById('instr-tl');
const instrSlEl = document.getElementById('instr-sl');
instrTlrEl.innerHTML = `<span style="color:#888;font-style:italic;">${LANG.instr_disappear_tlr}</span><br><br>${LANG.instr_body_tlr}`;
instrTlEl.innerHTML = `<span style="color:#888;font-style:italic;">${LANG.instr_disappear_tl}</span><br><br>${LANG.instr_body_tl}`;
instrSlEl.innerHTML = `<span style="color:#888;font-style:italic;">${LANG.instr_disappear_sl}</span><br><br>${LANG.instr_body_sl}`;

document.getElementById('disp-txt').innerHTML = LANG.display_cycle[0];

const V = LANG.V;
/* =====================================================================
   LOGOGRAPHIC VARIANT — 4-level cycle per item:
   Level 1 = TLR (romanized, default)
   Level 2 = TL  (target language script)
   Level 3 = SL  (source language)
   Level 4 = Quiz (tests TLR spelling)
   ===================================================================== */

const AnswerUtils = {
    normalize: function(text) {
        let t = text.toLowerCase();
        LANG.diacritic_map.forEach(([accented, plain]) => {
            t = t.split(accented).join(plain);
        });
        if (LANG.collapse_double_vowels) {
            t = t.replace(/aa/g,'a').replace(/ee/g,'e').replace(/ii/g,'i')
                 .replace(/oo/g,'o').replace(/uu/g,'u');
        }
        return t.toLowerCase().trim().replace(/[!?.,]/g,'');
    },
    check: function(input, correct) {
        return this.normalize(input) === this.normalize(correct);
    }
};

const NS='http://www.w3.org/2000/svg';
const sv=document.getElementById('sv'),st=document.getElementById('st'),lg=document.getElementById('lg');
let rot=0,drag=false,prev=0,inputActive=false,activeIdx=-1,displayMode=0;
// states: level 1-4 (1=TLR default), learned flag
const LR=262,THR=6,lbls=[],renders=[],states=V.map(()=>({level:1,learned:false}));

function mkt(txt,sz,it,fw,fc){
  const t=document.createElementNS(NS,'text');t.setAttribute('x','0');t.setAttribute('y','5');
  t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
  t.setAttribute('font-size',sz);t.setAttribute('font-family','Segoe UI,Arial,sans-serif');
  t.setAttribute('fill',fc);if(it)t.setAttribute('font-style','italic');if(fw)t.setAttribute('font-weight',fw);
  t.setAttribute('stroke','rgba(255,255,255,0.9)');t.setAttribute('stroke-width','4');
  t.setAttribute('stroke-linejoin','round');t.setAttribute('style','paint-order:stroke fill');
  t.textContent=txt;return t;
}


V.forEach((v,i)=>{
  const pa=v.posA!==undefined?v.posA:v.a;const pr=pa*Math.PI/180;
  const tx=Math.sin(pr)*LR;const ty=v.py!==undefined?v.py:(-Math.cos(pr)*LR)+(v.dy||0);
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${tx.toFixed(1)},${ty.toFixed(1)})`);
  g.setAttribute('opacity','0');g.style.cursor='pointer';g.style.pointerEvents='none';

  /* Level 1 = TLR (romanized) — green, bold, DEFAULT display */
  const t0=mkt(v.tlr,26,false,'600','#1b5e20');g.appendChild(t0);
  /* Level 2 = TL (script) — dark blue, bold */
  const t1=mkt(v.tl,26,false,'500','#0d2d42');t1.setAttribute('display','none');g.appendChild(t1);
  /* Level 3 = SL — italic, lighter */
  const t2=mkt(v.sl,22,true,null,'#1a4a6a');t2.setAttribute('display','none');g.appendChild(t2);

  const fo=document.createElementNS(NS,'foreignObject');
  fo.setAttribute('x','-115');fo.setAttribute('y','-38');fo.setAttribute('width','230');fo.setAttribute('height','90');fo.setAttribute('display','none');
  const xd=document.createElement('div');xd.style.cssText='width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;';
  const inp=document.createElement('input');inp.type='text';
  inp.placeholder=LANG.quiz_placeholder;
  inp.style.cssText='width:218px;font-size:18px;font-family:Segoe UI,Arial,sans-serif;text-align:center;border:2px solid #1a4a6a;background:rgba(255,255,255,0.93);border-radius:6px;padding:4px 8px;outline:none;box-sizing:border-box;color:#0d2d42;';
  const fb=document.createElement('div');fb.style.cssText='font-size:14px;font-family:Segoe UI,Arial,sans-serif;font-weight:500;min-height:18px;text-align:center;';
  const diacNote=document.createElement('div');
  diacNote.style.cssText='font-size:10px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:3px;margin-top:2px;';
  diacNote.textContent=LANG.diacritic_instructions;
  xd.appendChild(inp);xd.appendChild(fb);xd.appendChild(diacNote);fo.appendChild(xd);g.appendChild(fo);

  const dg=document.createElementNS(NS,'g');dg.setAttribute('transform','translate(0,54)');const dots=[];
  [-21,-7,7,21].forEach((dx,di)=>{
    const d=document.createElementNS(NS,'circle');d.setAttribute('cx',dx);d.setAttribute('cy','0');d.setAttribute('r','5');
    d.setAttribute('fill',di===0?'#1b5e20':'rgba(255,255,255,0.38)');dots.push(d);dg.appendChild(d);
  });g.appendChild(dg);

  const ck=document.createElementNS(NS,'text');
  ck.setAttribute('x','112');ck.setAttribute('y','-28');ck.setAttribute('text-anchor','middle');ck.setAttribute('font-size','24');
  ck.setAttribute('fill','#2e8b57');ck.setAttribute('stroke','rgba(255,255,255,0.88)');ck.setAttribute('stroke-width','3');
  ck.setAttribute('style','paint-order:stroke fill');ck.setAttribute('display','none');ck.textContent='\u2713';g.appendChild(ck);

  function render(){
    const s=states[i];
    if(displayMode===1){
      /* Display all TLR */
      t0.setAttribute('display','');t1.setAttribute('display','none');t2.setAttribute('display','none');fo.setAttribute('display','none');
    } else if(displayMode===2){
      /* Display all TL */
      t0.setAttribute('display','none');t1.setAttribute('display','');t2.setAttribute('display','none');fo.setAttribute('display','none');
    } else if(displayMode===3){
      /* Display all SL */
      t0.setAttribute('display','none');t1.setAttribute('display','none');t2.setAttribute('display','');fo.setAttribute('display','none');
    } else {
      t0.setAttribute('display',s.level===1?'':'none');
      t1.setAttribute('display',s.level===2?'':'none');
      t2.setAttribute('display',s.level===3?'':'none');
      fo.setAttribute('display',s.level===4?'':'none');
    }
    dots.forEach((d,di)=>{
      const fill = s.learned ? '#2e8b57' :
                   di < s.level-1 ? 'rgba(255,255,255,0.85)' :
                   di === s.level-1 ? (s.level===1?'#1b5e20':'#0d2d42') :
                   'rgba(255,255,255,0.38)';
      d.setAttribute('fill', fill);
    });
    ck.setAttribute('display',s.learned?'':'none');
    if(s.level===4&&!s.learned&&displayMode===0) setTimeout(()=>inp.focus(),60);
  }
  renders.push(render);

  function escape(){if(!states[i].learned&&states[i].level>1){inp.value='';fb.textContent='';inp.style.borderColor='#1a4a6a';states[i].level=1;render();}}
  g._escape=escape;

  g.addEventListener('mousedown',e=>e.stopPropagation());g.addEventListener('touchstart',e=>e.stopPropagation(),{passive:false});
  xd.addEventListener('click',e=>e.stopPropagation());
  g.addEventListener('click',e=>{
    e.stopPropagation();if(displayMode>0)return;
    const s=states[i];
    if(s.learned){s.level=s.level===1?2:s.level===2?3:s.level===3?1:1;}
    else if(s.level===1){s.level=2;}   // TLR → TL
    else if(s.level===2){s.level=3;}   // TL  → SL
    else if(s.level===3){s.level=4;}   // SL  → Quiz
    render();
  });
  inp.addEventListener('mousedown',e=>e.stopPropagation());inp.addEventListener('touchstart',e=>e.stopPropagation(),{passive:false});
  inp.addEventListener('focus',()=>inputActive=true);inp.addEventListener('blur',()=>inputActive=false);

  let quizTimer=null;
  inp.addEventListener('input',()=>{
    clearTimeout(quizTimer);
    /* Quiz tests TLR (romanized) spelling — diacritic-tolerant */
    const val=AnswerUtils.normalize(inp.value),tgt=AnswerUtils.normalize(v.tlr);
    fb.textContent='';inp.style.borderColor='#1a4a6a';
    if(val==='') return;
    if(val===tgt){
      fb.textContent=LANG.quiz_correct;fb.style.color='#2e8b57';inp.style.borderColor='#2e8b57';states[i].learned=true;
      setTimeout(()=>{states[i].level=1;inp.value='';fb.textContent='';inp.style.borderColor='#1a4a6a';render();},1500);
      return;
    }
    if(tgt.startsWith(val)){inp.style.borderColor='#f0a500';return;}
    inp.style.borderColor='#f0a500';
    quizTimer=setTimeout(()=>{
      if(AnswerUtils.normalize(inp.value)!==''&&!tgt.startsWith(AnswerUtils.normalize(inp.value))){
        fb.textContent=LANG.quiz_wrong;fb.style.color='#c0392b';inp.style.borderColor='#c0392b';
        setTimeout(()=>{inp.value='';fb.textContent='';inp.style.borderColor='#1a4a6a';},900);
      }
    },750);
  });
  lg.appendChild(g);lbls.push(g);
});

/* Title box: TLR default, click to cycle TLR→TL→SL→TLR (matches the
   vocabulary item convention — LOG content defaults to TLR everywhere,
   not just on individual vocabulary items) */
const ttlTlr=document.getElementById('ttl-tlr'),ttlTl=document.getElementById('ttl-tl'),ttlSl=document.getElementById('ttl-sl');
const titleBox=document.getElementById('title-box');
let titleLevel=1; // 1=TLR, 2=TL, 3=SL
function renderTitleLevel(){
  ttlTlr.style.display=titleLevel===1?'':'none';
  ttlTl.style.display=titleLevel===2?'':'none';
  ttlSl.style.display=titleLevel===3?'':'none';
}
titleBox.addEventListener('mousedown',e=>e.stopPropagation());
titleBox.addEventListener('click',e=>{
  e.stopPropagation();
  titleLevel=(titleLevel%3)+1;
  renderTitleLevel();
});

/* Display-all button — cycles: TLR / TL / SL / Normal */
const dispTxt=document.getElementById('disp-txt'),dispBtn=document.getElementById('disp-btn');
function setDisplayMode(mode){
  displayMode=mode;
  if(mode===0){show(rot);}else{lbls.forEach(l=>{l.setAttribute('opacity','1');l.style.pointerEvents='none';});}
  renders.forEach(r=>r());
}
dispBtn.addEventListener('mousedown',e=>e.stopPropagation());
dispBtn.addEventListener('click',e=>{
  e.stopPropagation();displayMode=(displayMode+1)%4;
  dispTxt.innerHTML=LANG.display_cycle[displayMode];setDisplayMode(displayMode);
});

/* Instructions panel: SL default (so a beginner can read them before
   knowing the target language), click to cycle SL→TLR→TL→SL */
const fobjInstr=document.getElementById('fobj-instr'),instrBox=document.getElementById('instr-box');
let instrLang='sl';
const instrCycle={sl:'tlr',tlr:'tl',tl:'sl'};
function renderInstrLang(){
  instrTlrEl.style.display=instrLang==='tlr'?'':'none';
  instrTlEl.style.display=instrLang==='tl'?'':'none';
  instrSlEl.style.display=instrLang==='sl'?'':'none';
}
instrBox.addEventListener('mousedown',e=>e.stopPropagation());instrBox.addEventListener('touchstart',e=>e.stopPropagation(),{passive:false});
instrBox.addEventListener('click',e=>{
  e.stopPropagation();instrLang=instrCycle[instrLang];
  renderInstrLang();
});
setTimeout(()=>{instrBox.style.opacity='0';setTimeout(()=>fobjInstr.setAttribute('visibility','hidden'),600);},15000);

/* Core drag + show */
const nma=a=>((a%360)+360)%360,df=(a,b)=>{const d=Math.abs(nma(a)-nma(b));return Math.min(d,360-d);};
function best(r){let bi=-1,md=THR;V.forEach((v,i)=>{const d=df(nma(r),v.a);if(d<md){md=d;bi=i;}});return bi;}
function show(r){
  st.setAttribute('transform','rotate('+r+')');
  if(displayMode===0){const ai=best(r);activeIdx=ai;lbls.forEach((l,i)=>{const vis=states[i].learned||i===ai;l.setAttribute('opacity',vis?'1':'0');l.style.pointerEvents=vis?'all':'none';});}
}
sv.addEventListener('click',()=>{if(displayMode>0)return;if(activeIdx>=0&&!states[activeIdx].learned)lbls[activeIdx]._escape();});
function pang(e){const rc=sv.getBoundingClientRect();const px=e.touches?e.touches[0].clientX:e.clientX;const py=e.touches?e.touches[0].clientY:e.clientY;return Math.atan2(px-rc.left-rc.width/2,rc.top+rc.height/2-py)*180/Math.PI;}
function dn(e){if(inputActive)return;drag=true;prev=pang(e);sv.style.cursor='grabbing';e.preventDefault();}
function mv(e){if(!drag)return;const a=pang(e);let d=a-prev;if(d>180)d-=360;if(d<-180)d+=360;rot=Math.max(-180,Math.min(180,rot+d));prev=a;show(rot);e.preventDefault();}
function up(){drag=false;sv.style.cursor='grab';}
sv.addEventListener('mousedown',dn);document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
sv.addEventListener('touchstart',dn,{passive:false});document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);
show(0);
</script>
