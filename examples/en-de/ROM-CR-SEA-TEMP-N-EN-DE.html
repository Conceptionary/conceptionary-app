/* ===== CONCEPTIONARY STYLE SHEET v0.1 (trial on the Compass, 2026-11-06) =====
   One block of design tokens plus the rules that use them. It sits AFTER the template's own CSS and only changes looks, never behaviour.
   Colour: ink / muted / surface / line, ONE primary (controls), ONE accent (the active word and highlight). Every text pair is 4.5:1 or better.
   Type: one system font stack (set by script into --cx-font so the word measuring uses the same font), weights 600 and 700 only.
   Spacing scale 4 / 8 / 12 / 16 / 24 px. Radius 10 (controls) and 16 (page card). Motion 150-250 ms, switched off by prefers-reduced-motion.

  --cx-primary: #2a56c6; --cx-primary-dark: #1f428f; --cx-on-primary: #ffffff;
  --cx-accent: #f2b01e; --cx-accent-soft: #fff4cf;
  --cx-btn-bg: #e4ecf8; --cx-btn-bg-hover: #d3e0f5; --cx-btn-bg-on: #bcd0f0; --cx-btn-ink: #1d3b80; --cx-btn-line: #bccbe8;
  --cx-disc-a: #fffdf6; --cx-disc-b: #efe8d4; --cx-disc-line: #d9cfb4;
  --cx-s1: 4px; --cx-s2: 8px; --cx-s3: 12px; --cx-s4: 16px; --cx-s5: 24px;

  --cx-primary: #3d63c9; --cx-primary-dark: #2f4fa6; --cx-accent: #f2b01e; --cx-accent-soft: #3a3320;

:root {
  --cx-pearl: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 38%, rgba(255,255,255,0) 62%),
              linear-gradient(135deg, #f8f5ff 0%, #e4edfb 32%, #f3e8f5 62%, #e2f1f3 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,1) 0%, rgba(255,255,255,.45) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #f3eefe 0%, #d6e4fa 32%, #efdff3 62%, #d3ebef 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.75) 0%, rgba(255,255,255,.2) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #cfdcf5 0%, #b3c8ee 35%, #cdbfe9 65%, #b4d9e3 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -3px 5px rgba(110,125,175,.20), inset 0 0 0 1px rgba(255,255,255,.35);
}
html[data-scheme="night"] {
  --cx-pearl: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #2c3a5c 0%, #34456d 35%, #3a3560 65%, #2b4458 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.3) 0%, rgba(255,255,255,.1) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #34456d 0%, #3f5486 35%, #473f78 65%, #345468 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.2) 0%, rgba(255,255,255,.05) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #46609c 0%, #4d6bb0 35%, #5a4d98 65%, #3f6f8a 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -3px 5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.06);
}
#cmpCtl .tb, .audio-wrap, .tools-dd button {
  background-image: var(--cx-pearl); background-size: 100% 100%, 220% 220%; background-position: 0 0, 0% 0%; background-repeat: no-repeat;
  transition: background-position .6s ease, box-shadow var(--cx-t), transform var(--cx-t), border-color var(--cx-t);
}
#cmpCtl .tb, .audio-wrap { box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:hover, .audio-wrap:hover { background-image: var(--cx-pearl-hover); background-position: 0 0, 100% 100%; box-shadow: var(--cx-pearl-edge), 0 3px 8px rgba(20,30,60,.20); }
#cmpCtl .tb.on { background-image: var(--cx-pearl-on); box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:active, .audio-wrap:active { box-shadow: inset 0 2px 5px rgba(60,70,110,.28); }
.tools-dd button { box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
.tools-dd button:hover { background-image: var(--cx-pearl-hover); background-position: 0 0, 100% 100%; }
/* Audio slider: a silver ball like the compass pivot, on a channel that darkens from light grey (quiet) to black (loud) */
.audio-wrap #auVol2::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; box-shadow: inset 0 1px 1px rgba(0,0,0,.25); }
.audio-wrap #auVol2::-moz-range-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; }
.audio-wrap #auVol2::-moz-range-progress { background: transparent !important; }
.audio-wrap #auVol2::-webkit-slider-thumb { box-sizing: border-box; border: 1px solid #555; margin-top: -5px; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f5f5 12%, #b0b0b0 58%, #707070 100%); box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.35); }
.audio-wrap #auVol2::-moz-range-thumb { box-sizing: border-box; border: 1px solid #555; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f5f5 12%, #b0b0b0 58%, #707070 100%); box-shadow: 0 1px 2px rgba(0,0,0,.45); }
@media (pointer: coarse) { .audio-wrap #auVol2::-webkit-slider-thumb { margin-top: -7px; } }
@media (max-height: 520px) and (orientation: landscape) { .audio-wrap #auVol2::-webkit-slider-thumb { margin-top: -4px; } }
html[data-scheme="night"] .tools-dd button { box-shadow: inset 0 1px 0 rgba(255,255,255,.10); }
    
/* ===== TML: monthly tide dial, Quiz and Learned panel ===== */
.textBox, .textBox.active, .textBox.learned { transform: none !important; }
.textBox.learned div { color: #1b7f3b !important; }
.segment-highlighted { stroke: var(--cx-accent); stroke-width: .9px; filter: none; }
.quiz-container { background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: var(--cx-r-card); box-shadow: var(--cx-shadow-md); top: 50%; left: 75%; right: auto; transform: translate(-50%, -50%); width: min(340px, 92vw); max-width: none; box-sizing: border-box; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.quiz-container input { background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 8px; font-family: var(--cx-font); box-sizing: border-box; cursor: text; user-select: text; -webkit-user-select: text; }
.quiz-container button:hover { background: var(--cx-btn-bg-hover) !important; color: var(--cx-btn-ink) !important; }
.learned-vocabulary { position: fixed; z-index: 600; display: none; background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 12px; box-shadow: var(--cx-shadow-md); top: 110px; left: 12px; width: 200px; max-height: calc(100vh - 40px); overflow-y: auto; touch-action: none; cursor: grab; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html .learned-vocabulary.has-items { display: block; }
html.no-quiz .quiz-container, html.no-quiz .learned-vocabulary, html.no-quiz .learned-vocabulary.has-items, html.no-quiz #arrayMoveTip { display: none !important; }
.array-title { background: var(--cx-primary); color: #fff; border-radius: 8px; font-family: var(--cx-font); text-align: left; padding: 5px 66px 5px 8px; min-height: 1.4em; }
.vocabulary-item { background: var(--cx-surface); border-color: var(--cx-line); font-family: var(--cx-font); }
.vocabulary-item .sl-word { color: var(--cx-muted); }
.vocabulary-item .tl-word.hidden, .vocabulary-item .sl-word.hidden { background: var(--cx-line); }
.toggle-visibility { background: var(--cx-btn-bg); color: var(--cx-btn-ink); border: 1px solid var(--cx-btn-line); border-radius: 8px; font-family: var(--cx-font); font-weight: 600; }
@media (pointer: coarse) { .quiz-container input { font-size: 16px; } }
#quizMoveHint { font: 600 14px var(--cx-font); color: var(--cx-muted); text-align: center; margin: 0 0 8px; transition: opacity .4s ease, max-height .4s ease, margin .4s ease; max-height: 30px; overflow: hidden; }
#quizMoveHint.gone { opacity: 0; max-height: 0; margin: 0; }
#arrayMoveTip { position: fixed; z-index: 1200; background: #1f2937; color: #fff; font: 600 14px var(--cx-font); padding: 7px 12px; border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity .3s ease; white-space: nowrap; }
#arrayMoveTip::after { content: ""; position: absolute; border: 6px solid transparent; }
#arrayMoveTip.left::after { left: 100%; top: 50%; margin-top: -6px; border-left-color: #1f2937; }
#arrayMoveTip.right::after { right: 100%; top: 50%; margin-top: -6px; border-right-color: #1f2937; }
#arrayMoveTip.below::after { bottom: 100%; left: 24px; border-bottom-color: #1f2937; }
@media print { .a4-page { background: #fff !important; } .learned-vocabulary, .quiz-container { display: none !important; } #printList .pl-gap { height: 3mm; } }
/* a word that turns yellow under the pointer (or a touch) always shows black text, in every colour scheme and whether or not it is learned */
html[lang] .textBox:hover div, html[lang] .textBox:active div, html[lang] .textBox.active:hover div, html[lang] .textBox.learned:hover div { color: #000 !important; text-shadow: none !important; background: #fff176 !important; }
html[data-scheme="night"] .phase-marker { fill: #e6ebf7; stroke: rgba(14,24,46,.85); }

/* ===== SEA: four seasons, the sun, filter button ===== */
.circle-path { stroke: var(--cx-ink); stroke-width: .5; fill: none; }
.season-segment { stroke: rgba(120,130,150,.35); stroke-width: .3; transition: fill .3s ease; }
.segment-highlighted { stroke: var(--cx-accent); stroke-width: .9px; filter: none; }
.q1-segment { fill: rgba(176,224,230,.45); } .q2-segment { fill: rgba(144,238,144,.4); } .q3-segment { fill: rgba(255,215,0,.35); } .q4-segment { fill: rgba(255,140,0,.35); }
html[data-scheme="night"] .q1-segment { fill: rgba(120,180,230,.28); } html[data-scheme="night"] .q2-segment { fill: rgba(110,210,120,.24); } html[data-scheme="night"] .q3-segment { fill: rgba(255,215,0,.22); } html[data-scheme="night"] .q4-segment { fill: rgba(255,140,0,.24); }
.segment-label { font-family: var(--cx-font); font-size: 2.5px; font-weight: bold; fill: var(--cx-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
html[data-scheme="night"] .segment-label { fill: #c5cce0; }
html[data-scheme="night"] .circle-path { stroke: #9fb4ee; }
.seasonal-icon { opacity: .2; pointer-events: none; }
#draggableFrame { cursor: grab; fill: url(#sunGradient); stroke: #ff7f00; stroke-width: .6px; pointer-events: all; opacity: .95; }
#draggableFrame:hover, #draggableFrame.dragging { stroke-width: .9px; }
#draggableFrame.dragging { cursor: grabbing; }
.array-sub { font: 600 .8em var(--cx-font); color: var(--cx-muted); text-align: center; margin: 4px 0; }
.drag-instruction { max-width: min(430px, 62vw); white-space: normal; }
#filter-btn { max-width: 12em; white-space: normal; }
@media print { .a4-page { background: #fff !important; } #draggableFrame { stroke-width: .4px; } }
/* Learned panels (layout) */
.learned-vocabulary { padding: 6px; }
.array-title { font-size: .9em; font-weight: bold; margin-bottom: 5px; }
.toggle-visibility { position: absolute; top: 7px; right: 8px; font-size: .72em; padding: 3px 8px; cursor: pointer; z-index: 5; }
.vocab-section { margin-bottom: 8px; }
.vocabulary-item { display: flex; flex-direction: column; font-size: .8em; margin: 4px 0; padding: 5px 6px; border: 1px solid var(--cx-line); border-radius: 8px; }
.vocabulary-item .tl-word { font-weight: bold; color: #1b7f3b; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
.vocabulary-item .sl-word { cursor: pointer; padding: 2px 5px; border-radius: 4px; }
.vocabulary-item .tl-word.hidden, .vocabulary-item .sl-word.hidden { color: transparent; user-select: none; }
html[data-scheme="night"] .vocabulary-item .tl-word { color: #6fdc9c; }

/* the Quiz is a free-floating panel: fixed to the window so that it can be grabbed and dropped anywhere (it was left in the page flow, which made the move do nothing) */
.quiz-container { position: fixed; }

/* hidden words in the Learned panel must stay hidden in the Night scheme too (the Night colour rule for .tl-word was more specific than the .hidden rule, so TL words never disappeared) */
html .vocabulary-item .tl-word.hidden, html .vocabulary-item .sl-word.hidden, html .vocabulary-item .tlr-word.hidden, html .vocabulary-item .w.hidden,
html[data-scheme="night"] .vocabulary-item .tl-word.hidden, html[data-scheme="night"] .vocabulary-item .sl-word.hidden, html[data-scheme="night"] .vocabulary-item .tlr-word.hidden, html[data-scheme="night"] .vocabulary-item .w.hidden { color: transparent !important; user-select: none; }

        <button id="quizCheck" type="button">QUIZ_BUTTON_LABEL</button>
        <div id="quizFeedback"></div>
    </div>

    <script>
    // =====================================================================
    // LANGUAGE CONFIGURATION BLOCK
    // To create a new language pair, replace ALL values in this section.
    // SL = Source Language  |  TL = Target Language (language being learned)
    //
    // STRUCTURE: 4 fixed quadrants aligned to the NORTHERN HEMISPHERE
    // calendar: Q1 = Dec-Feb (Winter), Q2 = Mar-May (Spring), Q3 = Jun-Aug
    // (Summer), Q4 = Sep-Nov (Autumn). The month-range labels are fixed in
    // the page (they make this the "Northern Hemisphere" variant) and are
    // NOT part of this block. The Southern Hemisphere variant uses the same
    // engine with the opposite season mapping, in a separate file.
    // PHONOGRAPHIC (ROM) VARIANT: layers TL (default) > SL > Quiz. The Quiz asks for the TL.
    //
    // Do NOT change anything outside this block.
    // =====================================================================
    const LANG = {

        // --- Title cycle (click the title box to change language) ---------
        titles: [
            "Die Jahreszeiten",
            "Seasons of the Year",
            "Die Jahreszeiten / Seasons of the Year"
        ],

        // --- UI strings --------------------------------------------------
        show_tl_label:    "Zeige: Englisch",     // e.g. "Show: TL"
        show_sl_label:    "Zeige: Deutsch",     // e.g. "Show: SL"
        reset_label:      "Zurücksetzen",       // e.g. "Reset"
        move_hint:        "Du kannst das verschieben",         // e.g. "You can move this" (shown for 5 seconds each time the Quiz opens)
        drag_instruction: "Ziehe die Sonne herum und entdecke die Jahreszeiten!",  // e.g. "Drag the sun around to explore the seasons!"
        array_title:      "Gelernter Wortschatz",       // e.g. "Learned Vocabulary"
        hide_all_label:   "Alle ausblenden",    // e.g. "Hide All"
        show_all_label:   "Alle einblenden",    // e.g. "Show All"
        quiz_placeholder: "Englisches Wort eingeben",  // e.g. "Enter the [TL] word"
        quiz_button:      "Prüfen", // e.g. "Check"
        quiz_correct:     "Richtig!",      // e.g. "Correct!"
        quiz_wrong:       "Nochmal versuchen",        // e.g. "Try again"

        // --- Filter button (one button; each click shows the next view) ---
        filter_all_label:         "Alle",          // e.g. "All"
        filter_seasons_label:     "4 Jahreszeiten",      // e.g. "4 Seasons"
        filter_significant_label: "Besondere Zeiten",  // e.g. "Significant Times"

        // --- Side panel section titles ------------------------------------
        seasons_section_title:     "Jahreszeiten (Seasons)",      // e.g. "Ngā Raumati (Seasons)"
        significant_section_title: "Besondere Zeiten (Significant Times)",  // e.g. "Ngā Wā Nui (Significant Times)"

        // --- Answer checking ----------------------------------------------
        // diacritic_map: pairs [accented, plain] used to normalise quiz answers. Leave empty [] if not needed.
        diacritic_map: [
            // ["ā","a"], ["ē","e"], ["ī","i"], ["ō","o"], ["ū","u"]
        ],
        // digraph_map: letter pairs treated as one when checking (applied to the typed AND the right answer), e.g. ["ou","o"], ["ei","e"].
        digraph_map: [],
        // collapse_double_vowels: true makes "aa" = "a" etc. (languages where a doubled vowel is an alternative macron notation).
        collapse_double_vowels: false,

        // --- Vocabulary data (any number of items) -------------------------
        // Format: [ SL phrase, TL phrase, Quiz prompt, Angle (0-360), Category ]
        // Category: "season" (one of the 4 quadrant seasons, listed in the left panel) or "event" / "cultural" (significant times, right panel).
        // Angle 0 = top of the circle (start of Q1/Dec); increases clockwise.
        //   Q1 (Dec-Feb): 330-360, 0-60   Q2 (Mar-May): 60-150   Q3 (Jun-Aug): 150-240   Q4 (Sep-Nov): 240-330
        seasonsData: [
            ["Winter", "Winter", "Wie heißt „Winter“ auf Englisch?", 0, "season"],
            ["Frühling", "Spring", "Wie heißt „Frühling“ auf Englisch?", 90, "season"],
            ["Sommer", "Summer", "Wie heißt „Sommer“ auf Englisch?", 180, "season"],
            ["Herbst", "Autumn", "Wie heißt „Herbst“ auf Englisch?", 270, "season"],
            ["Frühlings-Tagundnachtgleiche", "Spring Equinox", "Wie heißt „Frühlings-Tagundnachtgleiche“ auf Englisch?", 80, "event"],
            ["Sommersonnenwende", "Summer Solstice", "Wie heißt „Sommersonnenwende“ auf Englisch?", 175, "event"],
            ["Herbst-Tagundnachtgleiche", "Autumnal Equinox", "Wie heißt „Herbst-Tagundnachtgleiche“ auf Englisch?", 265, "event"],
            ["Wintersonnenwende", "Winter Solstice", "Wie heißt „Wintersonnenwende“ auf Englisch?", 355, "event"],
            ["Faschingsdienstag", "Shrove Tuesday", "Wie heißt „Faschingsdienstag“ auf Englisch?", 45, "cultural"],
            ["der 1. Mai", "May Day", "Wie heißt „der 1. Mai“ auf Englisch?", 105, "cultural"],
            ["Muttertag", "Mother's Day", "Wie heißt „Muttertag“ auf Englisch?", 125, "cultural"],
            ["Sommerferien", "Summer holidays", "Wie heißt „Sommerferien“ auf Englisch?", 190, "cultural"],
            ["Halloween", "Halloween", "Wie heißt „Halloween“ auf Englisch?", 285, "cultural"],
            ["Weihnachten", "Christmas", "Wie heißt „Weihnachten“ auf Englisch?", 335, "cultural"]
        ]
    };
    // =====================================================================
    // END OF LANGUAGE CONFIGURATION BLOCK
    // No language-specific content appears below this line.
    // =====================================================================

    </script>
    <script>

/* 2026-11-17 SEASONS (TEMPERATE, NORTHERN HEMISPHERE): each word sits just outside the dial at its own angle (pushed out when words would touch; the view box grows to hold the longest words),
   the layer cycle (ROM: TL > SL > Quiz; LOG: TLR > TL > SL > Quiz) on every word, Show All, the filter button, touch-anywhere grab of the sun, two movable Learned panels and a movable Quiz. */
var textBoxElements = [];
(function () {
    var SVGNS = 'http://www.w3.org/2000/svg', $ = function (id) { return document.getElementById(id); }, de = document.documentElement;
    var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif'; de.style.setProperty('--cx-font', FONT);
    var D = LANG.seasonsData, LOGV = D[0].length >= 6;
    var COL = LOGV ? { sl: 0, tl: 1, tlr: 2, q: 3, ang: 4, cat: 5 } : { sl: 0, tl: 1, q: 2, ang: 3, cat: 4 };
    var MODES = LOGV ? [2, 1, 0] : [1, 0], ANS = LOGV ? 2 : 1;
    var R0 = 36, GAP = 0.8;   /* the dial is r 30 and the sun reaches r 34 */
    var svg = $('svgCanvas'), frame = $('draggableFrame'), qc = $('quizContainer');
    var cv = document.createElement('canvas').getContext('2d'), tmp = document.createElement('div');
    var kOf = D.map(function () { return 0; }), learned = D.map(function () { return false; });
    var cur = 0, filter = 'all', showAll = false, layerMode = 0, frameDeg = D[0][COL.ang], quizIdx = -1, closedIdx = -1;
    var noQuiz = function () { return de.classList.contains('no-quiz'); };
    function plain(s) { tmp.innerHTML = String(s == null ? '' : s); tmp.querySelectorAll('rt, rp').forEach(function (n) { n.parentNode.removeChild(n); }); return tmp.textContent; }
    function lab(key, dflt) { var v = LANG[key]; return (v && !/^[A-Z_]+$/.test(v)) ? v : dflt; }
    function word(i, k) { return D[i][MODES[k]]; }
    function cat(i) { return D[i][COL.cat]; }
    function sizeOf(i) { return (cat(i) === 'season' ? 6 : cat(i) === 'event' ? 4.5 : 3.5) * (window.tsScale ? window.tsScale(i) : 1); }
    function wOf(i, txt) { cv.font = '700 ' + sizeOf(i) + 'px ' + FONT; return cv.measureText(plain(txt)).width + 3; }
    function hOf(i) { return sizeOf(i) * 1.35; }

    /* ---- answers ---- */
    window.AnswerUtils = {
        normalize: function (text) {
            var t = String(text).toLowerCase();
            (LANG.diacritic_map || []).forEach(function (p) { t = t.split(p[0]).join(p[1]); });
            (LANG.digraph_map || []).forEach(function (p) { t = t.split(p[0]).join(p[1]); });
            if (LANG.collapse_double_vowels) t = t.replace(/aa/g, 'a').replace(/ee/g, 'e').replace(/ii/g, 'i').replace(/oo/g, 'o').replace(/uu/g, 'u');
            return t.replace(/[\s\-!?.,]/g, '').trim();
        },
        checkAnswer: function (input, correct) { return this.normalize(input) === this.normalize(correct); }
    };

    /* ---- placement: seasons first, then events, then cultural; each word starts at the dial edge and moves outward until it touches nothing ---- */
    function fixedRects() { var out = []; svg.querySelectorAll('.segment-label').forEach(function (t) { try { var b = t.getBBox(); if (b.width > 0) out.push({ x: b.x + b.width / 2, y: b.y + b.height / 2, w: b.width + 0.6, h: b.height + 0.6 }); } catch (e) {} }); return out; }
    var RANK = { season: 0, event: 1, cultural: 2 };
    function rectsFor(kFn) {
        var out = [], placed = fixedRects(), order = D.map(function (_, i) { return i; }).sort(function (a, b) { return (RANK[cat(a)] - RANK[cat(b)]) || (a - b); });
        order.forEach(function (i) {
            var w = wOf(i, word(i, kFn(i))), h = hOf(i), a = (D[i][COL.ang] - 90) * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
            /* try the word's own angle first, then slide it a few degrees either way and move it outward: take the free spot that costs least (distance out plus a little for the turn) */
            var base = R0 + (w / 2) * Math.abs(ux) + (h / 2) * Math.abs(uy), best = null, bc = 1e9;
            for (var da = 0; da <= 36; da += 3) [da, -da].forEach(function (dg, di) {
                if (da === 0 && di === 1) return;
                var aa = a + dg * Math.PI / 180, vx = Math.cos(aa), vy = Math.sin(aa), dmin = R0 + (w / 2) * Math.abs(vx) + (h / 2) * Math.abs(vy);
                for (var d = dmin; d < dmin + 40; d += 0.5) {
                    var c = (d - base) + 0.45 * da; if (c >= bc) break;
                    var r = { x: 50 + d * vx, y: 50 + d * vy, w: w, h: h };
                    if (!placed.some(function (p) { return Math.abs(p.x - r.x) < (p.w + w) / 2 + GAP && Math.abs(p.y - r.y) < (p.h + h) / 2 + GAP; })) { best = r; bc = c; break; }
                }
            });
            if (!best) best = { x: 50 + (base + 40) * ux, y: 50 + (base + 40) * uy, w: w, h: h };
            placed.push(best); out[i] = best;
        });
        return out;
    }
    function applyRect(i, r) { var fo = textBoxElements[i]; if (!fo) return; fo.setAttribute('x', r.x - r.w / 2); fo.setAttribute('y', r.y - r.h / 2); fo.setAttribute('width', r.w); fo.setAttribute('height', r.h); fo.style.overflow = 'visible'; }
    function curK(i) { var d = textBoxElements[i] && textBoxElements[i].querySelector('div'); return d ? parseInt(d.dataset.k || '0') : 0; }
    window.cmpPlaceAll = function () {
        if (!textBoxElements.length) return;
        var hx = 40, hy = 40;
        MODES.forEach(function (_, k) { rectsFor(function () { return k; }).forEach(function (r) { hx = Math.max(hx, Math.abs(r.x - 50) + r.w / 2 + 1.5); hy = Math.max(hy, Math.abs(r.y - 50) + r.h / 2 + 1.5); }); });
        svg.setAttribute('viewBox', (50 - hx) + ' ' + (50 - hy) + ' ' + (2 * hx) + ' ' + (2 * hy));
        rectsFor(curK).forEach(function (r, i) { applyRect(i, r); });
    };
    function placeOne(i) {
        var fo = textBoxElements[i]; if (!fo) return;
        var w = wOf(i, fo.querySelector('div').innerHTML), h = hOf(i);
        var cx = parseFloat(fo.getAttribute('x')) + parseFloat(fo.getAttribute('width')) / 2, cy = parseFloat(fo.getAttribute('y')) + parseFloat(fo.getAttribute('height')) / 2;
        var c = Math.hypot(cx - 50, cy - 50), ux = (cx - 50) / c, uy = (cy - 50) / c, dmin = R0 + (w / 2) * Math.abs(ux) + (h / 2) * Math.abs(uy);
        var d = Math.max(c, dmin);   /* same direction as now, never closer than the dial edge */
        applyRect(i, { x: 50 + d * ux, y: 50 + d * uy, w: w, h: h });
    }
    window.applyTierStyle = function (div, i) { div.style.fontSize = sizeOf(i) + 'px'; div.style.whiteSpace = 'nowrap'; };
    function setK(i, k) { var d = textBoxElements[i] && textBoxElements[i].querySelector('div'); if (!d) return; kOf[i] = k; d.dataset.k = k; d.innerHTML = word(i, k); window.applyTierStyle(d, i); placeOne(i); }
    window.__tdlSetK = function (i, k) { setK(i, k); };

    /* ---- what shows ---- */
    function inFilter(i) { var c = cat(i); return filter === 'all' || (filter === 'seasons' && c === 'season') || (filter === 'significant' && c !== 'season'); }
    var QUAD = [['q1', 330, 60], ['q2', 60, 150], ['q3', 150, 240], ['q4', 240, 330]];
    function highlight(deg) {
        var n = ((deg % 360) + 360) % 360, act = (n >= 330 || n < 60) ? 'q1' : n < 150 ? 'q2' : n < 240 ? 'q3' : 'q4';
        QUAD.forEach(function (q) { var s = $(q[0] + '-segment'); if (s) s.classList.toggle('segment-highlighted', q[0] === act); });
        ['q1-snowflake', 'q2-koru', 'q3-sun', 'q3-rays', 'q4-leaf'].forEach(function (id) { var e = $(id); if (e) e.setAttribute('opacity', '0'); });
        ({ q1: ['q1-snowflake'], q2: ['q2-koru'], q3: ['q3-sun', 'q3-rays'], q4: ['q4-leaf'] })[act].forEach(function (id) { $(id).setAttribute('opacity', '1'); });
    }
    function refresh() {
        textBoxElements.forEach(function (tb, i) {
            var vis = inFilter(i) && (showAll || i === cur || learned[i]);
            tb.classList.toggle('active', vis && i === cur); tb.classList.toggle('learned', !!learned[i]);
            tb.style.display = vis ? 'block' : 'none';
            tb.style.opacity = !vis ? '0' : (i === cur ? '1' : showAll ? '0.9' : '0.5');
        });
        highlight(frameDeg);
    }
    window.updateVisibleTextBoxes = refresh;
    function setFrame(deg) { var a = (deg - 90) * Math.PI / 180; frame.setAttribute('cx', 50 + 30 * Math.cos(a)); frame.setAttribute('cy', 50 + 30 * Math.sin(a)); }
    function closest(deg) {
        var best = -1, md = 361; D.forEach(function (it, i) { if (!inFilter(i)) return; var d = Math.abs(deg - it[COL.ang]); if (d > 180) d = 360 - d; if (d < md) { md = d; best = i; } });
        return best < 0 ? cur : best;
    }
    function goTo(i) { cur = i; frameDeg = D[i][COL.ang]; setFrame(frameDeg); refresh(); }

    /* ---- the words ---- */
    function build() {
        document.querySelectorAll('.textBox').forEach(function (b) { if (b.parentNode) b.parentNode.removeChild(b); });
        textBoxElements = [];
        D.forEach(function (item, i) {
            var fo = document.createElementNS(SVGNS, 'foreignObject');
            fo.setAttribute('class', 'textBox'); fo.setAttribute('data-index', i);
            fo.setAttribute('x', 0); fo.setAttribute('y', 0); fo.setAttribute('width', 16); fo.setAttribute('height', 8); fo.style.overflow = 'visible'; fo.style.pointerEvents = 'auto';
            var div = document.createElement('div');
            div.style.cssText = 'display:flex;align-items:center;justify-content:center;width:100%;height:100%;box-sizing:border-box;text-align:center;font-family:Arial,sans-serif;color:black;cursor:pointer;white-space:nowrap;font-weight:bold';
            div.dataset.k = kOf[i]; div.innerHTML = word(i, kOf[i]); window.applyTierStyle(div, i);
            fo.appendChild(div);
            fo.addEventListener('click', function (e) {
                e.stopPropagation();
                var k = kOf[i] + 1;
                if (qc.style.display === 'block' && quizIdx === i) return;
                if (k >= MODES.length) {
                    if (!noQuiz() && !learned[i]) { showQuiz(i); return; }   /* the Quiz is hidden on touch phones: the cycle just starts again */
                    k = 0;
                }
                setK(i, k);
                if (window.__cmpSpeak) window.__cmpSpeak(i, true);
            });
            svg.insertBefore(fo, frame); textBoxElements.push(fo);
        });
        svg.appendChild(frame);
        window.cmpPlaceAll(); refresh();
    }

    /* ---- grab the sun anywhere on the face of the dial ---- */
    var dragging = false;
    function ptr(e) { var t = e.touches && e.touches[0]; return { x: t ? t.clientX : e.clientX, y: t ? t.clientY : e.clientY }; }
    function svgPt(p) { var pt = svg.createSVGPoint(); pt.x = p.x; pt.y = p.y; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
    function move(e) {
        if (!dragging) return;
        var p = svgPt(ptr(e)), deg = (Math.atan2(p.y - 50, p.x - 50) * 180 / Math.PI + 90 + 360) % 360;
        frameDeg = deg; setFrame(deg);
        var idx = closest(deg); if (idx !== cur) { cur = idx; refresh(); } else highlight(deg);
        if (e.cancelable) e.preventDefault();
    }
    function down(e) {
        if (e.target.closest && e.target.closest('.textBox')) return;
        var p = svgPt(ptr(e)); if (e.target !== frame && Math.hypot(p.x - 50, p.y - 50) > 37) return;
        dragging = true; frame.classList.add('dragging'); move(e); if (e.cancelable) e.preventDefault();
    }
    function up() { if (!dragging) return; dragging = false; frame.classList.remove('dragging'); if (window.__cmpSpeak && !showAll) window.__cmpSpeak(cur); }
    svg.addEventListener('mousedown', down); svg.addEventListener('touchstart', down, { passive: false });
    document.addEventListener('mousemove', move); document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('mouseup', up); document.addEventListener('touchend', up); document.addEventListener('touchcancel', up);

    /* ---- buttons ---- */
    var layerBtn = $('display-mode-toggle'), allBtn = $('show-all-toggle'), filterBtn = $('filter-btn');
    function layerLabel() { var c = MODES[layerMode]; return c === COL.tlr ? lab('show_tlr_label', 'Show: TLR') : c === COL.tl ? lab('show_tl_label', 'Show: TL') : lab('show_sl_label', 'Show: SL'); }
    function allLabel() { return showAll ? lab('hide_all_label', 'Hide All') : lab('show_all_label', 'Show All'); }
    var FILT = ['all', 'seasons', 'significant'];
    function filterLabel() { return filter === 'all' ? lab('filter_all_label', 'All') : filter === 'seasons' ? lab('filter_seasons_label', '4 Seasons') : lab('filter_significant_label', 'Significant Times'); }
    function setLayer(m) {
        layerMode = m; layerBtn.textContent = layerLabel();
        textBoxElements.forEach(function (tb, i) { var d = tb.querySelector('div'); kOf[i] = m; d.dataset.k = m; d.innerHTML = word(i, m); window.applyTierStyle(d, i); });
        window.cmpPlaceAll();
    }
    layerBtn.textContent = layerLabel(); allBtn.textContent = allLabel(); filterBtn.textContent = filterLabel();
    layerBtn.addEventListener('click', function () { setLayer((layerMode + 1) % MODES.length); });
    allBtn.addEventListener('click', function () { showAll = !showAll; allBtn.textContent = allLabel(); if (window.__cmpReset) window.__cmpReset(); refresh(); });
    filterBtn.addEventListener('click', function () {
        filter = FILT[(FILT.indexOf(filter) + 1) % FILT.length]; filterBtn.textContent = filterLabel();
        if (window.__cmpReset) window.__cmpReset();
        if (!inFilter(cur)) goTo(closest(frameDeg)); else refresh();
    });
    $('toggle-learned-left').addEventListener('click', function () { toggleArr('left'); });
    $('toggle-learned-right').addEventListener('click', function () { toggleArr('right'); });
    function toggleArr(side) {
        var c = $('learned-items-' + side), b = $('toggle-learned-' + side), spans = c.querySelectorAll('.vocabulary-item span'), vis = 0;
        spans.forEach(function (s) { if (!s.classList.contains('hidden')) vis++; });
        var most = vis > spans.length / 2; spans.forEach(function (s) { s.classList.toggle('hidden', most); });
        b.textContent = most ? lab('show_all_label', 'Show All') : lab('hide_all_label', 'Hide All');
    }

    /* ---- title and instructions ---- */
    var titleBox = $('title-box'), ti = 0; titleBox.innerHTML = LANG.titles[0];
    titleBox.addEventListener('click', function () { ti = (ti + 1) % LANG.titles.length; titleBox.innerHTML = LANG.titles[ti]; });
    var di = $('drag-instruction'); di.innerHTML = LANG.drag_instruction;
    setTimeout(function () { di.classList.add('fade'); setTimeout(function () { di.style.display = 'none'; }, 3000); }, 15000);
    ['array-title-left', 'array-title-right'].forEach(function (id) { $(id).textContent = LANG.array_title; });
    $('sub-left').textContent = LANG.seasons_section_title; $('sub-right').textContent = LANG.significant_section_title;
    $('toggle-learned-left').textContent = lab('hide_all_label', 'Hide All'); $('toggle-learned-right').textContent = lab('hide_all_label', 'Hide All');
    $('quizInput').placeholder = LANG.quiz_placeholder; $('quizCheck').textContent = LANG.quiz_button;
    if (LOGV && $('quizDiacriticNote')) $('quizDiacriticNote').textContent = LANG.diacritic_instructions;
    var rb = $('reset-btn'); if (LANG.reset_label && !/^[A-Z_]+$/.test(LANG.reset_label)) rb.textContent = LANG.reset_label;

    /* ---- the Learned panels (4 Seasons on the left, Significant Times on the right) ---- */
    var arrL = $('learned-vocabulary-left'), arrR = $('learned-vocabulary-right');
    document.body.appendChild(arrL); document.body.appendChild(arrR);   /* a fixed-position panel must not sit inside the page frame */
    function syncPanels() { [['left', arrL], ['right', arrR]].forEach(function (p) { p[1].classList.toggle('has-items', $('learned-items-' + p[0]).children.length > 0); }); }
    function addToArray(i) {
        var target = $('learned-items-' + (cat(i) === 'season' ? 'left' : 'right')), item = document.createElement('div'); item.className = 'vocabulary-item';
        var tl = document.createElement('span'); tl.className = 'tl-word'; tl.innerHTML = D[i][COL.tl];
        var sl = document.createElement('span'); sl.className = 'sl-word'; sl.textContent = D[i][COL.sl];
        [tl, sl].forEach(function (s) { s.addEventListener('click', function (e) { e.stopPropagation(); this.classList.toggle('hidden'); }); });
        item.appendChild(tl); item.appendChild(sl); target.appendChild(item); syncPanels(); placeArray(); setTimeout(showArrayTip, 80);
    }

    /* ---- the Quiz ---- */
    function showQuiz(i) {
        if (noQuiz()) return;
        if (quizIdx >= 0 && quizIdx !== i && !learned[quizIdx]) setK(quizIdx, 0);
        quizIdx = i;
        $('quizInput').placeholder = D[i][COL.q]; $('quizInput').value = ''; $('quizFeedback').textContent = '';
        qc.style.display = 'block'; qc.style.visibility = 'visible'; qc.style.opacity = '1'; qc.style.zIndex = '9999';
        setTimeout(function () { try { $('quizInput').focus(); } catch (e) {} }, 100);
    }
    function checkQuiz() {
        if (quizIdx < 0) return;
        var input = $('quizInput').value.trim(), correct = D[quizIdx][ANS], fb = $('quizFeedback'), qi = quizIdx;
        if (AnswerUtils.checkAnswer(input, plain(correct))) {
            fb.textContent = LANG.quiz_correct; fb.style.color = 'green'; learned[qi] = true;
            setK(qi, 0); addToArray(qi); refresh(); closedIdx = qi;
            setTimeout(function () { if (quizIdx === closedIdx) { qc.style.display = 'none'; quizIdx = -1; } }, 1500);
        } else { fb.textContent = LANG.quiz_wrong; fb.style.color = 'red'; }

                setTimeout(function () { if (!started && window.__auUtt === u) { try { speechSynthesis.cancel(); } catch (e) {} } }, 2500);   // stuck phone queue: clear it so the next tap works
            };
            if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 120); } else go();
        }
        function viaCloud(text, code, done) {
            fetch(AUDIO_API_URL + '?text=' + encodeURIComponent(text) + '&lang=' + encodeURIComponent(code))
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
                .then(function (b) { playUrl(URL.createObjectURL(b), done); })
                .catch(function () { note('The audio service could not be reached.'); });
        }
        function speak1(text, code, done) {
            var files = window.CONCEPTIONARY_AUDIO_FILES;
            if (files && files[text] && (!code || code === tlCode())) { playUrl(files[text], done); return; }   /* target-language recordings */
            var sf = window.CONCEPTIONARY_AUDIO_SL_FILES; if (sf && sf[text] && code && code === slCode() && code !== tlCode()) { playUrl(sf[text], done); return; }   /* source-language recordings (optional) */
            if (AUDIO_API_URL && code) viaCloud(text, code, done); else viaBrowser(text, code, done);
        }
        var lastItem = '';
        function speakItem(item) {
            if (st.mode === 2 || !item) return;
            var key = item.id + '|' + st.mode, now = Date.now();
            if (key === st.last && now - st.lastT < 1200) return;   // one phrase, one sound
            st.last = key; st.lastT = now;
            var items = [[item.tl, tlCode()]];                      // the target-language word (the script in the LOG file; never the romanised line)
            if (st.mode === 0) items.push([item.sl, slCode()]);     // then the source-language word
            st.seq++; var my = st.seq, i = 0;
            try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
            (function next() { if (my !== st.seq || i >= items.length) return; var it = items[i++]; if (!it[0]) { next(); return; } speak1(it[0], it[1], function () { setTimeout(next, 150); }); })();
        }
        window.__cmpSpeak = function (i, force) { var d = LANG.seasonsData[i]; if (!d) return; if (force) st.last = ''; speakItem({ id: i, tl: String(d[1]).replace(/<rt>[^<]*<\/rt>/g, '').replace(/<[^>]*>/g, ''), sl: d[0] }); };   // the TLR (romanised) line is never spoken

        cyc.addEventListener('click', function (e) {
            e.stopPropagation();
            st.mode = (st.mode + 1) % 3; label(); if (st.mode === 2) stop();
            if (window.speechSynthesis) speechSynthesis.getVoices();
            note(describe());
        });
        vol.addEventListener('input', function () { st.vol = vol.value / 100; if (st.cur) st.cur.volume = st.vol; vol.style.setProperty('--p', vol.value + '%'); });
        vol.addEventListener('click', function (e) { e.stopPropagation(); });
        window.addEventListener('load', label); label(); vol.style.setProperty('--p', vol.value + '%');
        window.__auCycle = { get mode() { return st.mode; }, label: label };

        /* Full Screen (hidden where the browser cannot do it, e.g. iPhone Safari) */
        var de = document.documentElement, fb = document.getElementById('fsBtn');
        var req = de.requestFullscreen || de.webkitRequestFullscreen;
        if (!req) { if (fb) fb.style.display = 'none'; }
        else {
            window.toggleFullScreen = function () {
                var on = document.fullscreenElement || document.webkitFullscreenElement;
                var fail = function () { if (!fb) return; fb.textContent = 'Not allowed here'; setTimeout(sync, 2500); };
                if (!on) { try { var p = req.call(de); if (p && p.catch) p.catch(fail); } catch (e) { fail(); } }
                else { var ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); }
            };
            var sync = function () { if (fb) fb.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit Full Screen' : 'Full Screen'; };
            document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
        }
    })();
