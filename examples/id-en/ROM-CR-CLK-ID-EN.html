    <title>Clock — Bahasa Indonesia — Model</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .left-panel, .right-panel {
            width: 25%;
            background-color: white;
            border: 2px solid #333;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .left-panel {
            border-right: none;
        }

        .right-panel {
            border-left: none;
        }

        .center-area {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            border: 2px solid #333;
            border-left: none;
            border-right: none;
        }

        .digital-display {
            font-size: 2em;
            font-weight: bold;
            background-color: #000;
            color: #00ff00;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .clock {
            width: 300px;
            height: 300px;
            border: 8px solid #333;
            border-radius: 50%;
            position: relative;
            background-color: white;
        }

        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            background-color: #333;
            transform-origin: bottom center;
            border-radius: 2px;
        }

        .hour-hand {
            width: 6px;
            height: 80px;
            top: 70px;
            left: 147px;
        }

        .minute-hand {
            width: 4px;
            height: 110px;
            top: 40px;
            left: 148px;
        }

        .second-hand {
            width: 2px;
            height: 120px;
            top: 30px;
            left: 149px;
            background-color: red;
        }

        .number {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dynamic-text-box {
            background-color: #f9f9f9;
            border: 2px solid #4CAF50;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .dynamic-text-box:hover {
            background-color: #e8f5e8;
            transform: scale(1.02);
        }

        .greeting-box {
            border-color: #FF9800;
            background-color: #fff3e0;
        }

        .approximate-box {
            border-color: #2196F3;
            background-color: #e3f2fd;
        }

        .exact-box {
            border-color: #4CAF50;
            background-color: #e8f5e8;
        }

        .part-of-day-box {
            border-color: #9C27B0;
            background-color: #f3e5f5;
        }

        .empty-box {
            border-color: #ccc;
            background-color: #f5f5f5;
            color: #999;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .controls button {
            padding: 8px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .controls button:hover {
            background-color: #45a049;
        }

        .question-text {
            background-color: #2196F3;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .tooltip {
            position: fixed;
            background-color: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tooltip.show {
            opacity: 1;
            visibility: visible;
        }

        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(40, 167, 69, 0.4);
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }
    </style>
    <style>
    /* 2026-11-04 responsive clock: the face is always a true circle (--clk), and the hands, numerals and layout are all measured from its centre,
       so nothing drifts or squashes on phones (portrait or landscape) or in short embeds */
    :root { --clk: clamp(120px, min(300px, 100vh - 190px, 46vw), 300px); }
    html { -webkit-text-size-adjust: 100%; }
    .left-panel, .right-panel, .center-area { min-width: 0; }
    .dynamic-text-box, .question-text { overflow-wrap: anywhere; }
    .clock { width: var(--clk); height: var(--clk); box-sizing: border-box; flex: none; aspect-ratio: 1 / 1; border-width: calc(var(--clk) * 0.027); }
    .hand { top: auto; bottom: 50%; left: 50%; transform-origin: 50% 100%; }
    .hour-hand   { width: calc(var(--clk) * 0.02);  height: 27%; margin-left: calc(var(--clk) * -0.01);  top: auto; left: 50%; }
    .minute-hand { width: calc(var(--clk) * 0.014); height: 37%; margin-left: calc(var(--clk) * -0.007); top: auto; left: 50%; }
    .second-hand { width: calc(var(--clk) * 0.007); height: 40%; margin-left: calc(var(--clk) * -0.0035); top: auto; left: 50%; }
    .clock-center { width: calc(var(--clk) * 0.04); height: calc(var(--clk) * 0.04); }
    .number { transform: translate(-50%, -50%); width: 2em; height: 2em; font-size: clamp(10px, calc(var(--clk) * 0.06), 18px); }
    .controls { flex-wrap: wrap; }
    .center-area { padding-bottom: 18px; box-sizing: border-box; }
    /* phone held upright: the two language panels sit above and below the clock, each as a 2 x 2 grid */
    @media (max-width: 700px) and (orientation: portrait) {
      :root { --clk: min(300px, 78vw, 100vh - 330px); }
      body { flex-direction: column; overflow-y: auto; height: auto; min-height: 100vh; }
      .left-panel, .right-panel { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; border: 2px solid #333; }
      .left-panel .question-text, .right-panel .question-text { grid-column: 1 / -1; margin-bottom: 0; padding: 8px; font-size: 14px; }
      .dynamic-text-box { padding: 8px; font-size: 14px; min-height: 44px; }
      .center-area { width: 100%; order: 0; padding: 10px 0 22px; border: 2px solid #333; border-left: 2px solid #333; border-right: 2px solid #333; }
      .left-panel { order: -1; } .right-panel { order: 1; }
      .digital-display { font-size: 1.5em; padding: 6px 14px; margin-bottom: 10px; }
      .controls { margin-top: 12px !important; }
      .watermark { position: static; padding: 6px 0 10px; width: 100%; }
    }
    /* phone held sideways, or a short embed: three columns, everything compact so the whole clock is visible */
    @media (max-height: 520px) and (orientation: landscape) {
      :root { --clk: clamp(100px, min(100vh - 96px, 40vw), 300px); }
      .left-panel, .right-panel { padding: 6px; gap: 6px; overflow-y: auto; justify-content: flex-start; }
      .question-text { padding: 5px; font-size: 12px; margin-bottom: 0; }
      .dynamic-text-box { padding: 5px; font-size: 12px; min-height: 0; border-radius: 6px; }
      .digital-display { font-size: 1.1em; padding: 3px 10px; margin-bottom: 6px; }
      .controls { margin-top: 6px !important; gap: 4px; }
      .controls button { padding: 4px 7px; font-size: 11px; }
      .center-area { padding-bottom: 14px; }
      .watermark { font-size: 9px; bottom: 2px; }
    }
    </style>
    <style>
    /* 2026-11-04 Audio and Print on the Clock */
    .audio-wrap { position: relative; display: flex; flex-direction: column; align-items: stretch; width: 104px; box-sizing: border-box; background-color: #4CAF50; color: #fff; border-radius: 4px; padding: 3px 6px 2px; }
    .audio-wrap:hover { background-color: #45a049; }
    .audio-wrap #auCycle { background: transparent; border: 0; color: inherit; font: inherit; font-size: 14px; padding: 4px 0 1px; margin: 0; cursor: pointer; white-space: nowrap; text-align: center; -webkit-tap-highlight-color: transparent; }
    .controls .audio-wrap #auCycle:hover { background: transparent; }
    .audio-wrap #auVol2 { width: 100%; height: 14px; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: none; cursor: pointer; --p: 80%; }
    .audio-wrap #auVol2::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(to right, #007FFF 0, #007FFF var(--p), #B0E0E6 var(--p), #B0E0E6 100%); }
    .audio-wrap #auVol2::-moz-range-track { height: 5px; border-radius: 3px; background: #B0E0E6; }
    .audio-wrap #auVol2::-moz-range-progress { height: 5px; border-radius: 3px; background: #007FFF; }
    .audio-wrap #auVol2::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8fbff 0%, #2fd0e8 38%, #7fb8f0 68%, #ff9cc8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .audio-wrap #auVol2::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8fbff 0%, #2fd0e8 38%, #7fb8f0 68%, #ff9cc8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
    @media (pointer: coarse) { .audio-wrap { width: 112px; } .audio-wrap #auVol2 { height: 20px; } .audio-wrap #auVol2::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6.5px; } .audio-wrap #auVol2::-moz-range-thumb { width: 18px; height: 18px; } }
    @media (max-height: 520px) and (orientation: landscape) { .audio-wrap { width: 86px; padding: 1px 5px 0; } .audio-wrap #auCycle { font-size: 11px; padding: 2px 0 0; } .audio-wrap #auVol2 { height: 13px; } }
    #auToast { position: fixed; z-index: 1100; background: rgba(40,40,40,.92); color: #fff; font: 14px Arial, sans-serif; padding: 7px 12px; border-radius: 8px; max-width: min(92vw, 360px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
    /* Print: the clock and both language panels on one A4 landscape page, without the buttons */
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { height: auto !important; overflow: visible !important; }
      body { display: flex !important; flex-direction: row !important; width: 100% !important; height: 188mm !important; min-height: 0 !important; background: #fff; }
      :root { --clk: 300px; }
      .left-panel, .right-panel { width: 25% !important; display: flex !important; flex-direction: column !important; overflow: visible !important; padding: 12px !important; }
      .center-area { width: 50% !important; }
      .controls, .tooltip, #auToast { display: none !important; }
      .watermark { position: fixed; bottom: 0; }
    }
    </style>

<script>
    /* Language codes for the Audio button (the App normally sets these). The clock makes a new sentence every minute, so the voice is the device's own Indonesian voice. */

    <!-- Left Panel - Source Language (SL) -->
    <div class="left-panel">
        <div class="question-text" id="sl-question">What time is it?</div>

        <div class="dynamic-text-box approximate-box" id="approximate-sl" data-tooltip="About what time is it?"></div>
        <div class="dynamic-text-box exact-box"        id="exact-sl"       data-tooltip="What is the exact time?"></div>
        <div class="dynamic-text-box part-of-day-box" id="part-of-day-sl" data-tooltip="What part of the day is it?"></div>
    </div>

    <!-- Center Area - Clock -->
    <div class="center-area">
        <div class="digital-display" id="digital-time">12:00:00</div>
        <div class="clock" id="clock">
            <div class="clock-center"></div>
            <div class="hand hour-hand"   id="hour-hand"></div>
            <div class="hand minute-hand" id="minute-hand"></div>
            <div class="hand second-hand" id="second-hand"></div>
        </div>
        <div class="controls" style="margin-top: 20px;">
            <button onclick="adjustHour(-1)">Hour −</button>
            <button onclick="adjustHour(1)">Hour +</button>
            <button onclick="adjustMinute(-1)">Min −</button>
            <button onclick="adjustMinute(1)">Min +</button>
            <button onclick="resetToCurrentTime()">Reset</button>
            <button id="printBtn" type="button" onclick="window.print()" title="Print this page on one A4 landscape sheet">Print</button>
            <button id="fsBtn" type="button" onclick="toggleFullScreen()">Full Screen</button>
        </div>
    </div>

    <!-- Right Panel - Target Language (TL) -->
    <div class="right-panel">
        <div class="question-text" id="tl-question">Jam berapa sekarang?</div>
        <div class="dynamic-text-box greeting-box"    id="greeting-tl"    data-tooltip="Bagaimana saya menyapa seseorang?"></div>
        <div class="dynamic-text-box approximate-box" id="approximate-tl" data-tooltip="Kira-kira jam berapa sekarang?"></div>
        <div class="dynamic-text-box exact-box"        id="exact-tl"       data-tooltip="Tepatnya jam berapa sekarang?"></div>
        <div class="dynamic-text-box part-of-day-box" id="part-of-day-tl" data-tooltip="Sekarang bagian hari apa?"></div>

            sl_exactTime: function(hours, minutes, hourWords) {

                if (minutes === 0) {

      for (var si = 0; si < shares.length; si++) { g = build(shares[si]); if (!g.hit) break; }   /* a smaller circle only when the words would sit on it */
      var vx = g.vx, vy = g.vy, vw = g.vw, vh = g.vh, bs = g.bs;

  }

    var pend = 0; function soon() { cancelAnimationFrame(pend); pend = requestAnimationFrame(fit); }
    new MutationObserver(function () { if (!busy) soon(); }).observe(svg, { attributes: true, attributeFilter: ['viewBox'], subtree: false });
    new MutationObserver(function () { if (!busy) soon(); }).observe(svg, { attributes: true, attributeFilter: ['x', 'y', 'width', 'height', 'style'], subtree: true });
    window.addEventListener('resize', soon); window.addEventListener('orientationchange', soon);
    if (phone.addEventListener) phone.addEventListener('change', function () { if (!phone.matches && window.cmpPlaceAll) window.cmpPlaceAll(); soon(); });

  }

  /* 3. PROGRESS, FIRST-USE HINT, CELEBRATION --------------------------------------------------------------------------------------- */
  var page = document.querySelector('.a4-page') || (CFG.progHost && document.querySelector(CFG.progHost)), prog = document.createElement('div'), partyEl = document.createElement('div'), hintEl = document.createElement('div');
  prog.id = 'kitProgress'; if (CFG.progHost) prog.className = 'kit-day'; partyEl.id = 'kitParty'; hintEl.id = 'kitHint';
  if (page) page.appendChild(prog); document.body.appendChild(partyEl); document.body.appendChild(hintEl);
  function total() { try { if (window.__kitCount) return window.__kitCount()[1]; return CFG.total ? CFG.total() : tbe().length; } catch (e) { return 0; } }
  function learnedN() { if (window.__kitCount) { try { return window.__kitCount()[0]; } catch (e) { return 0; } } return tbe().filter(function (fo) { return fo && fo.classList.contains('learned'); }).length; }   /* counted on the words of the mode now showing */

  function paint(first) {

  if (svg) new MutationObserver(repaint).observe(svg, { attributes: true, attributeFilter: ['class'], childList: true, subtree: true });
  var tdp = document.getElementById('transDisplay'); if (tdp) new MutationObserver(repaint).observe(tdp, { childList: true, characterData: true, subtree: true });   /* two-mode templates (Rice): transition words show here */
  paint(true); window.addEventListener('load', function () { setTimeout(function () { lastTot = total(); paint(true); }, 300); setTimeout(function () { lastTot = total(); paint(true); }, 1200); });
  var seen = false; try { seen = localStorage.getItem('conceptionary-hint-v1') === '1'; } catch (e) {}
  if (!seen) {
    var touch = window.matchMedia('(pointer: coarse)').matches;
    hintEl.textContent = lab('first_hint', touch ? (CFG.hintTouch || 'Drag the sun. Tap a word to see it in the other language. Pinch with two fingers to zoom.' ): (CFG.hint || 'Drag the sun. Click a word to see it in the other language.'));
    setTimeout(function () { hintEl.classList.add('on'); }, 1200);
    var gone = false, hide = function () { if (gone) return; gone = true; hintEl.classList.remove('on'); try { localStorage.setItem('conceptionary-hint-v1', '1'); } catch (e) {} };
    setTimeout(hide, 11000);
    ['pointerdown', 'keydown'].forEach(function (t) { document.addEventListener(t, function () { setTimeout(hide, 1500); }, { once: true, capture: true }); });
  }

  /* 4. ANSWERS: alternatives (LANG.alt_answers = { "Autumn": ["Fall"] }) and "almost" feedback ------------------------------------- */
  function norm(t) { return String(t == null ? '' : t).toLowerCase().replace(/<[^>]*>/g, '').replace(/[\s\-!?.,;:'"’‘“”()]/g, ''); }
  window.__kitAlt = function (input, correct) {
    var LG = (typeof LANG !== 'undefined') ? LANG : window.LANG, alts = (LG && LG.alt_answers && LG.alt_answers[String(correct).replace(/<[^>]*>/g, '')]) || [];   /* LANG is a const in the templates, so it is not on window */
    var n = norm(input); return alts.some(function (a) { return norm(a) === n; });
  };
  window.__kitNear = function (input, correct) {
    var a = norm(input), b = norm(correct); if (!a || !b || a === b) return '';
    var n = Math.min(a.length, b.length), i = 0; while (i < n && a[i] === b[i]) i++;
    if (Math.abs(a.length - b.length) <= 1 && (function () { var d = 0, k; if (a.length === b.length) { for (k = 0; k < a.length; k++) if (a[k] !== b[k]) d++; return d <= 1; } var s = a.length < b.length ? a : b, l = a.length < b.length ? b : a; for (k = 0; k < l.length; k++) { if (l.slice(0, k) + l.slice(k + 1) === s) return true; } return false; })())
      return lab('quiz_close', 'Almost! Check letter') + ' ' + (i + 1);
    return '';
  };
  if (typeof AnswerUtils !== 'undefined' && AnswerUtils.checkAnswer) {
    var oc = AnswerUtils.checkAnswer;
    AnswerUtils.checkAnswer = function (input, correct) { var ok = oc.call(AnswerUtils, input, correct) || window.__kitAlt(input, correct); window.__kitLast = { input: input, correct: correct, ok: ok }; return ok; };
  }
  var fb = document.getElementById('quizFeedback');
  if (fb) new MutationObserver(function () {
    var L = window.__kitLast; if (!L || L.ok || fb.dataset.kit === '1' || fb.style.color !== 'red') return;
    var near = window.__kitNear(L.input, L.correct); if (!near) return;
    fb.dataset.kit = '1'; fb.textContent = fb.textContent.replace(/\s*[—-]\s*.*$/, '') + ' — ' + near; setTimeout(function () { fb.dataset.kit = ''; }, 50);
  }).observe(fb, { childList: true, characterData: true, subtree: true });

  /* 5. THE QUIZ BOX: phone flag, drag anywhere (also by the answer box), stay above the on-screen keyboard ------------------------- */
  var QMQ = window.matchMedia('(pointer: coarse) and (max-width: 700px), (pointer: coarse) and (max-height: 520px) and (orientation: landscape)');
  function syncPhone() { de.classList.toggle('kit-phone', QMQ.matches); if (!CFG.keepNoQuiz) de.classList.remove('no-quiz'); }
  syncPhone(); if (QMQ.addEventListener) QMQ.addEventListener('change', syncPhone);
  var qc = document.querySelector('.quiz-container'), vv = window.visualViewport;
  if (qc) {
    /* on a phone the box opens at the TOP of the circle area, where the on-screen keyboard can never cover it */
    function placeTop() {
      if (!de.classList.contains('kit-phone') || qc.classList.contains('kit-moved')) return;
      var t = 4;   /* the very top: it covers the buttons for a moment, never the circle or the word you tapped */
      de.style.setProperty('--kit-qtop', Math.max(4, Math.round(t)) + 'px');
    }
    var wasOpen = false;
    new MutationObserver(function () { var open = qc.style.display === 'block'; if (open === wasOpen) return; wasOpen = open; de.classList.toggle('kit-quiz-open', open); if (open) { placeTop(); keepSoon(); } }).observe(qc, { attributes: true, attributeFilter: ['style'] });
    var st = null, swallow = false;
    qc.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.stopImmediatePropagation();                                  /* this drag replaces the older one that skipped the answer box */
      var r = qc.getBoundingClientRect(); st = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, x0: e.clientX, y0: e.clientY, drag: false, w: r.width };
    }, true);
    document.addEventListener('pointermove', function (e) {
      if (!st || e.pointerId !== st.id) return;
      if (!st.drag) {
        if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 7) return;
        st.drag = true; qc.classList.add('kit-moved'); qc.dataset.moved = '1'; qc.style.translate = '0px 0px';
        var w = de.classList.contains('kit-phone') ? Math.min(st.w, 380, window.innerWidth * 0.94) : st.w; st.dx = Math.min(st.dx, w - 20);
        if (de.classList.contains('kit-phone')) qc.style.setProperty('width', w + 'px', 'important');
        if (document.activeElement && document.activeElement.blur && qc.contains(document.activeElement)) document.activeElement.blur();
      }
      var w2 = qc.offsetWidth, h2 = qc.offsetHeight;

  }

  /* 6. FULL SCREEN ZOOM: Chrome switches its own pinch zoom off in full screen, so two fingers zoom and pan the circle here --------- */

    if (!svg) return;

  /* 7. RESET BUTTON for Days of the Week (the Seasons files already have one): back to the opening view, all learned words cleared -- */
  (function () {

  })();
})();
