/* ===== CONCEPTIONARY STYLE SHEET v0.1 (trial on the Compass, 2026-11-06) =====
   One block of design tokens plus the rules that use them. It sits AFTER the template's own CSS and only changes looks, never behaviour.
   Colour: ink / muted / surface / line, ONE primary (controls), ONE accent (the active word and highlight). Every text pair is 4.5:1 or better.
   Type: one system font stack (set by script into --cx-font so the word measuring uses the same font), weights 600 and 700 only.
   Spacing scale 4 / 8 / 12 / 16 / 24 px. Radius 10 (controls) and 16 (page card). Motion 150-250 ms, switched off by prefers-reduced-motion.
   NOTE: inside an SVG foreignObject one CSS px is one SVG unit, so borders, radii and shadows on words are written in tiny values. */
:root {
  --cx-ink: #1f2937; --cx-muted: #4b5565; --cx-faint: #6b7280;
  --cx-surface: #ffffff; --cx-bg: #eef1f7; --cx-line: #d3d9e6;
  --cx-primary: #2a56c6; --cx-primary-dark: #1f428f; --cx-on-primary: #ffffff;
  --cx-accent: #f2b01e; --cx-accent-soft: #fff4cf;
  --cx-btn-bg: #e4ecf8; --cx-btn-bg-hover: #d3e0f5; --cx-btn-bg-on: #bcd0f0; --cx-btn-ink: #1d3b80; --cx-btn-line: #bccbe8;
  --cx-disc-a: #fffdf6; --cx-disc-b: #efe8d4; --cx-disc-line: #d9cfb4;
  --cx-s1: 4px; --cx-s2: 8px; --cx-s3: 12px; --cx-s4: 16px; --cx-s5: 24px;
  --cx-r-ctl: 10px; --cx-r-card: 16px;
  --cx-shadow-sm: 0 1px 2px rgba(20,30,60,.12); --cx-shadow-md: 0 4px 14px rgba(20,30,60,.16);
  --cx-font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --cx-t: 180ms ease;
}
html[data-scheme="night"] {
  --cx-ink: #e6ebf7; --cx-muted: #b4bfd8; --cx-faint: #8f9cb8;
  --cx-surface: #172036; --cx-bg: #0d1424; --cx-line: #2e3a58;
  --cx-primary: #3d63c9; --cx-primary-dark: #2f4fa6; --cx-accent: #f2b01e; --cx-accent-soft: #3a3320;
  --cx-btn-bg: #24304e; --cx-btn-bg-hover: #2e3c60; --cx-btn-bg-on: #3a4a74; --cx-btn-ink: #d6e0fa; --cx-btn-line: #3b4a70;

    <script>
    // =====================================================================
    // LANGUAGE CONFIGURATION BLOCK
    // To create a new language pair, replace ALL values in this section.
    // SL = Source Language  |  TL = Target Language (language being learned)
    //
    // This template is designed for any climate with two broad annual
    // seasons spanning roughly 180 degrees each - most commonly a Dry Season
    // and a Wet Season (e.g. tropical monsoon climates). The right-hand
    // half of the dial (0-180 degrees) is "Season A" and the left-hand half
    // (180-360 degrees) is "Season B"; name them with the segment labels below.
    // PHONOGRAPHIC (ROM) VARIANT: layers TL (default) > SL > Quiz. The Quiz asks for the TL.
    //
    // Do NOT change anything outside this block.
    // =====================================================================
    const LANG = {

        // --- Title cycle (click the title box to change language) ---------
        titles: [
            "Tropical Seasons",
            "Musim Tropis",
            "Tropical Seasons / Musim Tropis"
        ],

        // --- UI strings --------------------------------------------------
        show_tl_label:    "Show: Indonesian",     // e.g. "Show: TL"
        show_sl_label:    "Show: English",     // e.g. "Show: SL"
        reset_label:      "Reset",       // e.g. "Reset"
        move_hint:        "You can move this",         // e.g. "You can move this" (shown for 5 seconds each time the Quiz opens)
        drag_instruction: "Drag the sun around to explore the seasons!",  // e.g. "Drag the sun around to explore the seasons!"
        array_title:      "Learned Vocabulary",       // e.g. "Learned Vocabulary"
        hide_all_label:   "Hide All",    // e.g. "Hide All"
        show_all_label:   "Show All",    // e.g. "Show All"
        quiz_placeholder: "Type the Indonesian",  // e.g. "Enter the [TL] phrase"
        quiz_button:      "Check", // e.g. "Check"
        quiz_correct:     "Correct!",      // e.g. "Correct!"
        quiz_wrong:       "Try again",        // e.g. "Try again"

        // --- Segment labels (Season A = right half 0-180, Season B = left half 180-360) ---
        label_season_a: "MUSIM KEMARAU",  // e.g. "DRY SEASON"
        label_season_b: "MUSIM HUJAN",  // e.g. "WET SEASON"

        // --- Seasonal decoration (sun and rays for Season A, raindrops for Season B) ---
        // Set decorations_enabled to false if your TL culture's seasons do not map to sun / rain imagery.
        decorations_enabled: true,

        // --- Answer checking ----------------------------------------------
        // diacritic_map: pairs [accented, plain] used to normalise quiz answers. Leave empty [] if not needed.
        diacritic_map: [
            // ["ā","a"], ["ē","e"], ["ī","i"], ["ō","o"], ["ū","u"]
        ],
        // digraph_map: letter pairs treated as one when checking (applied to the typed AND the right answer), e.g. ["ou","o"], ["ei","e"].
        digraph_map: [],
        // collapse_double_vowels: true makes "aa" = "a" etc. (languages where a doubled vowel is an alternative macron notation).
        collapse_double_vowels: false,

        // --- Vocabulary data (8 items; add or remove freely) -----------------
        // Format: [ SL phrase, TL phrase, Quiz prompt, Trigger angle, Display angle ]
        // The trigger angle is where the sun brings the word up; the display angle is where the word sits (usually the same).
        // Angle 0 = top of the circle; increases clockwise. 0-180 = Season A (right half); 180-360 = Season B (left half).
        seasonsData: [
            ["Start of the dry season", "Awal musim kemarau", "Type the Indonesian for: Start of the dry season", 0, 0],
            ["Clear skies", "Langit cerah", "Type the Indonesian for: Clear skies", 30, 30],

            ["Clouds are building", "Awan mulai menebal", "Type the Indonesian for: Clouds are building", 150, 150],
            ["Start of the wet season", "Awal musim hujan", "Type the Indonesian for: Start of the wet season", 180, 180],
            ["The first rains", "Hujan pertama", "Type the Indonesian for: The first rains", 210, 210],
            ["Peak of the wet season", "Puncak musim hujan", "Type the Indonesian for: Peak of the wet season", 270, 270],
            ["The rain is easing", "Hujan mulai reda", "Type the Indonesian for: The rain is easing", 330, 330]
        ]
    };

    var MODES = LOGV ? [2, 1, 0] : [1, 0], ANS = LOGV ? 2 : 1;

    function word(i, k) { return D[i][MODES[k]]; }

    <script>
    // --- Pull a word out of the dial to inspect it: it follows the finger or mouse and grows (up to 300%); let go and it STAYS for 5 seconds, then snaps back ---
    (function () {
        var MAXS = 3, HOLD_MS = 5000, svg = document.getElementById('svgCanvas');
        var held = new Map();   // index -> { ghost, box, x, y, s, hx, hy, w, h, timer }
        var g = null, swallow = false;
        function tf(o) { return 'translate(calc(-50% + ' + o.x + 'px), calc(-50% + ' + o.y + 'px)) scale(' + o.s + ')'; }
        function makeGhost(box) {

            gh.innerHTML = d.innerHTML; gh.style.textTransform = d.style.textTransform; gh.style.fontSize = (parseFloat(d.style.fontSize) * k) + 'px';
            document.body.appendChild(gh);
            var w = gh.offsetWidth, h = gh.offsetHeight, hx = r.left + r.width / 2, hy = r.top + r.height / 2;
            gh.style.left = hx + 'px'; gh.style.top = hy + 'px';

            gh.style.transform = 'translate(-50%, -50%) scale(1)';

        }
        function startHold(i) { var o = held.get(i); if (!o) return; clearTimeout(o.timer); o.timer = setTimeout(function () { snapBack(i); }, HOLD_MS); }
        window.__cmpReset = function () { held.forEach(function (o) { clearTimeout(o.timer); if (o.ghost.parentNode) o.ghost.parentNode.removeChild(o.ghost); o.box.style.visibility = ''; }); held.clear(); g = null; };
        ['display-mode-toggle', 'show-all-toggle', 'reset-btn'].forEach(function (id) { document.getElementById(id).addEventListener('click', function () { window.__cmpReset(); }); });
        window.addEventListener('resize', function () { window.__cmpReset(); });

        document.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            var gh = e.target.closest && e.target.closest('.cmp-ghost'), box = null, i = -1;
            if (gh) { held.forEach(function (o, k) { if (o.ghost === gh) { i = k; box = o.box; } }); }
            else { box = e.target.closest && e.target.closest('.textBox'); if (!box) return; i = parseInt(box.getAttribute('data-index')); var dv = box.querySelector('div'); if (!dv || getComputedStyle(box).display === 'none') return; }

            if (gh) { try { gh.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); }
        }, true);
        function makeGhostFor(box) { var o = makeGhost(box); o.ghost.style.display = 'none'; held.set(parseInt(box.getAttribute('data-index')), o); o.pending = true; return o; }
        document.addEventListener('pointermove', function (e) {
            if (!g || e.pointerId !== g.id) return;
            var dx = e.clientX - g.x0, dy = e.clientY - g.y0, d = Math.hypot(dx, dy), o = g.o;
            if (!g.drag) {
                if (d < 6) return;
                g.drag = true; o.ghost.style.display = ''; o.ghost.style.transition = 'none'; g.box.style.visibility = 'hidden'; o.pending = false;
                if (g.fresh && window.__cmpSpeak) window.__cmpSpeak(g.i, true);
            }
            var dmax = Math.max(120, Math.min(230, 0.30 * Math.min(window.innerWidth, window.innerHeight)));
            var s = g.hadHold ? g.s0 : 1 + (MAXS - 1) * Math.min(1, d / dmax);
            s = Math.min(s, (window.innerWidth - 8) / o.w, (window.innerHeight - 8) / o.h);
            var hw = o.w * s / 2, hh = o.h * s / 2, tx = o.hx + g.ox + dx, ty = o.hy + g.oy + dy;
            var cx = Math.min(Math.max(tx, hw + 2), window.innerWidth - hw - 2), cy = Math.min(Math.max(ty, hh + 2), window.innerHeight - hh - 2);

            e.preventDefault();

        function release(e) {

        }

        document.addEventListener('pointercancel', release, true);
        document.addEventListener('click', function (e) { if (swallow && e.target.closest && e.target.closest('.textBox')) { e.stopPropagation(); e.preventDefault(); swallow = false; } }, true);
        document.addEventListener('contextmenu', function (e) { if (e.target.closest && (e.target.closest('.textBox') || e.target.closest('.cmp-ghost'))) e.preventDefault(); });
    })();

    <script>

    /* 2026-11-17 AUDIO and FULL SCREEN on the Seasons. The Audio button cycles: TL + SL (hear the target-language day, then the source-language one) -> TL only -> Silent.
       The slider is the volume. Language codes come from the App: window.CONCEPTIONARY_AUDIO_LANG / _SL_LANG (e.g. 'id-ID', 'en-NZ'); label overrides window.CONCEPTIONARY_AUDIO_TL_LABEL / _SL_LABEL;
       recorded files: window.CONCEPTIONARY_AUDIO_FILES[text]; cloud voice: window.CONCEPTIONARY_AUDIO_API_URL.
       Let go of the sun, or tap a word: it is spoken. The romanised (TLR) line of the LOG file is never spoken. */
    (function () {
        var ctl = document.getElementById('cmpCtl'); if (!ctl || document.getElementById('auCycle')) return;
        var AB = { en: 'ENG', id: 'IND', ms: 'MSA', ja: 'JPN', ko: 'KOR', zh: '中文', fr: 'FRA', de: 'DEU', es: 'SPA', it: 'ITA', pt: 'POR', ru: 'RUS', ar: 'ARA', hi: 'HIN', th: 'THA', vi: 'VIE', mi: 'MRI', fil: 'FIL', tl: 'FIL', nl: 'NLD', sv: 'SWE', tr: 'TUR', pl: 'POL', el: 'ELL', he: 'HEB', sm: 'SMO', to: 'TON', fj: 'FIJ' };
        var AUDIO_API_URL = window.CONCEPTIONARY_AUDIO_API_URL || '';
        var st = { mode: 0, vol: 0.8, last: '', lastT: 0, timer: null, cur: null, pt: 'mouse', seq: 0 };   // mode 0 = TL+SL, 1 = TL only, 2 = silent
        function tlCode() { return window.CONCEPTIONARY_AUDIO_LANG || ''; }
        function slCode() { return window.CONCEPTIONARY_AUDIO_SL_LANG || ''; }
        function abbr(code, fb, ov) { if (ov) return ov; if (!code) return fb; var b = code.toLowerCase().split(/[-_]/)[0]; return AB[b] || b.toUpperCase(); }
        function tlName() { return abbr(tlCode(), 'TL', window.CONCEPTIONARY_AUDIO_TL_LABEL); }
        function slName() { return abbr(slCode(), 'SL', window.CONCEPTIONARY_AUDIO_SL_LABEL); }

        var wrap = document.createElement('div'); wrap.id = 'audioWrap'; wrap.className = 'audio-wrap';
        var cyc = document.createElement('button'); cyc.id = 'auCycle'; cyc.type = 'button';
        var vol = document.createElement('input'); vol.type = 'range'; vol.id = 'auVol2'; vol.min = 0; vol.max = 100; vol.step = 5; vol.value = 80; vol.setAttribute('aria-label', 'Volume');
        wrap.appendChild(cyc); wrap.appendChild(vol); ctl.insertBefore(wrap, ctl.firstChild);
        var toast = document.createElement('div'); toast.id = 'auToast'; document.body.appendChild(toast); var toastT = null;
        function note(text) {
            toast.textContent = text; toast.style.opacity = '1';
            var r = wrap.getBoundingClientRect(); toast.style.left = '0px'; toast.style.top = '0px';
            var w = toast.offsetWidth, h = toast.offsetHeight;
            toast.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px';
            var t = r.top - h - 8; if (t < 6) t = Math.min(window.innerHeight - h - 6, r.bottom + 8);
            toast.style.top = t + 'px';
            clearTimeout(toastT); toastT = setTimeout(function () { toast.style.opacity = '0'; }, 2600);
        }
        function label() {
            cyc.textContent = st.mode === 0 ? tlName() + '+' + slName() : st.mode === 1 ? tlName() : 'Silent';
            cyc.setAttribute('aria-label', 'Audio: ' + cyc.textContent);
            cyc.title = 'Click to change: ' + tlName() + ' + ' + slName() + ' / ' + tlName() + ' only / Silent. The slider is the volume.';
        }
        function describe() { return st.mode === 0 ? 'Audio: hear the target language (' + tlName() + '), then the source language (' + slName() + ')' : st.mode === 1 ? 'Audio: target language (' + tlName() + ') only' : 'Audio: silent'; }

        function pickVoice(code) {
            var vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
            if (!code) return null;
            var c = code.toLowerCase(), base = c.split('-')[0], best = null, bs = -1;
            vs.forEach(function (v) {
                var l = (v.lang || '').toLowerCase().replace('_', '-');
                if (l !== c && l.split('-')[0] !== base) return;
                var s = (l === c ? 4 : 0) + (/natural|neural|online/i.test(v.name) ? 3 : 0) + (/google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
                if (s > bs) { best = v; bs = s; }
            });
            return best;
        }
        function stop() { st.seq++; try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} if (st.cur) { try { st.cur.pause(); } catch (e) {} st.cur = null; } }
        function playUrl(u, done) { var a = new Audio(u); a.volume = st.vol; if (st.cur) { try { st.cur.pause(); } catch (e) {} } st.cur = a; if (done) a.onended = done; a.play().catch(function () { note('The browser blocked the sound: tap the page once and try again.'); }); }
        function viaBrowser(text, code, done) {
            if (!window.speechSynthesis) { note('This browser cannot speak.'); return; }
            var v = pickVoice(code);
            if (code && !v) { note('No ' + code + ' voice on this device.'); return; }

            if (code) u.lang = code; if (v) u.voice = v; u.volume = st.vol;
            window.__auUtt = u;   // keep a reference: some phones drop the sound if the utterance is garbage-collected
            var started = false; u.onstart = function () { started = true; };
            if (done) u.onend = done;

            };

        }

                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
                .then(function (b) { playUrl(URL.createObjectURL(b), done); })
                .catch(function () { note('The audio service could not be reached.'); });
        }
        function speak1(text, code, done) {
            var files = window.CONCEPTIONARY_AUDIO_FILES;
            if (files && files[text] && (!code || code === tlCode())) { playUrl(files[text], done); return; }   /* recordings belong to the target language only */
            if (AUDIO_API_URL && code) viaCloud(text, code, done); else viaBrowser(text, code, done);
        }
        var lastItem = '';
        function speakItem(item) {
            if (st.mode === 2 || !item) return;

        }
        window.__cmpSpeak = function (i, force) { var d = LANG.seasonsData[i]; if (!d) return; if (force) st.last = ''; speakItem({ id: i, tl: String(d[1]).replace(/<rt>[^<]*<\/rt>/g, '').replace(/<[^>]*>/g, ''), sl: d[0] }); };   // the TLR (romanised) line is never spoken

        cyc.addEventListener('click', function (e) {
            e.stopPropagation();
            st.mode = (st.mode + 1) % 3; label(); if (st.mode === 2) stop();
            if (window.speechSynthesis) speechSynthesis.getVoices();
            note(describe());
        });
        vol.addEventListener('input', function () { st.vol = vol.value / 100; if (st.cur) st.cur.volume = st.vol; vol.style.setProperty('--p', vol.value + '%'); });
        vol.addEventListener('click', function (e) { e.stopPropagation(); });
        window.addEventListener('load', label); label(); vol.style.setProperty('--p', vol.value + '%');
        window.__auCycle = { get mode() { return st.mode; }, label: label };

        /* Full Screen (hidden where the browser cannot do it, e.g. iPhone Safari) */
        var de = document.documentElement, fb = document.getElementById('fsBtn');
        var req = de.requestFullscreen || de.webkitRequestFullscreen;
        if (!req) { if (fb) fb.style.display = 'none'; }
        else {
            window.toggleFullScreen = function () {
                var on = document.fullscreenElement || document.webkitFullscreenElement;
                var fail = function () { if (!fb) return; fb.textContent = 'Not allowed here'; setTimeout(sync, 2500); };
                if (!on) { try { var p = req.call(de); if (p && p.catch) p.catch(fail); } catch (e) { fail(); } }
                else { var ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); }
            };
            var sync = function () { if (fb) fb.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit Full Screen' : 'Full Screen'; };
            document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
        }
    })();
