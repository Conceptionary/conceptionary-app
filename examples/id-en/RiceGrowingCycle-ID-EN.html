/* ===== CONCEPTIONARY STYLE SHEET v0.1 (trial on the Compass, 2026-11-06) =====

    <script>

    /* 2026-11-17 AUDIO and FULL SCREEN on the Seasons. The Audio button cycles: TL + SL (hear the target-language day, then the source-language one) -> TL only -> Silent.
       The slider is the volume. Language codes come from the App: window.CONCEPTIONARY_AUDIO_LANG / _SL_LANG (e.g. 'id-ID', 'en-NZ'); label overrides window.CONCEPTIONARY_AUDIO_TL_LABEL / _SL_LABEL;
       recorded files: window.CONCEPTIONARY_AUDIO_FILES[text]; cloud voice: window.CONCEPTIONARY_AUDIO_API_URL.
       Let go of the sun, or tap a word: it is spoken. The romanised (TLR) line of the LOG file is never spoken. */
    (function () {
        var ctl = document.getElementById('cmpCtl'); if (!ctl || document.getElementById('auCycle')) return;
        var AB = { en: 'ENG', id: 'IND', ms: 'MSA', ja: 'JPN', ko: 'KOR', zh: '中文', fr: 'FRA', de: 'DEU', es: 'SPA', it: 'ITA', pt: 'POR', ru: 'RUS', ar: 'ARA', hi: 'HIN', th: 'THA', vi: 'VIE', mi: 'MRI', fil: 'FIL', tl: 'FIL', nl: 'NLD', sv: 'SWE', tr: 'TUR', pl: 'POL', el: 'ELL', he: 'HEB', sm: 'SMO', to: 'TON', fj: 'FIJ' };
        var AUDIO_API_URL = window.CONCEPTIONARY_AUDIO_API_URL || '';
        var st = { mode: 0, vol: 0.8, last: '', lastT: 0, timer: null, cur: null, pt: 'mouse', seq: 0 };   // mode 0 = TL+SL, 1 = TL only, 2 = silent
        function tlCode() { return window.CONCEPTIONARY_AUDIO_LANG || ''; }
        function slCode() { return window.CONCEPTIONARY_AUDIO_SL_LANG || ''; }
        function abbr(code, fb, ov) { if (ov) return ov; if (!code) return fb; var b = code.toLowerCase().split(/[-_]/)[0]; return AB[b] || b.toUpperCase(); }
        function tlName() { return abbr(tlCode(), 'TL', window.CONCEPTIONARY_AUDIO_TL_LABEL); }
        function slName() { return abbr(slCode(), 'SL', window.CONCEPTIONARY_AUDIO_SL_LABEL); }

        var wrap = document.createElement('div'); wrap.id = 'audioWrap'; wrap.className = 'audio-wrap';
        var cyc = document.createElement('button'); cyc.id = 'auCycle'; cyc.type = 'button';
        var vol = document.createElement('input'); vol.type = 'range'; vol.id = 'auVol2'; vol.min = 0; vol.max = 100; vol.step = 5; vol.value = 80; vol.setAttribute('aria-label', 'Volume');
        wrap.appendChild(cyc); wrap.appendChild(vol); ctl.insertBefore(wrap, ctl.firstChild);
        var toast = document.createElement('div'); toast.id = 'auToast'; document.body.appendChild(toast); var toastT = null;
        function note(text) {
            toast.textContent = text; toast.style.opacity = '1';
            var r = wrap.getBoundingClientRect(); toast.style.left = '0px'; toast.style.top = '0px';
            var w = toast.offsetWidth, h = toast.offsetHeight;
            toast.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px';
            var t = r.top - h - 8; if (t < 6) t = Math.min(window.innerHeight - h - 6, r.bottom + 8);
            toast.style.top = t + 'px';
            clearTimeout(toastT); toastT = setTimeout(function () { toast.style.opacity = '0'; }, 2600);
        }
        function label() {
            cyc.textContent = st.mode === 0 ? tlName() + '+' + slName() : st.mode === 1 ? tlName() : 'Silent';
            cyc.setAttribute('aria-label', 'Audio: ' + cyc.textContent);
            cyc.title = 'Click to change: ' + tlName() + ' + ' + slName() + ' / ' + tlName() + ' only / Silent. The slider is the volume.';
        }
        function describe() { return st.mode === 0 ? 'Audio: hear the target language (' + tlName() + '), then the source language (' + slName() + ')' : st.mode === 1 ? 'Audio: target language (' + tlName() + ') only' : 'Audio: silent'; }

        function pickVoice(code) {
            var vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
            if (!code) return null;
            var c = code.toLowerCase(), base = c.split('-')[0], best = null, bs = -1;
            vs.forEach(function (v) {
                var l = (v.lang || '').toLowerCase().replace('_', '-');
                if (l !== c && l.split('-')[0] !== base) return;
                var s = (l === c ? 4 : 0) + (/natural|neural|online/i.test(v.name) ? 3 : 0) + (/google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
                if (s > bs) { best = v; bs = s; }
            });
            return best;
        }
        function stop() { st.seq++; try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} if (st.cur) { try { st.cur.pause(); } catch (e) {} st.cur = null; } }
        function playUrl(u, done) { var a = new Audio(u); a.volume = st.vol; if (st.cur) { try { st.cur.pause(); } catch (e) {} } st.cur = a; if (done) a.onended = done; a.play().catch(function () { note('The browser blocked the sound: tap the page once and try again.'); }); }
        function viaBrowser(text, code, done) {
            if (!window.speechSynthesis) { note('This browser cannot speak.'); return; }
            var v = pickVoice(code);
            if (code && !v) { note('No ' + code + ' voice on this device.'); return; }
            var u = new SpeechSynthesisUtterance(text);
            if (code) u.lang = code; if (v) u.voice = v; u.volume = st.vol;
            window.__auUtt = u;   // keep a reference: some phones drop the sound if the utterance is garbage-collected
            var started = false; u.onstart = function () { started = true; };
            if (done) u.onend = done;
            u.onerror = function (ev) { if (ev.error && ev.error !== 'interrupted' && ev.error !== 'canceled') note('The device could not speak (' + ev.error + ').'); };

                try { speechSynthesis.resume(); } catch (e) {}
                speechSynthesis.speak(u);
                setTimeout(function () { if (!started && window.__auUtt === u) { try { speechSynthesis.cancel(); } catch (e) {} } }, 2500);   // stuck phone queue: clear it so the next tap works
            };
            if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 120); } else go();
        }
        function viaCloud(text, code, done) {
            fetch(AUDIO_API_URL + '?text=' + encodeURIComponent(text) + '&lang=' + encodeURIComponent(code))
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
                .then(function (b) { playUrl(URL.createObjectURL(b), done); })
                .catch(function () { note('The audio service could not be reached.'); });
        }
        function speak1(text, code, done) {
            var files = window.CONCEPTIONARY_AUDIO_FILES;
            if (files && files[text] && (!code || code === tlCode())) { playUrl(files[text], done); return; }   /* recordings belong to the target language only */
            if (AUDIO_API_URL && code) viaCloud(text, code, done); else viaBrowser(text, code, done);
        }
        var lastItem = '';
        function speakItem(item) {
            if (st.mode === 2 || !item) return;
            var key = item.id + '|' + st.mode, now = Date.now();
            if (key === st.last && now - st.lastT < 1200) return;   // one phrase, one sound
            st.last = key; st.lastT = now;
            var items = [[item.tl, tlCode()]];                      // the target-language word (the script in the LOG file; never the romanised line)
            if (st.mode === 0) items.push([item.sl, slCode()]);     // then the source-language word
            st.seq++; var my = st.seq, i = 0;
            try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
            (function next() { if (my !== st.seq || i >= items.length) return; var it = items[i++]; if (!it[0]) { next(); return; } speak1(it[0], it[1], function () { setTimeout(next, 150); }); })();
        }
        window.__cmpSpeak = function (i, force) { var d = window.__riceItem(i); if (!d) return; if (force) st.last = ''; speakItem({ id: i, tl: String(d[1]).replace(/<rt>[^<]*<\/rt>/g, '').replace(/<[^>]*>/g, ''), sl: d[0] }); };   // the TLR (romanised) line is never spoken

        cyc.addEventListener('click', function (e) {
            e.stopPropagation();
            st.mode = (st.mode + 1) % 3; label(); if (st.mode === 2) stop();
            if (window.speechSynthesis) speechSynthesis.getVoices();
            note(describe());
        });
        vol.addEventListener('input', function () { st.vol = vol.value / 100; if (st.cur) st.cur.volume = st.vol; vol.style.setProperty('--p', vol.value + '%'); });
        vol.addEventListener('click', function (e) { e.stopPropagation(); });
        window.addEventListener('load', label); label(); vol.style.setProperty('--p', vol.value + '%');
        window.__auCycle = { get mode() { return st.mode; }, label: label };

        /* Full Screen (hidden where the browser cannot do it, e.g. iPhone Safari) */
        var de = document.documentElement, fb = document.getElementById('fsBtn');
        var req = de.requestFullscreen || de.webkitRequestFullscreen;
        if (!req) { if (fb) fb.style.display = 'none'; }
        else {
            window.toggleFullScreen = function () {
                var on = document.fullscreenElement || document.webkitFullscreenElement;
                var fail = function () { if (!fb) return; fb.textContent = 'Not allowed here'; setTimeout(sync, 2500); };
                if (!on) { try { var p = req.call(de); if (p && p.catch) p.catch(fail); } catch (e) { fail(); } }
                else { var ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); }
            };
            var sync = function () { if (fb) fb.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit Full Screen' : 'Full Screen'; };
            document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
        }
    })();
