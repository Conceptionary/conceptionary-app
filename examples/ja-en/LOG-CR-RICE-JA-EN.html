              linear-gradient(135deg, #f8f5ff 0%, #e4edfb 32%, #f3e8f5 62%, #e2f1f3 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,1) 0%, rgba(255,255,255,.45) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #f3eefe 0%, #d6e4fa 32%, #efdff3 62%, #d3ebef 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.75) 0%, rgba(255,255,255,.2) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #cfdcf5 0%, #b3c8ee 35%, #cdbfe9 65%, #b4d9e3 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -3px 5px rgba(110,125,175,.20), inset 0 0 0 1px rgba(255,255,255,.35);
}
html[data-scheme="night"] {
  --cx-pearl: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #2c3a5c 0%, #34456d 35%, #3a3560 65%, #2b4458 100%);
  --cx-pearl-hover: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.3) 0%, rgba(255,255,255,.1) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #34456d 0%, #3f5486 35%, #473f78 65%, #345468 100%);
  --cx-pearl-on: radial-gradient(120% 150% at 22% 0%, rgba(255,255,255,.2) 0%, rgba(255,255,255,.05) 40%, rgba(255,255,255,0) 64%),
              linear-gradient(135deg, #46609c 0%, #4d6bb0 35%, #5a4d98 65%, #3f6f8a 100%);
  --cx-pearl-edge: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -3px 5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.06);
}
#cmpCtl .tb, .audio-wrap, .tools-dd button {
  background-image: var(--cx-pearl); background-size: 100% 100%, 220% 220%; background-position: 0 0, 0% 0%; background-repeat: no-repeat;
  transition: background-position .6s ease, box-shadow var(--cx-t), transform var(--cx-t), border-color var(--cx-t);
}
#cmpCtl .tb, .audio-wrap { box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:hover, .audio-wrap:hover { background-image: var(--cx-pearl-hover); background-position: 0 0, 100% 100%; box-shadow: var(--cx-pearl-edge), 0 3px 8px rgba(20,30,60,.20); }
#cmpCtl .tb.on { background-image: var(--cx-pearl-on); box-shadow: var(--cx-pearl-edge), 0 1px 2px rgba(20,30,60,.16); }
#cmpCtl .tb:active, .audio-wrap:active { box-shadow: inset 0 2px 5px rgba(60,70,110,.28); }
.tools-dd button { box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
.tools-dd button:hover { background-image: var(--cx-pearl-hover); background-position: 0 0, 100% 100%; }
/* Audio slider: a silver ball like the compass pivot, on a channel that darkens from light grey (quiet) to black (loud) */
.audio-wrap #auVol2::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; box-shadow: inset 0 1px 1px rgba(0,0,0,.25); }
.audio-wrap #auVol2::-moz-range-track { height: 6px; border-radius: 3px; border: 1px solid #8e9097; box-sizing: border-box; background: linear-gradient(to right, #e4e6ea 0%, #a9abb2 35%, #4a4b51 70%, #0b0b0d 100%) !important; }
.audio-wrap #auVol2::-moz-range-progress { background: transparent !important; }
.audio-wrap #auVol2::-webkit-slider-thumb { box-sizing: border-box; border: 1px solid #555; margin-top: -5px; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f5f5 12%, #b0b0b0 58%, #707070 100%); box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.35); }
.audio-wrap #auVol2::-moz-range-thumb { box-sizing: border-box; border: 1px solid #555; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f5f5 12%, #b0b0b0 58%, #707070 100%); box-shadow: 0 1px 2px rgba(0,0,0,.45); }
@media (pointer: coarse) { .audio-wrap #auVol2::-webkit-slider-thumb { margin-top: -7px; } }
@media (max-height: 520px) and (orientation: landscape) { .audio-wrap #auVol2::-webkit-slider-thumb { margin-top: -4px; } }
html[data-scheme="night"] .tools-dd button { box-shadow: inset 0 1px 0 rgba(255,255,255,.10); }
    
.textBox, .textBox.active, .textBox.learned { transform: none !important; }
.textBox.learned div { color: #1b7f3b !important; }
.quiz-container { background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: var(--cx-r-card); box-shadow: var(--cx-shadow-md); top: 50%; left: 75%; right: auto; transform: translate(-50%, -50%); width: min(340px, 92vw); max-width: none; box-sizing: border-box; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.quiz-container input { background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 8px; font-family: var(--cx-font); box-sizing: border-box; cursor: text; user-select: text; -webkit-user-select: text; }
.quiz-container button:hover { background: var(--cx-btn-bg-hover) !important; color: var(--cx-btn-ink) !important; }
.learned-vocabulary { position: fixed; z-index: 600; display: none; background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 12px; box-shadow: var(--cx-shadow-md); top: 110px; left: 12px; width: 200px; max-height: calc(100vh - 40px); overflow-y: auto; touch-action: none; cursor: grab; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html .learned-vocabulary.has-items { display: block; }
html.no-quiz .quiz-container, html.no-quiz .learned-vocabulary, html.no-quiz .learned-vocabulary.has-items, html.no-quiz #arrayMoveTip { display: none !important; }
.array-title { background: var(--cx-primary); color: #fff; border-radius: 8px; font-family: var(--cx-font); text-align: left; padding: 5px 66px 5px 8px; min-height: 1.4em; }
.vocabulary-item { background: var(--cx-surface); border-color: var(--cx-line); font-family: var(--cx-font); }
.vocabulary-item .sl-word { color: var(--cx-muted); }
.vocabulary-item .tl-word.hidden, .vocabulary-item .sl-word.hidden { background: var(--cx-line); }
.toggle-visibility { background: var(--cx-btn-bg); color: var(--cx-btn-ink); border: 1px solid var(--cx-btn-line); border-radius: 8px; font-family: var(--cx-font); font-weight: 600; }
@media (pointer: coarse) { .quiz-container input { font-size: 16px; } }
#quizMoveHint { font: 600 14px var(--cx-font); color: var(--cx-muted); text-align: center; margin: 0 0 8px; transition: opacity .4s ease, max-height .4s ease, margin .4s ease; max-height: 30px; overflow: hidden; }
#quizMoveHint.gone { opacity: 0; max-height: 0; margin: 0; }
#arrayMoveTip { position: fixed; z-index: 1200; background: #1f2937; color: #fff; font: 600 14px var(--cx-font); padding: 7px 12px; border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity .3s ease; white-space: nowrap; }
#arrayMoveTip::after { content: ""; position: absolute; border: 6px solid transparent; }
#arrayMoveTip.left::after { left: 100%; top: 50%; margin-top: -6px; border-left-color: #1f2937; }
#arrayMoveTip.right::after { right: 100%; top: 50%; margin-top: -6px; border-right-color: #1f2937; }
#arrayMoveTip.below::after { bottom: 100%; left: 24px; border-bottom-color: #1f2937; }
@media print { .a4-page { background: #fff !important; } .learned-vocabulary, .quiz-container { display: none !important; } #printList .pl-gap { height: 3mm; } }
/* a word that turns yellow under the pointer (or a touch) always shows black text, in every colour scheme and whether or not it is learned */
html[lang] .textBox:hover div, html[lang] .textBox:active div, html[lang] .textBox.active:hover div, html[lang] .textBox.learned:hover div { color: #000 !important; text-shadow: none !important; background: #fff176 !important; }

.drag-instruction { max-width: min(430px, 62vw); white-space: normal; }
/* Learned panels (layout) */
.learned-vocabulary { padding: 6px; }
.array-title { font-size: .9em; font-weight: bold; margin-bottom: 5px; }
.toggle-visibility { position: absolute; top: 7px; right: 8px; font-size: .72em; padding: 3px 8px; cursor: pointer; z-index: 5; }
.vocab-section { margin-bottom: 8px; }
.vocabulary-item { display: flex; flex-direction: column; font-size: .8em; margin: 4px 0; padding: 5px 6px; border: 1px solid var(--cx-line); border-radius: 8px; }
.vocabulary-item .tl-word { font-weight: bold; color: #1b7f3b; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
.vocabulary-item .sl-word { cursor: pointer; padding: 2px 5px; border-radius: 4px; }
.vocabulary-item .tl-word.hidden, .vocabulary-item .sl-word.hidden { color: transparent; user-select: none; }
html[data-scheme="night"] .vocabulary-item .tl-word { color: #6fdc9c; }

/* the Quiz is a free-floating panel: fixed to the window so that it can be grabbed and dropped anywhere (it was left in the page flow, which made the move do nothing) */
.quiz-container { position: fixed; }

/* hidden words in the Learned panel must stay hidden in the Night scheme too (the Night colour rule for .tl-word was more specific than the .hidden rule, so TL words never disappeared) */
html .vocabulary-item .tl-word.hidden, html .vocabulary-item .sl-word.hidden, html .vocabulary-item .tlr-word.hidden, html .vocabulary-item .w.hidden,
html[data-scheme="night"] .vocabulary-item .tl-word.hidden, html[data-scheme="night"] .vocabulary-item .sl-word.hidden, html[data-scheme="night"] .vocabulary-item .tlr-word.hidden, html[data-scheme="night"] .vocabulary-item .w.hidden { color: transparent !important; user-select: none; }

/* ===== RICE: wheel, badge, window ===== */
#hubBg { fill: var(--cx-surface); }
#hubTL { fill: var(--cx-ink); } #hubSL { fill: var(--cx-muted); }
.seg { transition: filter .2s ease; }
#draggableFrame { cursor: grab; pointer-events: all; }
#draggableFrame.dragging { cursor: grabbing; opacity: .5; }
#svgCanvas text { font-family: var(--cx-font); }
#slideText { stroke: #fff; stroke-width: .5px; paint-order: stroke; }
#slideText.k-tlr, #tdContent.k-tlr, #langBadge.k-tlr { fill: #b03030; color: #b03030; } #slideText.k-tl { fill: #1a4f7c; } #slideText.k-sl { fill: #1a5e35; }
#langBadge { display: inline-block; padding: 4px 14px; border-radius: 14px; color: #fff; font: 700 clamp(11px, 1.5vw, 15px) var(--cx-font); white-space: nowrap; pointer-events: none; }
#langBadge.k-tlr { background: #b03030; color: #fff; } #langBadge.k-tl { background: #1a4f7c; } #langBadge.k-sl { background: #1a5e35; } #langBadge.k-quiz { background: #6c2e98; }
.title-box { text-align: left; line-height: 1.35; cursor: default; } .title-box .t1 { display: block; font-weight: 700; font-style: italic; font-size: clamp(11px, 1.6vw, 18px); } .title-box .t2 { display: block; font-weight: 400; font-size: clamp(10px, 1.3vw, 15px); opacity: .8; }
#transDisplay { display: none; position: fixed; touch-action: none; left: 85%; top: 52%; transform: translate(-50%, -50%); width: 18%; min-width: 150px; background: var(--cx-surface); color: var(--cx-ink); border: 2px solid #b03030; border-radius: 12px; padding: 10px 12px; box-shadow: 0 3px 14px rgba(0,0,0,.25); z-index: 30; cursor: grab; text-align: center; }
#tdMonth { font-size: clamp(10px, 1.2vw, 13px); color: var(--cx-muted); font-style: italic; margin-bottom: 4px; }
#tdContent { font-weight: 700; line-height: 1.4; min-height: 24px; font-size: 1.1em; }
#tdContent.k-tlr { color: #d85a5a; } #tdContent.k-tl { color: #1a4f7c; } #tdContent.k-sl { color: #1a8a4c; }
html[data-scheme="night"] #tdContent.k-tl { color: #8ec5ff; } html[data-scheme="night"] #tdContent.k-sl { color: #6fdc9c; } html[data-scheme="night"] #tdContent.k-tlr { color: #ff9a9a; }
#tdLearned { font-size: clamp(9px, 1.1vw, 11px); color: #1b7f3b; margin-top: 3px; min-height: 12px; }
#segTooltip { display: none; position: absolute; background: var(--cx-surface); color: var(--cx-ink); border: 1px solid var(--cx-line); border-radius: 8px; padding: 5px 10px; font-size: 12px; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 300; line-height: 1.6; }
#segTooltip .tt-month { font-weight: 700; font-size: 13px; } #segTooltip .tt-season { color: var(--cx-muted); }
.array-sub { font: 600 .8em var(--cx-font); color: var(--cx-muted); text-align: center; margin: 4px 0; }
html.m-trans #learned-vocabulary-left, html:not(.m-trans) #learned-vocabulary-right { display: none !important; }
.vocabulary-item .tlr-word { font-weight: 700; color: #d85a5a; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
.vocabulary-item .w.hidden { color: transparent; user-select: none; background: var(--cx-line); }
.vocabulary-item .mo { font-size: .75em; color: var(--cx-muted); align-self: flex-end; }
#quizPrompt { font-size: 14px; line-height: 1.5; margin-bottom: 6px; } #quizPrompt strong { color: #1a8a4c; font-size: 16px; }
.drag-instruction { max-width: min(430px, 62vw); white-space: normal; }

    <script>
    // --- Pull a word out of the dial to inspect it: it follows the finger or mouse and grows (up to 300%); let go and it STAYS for 5 seconds, then snaps back ---
    (function () {

        var g = null, swallow = false;

            document.body.appendChild(gh);

        }
        function startHold(i) { var o = held.get(i); if (!o) return; clearTimeout(o.timer); o.timer = setTimeout(function () { snapBack(i); }, HOLD_MS); }

        ['display-mode-toggle', 'show-all-toggle', 'mode-btn', 'reset-btn'].forEach(function (id) { document.getElementById(id).addEventListener('click', function () { window.__cmpReset(); }); });
        window.addEventListener('resize', function () { window.__cmpReset(); });

        document.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;

        }, true);

            var s = g.hadHold ? g.s0 : 1 + (MAXS - 1) * Math.min(1, d / dmax);

        document.addEventListener('click', function (e) { if (swallow && e.target.closest && e.target.closest('.textBox')) { e.stopPropagation(); e.preventDefault(); swallow = false; } }, true);
        document.addEventListener('contextmenu', function (e) { if (e.target.closest && (e.target.closest('.textBox') || e.target.closest('.cmp-ghost'))) e.preventDefault(); });
    })();

    <script>

    /* 2026-11-17 AUDIO and FULL SCREEN on the Seasons. The Audio button cycles: TL + SL (hear the target-language day, then the source-language one) -> TL only -> Silent.
       The slider is the volume. Language codes come from the App: window.CONCEPTIONARY_AUDIO_LANG / _SL_LANG (e.g. 'id-ID', 'en-NZ'); label overrides window.CONCEPTIONARY_AUDIO_TL_LABEL / _SL_LABEL;
       recorded files: window.CONCEPTIONARY_AUDIO_FILES[text]; cloud voice: window.CONCEPTIONARY_AUDIO_API_URL.
       Let go of the sun, or tap a word: it is spoken. The romanised (TLR) line of the LOG file is never spoken. */
    (function () {
        var ctl = document.getElementById('cmpCtl'); if (!ctl || document.getElementById('auCycle')) return;
        var AB = { en: 'ENG', id: 'IND', ms: 'MSA', ja: 'JPN', ko: 'KOR', zh: '中文', fr: 'FRA', de: 'DEU', es: 'SPA', it: 'ITA', pt: 'POR', ru: 'RUS', ar: 'ARA', hi: 'HIN', th: 'THA', vi: 'VIE', mi: 'MRI', fil: 'FIL', tl: 'FIL', nl: 'NLD', sv: 'SWE', tr: 'TUR', pl: 'POL', el: 'ELL', he: 'HEB', sm: 'SMO', to: 'TON', fj: 'FIJ' };
        var AUDIO_API_URL = window.CONCEPTIONARY_AUDIO_API_URL || '';
        var st = { mode: 0, vol: 0.8, last: '', lastT: 0, timer: null, cur: null, pt: 'mouse', seq: 0 };   // mode 0 = TL+SL, 1 = TL only, 2 = silent
        function tlCode() { return window.CONCEPTIONARY_AUDIO_LANG || ''; }
        function slCode() { return window.CONCEPTIONARY_AUDIO_SL_LANG || ''; }
        function abbr(code, fb, ov) { if (ov) return ov; if (!code) return fb; var b = code.toLowerCase().split(/[-_]/)[0]; return AB[b] || b.toUpperCase(); }
        function tlName() { return abbr(tlCode(), 'TL', window.CONCEPTIONARY_AUDIO_TL_LABEL); }
        function slName() { return abbr(slCode(), 'SL', window.CONCEPTIONARY_AUDIO_SL_LABEL); }

        var wrap = document.createElement('div'); wrap.id = 'audioWrap'; wrap.className = 'audio-wrap';
        var cyc = document.createElement('button'); cyc.id = 'auCycle'; cyc.type = 'button';
        var vol = document.createElement('input'); vol.type = 'range'; vol.id = 'auVol2'; vol.min = 0; vol.max = 100; vol.step = 5; vol.value = 80; vol.setAttribute('aria-label', 'Volume');
        wrap.appendChild(cyc); wrap.appendChild(vol); ctl.insertBefore(wrap, ctl.firstChild);
        var toast = document.createElement('div'); toast.id = 'auToast'; document.body.appendChild(toast); var toastT = null;
        function note(text) {
            toast.textContent = text; toast.style.opacity = '1';
            var r = wrap.getBoundingClientRect(); toast.style.left = '0px'; toast.style.top = '0px';
            var w = toast.offsetWidth, h = toast.offsetHeight;
            toast.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px';
            var t = r.top - h - 8; if (t < 6) t = Math.min(window.innerHeight - h - 6, r.bottom + 8);
            toast.style.top = t + 'px';

        }

            cyc.setAttribute('aria-label', 'Audio: ' + cyc.textContent);
            cyc.title = 'Click to change: ' + tlName() + ' + ' + slName() + ' / ' + tlName() + ' only / Silent. The slider is the volume.';
        }
        function describe() { return st.mode === 0 ? 'Audio: hear the target language (' + tlName() + '), then the source language (' + slName() + ')' : st.mode === 1 ? 'Audio: target language (' + tlName() + ') only' : 'Audio: silent'; }

        function pickVoice(code) {

            vs.forEach(function (v) {
                var l = (v.lang || '').toLowerCase().replace('_', '-');
                if (l !== c && l.split('-')[0] !== base) return;
                var s = (l === c ? 4 : 0) + (/natural|neural|online/i.test(v.name) ? 3 : 0) + (/google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
                if (s > bs) { best = v; bs = s; }

        }

        var lastItem = '';

        }

        cyc.addEventListener('click', function (e) {
            e.stopPropagation();

            if (window.speechSynthesis) speechSynthesis.getVoices();
            note(describe());
        });
        vol.addEventListener('input', function () { st.vol = vol.value / 100; if (st.cur) st.cur.volume = st.vol; vol.style.setProperty('--p', vol.value + '%'); });
        vol.addEventListener('click', function (e) { e.stopPropagation(); });
        window.addEventListener('load', label); label(); vol.style.setProperty('--p', vol.value + '%');
        window.__auCycle = { get mode() { return st.mode; }, label: label };

        /* Full Screen (hidden where the browser cannot do it, e.g. iPhone Safari) */
        var de = document.documentElement, fb = document.getElementById('fsBtn');
        var req = de.requestFullscreen || de.webkitRequestFullscreen;
        if (!req) { if (fb) fb.style.display = 'none'; }
        else {
            window.toggleFullScreen = function () {
                var on = document.fullscreenElement || document.webkitFullscreenElement;
                var fail = function () { if (!fb) return; fb.textContent = 'Not allowed here'; setTimeout(sync, 2500); };
                if (!on) { try { var p = req.call(de); if (p && p.catch) p.catch(fail); } catch (e) { fail(); } }
                else { var ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); }
            };
            var sync = function () { if (fb) fb.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit Full Screen' : 'Full Screen'; };
            document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
        }
    })();
